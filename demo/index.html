<script>
/* =======================================================================
   MÓDULO 2 · PRONTOS EM REDE (comunicação sincronizada)
   ======================================================================= */
function usuariosVisiveis(){
  const ls=lojasVisiveis();
  return Object.values(S.usuarios).filter(u=>u.nivel==='associado' && ls.some(l=>l.id===u.loja));
}
const adesaoCampanha = c => {
  const us=usuariosVisiveis(); if(!us.length) return 0;
  return Math.round(us.filter(u=>c.ag&&c.ag[u.id]).length/us.length*100);
};
/* a próxima campanha: a mais perto no tempo entre as que ainda não foram publicadas */
function proximaCampanha(){
  const fut=S.campanhas.filter(c=>c.st!=='publicada').sort((a,b)=>a.dt<b.dt?-1:1);
  return fut.find(c=>new Date(c.dt)>=HOJE) || fut[0] || S.campanhas[0];
}
const publicoRotulo = c => c.pub? c.pub.rotulo : '';
const dataCurta = iso => new Date(iso).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}).replace('.','');
let CAL_MES = null;   // {a, m} do calendário da rede

VIEWS.prontos=function(v,arg){
  const us=usuariosVisiveis(), con=us.filter(u=>u.ig).length;
  const camp=(arg && S.campanhas.find(c=>c.id===arg)) || proximaCampanha();
  const souBrasil=souMatriz(), euAg=camp.ag&&camp.ag[euId()];
  const ordem=S.campanhas.slice().sort((a,b)=>a.dt<b.dt?-1:1);
  const proximas=ordem.filter(c=>c.st!=='publicada'), passadas=ordem.filter(c=>c.st==='publicada');
  const programadas=proximas.filter(c=>c.st==='agendada').length;
  if(!CAL_MES){ const d=new Date(camp.dt); CAL_MES={a:d.getFullYear(), m:d.getMonth()}; }

  const cartao=c=>{ const ad=adesaoCampanha(c), d=new Date(c.dt), eu_=c.ag&&c.ag[euId()], atual=c.id===camp.id;
    return '<div class="camp'+(atual?' on':'')+'" data-camp="'+c.id+'">'+
      '<div class="cd"><b>'+d.getDate()+'</b><span>'+d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')+'</span></div>'+
      '<div class="ct"><div class="t">'+esc(c.tit)+'</div>'+
        '<div class="mini">'+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+' · '+esc(c.peca)+
          (c.pub?' · '+esc(c.pub.rotulo):'')+'</div>'+
        '<div class="cs">'+(c.st==='agendada'?'<span class="tag ok">Programada</span>':'<span class="tag mut">Planejada</span>')+
          '<span class="mini num">'+ad+'% · '+Object.keys(c.ag||{}).length+' contas</span></div>'+
        '<div class="ca">'+(souBrasil? '<button class="btn sm '+(c.st==='agendada'?'':'pri')+'" data-prog="'+c.id+'">'+(c.st==='agendada'?'Reprogramar':'Programar')+'</button><button class="btn sm" data-ver="'+c.id+'">Adesão</button>'
          : souCorretor()? (eu_?'<span class="tag ok">Você agendou</span>':'<button class="btn sm pri" data-ag="'+c.id+'">Agendar</button>') : '<button class="btn sm" data-ver="'+c.id+'">Adesão</button>')+
          (atual?'':'<a class="btn sm" href="#/prontos/'+c.id+'">Detalhes</a>')+'</div></div></div>'; };

  v.innerHTML =
    ph('Campanhas da rede','Comunicação sincronizada: a Matriz publica arte e legenda e a rede inteira posta no mesmo dia e na mesma hora — em um clique, sem repassar arquivo por WhatsApp. Crie as campanhas dos próximos meses e programe cada uma para toda a rede, por regional ou por unidade.',
      souBrasil?'<button class="btn pri" id="novaC">+ Nova campanha</button>':(souCorretor()&&!euAg?'<button class="btn pri" id="agEu">Agendar na minha conta</button>':''),'prontos')+
    '<div class="grid g4" style="margin-bottom:16px">'+
      kpi('Próxima publicação', new Date(proximaCampanha().dt).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}), esc(proximaCampanha().tit.split('—')[0].trim())+' · '+new Date(proximaCampanha().dt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}))+
      kpi('Campanhas à frente', proximas.length, programadas+' programadas · '+(proximas.length-programadas)+' a programar', proximas.length-programadas?'k-warn':'k-ok')+
      kpi('Contas conectadas', con+'/'+us.length, pct(con/Math.max(1,us.length)*100)+' dos associados', con/Math.max(1,us.length)>.6?'k-ok':'k-warn')+
      kpi('Adesão da campanha', pct(adesaoCampanha(camp)), esc(camp.tit.split('—')[0].trim().slice(0,28)), adesaoCampanha(camp)>60?'k-ok':'k-warn')+
    '</div>'+
    '<div class="card" style="margin-bottom:16px"><div class="ch"><h3>Próximas campanhas</h3><div class="r"><span class="mini">'+(souBrasil?'cada uma com o seu botão de programar':'na ordem em que vão ao ar')+'</span></div></div>'+
      '<div class="cb"><div class="camp-grid">'+(proximas.map(cartao).join('')||'<div class="empty">Nenhuma campanha à frente. Crie a próxima.</div>')+'</div></div></div>'+
    '<div class="grid g23" style="margin-bottom:16px">'+
      '<div class="card"><div class="ch"><h3>'+(camp.st==='agendada'?'Campanha programada':'Campanha em preparação')+'</h3><div class="r">'+(euAg?'<span class="tag ok">Você já agendou</span>':'<span class="tag '+(dias(new Date(camp.dt))<0?'mut':'red')+'">'+(dias(new Date(camp.dt))<0?'já passou':'Faltam '+dias(new Date(camp.dt))+' dias')+'</span>')+'</div></div>'+
      '<div class="cb" style="display:grid;grid-template-columns:190px 1fr;gap:18px;align-items:start">'+
        (camp.arte?'<img class="prev" src="'+camp.arte+'" alt="" style="width:100%;border-radius:12px">':'<canvas class="prev" id="cvC"></canvas>')+
        '<div><div style="font-family:var(--font-d);font-weight:800;font-size:17px">'+esc(camp.tit)+'</div>'+
        '<div class="mini" style="margin:5px 0 12px">'+new Date(camp.dt).toLocaleString('pt-BR')+' · '+esc(camp.peca)+' · '+(camp.pub?esc(camp.pub.rotulo):'ainda não programada')+'</div>'+
        '<div style="background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:12.9px;line-height:1.55">'+esc(camp.leg)+'</div>'+
        '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">'+
          (souBrasil?'<button class="btn pri" id="disparar">'+(camp.st==='agendada'?'Reprogramar':'Programar para as unidades')+'</button>':
           euAg?'<button class="btn" id="desag">Cancelar meu agendamento</button>':'<button class="btn pri" id="agEu2">Agendar na minha conta</button>')+
          '<button class="btn" id="cpLeg">Copiar legenda</button>'+
          '<a class="btn" href="#/estudio/'+(camp.tpl||'t01')+'">Personalizar</a>'+
          '<button class="btn" id="dlArte">↓ Baixar arte</button></div>'+
        '</div></div></div>'+
      '<div class="card"><div class="ch"><h3>Calendário da rede</h3><div class="r" style="display:flex;gap:6px;align-items:center"><button class="btn sm" id="calAnt">‹</button><span class="mini" id="calTit" style="min-width:110px;text-align:center"></span><button class="btn sm" id="calProx">›</button></div></div><div class="cb" id="cal"></div></div>'+
    '</div>'+
    '<div class="card"><div class="ch"><h3>Todas as campanhas</h3><div class="r"><span class="mini">adesão medida sobre '+us.length+' associados do seu escopo</span></div></div>'+
      '<div class="tw"><table><thead><tr><th>Campanha</th><th>Data</th><th>Peça</th><th>Público</th><th>Situação</th><th>Adesão</th><th></th></tr></thead><tbody>'+
      ordem.map(c=>{ const ad=adesaoCampanha(c);
        return '<tr'+(c.id===camp.id?' style="background:var(--brand-soft)"':'')+'><td style="font-weight:600">'+esc(c.tit)+'</td><td class="num">'+new Date(c.dt).toLocaleDateString('pt-BR')+'</td><td>'+esc(c.peca)+'</td>'+
        '<td class="mini">'+(c.pub?esc(c.pub.rotulo):'—')+'</td>'+
        '<td>'+(c.st==='publicada'?'<span class="tag ok">Publicada</span>':c.st==='agendada'?'<span class="tag">Programada</span>':'<span class="tag mut">Planejada</span>')+'</td>'+
        '<td style="min-width:130px">'+barra(ad)+'<span class="mini num">'+ad+'% · '+Object.keys(c.ag||{}).length+' contas</span></td>'+
        '<td style="white-space:nowrap">'+(souCorretor()? (c.ag&&c.ag[euId()]?'<span class="tag ok">Agendada</span>':c.st==='publicada'?'':'<button class="btn sm" data-ag="'+c.id+'">Agendar</button>')
                            : (souBrasil&&c.st!=='publicada'?'<button class="btn sm" data-prog="'+c.id+'">'+(c.st==='agendada'?'Reprogramar':'Programar')+'</button> ':'')+'<button class="btn sm" data-ver="'+c.id+'">Ver adesão</button>')+'</td></tr>';
      }).join('')+'</tbody></table></div></div>';

  montarPeca({fmt:'feed', tema:'azul', titulo:camp.tit.split('—')[0].trim(), sub:camp.peca+' · publicação sincronizada',
    nome:eu().nome, creci:'', tel:'', unidade:'RE/MAX Brasil', foto:eu().foto}).then(cv=>{
      const a=$('#cvC'); if(!a) return; a.width=cv.width; a.height=cv.height; a.getContext('2d').drawImage(cv,0,0);
      $('#dlArte')&&$('#dlArte').addEventListener('click',()=>canvasBlob(cv,'image/png').then(b=>{baixarBlob(b,'campanha-'+camp.id+'.png');toast('Arte baixada.',1);})); });
  if(camp.arte) $('#dlArte').addEventListener('click',()=>fetch(camp.arte).then(r=>r.blob()).then(b=>{ baixarBlob(b,'campanha-'+camp.id+'.jpg'); toast('Arte baixada.',1); }));

  // calendário que anda pelos meses
  const pintaCal=()=>{
    const a=CAL_MES.a, m=CAL_MES.m, prim=new Date(a,m,1).getDay(), nd=new Date(a,m+1,0).getDate();
    $('#calTit').textContent=new Date(a,m,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
    let cal=['D','S','T','Q','Q','S','S'].map(d=>'<div class="dh">'+d+'</div>').join('');
    for(let i=0;i<prim;i++) cal+='<div class="dy off"></div>';
    for(let d=1;d<=nd;d++){
      let ev='';
      S.campanhas.forEach(c=>{ const cd=new Date(c.dt); if(cd.getFullYear()===a&&cd.getMonth()===m&&cd.getDate()===d)
        ev+='<div class="ev '+(c.st==='publicada'?'ok':c.st==='agendada'?'red':'')+'" data-go="'+c.id+'" title="'+esc(c.tit)+'">'+cd.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+' · '+esc(c.tit.split('—')[0].trim().slice(0,16))+'</div>'; });
      S.comunicados.forEach(k=>{ const kd=dt(k.dt); if(kd.getFullYear()===a&&kd.getMonth()===m&&kd.getDate()===d&&k.obr) ev+='<div class="ev">Comunicado</div>'; });
      const hoje = a===HOJE.getFullYear()&&m===HOJE.getMonth()&&d===HOJE.getDate();
      cal+='<div class="dy'+(hoje?' today':'')+'"><div class="n">'+d+'</div>'+ev+'</div>';
    }
    $('#cal').innerHTML='<div class="cal">'+cal+'</div>';
    $$('#cal [data-go]').forEach(e=>e.addEventListener('click',()=>{ location.hash='#/prontos/'+e.dataset.go; }));
  };
  pintaCal();
  $('#calAnt').addEventListener('click',()=>{ CAL_MES.m--; if(CAL_MES.m<0){ CAL_MES.m=11; CAL_MES.a--; } pintaCal(); });
  $('#calProx').addEventListener('click',()=>{ CAL_MES.m++; if(CAL_MES.m>11){ CAL_MES.m=0; CAL_MES.a++; } pintaCal(); });

  const agendar=cid=>{ commit('Agendou campanha', S.campanhas.find(c=>c.id===cid).tit, s=>{ const c=s.campanhas.find(x=>x.id===cid); c.ag=c.ag||{}; c.ag[euId()]=c.dt; });
    toast('<b>Agendado.</b> Sua conta publica junto com a rede.',1); route(); };
  $('#agEu')&&$('#agEu').addEventListener('click',()=>agendar(camp.id));
  $('#agEu2')&&$('#agEu2').addEventListener('click',()=>agendar(camp.id));
  $$('[data-ag]',v).forEach(b=>b.addEventListener('click',()=>agendar(b.dataset.ag)));
  $('#desag')&&$('#desag').addEventListener('click',()=>{ commit('Cancelou agendamento',camp.tit,s=>{delete s.campanhas.find(x=>x.id===camp.id).ag[euId()];}); route(); toast('Agendamento cancelado.'); });
  $('#cpLeg').addEventListener('click',()=>{ try{navigator.clipboard.writeText(camp.leg);}catch(e){} toast('Legenda copiada.',1); });
  $$('[data-ver]',v).forEach(b=>b.addEventListener('click',()=>{
    const c=S.campanhas.find(x=>x.id===b.dataset.ver);
    modal('Adesão · '+esc(c.tit),
      (c.pub?'<div class="mini" style="margin-bottom:10px">Programada para: '+esc(c.pub.rotulo)+'</div>':'')+
      '<div class="tw" style="max-height:52vh;overflow:auto"><table><thead><tr><th>Unidade</th><th>Agendaram</th><th>Adesão</th></tr></thead><tbody>'+
      lojasVisiveis().map(l=>{ const cs=corretoresDe(l.id), n=cs.filter(u=>c.ag&&c.ag[u.id]).length;
        return '<tr><td>'+esc(l.nome)+'</td><td class="num">'+n+'/'+cs.length+'</td><td style="min-width:120px">'+barra(Math.round(n/Math.max(1,cs.length)*100))+'</td></tr>'; }).join('')+
      '</tbody></table></div>','<button class="btn pri" onclick="fechaModal()">Fechar</button>');
  }));
  $('#disparar')&&$('#disparar').addEventListener('click',()=>disparoEmMassa(camp.id));
  $$('[data-prog]',v).forEach(b=>b.addEventListener('click',()=>disparoEmMassa(b.dataset.prog)));
  $('#novaC')&&$('#novaC').addEventListener('click',()=>{
    const sug=new Date(HOJE); sug.setDate(sug.getDate()+14);
    const ov=modal('Nova campanha',
      '<div class="field"><label>Título</label><input id="nT" placeholder="Ex.: Outubro — semana do imóvel pronto"></div>'+
      '<div class="grid g2" style="gap:12px"><div class="field"><label>Data</label><input type="date" id="nD" value="'+sug.toISOString().slice(0,10)+'"></div>'+
      '<div class="field"><label>Hora</label><input type="time" id="nH" value="10:00"></div></div>'+
      '<div class="field"><label>Formato</label><select id="nP"><option>Feed</option><option>Feed + Story</option><option>Story</option><option>Carrossel</option></select></div>'+
      '<div class="field"><label>Legenda oficial</label><textarea id="nL" rows="3" placeholder="Texto que a rede publica…"></textarea></div>'+
      '<div class="field"><label>Modelo de arte</label><select id="nM">'+TPLS().filter(t=>t.cat==='Redes sociais').map(t=>'<option value="'+t.id+'">'+esc(t.nome)+'</option>').join('')+'</select></div>'+
      '<div class="field"><label>Ou uma arte salva no Estúdio</label><select id="nA"><option value="">— usar o modelo acima —</option>'+S.pecas.map(p=>'<option value="'+p.id+'">'+esc(p.tplNome)+' · '+quando(p.criado)+'</option>').join('')+'</select></div>'+
      '<label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" id="nProg" checked style="width:auto"> Programar a publicação em massa em seguida (escolher o público)</label>',
      '<button class="btn" onclick="fechaModal()">Cancelar</button><button class="btn pri" id="nOk">Criar campanha</button>');
    $('#nOk',ov).addEventListener('click',()=>{
      const tit=$('#nT',ov).value.trim()||'Nova campanha da rede', id=uid('c'), prog=$('#nProg',ov).checked;
      commit('Criou campanha', tit, s=>{ s.campanhas.unshift({id, tit, dt:$('#nD',ov).value+'T'+$('#nH',ov).value,
        st:'planejada', peca:$('#nP',ov).value, tpl:$('#nM',ov).value, leg:$('#nL',ov).value.trim()||'#RemaxBrasil #ProntosEmRede', ag:{}, arte:((S.pecas.find(p=>p.id===$('#nA',ov).value)||{}).thumb)||''}); });
      fechaModal(); CAL_MES=null; location.hash='#/prontos/'+id; route(); toast('Campanha criada e visível para a rede.',1);
      if(prog) setTimeout(()=>disparoEmMassa(id),250);
    });
  });
};

/* disparo em massa — usado em Campanhas da rede e em Redes sociais.
   Público: toda a rede, uma ou mais regionais, ou unidades escolhidas uma a uma. */
function disparoEmMassa(campId){
  const camp=S.campanhas.find(c=>c.id===campId)||proximaCampanha();
  const ov=modal('Programar publicação em massa',
    '<div class="field"><label>Campanha</label><select id="pC">'+S.campanhas.filter(c=>c.st!=='publicada').sort((a,b)=>a.dt<b.dt?-1:1).map(c=>'<option value="'+c.id+'"'+(c.id===camp.id?' selected':'')+'>'+esc(c.tit)+' · '+dataCurta(c.dt)+'</option>').join('')+'</select></div>'+
    '<div class="field"><label>Público</label><div class="chips" id="pPub">'+
      '<button class="chip on" data-p="todas">Toda a rede · '+BASE.lojas.length+' unidades</button>'+
      BASE.masters.map(m=>'<button class="chip" data-p="'+m.id+'">'+esc(m.nome.replace('Master ',''))+' · '+BASE.lojas.filter(l=>l.master===m.id).length+'</button>').join('')+
      '<button class="chip" data-p="unidades">Escolher unidades…</button></div>'+
      '<div id="pUn" style="display:none;max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-top:8px">'+
        BASE.lojas.map(l=>'<label style="display:flex;gap:8px;align-items:center;font-size:12.8px;padding:3px 0"><input type="checkbox" data-l="'+l.id+'" style="width:auto"> '+esc(l.nome)+' <span class="mini">· '+esc(masterDe(l.master).nome.replace('Master ',''))+'</span></label>').join('')+'</div>'+
      '<div class="mini" id="pRes" style="margin-top:6px"></div></div>'+
    '<div class="grid g2" style="gap:12px"><div class="field"><label>Data</label><input type="date" id="pD" value="'+camp.dt.slice(0,10)+'"></div>'+
    '<div class="field"><label>Hora</label><input type="time" id="pH" value="'+camp.dt.slice(11,16)+'"></div></div>'+
    '<div class="field"><label>Canais</label><div class="chips" id="pCan"><button class="chip on">Instagram feed</button><button class="chip on">Story</button><button class="chip">Facebook</button></div></div>'+
    '<div class="hint">Envio pela integração de publicação da plataforma. Só entram na fila as contas conectadas; as demais recebem arte e legenda com aviso de publicação manual e vão para a esteira de ativação do CS.</div>',
    '<button class="btn" onclick="fechaModal()">Cancelar</button><button class="btn pri" id="okD">Programar publicação</button>');
  const chips=$$('#pPub .chip',ov);
  const lojasAlvo=()=>{
    const on=chips.filter(c=>c.classList.contains('on')).map(c=>c.dataset.p);
    if(on.indexOf('unidades')>=0){ const ids=$$('#pUn input:checked',ov).map(i=>i.dataset.l); return {ls:BASE.lojas.filter(l=>ids.indexOf(l.id)>=0), rotulo:ids.length+' unidade'+(ids.length===1?'':'s')+' escolhida'+(ids.length===1?'':'s')}; }
    if(!on.length || on.indexOf('todas')>=0) return {ls:BASE.lojas, rotulo:'Toda a rede · '+BASE.lojas.length+' unidades'};
    const ls=BASE.lojas.filter(l=>on.indexOf(l.master)>=0);
    return {ls, rotulo:on.map(id=>masterDe(id).nome.replace('Master ','')).join(' + ')+' · '+ls.length+' unidades'};
  };
  const resumo=()=>{ const a=lojasAlvo(), us=a.ls.flatMap(l=>corretoresDe(l.id)); $('#pRes',ov).textContent=a.rotulo+' · '+us.length+' associados, '+us.filter(u=>u.ig).length+' com conta conectada'; };
  chips.forEach(c=>c.addEventListener('click',()=>{
    const p=c.dataset.p;
    if(p==='todas'||p==='unidades'){ chips.forEach(x=>x.classList.toggle('on', x===c)); }
    else { c.classList.toggle('on'); chips.filter(x=>x.dataset.p==='todas'||x.dataset.p==='unidades').forEach(x=>x.classList.remove('on')); if(!chips.some(x=>x.classList.contains('on'))) chips[0].classList.add('on'); }
    $('#pUn',ov).style.display = chips.find(x=>x.dataset.p==='unidades').classList.contains('on')? 'block':'none';
    resumo();
  }));
  $$('#pUn input',ov).forEach(i=>i.addEventListener('change',resumo));
  $('#pC',ov).addEventListener('change',e=>{ const c=S.campanhas.find(x=>x.id===e.target.value); if(c){ $('#pD',ov).value=c.dt.slice(0,10); $('#pH',ov).value=c.dt.slice(11,16); } });
  resumo();
  $$('#pCan .chip',ov).forEach(c=>c.addEventListener('click',()=>c.classList.toggle('on')));
  $('#okD',ov).addEventListener('click',()=>{
    const cid=$('#pC',ov).value, d=$('#pD',ov).value, h=$('#pH',ov).value, alvo=lojasAlvo();
    if(!alvo.ls.length) return toast('Escolha pelo menos uma unidade.');
    const canais=$$('#pCan .chip.on',ov).map(c=>c.textContent);
    let n=0, semConta=0;
    commit('Programou publicação em massa', S.campanhas.find(c=>c.id===cid).tit+' · '+alvo.rotulo, s=>{
      const c=s.campanhas.find(x=>x.id===cid); c.dt=d+'T'+h; c.ag=c.ag||{}; c.st='agendada';
      c.pub={rotulo:alvo.rotulo, lojas:alvo.ls.map(l=>l.id), canais, quando:agora()};
      Object.values(s.usuarios).forEach(u=>{
        if(u.nivel!=='associado' || !alvo.ls.some(l=>l.id===u.loja)) return;
        if(!u.ig){ semConta++; return; }
        if(!c.ag[u.id]){ c.ag[u.id]=c.dt; n++; }
      });
    }, 'Integração de publicação');
    fechaModal(); CAL_MES=null; location.hash='#/prontos/'+cid; route();
    toast('<b>'+n+' contas</b> entraram na fila para '+new Date(d+'T'+h).toLocaleString('pt-BR')+' · '+esc(alvo.rotulo)+(semConta?'.<br>'+semConta+' sem conta conectada receberam a arte para publicação manual.':'.'),1);
  });
}

/* =======================================================================
   MÓDULO 2 · REDES SOCIAIS
   ======================================================================= */
VIEWS.redes=function(v){
  const us=usuariosVisiveis(), con=us.filter(u=>u.ig).length;
  const prov=PROVEDORES.find(p=>p.id===S.social.provedor);
  const fila=[];
  S.campanhas.forEach(c=>Object.keys(c.ag||{}).forEach(uidc=>{
    const u=S.usuarios[uidc]; if(!u||!us.some(x=>x.id===uidc)) return;
    fila.push({q:c.dt, tit:c.tit, u, st:new Date(c.dt)<HOJE?'publicada':'fila'});
  }));
  (S.social.fila||[]).forEach(p=>{ const u=S.usuarios[p.uid]; if(!u||!us.some(x=>x.id===p.uid)) return;
    fila.push({q:p.quando, tit:'Peça do Estúdio · '+p.tplNome, u, st:new Date(p.quando)<new Date()?'publicada':'fila'}); });
  fila.sort((a,b)=> a.q<b.q?1:-1);
  const eu_=souCorretor()?S.usuarios[euId()]:null;
  const conexaoReal = /^https?:/.test(location.protocol) && !EM_QUADRO && !!LS.get('pr_chave_api');   // integração ligada neste navegador
  const M=metricasRede(lojasVisiveis());

  v.innerHTML =
    ph('Redes sociais','Conexão das contas dos associados e agendamento em massa. É daqui que a arte oficial sai para o perfil de cada corretor, no mesmo dia e na mesma hora.',
      (eu_&&(!eu_.ig||(conexaoReal&&!eu_.teamSocial)))?'<button class="btn pri" id="conectar">Conectar meu Instagram</button>':
      (ROLE!=='corretor'?'<button class="btn pri" id="massa">Publicar em massa</button><button class="btn" id="conectarTodas">Conectar pendentes</button>':''),'redes')+
    '<div class="grid g4" style="margin-bottom:16px">'+
      kpi('Contas conectadas', con+'/'+us.length, pct(con/Math.max(1,us.length)*100)+' da base visível', con/Math.max(1,us.length)>.6?'k-ok':'k-warn')+
      kpi('Publicações na fila', fila.filter(f=>f.st==='fila').length, 'agendadas e ainda não publicadas')+
      kpi('Já publicadas', fila.filter(f=>f.st==='publicada').length, 'pela plataforma')+
      kpi('Alcance no período', compacto(M.alcance), 'somado das publicações da rede','k-ok')+
    '</div>'+
    '<div class="card pad" style="margin-bottom:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap">'+
      '<span class="tag ok">'+esc(T('Integração ativa'))+'</span>'+
      '<div style="flex:1;min-width:220px"><b>'+esc(T('Publicação automática no Instagram'))+'</b><div class="mini">'+esc(T('Feed, carrossel, reels e stories saem da plataforma direto para o perfil de cada associado. As métricas voltam a cada 24 horas.'))+'</div></div>'+
      '<span class="mini">'+esc(T('ativa desde'))+' '+new Date(S.social.conectadoEm).toLocaleDateString('pt-BR')+'</span></div>'+
    '<div class="grid g23">'+
      '<div class="card"><div class="ch"><h3>Fila de publicação</h3><div class="r"><span class="mini">gerada pelos agendamentos reais</span></div></div>'+
      '<div class="tw" style="max-height:430px;overflow:auto"><table><thead><tr><th>Quando</th><th>Conteúdo</th><th>Conta</th><th>Situação</th></tr></thead><tbody>'+
      (fila.slice(0,40).map(f=>'<tr><td class="num">'+new Date(f.q).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+'</td>'+
        '<td>'+esc(f.tit.split('—')[0].trim())+'</td><td class="mini">'+esc(primeiro(f.u.nome))+' · '+esc(lojaDe(f.u.loja).nome)+'</td>'+
        '<td>'+(f.st==='fila'?'<span class="tag">Agendada</span>':'<span class="tag ok">Publicada</span>')+'</td></tr>').join('')
        ||'<tr><td colspan="4"><div class="empty">Nada na fila. Programe uma publicação em massa.</div></td></tr>')+
      '</tbody></table></div></div>'+
      '<div class="card"><div class="ch"><h3>Contas dos associados</h3><div class="r"><span class="mini">'+con+' de '+us.length+'</span></div></div><div class="lst" style="max-height:430px;overflow:auto">'+
        us.slice(0,40).map(u=>'<div class="li" style="cursor:default">'+avatar(u)+
          '<div class="bd"><div class="t" style="font-size:13px">'+esc(u.nome)+'</div><div class="s">'+esc(lojaDe(u.loja).nome)+'</div></div>'+
          '<div class="rt">'+((u.ig&&(!conexaoReal||u.teamSocial))?'<span class="tag ok">Conectada'+(u.igConta?' · '+esc(u.igConta):'')+'</span>':
            (ROLE==='corretor'?'<span class="tag warn">Pendente</span>':'<button class="btn sm" data-con="'+u.id+'">'+(u.ig?'Conectar de verdade':'Conectar')+'</button>'))+'</div></div>').join('')+
      '</div></div>'+
    '</div>';

  const conecta=id=>{ commit('Conectou conta social', S.usuarios[id].nome, s=>{ s.usuarios[id].ig=true; }, (prov||{}).nome||'provedor');
    toast('<b>Conta conectada.</b> O associado entra nas publicações sincronizadas.',1); route(); };
  // conexão real: cria o espaço do associado na integração e abre a autorização do Instagram numa aba nova
  const conectaReal=async id=>{
    const u=S.usuarios[id]; const aba=window.open('about:blank','_blank');
    toast('Gerando o link de autorização de '+esc(primeiro(u.nome))+'…');
    const r=await chamarApi('social.php','conectar',{voltar:location.origin+location.pathname+'?instagram=voltou&u='+encodeURIComponent(id), usuario:{id, nome:u.nome}, teamId:u.teamSocial||''});
    if(!r.ok || !r.url){ if(aba) aba.close(); toast('<b>Não deu.</b> '+esc(r.erro||'')); return; }
    commit('Abriu a autorização do Instagram', u.nome, s=>{ s.usuarios[id].teamSocial=r.teamId; }, 'Integração de publicação');
    if(aba) aba.location.href=r.url; else location.href=r.url;
    toast('<b>Autorização aberta numa aba nova.</b> Entre com o Instagram de '+esc(primeiro(u.nome))+' e autorize. Ao voltar, a conta aparece conectada.',1);
  };
  $$('[data-con]',v).forEach(b=>b.addEventListener('click',()=>conexaoReal? conectaReal(b.dataset.con) : conecta(b.dataset.con)));
  $$('[data-prov]',v).forEach(b=>b.addEventListener('click',()=>{
    commit('Trocou o provedor de publicação', PROVEDORES.find(p=>p.id===b.dataset.prov).nome, s=>{ s.social.provedor=b.dataset.prov; s.social.conectadoEm=agora(); });
    route(); toast('Provedor atualizado para <b>'+esc(PROVEDORES.find(p=>p.id===b.dataset.prov).nome)+'</b>.',1);
  }));
  $('#massa')&&$('#massa').addEventListener('click',()=>disparoEmMassa(proximaCampanha().id));
  $('#conectarTodas')&&$('#conectarTodas').addEventListener('click',()=>{
    const pend=us.filter(u=>!u.ig);
    if(!pend.length) return toast('Todas as contas do seu escopo já estão conectadas.',1);
    const ov=modal('Conectar contas pendentes',
      '<p style="margin:0 0 12px;font-size:13.4px;color:var(--ink-2)">'+pend.length+' associados ainda não conectaram o perfil. A plataforma dispara o convite de autorização por e-mail e WhatsApp; quem autorizar entra automaticamente nas próximas campanhas.</p>'+
      '<div class="lst" style="border:1px solid var(--line);border-radius:12px;max-height:38vh;overflow:auto">'+
      pend.slice(0,20).map(u=>'<div class="li" style="cursor:default">'+avatar(u,26)+'<div class="bd"><div class="t" style="font-size:12.8px">'+esc(u.nome)+'</div><div class="s">'+esc(lojaDe(u.loja).nome)+'</div></div></div>').join('')+'</div>',
      '<button class="btn" onclick="fechaModal()">Cancelar</button><button class="btn pri" id="okT">Enviar convite a '+pend.length+'</button>');
    $('#okT',ov).addEventListener('click',()=>{
      commit('Enviou convite de conexão', pend.length+' associados', s=>{ pend.forEach(u=>{ if(Math.random()<0.55) s.usuarios[u.id].ig=true; }); });
      fechaModal(); route(); toast('Convites enviados. As autorizações que voltarem já aparecem conectadas.',1);
    });
  });
  $('#conectar')&&$('#conectar').addEventListener('click',()=>{
    const ov=modal('Conectar Instagram',
      '<div class="tl" style="margin-bottom:6px">'+
      ['Deixar a conta como profissional (Comercial ou Criador de conteúdo)','Abrir o link do convite e entrar com o Instagram','Autorizar a plataforma Prontos em Rede a publicar','Pronto: as campanhas da rede saem no seu perfil']
        .map((p,i)=>'<div class="it '+(i===0?'now':'')+'"><div class="t">'+p+'</div></div>').join('')+'</div>'+
      '<div class="hint">Se travar em qualquer passo, mande “instagram” no WhatsApp do suporte: um analista faz junto com você.</div>',
      '<button class="btn" onclick="fechaModal()">Depois</button><button class="btn pri" id="okC">Autorizar</button>');
    $('#okC',ov).addEventListener('click',()=>{ fechaModal(); conexaoReal? conectaReal(euId()) : conecta(euId()); });
  });
};
</script>
<script>
/* =======================================================================
   MÓDULO 3 · COMPLIANCE & GOVERNANCE
   ======================================================================= */
function novaAprovacao(o){
  const niveis=alcadasDe(o.tipo==='Evidência'||o.tipo==='Fachada'? o.tipo : 'Peça fora do padrão');
  S.aprovacoes.unshift(Object.assign({id:uid('a'), dt:agora(), st:'pendente', quem:eu().nome, niveis, nivel:0, trilha:[]}, o));
}
/* alçadas: cada item sobe N1 → N2 → N3; só a última aplica o resultado na jornada */
const niveisDe = a => (a.niveis && a.niveis.length)? a.niveis : alcadasDe(a.tipo==='Evidência'||a.tipo==='Fachada'? a.tipo : 'Peça fora do padrão');
const rotuloNivel = a => niveisDe(a)[Math.min(a.nivel||0, niveisDe(a).length-1)];
const nivelAtual = a => 'N'+(Math.min(a.nivel||0, niveisDe(a).length-1)+1)+' · '+rotuloNivel(a);
function trilhaHTML(a){
  const ns=niveisDe(a), at=a.st==='pendente'? (a.nivel||0) : ns.length;
  return '<div class="trilha">'+ns.map((n,i)=>'<span class="'+(i<at?'ok':i===at?'agora':'')+'">'+(i<at?'✓ ':'')+'N'+(i+1)+' · '+esc(n)+'</span>').join('<i>→</i>')+'</div>';
}
function aplicarAprovacao(a, ok, motivo){
  const u=S.unidades[a.loja];
  if(ok){
    if(a.alvo.tipo==='etapa'){ u.etapas[a.alvo.etapa].ok=true; u.etapas[a.alvo.etapa].enviado=false; u.etapas[a.alvo.etapa].em=agora(); }
    if(a.alvo.tipo==='fachada_projeto'){ u.fachada.st='producao'; u.etapas.e5.ok=true; u.etapas.e5.enviado=false; }
    if(a.alvo.tipo==='fachada_foto'){ u.fachada.st='instalada'; u.etapas.e6.ok=true; u.etapas.e6.enviado=false; }
  } else {
    if(a.alvo.tipo==='etapa') u.etapas[a.alvo.etapa].enviado=false;
    if(a.alvo.tipo==='fachada_projeto'){ u.fachada.st='nao_iniciada'; u.etapas.e5.enviado=false; }
    if(a.alvo.tipo==='fachada_foto'){ u.etapas.e6.enviado=false; }
    a.motivo=motivo||'';
  }
  a.st = ok?'aprovado':'reprovado'; a.decisor=eu().nome; a.decidido=agora();
}

function enviarEvidencia(lid, eid, contexto){
  const def=etapaDef(eid), l=lojaDe(lid);
  let anexos=[];
  const ov=modal('Enviar evidência · '+esc(def?def.nome:contexto.titulo||''),
    '<div class="mini" style="margin-bottom:12px">'+esc(l.nome)+(def?' · prazo '+dataLonga(dt(def.prazo)):'')+'</div>'+
    '<div class="drop" id="drop"><div class="ic">⇪</div><div class="t">Selecionar fotos, notas fiscais ou documentos</div>'+
    '<div class="mini">JPG, PNG ou PDF · a imagem é reduzida e anexada ao registro da etapa</div></div>'+
    '<div id="lista"></div>'+
    '<div class="field" style="margin-top:14px"><label>Observação para o aprovador</label><textarea id="obs" rows="2" placeholder="Ex.: cartões entregues pela gráfica em 05/09, nota anexa."></textarea></div>'+
    '<div class="hint">Toda evidência guarda autor, data e hora. É o que sustenta o relatório de compliance da RE/MAX Brasil.</div>',
    '<button class="btn" onclick="fechaModal()">Cancelar</button><button class="btn pri" id="okUp" disabled>Enviar para aprovação</button>');
  const pinta=()=>{ $('#lista',ov).innerHTML=anexos.map(a=>fileRow(a)).join(''); $('#okUp',ov).disabled=!anexos.length; };
  $('#drop',ov).addEventListener('click',()=>pedirArquivos('image/*,application/pdf',true,as=>{ anexos=anexos.concat(as); pinta(); }));
  $('#okUp',ov).addEventListener('click',()=>{
    const obs=$('#obs',ov).value.trim();
    commit('Enviou evidência', (def?def.nome:contexto.titulo)+' · '+l.nome, s=>{
      const alvo = contexto&&contexto.alvo ? contexto.alvo : {tipo:'etapa', etapa:eid};
      if(alvo.tipo==='etapa'){ const e=s.unidades[lid].etapas[eid]; e.evid=e.evid.concat(anexos); e.enviado=true; }
      if(alvo.tipo==='fachada_projeto') s.unidades[lid].fachada={...s.unidades[lid].fachada, st:'em_analise', projeto:anexos[0]};
      if(alvo.tipo==='fachada_foto'){ s.unidades[lid].fachada.foto=anexos[0]; s.unidades[lid].etapas.e6.enviado=true; }
      novaAprovacao({tipo: alvo.tipo==='etapa'?'Evidência':'Fachada',
        item:(contexto&&contexto.titulo? contexto.titulo : def.nome)+' — '+l.nome, loja:lid, obs:obs||'Sem observação.', alvo, anexos});
    });
    fechaModal(); route();
    toast('<b>Evidência enviada.</b><br>A etapa fica em aprovação até a Master validar.',1);
  });
}

VIEWS.jornada=function(v,arg){
  const ls=lojasVisiveis();
  const alvo = arg? lojaDe(arg) : (ls.length===1? ls[0] : null);
  if(alvo) return jornadaUnidade(v, alvo);
  const porEtapa=ETAPAS.map(e=>{
    const c=ls.filter(l=>S.unidades[l.id].etapas[e.id].ok).length;
    const a=ls.filter(l=>statusEtapa(l.id,e.id)==='atrasada').length;
    return {e,c,a,p:Math.round(c/ls.length*100)};
  });
  const emAtraso=ls.filter(l=>ETAPAS.some(e=>statusEtapa(l.id,e.id)==='atrasada')).length;
  v.innerHTML =
    ph('Jornada de adequação','Sete etapas, prazo por etapa, evidência anexada, aprovação e alerta automático. É o que transforma “todo mundo precisa se adequar” em uma linha por unidade, com data e responsável.',
      '<button class="btn" id="btnAl">🔔 Alertas</button><button class="btn pri" id="btnRel2">↓ Relatório</button>','jornada')+
    '<div class="grid g4" style="margin-bottom:16px">'+
      kpi('Adesão média', pct(mediaAdesao(ls)), ls.length+' unidades acompanhadas')+
      kpi('Etapas concluídas', porEtapa.reduce((a,x)=>a+x.c,0)+'/'+(ls.length*7), 'no conjunto da rede')+
      kpi('Unidades em atraso', emAtraso, 'com pelo menos uma etapa vencida', emAtraso?'k-bad':'k-ok')+
      kpi('Encerramento', DEADLINE.toLocaleDateString('pt-BR'), dias(DEADLINE)+' dias · prazo a confirmar com a RE/MAX','k-warn')+
    '</div>'+
    '<div class="card" style="margin-bottom:16px"><div class="ch"><h3>Progresso por etapa</h3><div class="r"><span class="mini">clique na etapa para ver quem falta</span></div></div><div class="cb">'+
      porEtapa.map(x=>'<div style="display:grid;grid-template-columns:1fr 130px 96px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer" data-e="'+x.e.id+'">'+
        '<div><div style="font-size:13.2px;font-weight:600">'+esc(x.e.nome)+'</div><div class="mini">Prazo '+dataLonga(dt(x.e.prazo))+(x.a?' · <span style="color:var(--bad)">'+x.a+' em atraso</span>':'')+'</div></div>'+
        barra(x.p)+'<div class="mini num" style="text-align:right">'+x.c+'/'+ls.length+' unidades</div></div>').join('')+
    '</div></div>'+
    '<div class="card"><div class="ch"><h3>Situação por unidade</h3><div class="r"><input id="fU" placeholder="Filtrar…" style="border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12.5px"></div></div>'+
      '<div class="tw"><table><thead><tr><th>Unidade</th><th>Regional</th>'+ETAPAS.map((e,i)=>'<th title="'+esc(e.nome)+'">E'+(i+1)+'</th>').join('')+'<th>Adesão</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div>';
  const cor={concluida:'var(--ok)',aprovacao:'var(--brand-2)',andamento:'var(--brand-3)',atrasada:'var(--red)',pendente:'var(--surface-3)'};
  const pinta=(f)=>{
    $('#tb').innerHTML=ls.filter(l=>!f||(l.nome+l.bairro).toLowerCase().includes(f.toLowerCase()))
      .sort((a,b)=>adesao(b.id)-adesao(a.id)).map(l=>
      '<tr><td style="font-weight:600">'+esc(l.nome)+'<div class="mini">'+esc(l.bairro)+'</div></td>'+
      '<td class="mini">'+esc(masterDe(l.master).nome.replace('Master ',''))+'</td>'+
      ETAPAS.map(e=>{ const s=statusEtapa(l.id,e.id);
        return '<td title="'+esc(e.nome)+' — '+s+'"><span style="display:inline-block;width:13px;height:13px;border-radius:4px;background:'+cor[s]+'"></span></td>';}).join('')+
      '<td style="min-width:110px">'+barra(adesao(l.id))+'<span class="mini num">'+adesao(l.id)+'%</span></td>'+
      '<td><a class="btn sm" href="#/jornada/'+l.id+'">Abrir</a></td></tr>').join('');
  };
  pinta();
  $('#fU').addEventListener('input',e=>pinta(e.target.value));
  $('#btnAl').addEventListener('click',viewAlertas);
  $('#btnRel2').addEventListener('click',()=>relatorioModal(ls));
  $$('[data-e]',v).forEach(el=>el.addEventListener('click',()=>{
    const e=etapaDef(el.dataset.e);
    const faltam=ls.filter(l=>!S.unidades[l.id].etapas[e.id].ok);
    modal('Quem falta · '+esc(e.nome),
      '<div class="mini" style="margin-bottom:10px">Prazo '+dataLonga(dt(e.prazo))+' · '+faltam.length+' unidades pendentes</div>'+
      '<div class="lst" style="border:1px solid var(--line);border-radius:12px;max-height:46vh;overflow:auto">'+
      (faltam.map(l=>'<div class="li" style="cursor:default"><span class="ico">'+adesao(l.id)+'</span><div class="bd"><div class="t">'+esc(l.nome)+'</div>'+
        '<div class="s">'+esc(masterDe(l.master).nome)+' · '+stTag(statusEtapa(l.id,e.id))+'</div></div></div>').join('')||'<div class="empty">Todas concluíram.</div>')+'</div>',
      '<button class="btn" onclick="fechaModal()">Fechar</button><button class="btn pri" id="cobrar">Cobrar as pendentes</button>');
    $('#cobrar').addEventListener('click',()=>{ commit('Cobrou etapa pendente', e.nome+' · '+faltam.length+' unidades'); fechaModal(); toast('Cobrança enviada por e-mail e WhatsApp a '+faltam.length+' unidades.',1); });
  }));
};

function jornadaUnidade(v,l){
  const U=S.unidades[l.id], e=proximaEtapa(l.id), d=dias(dt(e.prazo));
  const podeEnviar = ROLE==='franquia' || souMatriz() || ROLE==='master';
  v.innerHTML =
    (lojasVisiveis().length>1?'<a class="btn sm" href="#/jornada" style="margin-bottom:14px">← Todas as unidades</a>':'')+
    ph('Jornada · '+esc(l.nome), esc(l.bairro)+' · '+esc(masterDe(l.master).nome)+' · '+corretoresDe(l.id).length+' associados',
      '<a class="btn" href="#/fachadas">Fachada</a>'+(podeEnviar?'<button class="btn pri" id="up2">⇪ Enviar evidência</button>':''),'jornada')+
    '<div class="grid g4" style="margin-bottom:16px">'+
      kpi('Adesão', pct(adesao(l.id)), etapasOk(l.id)+' de 7 etapas concluídas', adesao(l.id)>=70?'k-ok':'k-warn')+
      kpi('Próxima etapa', d<0? Math.abs(d)+' <small>dias em atraso</small>' : d+' <small>dias</small>', esc(e.nome.slice(0,42)), d<0?'k-bad':d<30?'k-warn':'')+
      kpi('Evidências', ETAPAS.reduce((a,x)=>a+U.etapas[x.id].evid.length,0), 'fotos, notas e documentos anexados')+
      kpi('Pontos', pontosU(l.id), 'na régua da rede','k-ok')+
    '</div>'+
    '<div class="grid g23">'+
      '<div class="card"><div class="ch"><h3>Etapas</h3><div class="r"><span class="mini">prazos definidos pela RE/MAX Brasil</span></div></div><div class="cb"><div class="tl">'+
        ETAPAS.map(x=>{ const s=statusEtapa(l.id,x.id), dd=dias(dt(x.prazo)), ev=U.etapas[x.id].evid;
          return '<div class="it '+(s==='concluida'?'done':s==='atrasada'?'late':(s==='andamento'||s==='aprovacao')?'now':'')+'">'+
          '<div class="t">'+esc(x.nome)+'</div>'+
          '<div class="d">Prazo '+dataLonga(dt(x.prazo))+' · '+(s==='concluida'?'concluída':dd<0?'vencida há '+Math.abs(dd)+' dias':'faltam '+dd+' dias')+'</div>'+
          (ev.length?'<div style="margin-top:6px">'+ev.slice(0,2).map(a=>fileRow(a)).join('')+'</div>':'')+
          '<div class="r">'+stTag(s)+
            (s==='concluida'? '' : s==='aprovacao'? '<span class="mini">aguardando a Master</span>' :
             podeEnviar? '<button class="btn sm" data-up="'+x.id+'">Enviar evidência</button>':'')+
          '</div></div>';
        }).join('')+'</div></div></div>'+
      '<div><div class="card" style="margin-bottom:16px"><div class="ch"><h3>Linha do tempo</h3></div><div class="cb">'+
        ETAPAS.map(x=>{
          const p=Math.max(0,Math.min(100,Math.round((dt(x.prazo)-new Date(2026,7,1))/(DEADLINE-new Date(2026,7,1))*100)));
          const ok=U.etapas[x.id].ok;
          return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px"><span class="mini" style="width:46px">'+dataBR(dt(x.prazo))+'</span>'+
          '<div style="flex:1;height:8px;background:var(--surface-2);border-radius:99px;position:relative">'+
          '<span style="position:absolute;left:'+p+'%;top:-3px;width:14px;height:14px;border-radius:50%;background:'+(ok?'var(--ok)':'var(--brand-2)')+';transform:translateX(-50%)"></span></div></div>';
        }).join('')+
        '<div class="hint" style="margin-top:8px">Prazos são <b>parâmetros</b>: a RE/MAX Brasil ajusta pelo painel, sem depender de desenvolvimento.</div>'+
      '</div></div>'+
      '<div class="card"><div class="ch"><h3>Alertas desta unidade</h3></div><div class="cb">'+
        (ETAPAS.filter(x=>!U.etapas[x.id].ok).slice(0,4).map(x=>{ const dd=dias(dt(x.prazo));
          return '<div style="display:flex;gap:9px;align-items:flex-start;margin-bottom:10px"><span class="tag '+(dd<0?'bad':dd<45?'warn':'mut')+'">'+(dd<0?'vencida':'faltam '+dd+'d')+'</span><div style="font-size:12.7px">'+esc(x.nome)+'</div></div>';
        }).join('')||'<div class="mini">Nenhuma pendência. Unidade em dia.</div>')+
        '<div class="mini">Enviados por e-mail, WhatsApp e no painel — a 60, 30 e 7 dias do prazo.</div>'+
      '</div></div></div>'+
    '</div>';
  $$('[data-up]',v).forEach(b=>b.addEventListener('click',()=>enviarEvidencia(l.id,b.dataset.up)));
  $('#up2')&&$('#up2').addEventListener('click',()=>enviarEvidencia(l.id, proximaEtapa(l.id).id));
}

/* ---------- Fachadas ---------- */
const FACH_LABEL={nao_iniciada:'Não iniciada', em_analise:'Projeto em análise', producao:'Em produção', instalada:'Instalada'};
function fachadaCard(l){
  const F=S.unidades[l.id].fachada, nova=F.st==='instalada';
  const corpo = F.foto&&F.foto.thumb
    ? '<img src="'+F.foto.thumb+'" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" alt="">'
    : '<div class="sky"></div><div class="bld"></div><div class="band'+(nova?'':' old')+'"><img src="'+LOGO+'" alt=""></div><div class="door"></div><div class="grd"></div>';
  return '<div><div class="fach">'+corpo+'<span class="st">'+(nova?'<span class="tag ok">Nova identidade</span>':'<span class="tag warn">'+FACH_LABEL[F.st]+'</span>')+'</span></div>'+
    '<div style="font-size:12.6px;font-weight:600;margin-top:7px">'+esc(l.nome)+'</div><div class="mini">'+esc(l.bairro)+'</div></div>';
}
VIEWS.fachadas=function(v){
  const ls=lojasVisiveis(), l0=minhaLoja()||ls[0], F=S.unidades[l0.id].fachada;
  const inst=ls.filter(l=>S.unidades[l.id].fachada.st==='instalada').length;
  const podeEnviar = ROLE!=='corretor';
  v.innerHTML =
    ph('Fachadas','Passo a passo, submissão do projeto, aprovação, produção e foto final — mais o acervo nacional com a fachada atualizada de cada unidade. É a etapa mais cara e mais visível da adequação.',
      '<button class="btn" id="dlProj">↓ Projeto padrão</button>'+(podeEnviar&&F.st==='nao_iniciada'?'<button class="btn pri" id="subm">Enviar projeto</button>':''),'fachadas')+
    '<div class="grid g4" style="margin-bottom:16px">'+
      kpi('Fachadas instaladas', inst+'/'+ls.length, pct(inst/ls.length*100)+' da base visível', inst/ls.length>.5?'k-ok':'k-warn')+
      kpi('Projetos em análise', ls.filter(l=>S.unidades[l.id].fachada.st==='em_analise').length, 'aguardando aprovação')+
      kpi('Em produção', ls.filter(l=>S.unidades[l.id].fachada.st==='producao').length, 'com fornecedor homologado')+
      kpi('Prazo de instalação', dt('2027-03-15').toLocaleDateString('pt-BR'), 'etapa 6 da jornada','k-warn')+
    '</div>'+
    '<div class="grid g23" style="margin-bottom:16px">'+
      '<div class="card"><div class="ch"><h3>Fluxo da unidade</h3><div class="r"><span class="mini">'+esc(l0.nome)+'</span></div></div><div class="cb"><div class="tl">'+
        (function(){
          const et=['nao_iniciada','em_analise','producao','instalada'].indexOf(F.st);
          const passos=[['Baixar o projeto padrão e medir a fachada',0],['Enviar o projeto adaptado (PDF, DWG ou foto)',0],
            ['Aprovação da Master Regional',1],['Orçamento com fornecedor homologado',2],['Produção e instalação',2],
            ['Enviar a foto final para o acervo nacional',3]];
          return passos.map((p,i)=>{
            const cls = p[1]<et? 'done' : p[1]===et? 'now':'';
            let extra='';
            if(i===1 && F.projeto) extra='<div style="margin-top:6px">'+fileRow(F.projeto)+'</div>';
            if(i===1 && !F.projeto && podeEnviar && F.st==='nao_iniciada') extra='<div class="r"><button class="btn sm" id="subm2">Enviar projeto</button></div>';
            if(i===5 && F.foto) extra='<div style="margin-top:6px">'+fileRow(F.foto)+'</div>';
            if(i===5 && !F.foto && podeEnviar && F.st==='producao') extra='<div class="r"><button class="btn sm" id="foto">Enviar foto final</button></div>';
            return '<div class="it '+cls+'"><div class="t">'+p[0]+'</div>'+extra+'</div>';
          }).join('');
        })()+
      '</div></div></div>'+
      '<div class="card"><div class="ch"><h3>Antes e depois</h3></div><div class="cb"><div class="grid g2" style="gap:12px">'+
        '<div><div class="fach"><div class="sky"></div><div class="bld"></div><div class="band old"><img src="'+LOGO+'" style="opacity:.75" alt=""></div><div class="door"></div><div class="grd"></div></div><div class="mini" style="margin-top:6px">Identidade anterior</div></div>'+
        '<div><div class="fach">'+(F.foto&&F.foto.thumb?'<img src="'+F.foto.thumb+'" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" alt="">':'<div class="sky"></div><div class="bld"></div><div class="band"><img src="'+LOGO+'" alt=""></div><div class="door"></div><div class="grd"></div>')+'</div>'+
        '<div class="mini" style="margin-top:6px">'+(F.foto?'Foto enviada pela unidade':'Nova identidade')+'</div></div>'+
      '</div></div></div>'+
    '</div>'+
    '<div class="card"><div class="ch"><h3>Acervo nacional de fachadas</h3><div class="r"><span class="mini">'+ls.length+' unidades ativas · previsto para ~600 na rede</span></div></div>'+
      '<div class="cb"><div class="grid" style="grid-template-columns:repeat(5,1fr);gap:14px">'+ls.slice(0,10).map(fachadaCard).join('')+'</div>'+
      '<div class="hint" style="margin-top:16px">O acervo alimenta materiais institucionais, o relatório de compliance e a checagem visual da adequação — sem pedir foto por WhatsApp.</div></div></div>';
  const enviarProjeto=()=>enviarEvidencia(l0.id,'e5',{titulo:'Projeto de fachada', alvo:{tipo:'fachada_projeto'}});
  $('#subm')&&$('#subm').addEventListener('click',enviarProjeto);
  $('#subm2')&&$('#subm2').addEventListener('click',enviarProjeto);
  $('#foto')&&$('#foto').addEventListener('click',()=>enviarEvidencia(l0.id,'e6',{titulo:'Foto da fachada instalada', alvo:{tipo:'fachada_foto'}}));
  $('#dlProj').addEventListener('click',()=>{
    const t=TEMPLATES.find(x=>x.id==='t15');
    montarPeca({fmt:'slide',tema:'claro',titulo:t.txt,sub:'Especificação de letreiro, cores e materiais · '+dataLonga(HOJE),nome:'RE/MAX Brasil',creci:'',tel:'',unidade:'Padrão nacional de fachada'})
      .then(cv=>pecaPDF(cv,'remax-projeto-padrao-fachada.pdf'));
    commit('Baixou o projeto padrão de fachada','Fachadas'); toast('Projeto padrão baixado em PDF.',1);
  });
};

/* ---------- Aprovações ---------- */
VIEWS.aprovacoes=function(v){
  const meu=ROLE==='franquia';
  const lista = souMatriz()? S.aprovacoes : ROLE==='master'? S.aprovacoes.filter(a=>lojaDoMaster(lojaDe(a.loja))) : S.aprovacoes.filter(a=>a.loja===escopoLoja());
  const pend=lista.filter(a=>a.st==='pendente' && (meu || podeDecidirNivel(rotuloNivel(a))));
  v.innerHTML =
    ph('Fluxo de aprovação','Projetos de fachada, evidências de etapa e peças fora do padrão passam por aprovação. Cada decisão fica registrada com autor, data e justificativa — e o que é aprovado avança a jornada da unidade na hora.',
      '','aprovacoes')+
    '<div class="grid g3" style="margin-bottom:16px">'+
      kpi(meu?'Suas pendências':'Aguardando você', pend.length, meu?'enviadas pela sua unidade':'SLA de resposta: 3 dias úteis', pend.length?'k-warn':'k-ok')+
      kpi('Aprovados', lista.filter(a=>a.st==='aprovado').length, 'no período')+
      kpi('Reprovados', lista.filter(a=>a.st==='reprovado').length, 'com justificativa registrada')+
    '</div>'+
    (meu?'<div class="hint" style="margin-bottom:16px">A franquia acompanha o andamento, mas quem aprova são as alçadas definidas pela Matriz.</div>':
      '<div class="hint" style="margin-bottom:16px"><b>Alçadas.</b> Evidências passam por N1 · Master Regional e N2 · Matriz; projetos de fachada sobem até N3 · Diretoria. Você decide o que está no seu nível'+(souMatriz()?' — <a href="#/jornadas">ajustar alçadas</a>':'')+'.</div>')+
    '<div class="card"><div class="lst" id="aps"></div></div>';
  const pinta=()=>{
    $('#aps').innerHTML = lista.map(a=>
      '<div class="li" style="cursor:default"><span class="ico" style="'+(a.tipo==='Fachada'?'background:var(--brand-soft);color:var(--brand-2)':a.tipo==='Evidência'?'background:var(--ok-soft);color:var(--ok)':'background:var(--warn-soft);color:var(--warn)')+'">'+a.tipo[0]+'</span>'+
      '<div class="bd"><div class="t">'+esc(a.item)+' <span class="tag mut">'+esc(a.tipo)+'</span></div>'+
      '<div class="s">'+esc(lojaDe(a.loja).nome)+' · '+esc(a.quem)+' · '+quando(a.dt)+' — '+esc(a.obs||'')+
        (a.motivo?' <b style="color:var(--bad)">Motivo: '+esc(a.motivo)+'</b>':'')+
        (a.decisor?' · decidido por '+esc(a.decisor):'')+'</div>'+trilhaHTML(a)+
        ((a.anexos&&a.anexos.length)?'<div style="margin-top:6px;max-width:420px">'+a.anexos.slice(0,2).map(x=>fileRow(x)).join('')+'</div>':'')+
      '</div>'+
      '<div class="rt">'+(a.st==='pendente'
        ? (!meu && podeDecidirNivel(rotuloNivel(a))?'<div style="display:flex;gap:6px"><button class="btn sm" data-no="'+a.id+'">Reprovar</button><button class="btn sm pri" data-ok="'+a.id+'">Aprovar</button></div>'
           :'<span class="tag warn">Aguardando '+esc(nivelAtual(a))+'</span>')
        : stTag(a.st))+'</div></div>').join('')||'<div class="empty">Nada para aprovar.</div>';
    $$('[data-ok]').forEach(b=>b.addEventListener('click',()=>{
      const a=S.aprovacoes.find(x=>x.id===b.dataset.ok);
      const nv=nivelAtual(a), ultimo=(a.nivel||0)>=niveisDe(a).length-1;
      commit(ultimo?'Aprovou':'Aprovou no nível e encaminhou', a.item+' · '+nv, s=>{ const x=s.aprovacoes.find(y=>y.id===a.id);
        x.niveis=niveisDe(x); x.trilha=(x.trilha||[]).concat([{nivel:nv, quem:eu().nome, q:agora()}]);
        if(ultimo) aplicarAprovacao(x,true); else x.nivel=(x.nivel||0)+1; });
      route(); renderNav();
      toast(ultimo?'<b>Aprovado.</b> A unidade avançou na jornada e a adesão foi recalculada.'
                  :'<b>Aprovado no '+esc(nv)+'.</b> Seguiu para '+esc(nivelAtual(S.aprovacoes.find(y=>y.id===a.id)))+'.',1);
    }));
    $$('[data-no]').forEach(b=>b.addEventListener('click',()=>{
      const a=S.aprovacoes.find(x=>x.id===b.dataset.no);
      const ov=modal('Reprovar · '+esc(a.item),'<div class="field"><label>Motivo (vai para a unidade)</label><textarea id="mot" rows="3" placeholder="Ex.: proporção do logotipo alterada — refazer pelo Estúdio."></textarea></div>',
        '<button class="btn" onclick="fechaModal()">Cancelar</button><button class="btn red" id="okNo">Reprovar</button>');
      $('#okNo',ov).addEventListener('click',()=>{
        const m=$('#mot',ov).value.trim();
        commit('Reprovou', a.item, s=>{ aplicarAprovacao(s.aprovacoes.find(x=>x.id===a.id), false, m); });
        fechaModal(); route(); toast('Reprovado — motivo enviado à unidade.');
      });
    }));
  };
  pinta();
};
</script>
<script>
/* =======================================================================
   MÓDULO 4 · COMMUNICATION CENTER
   ======================================================================= */
let AREA_ATUAL='Todas';
VIEWS.comunicados=function(v,arg){
  if(arg) return comunicadoDetalhe(v,arg);
  const ls=lojasVisiveis();
  const podePublicar = souMatriz()||ROLE==='master';
  const meus=S.comunicados.length, obr=S.comunicados.filter(k=>k.obr).length;
  const minhaLeitura=S.comunicados.length-naoLidos().length;
  const redeLeitura=Math.round(ls.reduce((a,l)=>a+leituraDe(l.id),0)/Math.max(1,ls.length));
  v.innerHTML =
    ph('Comunicados','Canal direto da RE/MAX Brasil e das Masters com franquias e associados — pesquisável, com histórico e confirmação de leitura. É o que substitui a cascata de WhatsApp.',
      podePublicar?'<button class="btn pri" id="novoC">+ Novo comunicado</button>':'','comunicados')+
    '<div class="grid g4" style="margin-bottom:16px">'+
      kpi('Publicados', meus, 'no repositório institucional')+
      kpi('Leitura obrigatória', obr, 'com confirmação exigida')+
      kpi('Sua leitura', minhaLeitura+'/'+meus, naoLidos().length? naoLidos().length+' pendentes':'em dia', naoLidos().length?'k-warn':'k-ok')+
      kpi('Leitura da rede', pct(redeLeitura), 'média das unidades do seu escopo', redeLeitura>70?'k-ok':'k-warn')+
    '</div>'+
    '<div class="chips" id="areas" style="margin-bottom:14px">'+['Todas'].concat(AREAS).map(a=>'<button class="chip '+(a===AREA_ATUAL?'on':'')+'" data-a="'+a+'">'+a+'</button>').join('')+'</div>'+
    '<div class="card"><div class="lst" id="ks"></div></div>';
  const pinta=()=>{
    const ks=S.comunicados.filter(k=>AREA_ATUAL==='Todas'||k.area===AREA_ATUAL);
    $('#ks').innerHTML=ks.map(k=>{
      const lido=(S.leituras[k.id]||[]).indexOf(euId())>=0;
      return '<div class="li '+(lido?'':'unread')+'" data-k="'+k.id+'"><span class="ico">'+esc(k.area.slice(0,2).toUpperCase())+'</span>'+
      '<div class="bd"><div class="t">'+esc(k.tit)+(k.obr?' <span class="tag red">Obrigatório</span>':'')+(lido?'':' <span class="tag">Novo</span>')+'</div>'+
      '<div class="s">'+esc(k.res)+'</div></div>'+
      '<div class="rt"><span>'+dt(k.dt).toLocaleDateString('pt-BR')+'</span><span class="mini">'+esc(k.autor||k.area)+'</span></div></div>';
    }).join('')||'<div class="empty">Nenhum comunicado nesta área.</div>';
    $$('#ks .li').forEach(el=>el.addEventListener('click',()=>location.hash='#/comunicados/'+el.dataset.k));
  };
  pinta();
  $$('#areas .chip').forEach(b=>b.addEventListener('click',()=>{AREA_ATUAL=b.dataset.a;$$('#areas .chip').forEach(x=>x.classList.toggle('on',x===b));pinta();}));
  $('#novoC')&&$('#novoC').addEventListener('click',()=>{
    let img='';
    const dests = souMatriz()? ['Toda a rede','Masters Regionais','Franquias','Associados'].concat(BASE.masters.map(m=>'Regional · '+m.nome))
                             : ['Toda a regional','Franquias da regional','Associados da regional'];
    const ov=modal('Novo comunicado',
      '<div class="field"><label>Título</label><input id="cT" placeholder="Ex.: Etapa de papelaria — prorrogação de prazo"></div>'+
      '<div class="grid g2" style="gap:12px"><div class="field"><label>Área</label><select id="cA">'+AREAS.map(a=>'<option>'+a+'</option>').join('')+'</select></div>'+
      '<div class="field"><label>Destinatários</label><select id="cD">'+dests.map(d=>'<option>'+esc(d)+'</option>').join('')+'</select></div></div>'+
      '<div class="field"><label>Resumo</label><input id="cR" placeholder="Uma linha que aparece na lista"></div>'+
      '<div class="field"><label>Texto</label><textarea id="cC" rows="4" placeholder="Conteúdo do comunicado…"></textarea></div>'+
      '<div class="field"><label>Imagem ou vídeo (opcional)</label><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="cImg">Anexar imagem</button>'+
        '<input id="cVid" placeholder="ou o link de um vídeo do YouTube ou do Instagram" style="flex:1;min-width:200px"></div><div id="cImgP" style="margin-top:8px"></div></div>'+
      '<div class="grid g2" style="gap:12px"><div class="field"><label>Evento (opcional)</label><input type="date" id="cEv"></div>'+
      '<div class="field"><label>Local do evento</label><input id="cEvL" placeholder="Ex.: São Paulo · SP"></div></div>'+
      '<div class="field"><label>Avisar por</label><div class="chips" id="cCan"><button class="chip on" data-c="plataforma" disabled>Plataforma</button>'+
        '<button class="chip on" data-c="email">E-mail</button><button class="chip on" data-c="whatsapp">WhatsApp</button><button class="chip" data-c="popup">Aviso ao entrar</button></div></div>'+
      '<label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" id="cO" checked style="width:auto"> Exigir confirmação de leitura</label>',
      '<button class="btn" onclick="fechaModal()">Cancelar</button><button class="btn pri" id="cOk">Publicar</button>');
    $$('#cCan .chip:not([disabled])',ov).forEach(c=>c.addEventListener('click',()=>c.classList.toggle('on')));
    $('#cImg',ov).addEventListener('click',()=>escolherImagem(1200,.8,url=>{ img=url; $('#cImgP',ov).innerHTML='<img src="'+url+'" alt="" style="max-height:110px;border-radius:10px">'; }));
    $('#cOk',ov).addEventListener('click',()=>{
      const tit=$('#cT',ov).value.trim(); if(!tit) return toast('Dê um título ao comunicado.');
      const lk=$('#cVid',ov).value.trim(), yt=ytId(lk), ig=yt?'':igCodigo(lk);
      if(lk && !yt && !ig) return toast('O link de vídeo precisa ser do YouTube ou do Instagram.');
      const canais=['plataforma'].concat($$('#cCan .chip.on:not([disabled])',ov).map(c=>c.dataset.c));
      const dest=$('#cD',ov).value, n=destinatariosN(dest), id=uid('k'), ev=$('#cEv',ov).value;
      commit('Publicou comunicado', tit+' · '+dest, s=>{
        s.comunicados.unshift({id, area:$('#cA',ov).value, tit, dt:new Date().toISOString().slice(0,10),
          obr:$('#cO',ov).checked, res:$('#cR',ov).value.trim()||tit, corpo:esc($('#cC',ov).value.trim()).replace(/\n/g,'<br>'),
          autor:eu().nome, dest, canais, popup:canais.indexOf('popup')>=0,
          midia:(img||yt||ig)?{img, yt, ig}:null, evento:ev?{data:ev, hora:'09:00', fim:'18:00', local:$('#cEvL',ov).value.trim()}:null});
        s.leituras[id]=[];
        s.envios.unshift({k:id, q:agora(), tipo:'publicacao', canais, n, quem:eu().nome});
      });
      const ext=canais.filter(c=>c==='email'||c==='whatsapp').map(c=>c==='email'?'e-mail':'WhatsApp');
      fechaModal(); route(); toast('<b>Comunicado publicado</b> para '+n+' pessoas'+(ext.length?', com aviso por '+ext.join(' e '):'')+'. A leitura passa a ser medida.',1);
    });
  });
};

function comunicadoDetalhe(v,id){
  const k=S.comunicados.find(x=>x.id===id); if(!k){location.hash='#/comunicados';return;}
  const lido=(S.leituras[k.id]||[]).indexOf(euId())>=0;
  const ls=lojasVisiveis(), verLeitura=ROLE!=='corretor';
  v.innerHTML =
    '<a class="btn sm" href="#/comunicados" style="margin-bottom:14px">← Comunicados</a>'+
    ph(esc(k.tit),'<span class="tag mut">'+esc(k.area)+'</span> &nbsp; publicado em '+dt(k.dt).toLocaleDateString('pt-BR')+' por '+esc(k.autor||'RE/MAX Brasil')+
      (k.obr?' &nbsp; <span class="tag red">Leitura obrigatória</span>':''),'','comunicados')+
    '<div class="grid '+(verLeitura?'g23':'')+'">'+
      '<div class="card pad">'+midiaComunicado(k)+'<div style="font-size:14.2px;line-height:1.7;color:var(--ink-2)">'+k.corpo+'</div>'+eventoComunicado(k)+'<div class="divider"></div>'+
        '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+
        (lido?'<span class="tag ok">✓ Leitura confirmada</span>':'<button class="btn pri" id="okLer">Confirmar leitura</button>')+
        '<button class="btn" id="dlK">↓ Baixar</button><a class="btn" href="#/jornada">Ir para a jornada</a></div></div>'+
      (verLeitura?'<div class="card"><div class="ch"><h3>Quem leu</h3><div class="r"><span class="mini">'+(S.leituras[k.id]||[]).length+' confirmações</span></div></div><div class="cb">'+
        ls.slice(0,8).map(l=>{
          const cs=corretoresDe(l.id), n=cs.filter(u=>(S.leituras[k.id]||[]).indexOf(u.id)>=0).length;
          const p=Math.round(n/Math.max(1,cs.length)*100);
          return '<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:12.7px"><span style="font-weight:600">'+esc(l.nome)+'</span><span class="mini num">'+n+'/'+cs.length+'</span></div>'+barra(p)+'</div>';
        }).join('')+
        '<div class="divider"></div>'+enviosComunicado(k)+'<button class="btn sm" id="cobrar">Cobrar quem não leu</button></div></div>':'')+
    '</div>';
  $('#okLer')&&$('#okLer').addEventListener('click',()=>{
    commit('Confirmou leitura', k.tit, s=>{ s.leituras[k.id]=(s.leituras[k.id]||[]).concat([euId()]); });
    route(); renderNav(); toast('Leitura confirmada, com data e hora.',1);
  });
  $('#icsK')&&$('#icsK').addEventListener('click',()=>{ baixarBlob(new Blob([icsDe(k)],{type:'text/calendar;charset=utf-8'}),'evento-'+k.id+'.ics'); toast('Convite baixado: abre em qualquer agenda.',1); });
  $('#cobrar')&&$('#cobrar').addEventListener('click',()=>{
    const faltam=[]; ls.forEach(l=>corretoresDe(l.id).forEach(u=>{ if((S.leituras[k.id]||[]).indexOf(u.id)<0) faltam.push(u); }));
    const link=location.href.split('#')[0]+'#/comunicados/'+k.id;
    const msg='Olá! Você ainda não confirmou a leitura do comunicado "'+k.tit+'". Leva menos de um minuto: '+link;
    const ov=modal('Cobrar quem não leu',
      '<p style="margin:0 0 12px;font-size:13.4px;color:var(--ink-2)"><b>'+faltam.length+' pessoas</b> ainda não confirmaram. A cobrança sai pelos canais marcados e fica registrada neste comunicado.</p>'+
      '<div class="field"><label>Canais</label><div class="chips" id="cbC"><button class="chip on" data-c="email">E-mail</button><button class="chip on" data-c="whatsapp">WhatsApp</button><button class="chip" data-c="popup">Aviso ao entrar</button></div></div>'+
      '<div class="field"><label>Mensagem</label><textarea id="cbM" rows="4">'+esc(msg)+'</textarea></div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn sm" id="cbZap" target="_blank" rel="noopener">Testar no meu WhatsApp</a><a class="btn sm" id="cbMail">Testar no meu e-mail</a></div>'+
      '<div class="hint" style="margin-top:12px">Os botões de teste abrem o seu WhatsApp e o seu e-mail com a mensagem pronta — é o que cada pessoa vai receber.</div>',
      '<button class="btn" onclick="fechaModal()">Cancelar</button><button class="btn pri" id="cbOk">Enviar cobrança a '+faltam.length+'</button>');
    const atualiza=()=>{ const t=$('#cbM',ov).value;
      $('#cbZap',ov).href='https://wa.me/?text='+encodeURIComponent(t);
      $('#cbMail',ov).href='mailto:?subject='+encodeURIComponent('Leitura pendente: '+k.tit)+'&body='+encodeURIComponent(t); };
    atualiza(); $('#cbM',ov).addEventListener('input',atualiza);
    $$('#cbC .chip',ov).forEach(c=>c.addEventListener('click',()=>c.classList.toggle('on')));
    $('#cbOk',ov).addEventListener('click',()=>{
      const canais=$$('#cbC .chip.on',ov).map(c=>c.dataset.c); if(!canais.length) return toast('Marque pelo menos um canal.');
      commit('Cobrou leitura', k.tit+' · '+faltam.length+' pessoas · '+canais.join(', '), s=>{
        s.envios.unshift({k:k.id, q:agora(), tipo:'cobranca', canais, n:faltam.length, quem:eu().nome});
        if(canais.indexOf('popup')>=0){ const x=s.comunicados.find(y=>y.id===k.id); x.popup=true; } });
      fechaModal(); route(); toast('<b>Cobrança enviada</b> a '+faltam.length+' pessoas por '+canais.map(c=>c==='email'?'e-mail':c==='whatsapp'?'WhatsApp':'aviso ao entrar').join(' e ')+'.',1);
    });
  });
  $('#dlK').addEventListener('click',()=>{
    const txt=k.tit+'\n'+dt(k.dt).toLocaleDateString('pt-BR')+' · '+k.area+' · '+(k.autor||'RE/MAX Brasil')+'\n\n'+k.corpo.replace(/<br\s*\/?>/g,'\n').replace(/<[^>]+>/g,'');
    baixarBlob(new Blob([txt],{type:'text/plain;charset=utf-8'}), 'comunicado-'+k.id+'.txt'); toast('Comunicado baixado.',1);
  });
}

/* ---------- comunicados: mídia, evento e envios ---------- */
function destinatariosN(dest){
  const us=Object.values(S.usuarios), daReg=mid=>us.filter(u=>(lojaDe(u.loja)||{}).master===mid).length;
  if(dest==='Masters Regionais') return BASE.masters.length;
  if(dest==='Franquias') return BASE.lojas.length;
  if(dest==='Associados') return us.filter(u=>u.nivel==='associado').length;
  if(/^Regional · /.test(dest)){ const m=BASE.masters.find(x=>'Regional · '+x.nome===dest); return m?daReg(m.id):0; }
  if(/regional/.test(dest)){ const f=/Franquias/.test(dest)? u=>u.nivel==='franquia' : /Associados/.test(dest)? u=>u.nivel==='associado' : ()=>true;
    return us.filter(u=>lojaDoMaster(lojaDe(u.loja)) && f(u)).length; }
  return us.length + BASE.masters.length;
}
function midiaComunicado(k){
  const m=k.midia; if(!m) return '';
  if(m.yt||m.ig) return '<div class="video-inst k-video">'+capaBotao({yt:m.yt, ig:m.ig, tit:k.tit})+'</div>';
  return m.img? '<img src="'+m.img+'" alt="" data-lupa style="display:block;width:100%;border-radius:14px;margin-bottom:16px;cursor:zoom-in">' : '';
}
const dataIcs = (d,h) => d.replace(/-/g,'')+'T'+String(h||'09:00').replace(':','')+'00';
function eventoComunicado(k){
  const e=k.evento; if(!e) return '';
  const g='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(k.tit)+'&dates='+dataIcs(e.data,e.hora)+'/'+dataIcs(e.data,e.fim||e.hora)+
    '&ctz=America/Sao_Paulo&location='+encodeURIComponent(e.local||'')+'&details='+encodeURIComponent(k.res||'');
  return '<div class="k-evento"><div><b>'+dataLonga(dt(e.data))+'</b> · '+esc(e.hora||'')+(e.fim?'–'+esc(e.fim):'')+(e.local?' · '+esc(e.local):'')+'</div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><a class="btn sm pri" href="'+g+'" target="_blank" rel="noopener">Adicionar ao Google Agenda</a>'+
    '<button class="btn sm" id="icsK">↓ Convite para Outlook e celular (.ics)</button></div></div>';
}
function icsDe(k){
  const e=k.evento, limpa=s=>String(s||'').replace(/[,;]/g,' ').replace(/<[^>]+>/g,' ');
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//BMAG//Prontos em Rede//PT','BEGIN:VEVENT','UID:'+k.id+'@prontosemrede',
    'DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART;TZID=America/Sao_Paulo:'+dataIcs(e.data,e.hora),
    'DTEND;TZID=America/Sao_Paulo:'+dataIcs(e.data,e.fim||e.hora),'SUMMARY:'+limpa(k.tit),'LOCATION:'+limpa(e.local),'DESCRIPTION:'+limpa(k.res),
    'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:'+limpa(k.tit),'END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
}
function enviosComunicado(k){
  const es=(S.envios||[]).filter(x=>x.k===k.id);
  const can=c=>c==='email'?'E-mail':c==='whatsapp'?'WhatsApp':c==='popup'?'Aviso ao entrar':'Plataforma';
  return '<div style="margin-bottom:12px"><div style="font-size:12.5px;font-weight:600;margin-bottom:6px">Envios</div>'+
    (es.length? es.map(x=>{ const r=seed('env'+x.k+x.q);
      return '<div class="mini" style="padding:5px 0;border-bottom:1px solid var(--line)"><b>'+(x.tipo==='cobranca'?'Cobrança':'Publicação')+'</b> · '+quando(x.q)+' · '+x.n+' pessoas<br>'+

function cnpjOk(c){ c=String(c||'').replace(/\D/g,''); if(c.length!==14 || /^(\d)\1+$/.test(c)) return false;

function importarUsuarios(ls){
  const inp=$('#filePicker'); inp.value=''; inp.accept='.csv,text/csv,.txt'; inp.multiple=false;
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f) return; const t0=performance.now(); const fr=new FileReader();
    fr.onload=()=>{
      const linhas=lerCSV(fr.result), cab=(linhas.shift()||[]).map(normCab);
      const col=(...ks)=>cab.findIndex(h=>ks.some(k=>h===k||h.indexOf(k)===0));
      const c={nome:col('nome completo','nome'), email:col('e mail','email'), tel:col('celular','telefone','whatsapp'), perfil:col('perfil','nivel','cargo'),
               loja:col('unidade','loja'), creci:col('creci'), insta:col('instagram')};
      if(c.nome<0||c.email<0||c.tel<0) return toast('A planilha precisa das colunas nome completo, e-mail e celular. Baixe o modelo.');
      const existentes=new Set(Object.values(S.usuarios).map(u=>(u.email||'').toLowerCase())), vistos=new Set();
      const achaLoja=n=>{ const k=normCab(n); if(!k) return null; return ls.find(l=>normCab(l.nome)===k) || ls.find(l=>normCab(l.nome).includes(k)||k.includes(normCab(l.nome))) || null; };
      const rows=linhas.map(r=>{ const g=i=>i>=0?String(r[i]||'').trim():'';
        const x={nome:g(c.nome), email:g(c.email), tel:g(c.tel), perfil:/gest|franq|broker|dono/i.test(g(c.perfil))?'franquia':'associado',
                 lojaTxt:g(c.loja), creci:g(c.creci), insta:g(c.insta).replace(/^@/,'')};
        x.loja=achaLoja(x.lojaTxt);
        x.erro=!x.nome?'sem nome':!emailOk(x.email)?'e-mail inválido':x.tel.replace(/\D/g,'').length<10?'celular sem DDD':
               existentes.has(x.email.toLowerCase())?'já cadastrado':vistos.has(x.email.toLowerCase())?'repetido na planilha':'';
        vistos.add(x.email.toLowerCase()); return x; });
      const bons=rows.filter(x=>!x.erro);
      const ov=modal('Importar planilha · '+esc(f.name),
        '<div class="mini" style="margin-bottom:10px">'+rows.length+' linhas lidas · <b>'+bons.length+' prontas</b>'+(rows.length-bons.length?' · '+(rows.length-bons.length)+' com problema (não entram)':'')+'</div>'+
        '<div class="field"><label>Unidade para quem veio sem unidade reconhecida</label><select id="imU">'+ls.map(l=>'<option value="'+l.id+'">'+esc(l.nome)+'</option>').join('')+'</select></div>'+
        '<div class="tw" style="max-height:46vh;overflow:auto"><table><thead><tr><th></th><th>Nome</th><th>E-mail</th><th>Celular</th><th>Perfil</th><th>Unidade</th></tr></thead><tbody>'+
        rows.map(x=>'<tr'+(x.erro?' style="opacity:.55"':'')+'><td>'+(x.erro?'<span class="tag bad">'+esc(x.erro)+'</span>':'<span class="tag ok">ok</span>')+'</td><td>'+esc(x.nome)+'</td><td class="mini">'+esc(x.email)+'</td>'+
          '<td class="mini">'+esc(x.tel)+'</td><td class="mini">'+(x.perfil==='franquia'?'Gestor':'Corretor')+'</td><td class="mini">'+esc(x.loja?x.loja.nome:(x.lojaTxt||'—')+' → padrão')+'</td></tr>').join('')+
        '</tbody></table></div>',
        '<button class="btn" onclick="fechaModal()">Cancelar</button><button class="btn pri" id="imOk"'+(bons.length?'':' disabled')+'>Cadastrar '+bons.length+' e convidar</button>');
      $('#imOk',ov).addEventListener('click',()=>{
        const padrao=$('#imU',ov).value;
        commit('Importou planilha de usuários', f.name+' · '+bons.length+' pessoas', s=>{
          bons.forEach(x=>{ const id=uid('u'); s.usuarios[id]={id, nome:x.nome, email:x.email, tel:x.tel, insta:x.insta, creci:x.creci, foto:'', loja:x.loja?x.loja.id:padrao,
            nivel:x.perfil, ativo:false, ig:false, criado:agora(), pecasFeitas:0, ultimo:null}; });
          s.convites+=bons.length; s.ultimaImportacao={n:bons.length, ms:Math.round(performance.now()-t0), q:agora()};
        });
        fechaModal(); route(); toast('<b>'+bons.length+' pessoas cadastradas</b> em '+((performance.now()-t0)/1000).toFixed(1).replace('.',',')+' s. Os convites saíram por e-mail e WhatsApp.',1);
      });
    };
    fr.readAsText(f,'utf-8'); };
  inp.click();
}

function abrirTicket(o){
  const n='#'+(4822+S.tickets.filter(t=>/^#48/.test(t.id)).length);
  const t=Object.assign({id:n, canal:'Plataforma', prio:'Média', sla:'8h', st:'Aberto', resp:'Fila N1',
    loja:escopoLoja()||'l18', autor:eu().nome, abertura:agora(), ia:false, msgs:[]}, o);
  commit('Abriu chamado', t.id+' · '+t.assunto, s=>{ s.tickets.unshift(t); }, o.canal||'Plataforma');
  avisarSuporte(t);
  return t;
}
/* aviso ao suporte (e-mail e, quando configurado, WhatsApp) — o destinatário é fixo no servidor, por isso não pede chave */
function avisarSuporte(t){
  if(typeof SINCRONIZA==='undefined' || !SINCRONIZA) return;
  const l=lojaDe(t.loja)||{};
  fetch('api/notificar.php?acao=chamado',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    id:t.id, assunto:t.assunto, autor:t.autor, papel:eu().papel, unidade:l.nome||'', prio:t.prio, sla:t.sla, canal:t.canal,
    descricao:(t.msgs&&t.msgs[0]&&t.msgs[0].txt)||'', link:location.origin+location.pathname+'#/suporte'})})
  .then(r=>r.json()).then(j=>{ if(j.ok) toast('<b>Suporte avisado</b> por '+esc(j.canais||'e-mail')+'.',1); else if(j.erro) console.warn('aviso ao suporte:', j.erro); }).catch(()=>{});
}
VIEWS.suporte=function(v){
  const ls=lojasVisiveis();

      '<button class="btn pri" id="novoT">+ Abrir chamado</button><button class="btn" id="zap">Simular WhatsApp</button>','suporte')+
    '<div class="grid g4" style="margin-bottom:16px">'+

    $$('[data-t]').forEach(b=>b.addEventListener('click',()=>detalheTicket(b.dataset.t, pintaT)));
  };
  pintaT();

  const msgs=$('#msgs');
  const addMsg=(txt,quem,fonte)=>{ const d=document.createElement('div'); d.className='msg '+quem;
    d.innerHTML=txt+(fonte?'<div class="src">Fonte: <b>'+esc(fonte)+'</b></div>':''); msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight; return d; };
  addMsg('Oi, '+esc(primeiro(eu().nome))+'. Sou o assistente do Prontos em Rede. Respondo sobre uso da marca, materiais, prazos da adequação e fachada — e, quando não sei, abro um chamado com uma pessoa da equipe.','bot');
  const responder=(t)=>{
    const r=respostaIA(t);
    if(r.fonte){ addMsg(esc(r.tx),'bot',r.fonte); return; }
    const d=addMsg('Não encontrei essa resposta no Brand Center. Quer que eu abra um chamado para uma pessoa da operação?','bot');
    const b=document.createElement('button'); b.className='btn sm pri'; b.style.marginTop='8px'; b.textContent='Abrir chamado';
    b.addEventListener('click',()=>{ const tk=abrirTicket({assunto:t.slice(0,70), canal:'Plataforma', prio:'Média'});
      b.remove(); addMsg('Chamado <b>'+tk.id+'</b> criado · responsável: Fila N1 · SLA 8h. Você acompanha na lista abaixo.','bot','Escalonamento humano'); pintaT(); renderNav(); });
    d.appendChild(b);
  };
  const enviar=()=>{ const t=$('#chatIn').value.trim(); if(!t) return; addMsg(esc(t),'me'); $('#chatIn').value=''; setTimeout(()=>responder(t),380); };
  $('#chatGo').addEventListener('click',enviar);
  $('#chatIn').addEventListener('keydown',e=>{ if(e.key==='Enter') enviar(); });

  $('#novoT').addEventListener('click',()=>{

      '<div class="field"><label>Prioridade</label><select id="tP"><option>Baixa</option><option selected>Média</option><option>Alta</option></select></div></div>'+

      '<button class="btn" onclick="fechaModal()">Cancelar</button><button class="btn pri" id="tOk">Abrir chamado</button>');

      fechaModal(); pintaT(); renderNav(); toast('<b>Chamado '+t.id+' aberto.</b> SLA de '+sla+'.',1);

  $('#zap').addEventListener('click',()=>{

      '<div style="background:#E9F5EC;border-radius:14px;padding:16px">'+
      '<div style="background:#fff;border-radius:10px;padding:10px 13px;font-size:13px;max-width:80%;margin-bottom:9px">Oi, preciso do cartão de visita novo com meu CRECI</div>'+

      '<button class="btn" onclick="fechaModal()">Fechar</button><button class="btn pri" id="zOk">Enviar como WhatsApp</button>');
    $('#zOk',ov).addEventListener('click',()=>{
      const t=abrirTicket({assunto:$('#zTxt',ov).value.trim().slice(0,70)||'Mensagem via WhatsApp', canal:'WhatsApp', prio:'Alta', sla:'2h'});

function detalheTicket(id, apos){
  const t=S.tickets.find(x=>x.id===id);
  const podeAgir = souMatriz()||ROLE==='master'||ROLE==='franquia';
  const ov=modal('Chamado '+t.id,
    '<div class="kv"><span class="k">Assunto</span><span class="v"><b>'+esc(t.assunto)+'</b></span></div>'+
    '<div class="kv"><span class="k">Unidade</span><span class="v">'+esc((lojaDe(t.loja)||{}).nome||'—')+' · aberto por '+esc(t.autor||'—')+'</span></div>'+
    '<div class="kv"><span class="k">Canal / SLA</span><span class="v">'+esc(t.canal)+' · '+esc(t.sla)+' · prioridade '+esc(t.prio)+'</span></div>'+
    '<div class="kv"><span class="k">Situação</span><span class="v">'+esc(t.st)+' · responsável '+esc(t.resp)+'</span></div>'+
    '<div style="margin-top:14px" id="hist">'+((t.msgs||[]).map(m=>'<div style="border-left:2px solid var(--line);padding:6px 0 6px 12px;margin-bottom:8px"><div style="font-size:13px">'+esc(m.txt)+'</div><div class="mini">'+esc(m.quem)+' · '+quando(m.q)+'</div></div>').join('')||'<div class="mini">Sem interações registradas.</div>')+'</div>'+
    (podeAgir?'<div class="field" style="margin-top:12px"><label>Responder</label><textarea id="resp" rows="2" placeholder="Resposta ao usuário…"></textarea></div>':''),
    podeAgir? '<button class="btn" id="esc">Escalar N2</button><button class="btn" id="respBtn">Responder</button><button class="btn pri" id="res">Resolver</button>'
            : '<button class="btn pri" onclick="fechaModal()">Fechar</button>');
  if(!podeAgir) return;
  $('#respBtn',ov).addEventListener('click',()=>{
    const txt=$('#resp',ov).value.trim(); if(!txt) return toast('Escreva a resposta.');
    commit('Respondeu chamado', t.id, s=>{ const x=s.tickets.find(y=>y.id===id); x.msgs=(x.msgs||[]).concat([{quem:eu().nome,txt,q:agora()}]); x.st='Em atendimento'; x.resp=eu().nome; });
    fechaModal(); apos&&apos(); renderNav(); toast('Resposta registrada e enviada ao usuário.',1);
  });
  $('#esc',ov).addEventListener('click',()=>{
    commit('Escalou chamado', t.id, s=>{ const x=s.tickets.find(y=>y.id===id); x.st='Escalado · N2'; x.resp='Coordenação · N2'; });
    fechaModal(); apos&&apos(); renderNav(); toast('Chamado escalado para o N2.');
  });
  $('#res',ov).addEventListener('click',()=>{
    commit('Resolveu chamado', t.id, s=>{ const x=s.tickets.find(y=>y.id===id); x.st='Resolvido'; });

  });
}

      '<div class="hint" style="margin-top:16px">Cada onda repete o mesmo kit de onboarding. Sem kit templatizado, subir 20 unidades consome semanas que a operação não tem.</div>'+
    '</div></div>'+
    '<div class="grid g23">'+
      '<div class="card"><div class="ch"><h3>Carteira de unidades</h3><div class="r"><span class="mini">avance o onboarding pelo botão</span></div></div>'+
      '<div class="tw"><table><thead><tr><th>Unidade</th><th>Onboarding</th><th>Ativos</th><th>Adesão</th><th>Risco</th><th></th></tr></thead><tbody id="tbo"></tbody></table></div></div>'+
      '<div class="card"><div class="ch"><h3>Kit de onboarding</h3></div><div class="cb"><div class="tl">'+
        [['Reunião de abertura de 30 minutos com o gestor','done'],['Cadastro da loja e da equipe pela planilha (≈15 min)','done'],
         ['Primeiro acesso de cada associado (≈5 min) e videoaulas do Help Desk','now'],['Primeira peça publicada por cada associado','pendente'],
         ['Checklist da jornada iniciado','pendente'],['Revisão de 30 dias com o CS','pendente']]

    $('#tbo').innerHTML=ls.map(l=>{
      const U=S.unidades[l.id], risco=(ativosDe(l.id)/Math.max(1,corretoresDe(l.id).length)<.5)||U.ultima>6;

      '<td class="num">'+ativosDe(l.id)+'/'+corretoresDe(l.id).length+'</td>'+
      '<td style="min-width:100px">'+barra(adesao(l.id))+'</td>'+
      '<td>'+(risco?'<span class="tag bad">Atenção do CS</span>':'<span class="tag ok">Saudável</span>')+'</td>'+

      pinta(); toast(l.nome+' agora está '+novo+'.',1);
    }));
  };
  pinta();
};
