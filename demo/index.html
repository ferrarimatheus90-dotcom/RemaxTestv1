function metricasCorretor(id){
  const u=S.usuarios[id]||{}, r=seed('mk:'+id);
  const base = u.ativo? rint(r,4,20) : rint(r,0,3);
  const reais = S.campanhas.filter(c=>c.ag&&c.ag[id]).length + S.pecas.filter(p=>p.uid===id).length;
  const posts = base+reais;
  const seguidores = u.ig? rint(r,320,4200) : rint(r,0,180);
  const alcance = Math.round(posts*(180+r()*520) + seguidores*0.7);
  const eng = 1.2 + r()*4.4;
  const reels = Math.round(posts*(0.12+r()*0.28));
  const stories = Math.round(posts*(0.5+r()*1.3));
  const imoveis = rint(r,0,16);
  const dist = Array.from({length:SEMANAS},(_,i)=> Math.max(0, Math.round(posts/SEMANAS*(0.4+r()*1.6))));
  const inter=alcance*eng/100;      // interações estimadas sobre o alcance
  return {posts, alcance, eng, reels, stories, imoveis, seguidores, freq:posts/SEMANAS, dist,
          curtidas:Math.round(inter*0.82), comentarios:Math.round(inter*0.07), salvos:Math.round(inter*0.08), compart:Math.round(inter*0.03)};
}
function metricasLoja(lid){
  const cs=corretoresDe(lid);
  const acc={posts:0,alcance:0,reels:0,stories:0,imoveis:0,seguidores:0,eng:0,pecas:0,curtidas:0,comentarios:0,salvos:0,compart:0,dist:Array(SEMANAS).fill(0)};
  cs.forEach(c=>{ const m=metricasCorretor(c.id);
    acc.posts+=m.posts; acc.alcance+=m.alcance; acc.reels+=m.reels; acc.stories+=m.stories;
    acc.imoveis+=m.imoveis; acc.seguidores+=m.seguidores; acc.eng+=m.eng;
    acc.curtidas+=m.curtidas; acc.comentarios+=m.comentarios; acc.salvos+=m.salvos; acc.compart+=m.compart;
    m.dist.forEach((d,i)=>acc.dist[i]+=d); });
  acc.eng = cs.length? acc.eng/cs.length : 0;
  acc.freq = cs.length? acc.posts/SEMANAS/cs.length : 0;
  acc.pecas = S.pecas.filter(p=>{const u=S.usuarios[p.uid]; return u&&u.loja===lid;}).length;
  acc.corretores = cs.length; acc.ativos = ativosDe(lid);
  return acc;
}
function metricasRede(ls){
  const acc={posts:0,alcance:0,reels:0,stories:0,imoveis:0,seguidores:0,eng:0,pecas:0,corretores:0,ativos:0,curtidas:0,comentarios:0,salvos:0,compart:0,dist:Array(SEMANAS).fill(0)};
  ls.forEach(l=>{ const m=metricasLoja(l.id);
    ['posts','alcance','reels','stories','imoveis','seguidores','pecas','corretores','ativos','curtidas','comentarios','salvos','compart'].forEach(k=>acc[k]+=m[k]);
    acc.eng+=m.eng; m.dist.forEach((d,i)=>acc.dist[i]+=d); });
  acc.eng = ls.length? acc.eng/ls.length : 0;
  acc.freq = acc.corretores? acc.posts/SEMANAS/acc.corretores : 0;
  acc.serie = acc.dist;
  acc.seriePecas = acc.dist.map((d,i)=> Math.round(d*(0.35+((i%4)*0.06))) + (i===SEMANAS-1? S.pecas.length:0));
  const hoje=new Date(HOJE);
  acc.semanas = Array.from({length:SEMANAS},(_,i)=>{ const d=new Date(hoje); d.setDate(d.getDate()-(SEMANAS-1-i)*7); return dataBR(d); });
  return acc;
}

  const mix=[{n:'Feed',v:Math.max(0,m.posts-m.reels)},{n:'Reels',v:m.reels},{n:'Stories',v:m.stories}];
  v.innerHTML =
    ph('Meus indicadores','Como está o seu marketing: quanto você publica, quanto alcança e como isso se compara com a média da sua unidade.','','marketing')+

      kpi('Engajamento', m.eng.toFixed(1).replace('.',',')+'%', 'média da unidade: '+ml.eng.toFixed(1).replace('.',',')+'%', m.eng>=ml.eng?'k-ok':'k-warn')+

function calorJornada(cv, ls){
  const peso={concluida:1, aprovacao:.7, andamento:.4, atrasada:.15, pendente:0}, rot={concluida:'✓', aprovacao:'⇧', andamento:'…', atrasada:'!', pendente:''};
  const nomeSt={concluida:'concluída', aprovacao:'em aprovação', andamento:'em andamento', atrasada:'atrasada', pendente:'pendente'};
  const ord=ls.slice().sort((a,b)=>adesao(b.id)-adesao(a.id));
  gCalor(cv, ord.map(NOME_CURTO), ['E1','E2','E3','E4','E5','E6','E7'],
    ord.map(l=>ETAPAS.map((e,j)=>{ const s=statusEtapa(l.id,e.id); return {v:peso[s], rot:rot[s], s:ETAPA_CURTA[j]+' — '+nomeSt[s]+' · prazo '+dataBR(dt(e.prazo))}; })),
    {altLinha: ls.length>12? 22 : 26});
}

      ls.slice().sort((a,b)=>adesao(b.id)-adesao(a.id)).map(l=>{ const U=S.unidades[l.id];
        return '<tr><td style="font-weight:600">'+esc(l.nome)+'<div class="mini">'+esc(masterDe(l.master).nome.replace('Master ',''))+'</div></td>'+

        '<td>'+(U.etapas.e3.ok?'<span class="tag ok">OK</span>':'<span class="tag mut">pendente</span>')+'</td>'+
        '<td class="num">'+ativosDe(l.id)+'/'+corretoresDe(l.id).length+'</td>'+

      '</tbody></table></div></div>'+
    '<div class="grid g3" style="margin-bottom:16px">'+
      '<div class="card"><div class="ch"><h3>Chamados por situação</h3></div><div class="cb"><div class="grafico"><canvas id="gTk"></canvas></div><div id="gTkLeg"></div></div></div>'+
      '<div class="card"><div class="ch"><h3>Publicações por semana</h3></div><div class="cb"><div class="grafico"><canvas id="gPub"></canvas></div></div></div>'+
      '<div class="card"><div class="ch"><h3>Leitura por regional</h3><div class="r"><span class="mini">comunicados obrigatórios</span></div></div><div class="cb"><div class="grafico"><canvas id="gLeReg"></canvas></div></div></div>'+
    '</div>'+
    '<div class="grid g2">'+
      '<div class="card"><div class="ch"><h3>Evolução da adesão</h3></div><div class="cb"><div class="grafico"><canvas id="gEvo"></canvas></div></div></div>'+
      '<div class="card"><div class="ch"><h3>Situação das unidades</h3></div><div class="cb"><div class="grafico"><canvas id="gSit"></canvas></div>'+
        legenda([{n:'Em conformidade',v:conformes,cor:cssVar('--ok','#1F6B45')},{n:'Em andamento',v:ls.filter(l=>adesao(l.id)<70&&adesao(l.id)>=40).length,cor:PALETA[5]},{n:'Em risco',v:ls.filter(l=>adesao(l.id)<40).length,cor:cssVar('--red','#D4222F')}])+
      '</div></div>'+
    '</div>';
  const base=mediaAdesao(ls);
  gLinha($('#gEvo'), ['abr','mai','jun','jul','ago','set'],
    [{nome:'Adesão média', dados:[0,1,2,3,4,5].map(i=> i===5? base : Math.max(3,Math.round(base*(0.25+i*0.15)))), cor:PALETA[0]}],
    {alt:230, fmt:v=>Math.round(v)+'%'});
  gRosca($('#gSit'), [{n:'Em conformidade',v:conformes,cor:cssVar('--ok','#1F6B45')},
                      {n:'Em andamento',v:ls.filter(l=>adesao(l.id)<70&&adesao(l.id)>=40).length,cor:PALETA[5]},
                      {n:'Em risco',v:ls.filter(l=>adesao(l.id)<40).length,cor:cssVar('--red','#D4222F')}],
    {alt:230, centro:String(ls.length), rotulo:'unidades'});
  medidoresPintar(ls);
  funilJornada($('#gFunil'), ls);
  const top8=ls.slice().sort((a,b)=>adesao(b.id)-adesao(a.id)).slice(0,8);
  gBarrasH($('#gRankAd'), top8.map(NOME_CURTO), top8.map(l=>adesao(l.id)), {fmt:v=>v+'%', max:100, meta:70, metaRotulo:'meta 70%'});
  calorJornada($('#gCalor'), ls);
  const tk=S.tickets.filter(t=>souMatriz()||masterVeRede()||ls.some(l=>l.id===t.loja));
  const grp=[['Em atendimento',t=>/atendimento|Aberto/.test(t.st),PALETA[0]],['Escalado · N2',t=>/Escalado/.test(t.st),PALETA[5]],['Aguardando',t=>/Aguardando|aprovação/.test(t.st),PALETA[3]],['Resolvidos',t=>/Resolvido/.test(t.st),PALETA[4]]]
    .map(x=>({n:x[0], v:tk.filter(x[1]).length, cor:x[2]}));
  gRosca($('#gTk'), grp, {alt:200, centro:String(tk.length), rotulo:'chamados'}); $('#gTkLeg').innerHTML=legenda(grp);
  gLinha($('#gPub'), M.semanas, [{nome:'Publicações', dados:M.serie, cor:PALETA[0]}], {alt:200});
  const regs=BASE.masters.filter(m=>ls.some(l=>l.master===m.id)).map(m=>({m, ls:ls.filter(l=>l.master===m.id)}));
  gBarrasH($('#gLeReg'), regs.map(r=>r.m.nome.replace('Master ','')), regs.map(r=>leituraMedia(r.ls)), {fmt:v=>v+'%', max:100, meta:80, metaRotulo:'meta 80%', cor:PALETA[2], alt:200});
  $('#rel3').addEventListener('click',()=>relatorioModal(ls));
};

      '<div style="font-family:var(--font-d);font-size:22px;font-weight:800;margin-top:6px">Convenção de maio de 2027</div>'+

      '<div style="margin-left:auto;text-align:right"><div style="font-family:var(--font-d);font-size:40px;font-weight:800;letter-spacing:-.03em" class="num">'+faltam+'</div><div class="mini" style="color:#CFE9FB">dias para a convenção</div></div></div>'+
      '<div style="height:8px;border-radius:99px;background:rgba(255,255,255,.22);margin-top:18px;overflow:hidden"><i style="display:block;height:100%;width:'+Math.round((1-faltam/total)*100)+'%;background:#fff;border-radius:99px"></i></div>'+
    '</div>'+
    '<div class="grid g3" style="margin-bottom:16px">'+
      (minha? kpi('Sua posição', pos+'º', 'entre as '+ls.length+' unidades', pos<=5?'k-ok':'') : kpi('Unidades pontuando', ls.length, 'toda a rede do programa'))+

      kpi('Média da rede', Math.round(ls.reduce((a,l)=>a+pontosU(l.id),0)/ls.length), 'pontos por unidade')+
    '</div>'+
    '<div class="grid g23">'+
      '<div class="card"><div class="ch"><h3>Ranking de unidades</h3><div class="r"><span class="mini">recalculado a cada ação na plataforma</span></div></div>'+

        '<td class="num">'+adesao(l.id)+'%</td><td class="num">'+etapasOk(l.id)+'/7</td>'+
        '<td style="font-family:var(--font-d);font-weight:800" class="num">'+pontosU(l.id)+'</td></tr>').join('')+
      '</tbody></table></div></div>'+

        regionais.map((r,i)=>'<div style="display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid var(--line)">'+
        '<span style="font-family:var(--font-d);font-weight:800;color:'+(i===0?'var(--red)':'var(--muted)')+'">'+(i+1)+'º</span>'+
        '<div style="flex:1"><div style="font-size:12.9px;font-weight:600">'+esc(r.m.nome)+'</div><div class="mini">'+esc(r.m.area)+'</div></div>'+

        avatar(x.u)+'<div class="bd"><div class="t" style="font-size:12.9px">'+esc(x.u.nome)+'</div><div class="s">'+esc(lojaDe(x.u.loja).nome)+'</div></div>'+
        '<div class="rt"><b class="num">'+x.p+'</b></div></div>').join('')+
      '</div></div></div>'+
    '</div>';
  $('#regras').addEventListener('click',()=>modal('Como a pontuação funciona',

    [['Etapa concluída dentro do prazo','+'+PONTOS.etapa],['Etapa concluída em atraso','+'+PONTOS.etapaAtraso],
     ['Etapa com evidência aprovada','+'+PONTOS.evidencia],['Participação em campanha sincronizada','+'+PONTOS.campanha+' por campanha'],
     ['Confirmação de leitura obrigatória','+'+PONTOS.leitura],['Peça oficial gerada pelo Estúdio','+'+PONTOS.peca],
     ['Fachada instalada e validada','+'+PONTOS.fachada],['Entrega validada no Programa de Excelência','conforme o critério']]
    .map(r=>'<tr><td>'+r[0]+'</td><td style="font-family:var(--font-d);font-weight:700;color:var(--ok)">'+r[1]+'</td></tr>').join('')+
    '</tbody></table></div>'+
    '<div class="hint" style="margin-top:14px">Pesos configuráveis pela RE/MAX Brasil. Aprove uma evidência em Compliance ou valide uma comprovação no Programa de Excelência e volte aqui: o ranking muda.</div>',
    '<button class="btn pri" onclick="fechaModal()">Entendi</button>'));

<script>
/* =======================================================================
   MÓDULO 6 · PROGRAMA DE EXCELÊNCIA
   Entrega comprovada com foto, guardada e validada — vira ponto e bonificação.
   ======================================================================= */
const critDe = id => ((S&&S.pexCriterios)||CRITERIOS_EXC).find(c=>c.id===id) || {nome:'Critério', pts:0};
const provasDe = lid => S.excelencia.provas.filter(p=>p.loja===lid);
function pontosExcLoja(lid){ return provasDe(lid).filter(p=>p.st==='aprovado').reduce((a,p)=>a+p.pts,0); }
function pontosExcUser(id){ return S.excelencia.provas.filter(p=>p.uid===id&&p.st==='aprovado').reduce((a,p)=>a+p.pts,0); }
function faixaDe(pts){
  const fs=S.excelencia.faixas.slice().sort((a,b)=>b.min-a.min);
  return fs.find(f=>pts>=f.min) || null;
}
function proximaFaixa(pts){
  const fs=S.excelencia.faixas.slice().sort((a,b)=>a.min-b.min);
  return fs.find(f=>pts<f.min) || null;
}

VIEWS.excelencia=function(v){
  const eGestor = souMatriz()||ROLE==='master';
  const alvoLoja = escopoLoja();
  const ls=lojasVisiveis();
  const provas = eGestor ? S.excelencia.provas.filter(p=>ls.some(l=>l.id===p.loja)) : provasDe(alvoLoja);
  const pend = provas.filter(p=>p.st==='pendente');
  const meusPts = souCorretor()? pontosExcUser(euId()) : alvoLoja? pontosExcLoja(alvoLoja) : provas.filter(p=>p.st==='aprovado').reduce((a,p)=>a+p.pts,0);
  const faixa = faixaDe(meusPts), prox = proximaFaixa(meusPts);
  const encerra = dias(dt(S.excelencia.encerra));

  v.innerHTML =
    ph('Programa de Excelência','Cada entrega feita vale ponto — desde que comprovada. O associado ou a unidade envia a foto da prova, a RE/MAX valida, o arquivo fica guardado com autor, data e hora, e os pontos entram na faixa de bonificação do ciclo.',
      (ROLE!=='brasil'?'<button class="btn pri" id="envProva">＋ Enviar comprovação</button>':'')+
      (souMatriz()?'<button class="btn" id="editFaixas">Configurar faixas</button><button class="btn pri" id="expExc">↓ Exportar comprovações</button>':''),'excelencia')+
    '<div class="grid g4" style="margin-bottom:16px">'+
      kpi(eGestor?'Pontos validados':'Meus pontos', nf(meusPts), 'no ciclo '+esc(S.excelencia.ciclo), faixa?'k-ok':'')+
      kpi('Faixa atual', faixa? esc(faixa.nome) : '—', prox? 'faltam '+(prox.min-meusPts)+' pontos para '+prox.nome : 'faixa máxima alcançada', faixa&&faixa.id==='ouro'?'k-ok':'k-warn')+
      kpi('Comprovações guardadas', provas.length, provas.filter(p=>p.st==='aprovado').length+' validadas')+
      kpi('Ciclo encerra em', encerra+' <small>dias</small>', dataLonga(dt(S.excelencia.encerra)), encerra<30?'k-warn':'')+
    '</div>'+
    '<div class="grid g3" style="margin-bottom:16px">'+
      S.excelencia.faixas.slice().sort((a,b)=>b.min-a.min).map(f=>
        '<div class="faixa '+f.id+'"><div class="fn">'+esc(f.nome)+(faixa&&faixa.id===f.id?' <span class="tag ok">sua faixa</span>':'')+'</div>'+
        '<div class="fq">a partir de '+f.min+' pontos no ciclo</div>'+
        '<div class="fb">'+esc(f.premio)+'</div>'+
        '<div style="margin-top:11px">'+barra(Math.min(100,Math.round(meusPts/f.min*100)))+
        '<span class="mini num">'+nf(meusPts)+' / '+f.min+'</span></div></div>').join('')+
    '</div>'+
    (eGestor&&pend.length?'<div class="hint warn" style="margin-bottom:16px"><b>'+pend.length+' comprovações aguardando validação.</b> Validar credita os pontos na hora e move o ranking da rede.</div>':'')+
    '<div class="grid g23" style="margin-bottom:16px">'+
      '<div class="card"><div class="ch"><h3>Critérios do ciclo</h3><div class="r"><span class="mini">'+critLista().length+' formas de pontuar</span></div></div><div class="cb">'+
        critLista().map(c=>{
          const feita = provas.some(p=>p.criterio===c.id && p.st==='aprovado');
          return '<div class="crit"><div class="pt">'+c.pts+'</div><div class="cn"><b>'+esc(c.nome)+(feita?' <span class="tag ok">validado</span>':'')+'</b>'+
          '<span>'+esc(c.desc)+' · prova: '+esc(c.prova)+'</span></div>'+
          (ROLE!=='brasil'&&!feita?'<button class="btn sm" data-crit="'+c.id+'">Comprovar</button>':'')+'</div>';
        }).join('')+
      '</div></div>'+
      '<div class="card"><div class="ch"><h3>Ranking do programa</h3><div class="r"><span class="mini">pontos validados</span></div></div><div class="cb">'+
        (function(){
          const arr = souCorretor()
            ? corretoresDe(lojaDe(S.usuarios[euId()].loja).id).map(u=>({n:u.nome, p:pontosExcUser(u.id), eu:u.id===euId()}))
            : BASE.lojas.map(l=>({n:l.nome, p:pontosExcLoja(l.id), eu:l.id===alvoLoja}));
          return arr.sort((a,b)=>b.p-a.p).slice(0,10).map((x,i)=>{
            const f=faixaDe(x.p);
            return '<div style="display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid var(--line);'+(x.eu?'background:var(--brand-soft);border-radius:8px;padding-left:8px':'')+'">'+
            '<span style="font-family:var(--font-d);font-weight:800;color:'+(i<3?'var(--red)':'var(--muted)')+';width:20px">'+(i+1)+'</span>'+
            '<div style="flex:1;min-width:0"><div style="font-size:12.9px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(x.n)+'</div>'+
            (f?'<div class="mini">faixa '+esc(f.nome)+'</div>':'<div class="mini">sem faixa ainda</div>')+'</div>'+
            '<b class="num" style="font-family:var(--font-d)">'+x.p+'</b></div>';
          }).join('');
        })()+
      '</div></div>'+
    '</div>'+
    '<div class="card"><div class="ch"><h3>Comprovações guardadas</h3>'+
      '<div class="r"><span class="mini">arquivo, autor, data e hora — registro imutável</span></div></div><div class="cb">'+
      (provas.length? '<div class="provas" id="gal"></div>' : '<div class="empty">Nenhuma comprovação enviada ainda. Escolha um critério acima e envie a foto da entrega.</div>')+
    '</div></div>';

  if(provas.length){
    $('#gal').innerHTML=provas.map(p=>{
      const c=critDe(p.criterio);
      return '<div class="prova">'+(p.arq&&p.arq.thumb?'<img src="'+p.arq.thumb+'" data-lupa alt="">':'<div style="aspect-ratio:4/3;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);font-size:12px">'+esc((p.arq&&p.arq.nome)||'sem imagem')+'</div>')+
        '<div class="pv"><b>'+esc(c.nome)+'</b>'+
        '<span>'+esc(p.autor)+' · '+quando(p.q)+'</span>'+
        '<div style="margin-top:7px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">'+
          (p.st==='pendente'?'<span class="tag warn">Aguardando</span>':p.st==='aprovado'?'<span class="tag ok">+'+p.pts+' pts</span>':'<span class="tag bad">Recusada</span>')+
          (p.arq&&p.arq.thumb?'<button class="btn sm" data-dl="'+p.id+'">↓</button>':'')+
          (eGestor&&p.st==='pendente'?'<button class="btn sm" data-no="'+p.id+'">✕</button><button class="btn sm pri" data-ok="'+p.id+'">✓</button>':'')+
        '</div>'+
        (p.obs?'<span style="display:block;margin-top:6px">'+esc(p.obs)+'</span>':'')+
        (p.motivo?'<span style="display:block;margin-top:6px;color:var(--bad)">'+esc(p.motivo)+'</span>':'')+
        '</div></div>';
    }).join('');
    $$('[data-dl]',v).forEach(b=>b.addEventListener('click',()=>{
      const p=S.excelencia.provas.find(x=>x.id===b.dataset.dl);
      fetch(p.arq.thumb).then(r=>r.blob()).then(bl=>baixarBlob(bl,'comprovacao-'+p.id+'.jpg'));
      toast('Comprovação baixada.',1);
    }));
    $$('[data-ok]',v).forEach(b=>b.addEventListener('click',()=>{
      const p=S.excelencia.provas.find(x=>x.id===b.dataset.ok);
      commit('Validou comprovação', critDe(p.criterio).nome+' — '+(lojaDe(p.loja)||{}).nome, s=>{
        const x=s.excelencia.provas.find(y=>y.id===p.id); x.st='aprovado'; x.validador=eu().nome; x.validado=agora(); });
      route(); toast('<b>Comprovação validada.</b> +'+p.pts+' pontos creditados.',1);
    }));
    $$('[data-no]',v).forEach(b=>b.addEventListener('click',()=>{
      const p=S.excelencia.provas.find(x=>x.id===b.dataset.no);
      const ov=modal('Recusar comprovação','<div class="field"><label>Motivo</label><textarea id="mx" rows="3" placeholder="Ex.: foto não mostra a fachada inteira."></textarea></div>',
        '<button class="btn" onclick="fechaModal()">Cancelar</button><button class="btn red" id="okNo">Recusar</button>');
      $('#okNo',ov).addEventListener('click',()=>{
        const m=$('#mx',ov).value.trim();
        commit('Recusou comprovação', critDe(p.criterio).nome, s=>{
          const x=s.excelencia.provas.find(y=>y.id===p.id); x.st='recusado'; x.motivo=m||'Sem justificativa.'; x.validador=eu().nome; });
        fechaModal(); route(); toast('Comprovação recusada — o autor foi avisado.');
      });
    }));
  }

  const abrirEnvio=(critId)=>{
    let arq=null;
    const ov=modal('Enviar comprovação',

          obs:$('#xObs',ov).value.trim(), arq});
      });
      fechaModal(); route(); renderNav();
      toast('<b>Comprovação enviada.</b> Fica guardada e aguarda a validação da RE/MAX.',1);
    });
  };
  $('#envProva')&&$('#envProva').addEventListener('click',()=>abrirEnvio(critLista()[0].id));

  $('#editFaixas')&&$('#editFaixas').addEventListener('click',()=>{
    const ov=modal('Configurar faixas de bonificação',
      '<div class="field"><label>Ciclo</label><input id="fCic" value="'+esc(S.excelencia.ciclo)+'"></div>'+
      '<div class="field"><label>Encerramento</label><input type="date" id="fEnc" value="'+S.excelencia.encerra+'"></div>'+
      S.excelencia.faixas.map(f=>'<div class="grid g2" style="gap:12px"><div class="field"><label>'+esc(f.nome)+' · pontos mínimos</label>'+
        '<input type="number" data-min="'+f.id+'" value="'+f.min+'"></div>'+
        '<div class="field"><label>Bonificação</label><input data-pre="'+f.id+'" value="'+esc(f.premio)+'"></div></div>').join('')+

      '<button class="btn" onclick="fechaModal()">Cancelar</button><button class="btn pri" id="fOk">Salvar</button>');
    $('#fOk',ov).addEventListener('click',()=>{
      commit('Ajustou as faixas do Programa de Excelência','', s=>{
        s.excelencia.ciclo=$('#fCic',ov).value.trim()||s.excelencia.ciclo;
        s.excelencia.encerra=$('#fEnc',ov).value||s.excelencia.encerra;
        s.excelencia.faixas.forEach(f=>{
          const m=$('[data-min="'+f.id+'"]',ov), p=$('[data-pre="'+f.id+'"]',ov);
          if(m) f.min=parseInt(m.value,10)||f.min;
          if(p) f.premio=p.value.trim()||f.premio;
        });
      });
      fechaModal(); route(); toast('Faixas atualizadas.',1);
    });
  });
  $('#expExc')&&$('#expExc').addEventListener('click',()=>{
    const linhas=[['id','criterio','pontos','unidade','autor','enviado_em','situacao','validador','observacao','arquivo']];
    S.excelencia.provas.forEach(p=>linhas.push([p.id,critDe(p.criterio).nome,p.pts,(lojaDe(p.loja)||{}).nome||'',p.autor,p.q,p.st,p.validador||'',(p.obs||'').replace(/;/g,','),(p.arq&&p.arq.nome)||'']));
    baixarBlob(new Blob(['﻿'+linhas.map(r=>r.join(';')).join('\n')],{type:'text/csv;charset=utf-8'}),'programa-excelencia.csv');
    toast('Comprovações exportadas.',1);
  });
};

function ytId(u){ const m=String(u||'').match(/(?:youtu\.be\/|v=|shorts\/|embed\/|live\/)([\w-]{11})/); return m?m[1]:(/^[\w-]{11}$/.test(u)?u:''); }

    '<span class="play"></span><span class="yt-alt">'+esc(T('Assistir no YouTube'))+'</span></button>';

function srcVideo(v){

  const ov=modal(esc(v.tit), '<iframe class="player'+(v.ig?' ig':'')+'" src="'+srcVideo(v)+'" title="'+esc(v.tit)+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>', '');

function lerImagemReduzida(arq, max, q, pronto){
  if(!arq || !/^image\//.test(arq.type||'')){ toast(T('Escolha uma imagem em JPG ou PNG.')); return; }
  const fr=new FileReader();
  fr.onload=()=>{ const im=new Image(); im.onload=()=>{
    const k=Math.min(1, max/Math.max(im.width, im.height)), c=document.createElement('canvas');
    c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    pronto(c.toDataURL('image/jpeg',q), arq.name); }; im.onerror=()=>toast(T('Não consegui ler essa imagem.')); im.src=fr.result; };
  fr.readAsDataURL(arq);
}
function escolherImagem(max, q, pronto){
  const inp=$('#filePicker'); inp.value=''; inp.accept='image/*'; inp.multiple=false;
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(f) lerImagemReduzida(f,max,q,pronto); };
  inp.click();
}

    const ov=modal(T('Adicionar vídeo'),
      '<div class="field"><label>'+esc(T('Link do vídeo'))+'</label><input id="tvU" placeholder="https://www.youtube.com/watch?v=…  ou  https://www.instagram.com/reel/…"></div>'+
      '<div class="field"><label>'+esc(T('Título'))+'</label><input id="tvT"></div>'+
      '<div class="grid g2" style="gap:12px"><div class="field"><label>'+esc(T('Categoria'))+'</label><select id="tvC">'+['Institucional','Liderança','Treinamentos','Eventos'].map(c=>'<option>'+c+'</option>').join('')+'</select></div>'+
      '<div class="field"><label>'+esc(T('Canal ou autor'))+'</label><input id="tvA" placeholder="Ex.: RE/MAX Brasil"></div></div>'+
      '<label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" id="tvD" style="width:auto"> '+esc(T('Destacar na tela inicial'))+'</label>'+
      '<div class="hint" style="margin-top:12px">'+esc(T('Vídeos do YouTube e do Instagram entram pelo link: tocam dentro da plataforma, sem baixar nem ocupar espaço. O perfil precisa ser público.'))+'</div>',
      '<button class="btn" onclick="fechaModal()">'+esc(T('Cancelar'))+'</button><button class="btn pri" id="tvOk">'+esc(T('Adicionar'))+'</button>');
    $('#tvOk',ov).addEventListener('click',()=>{
      const u=$('#tvU',ov).value.trim(), yt=ytId(u), ig=yt?'':igCodigo(u);
      if(!yt&&!ig) return toast(T('Cole um link do YouTube ou do Instagram.'));
      const tit=$('#tvT',ov).value.trim()||T('Vídeo da rede'), id=uid('v'), dest=$('#tvD',ov).checked;
      commit('Adicionou vídeo à RE/MAX TV', tit, s=>{ if(dest) s.tv.forEach(x=>x.dest=0);
        s.tv.unshift({id, yt, ig, tit, canal:$('#tvA',ov).value.trim(), cat:$('#tvC',ov).value, dest:dest?1:0}); });
      fechaModal(); route(); toast(T('Vídeo publicado na RE/MAX TV.'),1);
    });
  });
  $('#tvAudio')&&$('#tvAudio').addEventListener('click',()=>{
    let arq=null;
    const ov=modal(T('Adicionar áudio'),
      '<div class="field"><label>'+esc(T('Nome'))+'</label><input id="auN" placeholder="Ex.: Trilha institucional 2026"></div>'+
      '<div class="field"><label>'+esc(T('Tipo'))+'</label><select id="auT"><option>Trilha</option><option>Vinheta</option><option>Spot de rádio</option></select></div>'+
      '<button class="btn" id="auF" style="width:100%;justify-content:center">'+esc(T('Escolher arquivo (MP3, até 2 MB)'))+'</button><div class="mini" id="auI" style="margin-top:6px"></div>',
      '<button class="btn" onclick="fechaModal()">'+esc(T('Cancelar'))+'</button><button class="btn pri" id="auOk">'+esc(T('Publicar'))+'</button>');
    $('#auF',ov).addEventListener('click',()=>{ const inp=$('#filePicker'); inp.value=''; inp.accept='audio/*'; inp.multiple=false;
      inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f) return;
        if(f.size>2*1048576){ arq={nome:f.name, tam:f.size}; $('#auI',ov).textContent=f.name+' · '+kb(f.size)+' — '+T('grande demais para a demonstração: fica só o registro.'); return; }
        const fr=new FileReader(); fr.onload=()=>{ arq={nome:f.name, tam:f.size, src:fr.result}; $('#auI',ov).textContent=f.name+' · '+kb(f.size); }; fr.readAsDataURL(f); };
      inp.click(); });
    $('#auOk',ov).addEventListener('click',()=>{
      const nome=$('#auN',ov).value.trim()||(arq&&arq.nome)||T('Áudio da marca');
      commit('Publicou áudio da marca', nome, s=>{ s.audios.unshift({id:uid('au'), nome, tipo:$('#auT',ov).value, src:arq&&arq.src||'', obs:arq?arq.nome+' · '+kb(arq.tam):''}); });
      fechaModal(); route(); toast(T('Áudio publicado.'),1);
    });
  });
};
</script>

<script>
/* =======================================================================
   v3 — Help Desk, Pessoas da rede, Meu perfil, aviso de comunicado ao entrar
   ======================================================================= */
function marcarAcesso(){
  if(souCorretor()){ if(S.usuarios[euId()]) S.usuarios[euId()].ultimo=agora(); }
  else S.perfis[ROLE]=Object.assign(S.perfis[ROLE]||{}, {ultimo:agora()});
  saveState();
}
function popupComunicado(){
  try{ if(sessionStorage.getItem('pr_popup_'+ROLE)) return; sessionStorage.setItem('pr_popup_'+ROLE,'1'); }catch(e){}
  const k=S.comunicados.find(x=>x.popup && (S.leituras[x.id]||[]).indexOf(euId())<0); if(!k) return;
  const ov=modal(esc(k.tit),
    (k.midia&&k.midia.img?'<img src="'+k.midia.img+'" alt="" style="width:100%;border-radius:12px;margin-bottom:14px">':'')+
    '<div class="mini" style="margin-bottom:10px">'+esc(k.area)+' · '+esc(k.autor||'')+(k.obr?' · '+esc(T('leitura obrigatória')):'')+'</div>'+
    '<div style="font-size:14px;line-height:1.65;color:var(--ink-2)">'+k.corpo+'</div>',
    '<button class="btn" onclick="fechaModal()">'+esc(T('Ler depois'))+'</button><a class="btn" href="#/comunicados/'+k.id+'" onclick="fechaModal()">'+esc(T('Abrir comunicado'))+'</a><button class="btn pri" id="ppOk">'+esc(T('Confirmar leitura'))+'</button>');
  $('#ppOk',ov).addEventListener('click',()=>{
    commit('Confirmou leitura', k.tit+' · aviso ao entrar', s=>{ s.leituras[k.id]=(s.leituras[k.id]||[]).concat([euId()]); });
    fechaModal(); renderNav(); route(); toast(T('Leitura confirmada, com data e hora.'),1);
  });
}

/* ---------- Help Desk ---------- */
const TUTORIAIS=[
  {id:'tu1', mod:'Primeiros passos', tit:'Primeiro acesso, senha e perfil', dur:'3 min'},
  {id:'tu2', mod:'Brand Center', tit:'Guia da marca e downloads', dur:'4 min'},
  {id:'tu3', mod:'Estúdio de Arte', tit:'Criar uma peça com a foto do imóvel', dur:'5 min'},
  {id:'tu4', mod:'Social Hub', tit:'Conectar o Instagram e agendar a campanha', dur:'5 min'},
  {id:'tu5', mod:'Compliance', tit:'Enviar evidência e acompanhar a jornada', dur:'4 min'},
  {id:'tu6', mod:'Comunicados', tit:'Ler, confirmar e cobrar leitura', dur:'3 min'},
  {id:'tu7', mod:'Programa de Excelência', tit:'Comprovar uma entrega e subir de faixa', dur:'4 min'},
  {id:'tu8', mod:'Gestão da unidade', tit:'Cadastrar a equipe pela planilha', dur:'4 min'}
];
VIEWS.helpdesk=function(v){
  const zap=(S.param&&S.param.whatsSuporte)||'';
  // link do WhatsApp: número sem o DDI ganha o 55; a conversa já abre com a mensagem inicial e o nome de quem pede
  const zapNum=(function(){ let n=zap.replace(/\D/g,''); if(n.length===10||n.length===11) n='55'+n; return n; })();
  const zapUrl='https://wa.me/'+zapNum+'?text='+encodeURIComponent('Olá! Sou '+eu().nome+' ('+eu().papel+'). Preciso de ajuda com a plataforma '+((S.param&&S.param.plataforma)||'Prontos em Rede')+': ');
  v.innerHTML=
    ph('Help Desk', T('Tutoriais em vídeo por módulo, respostas na hora e chamados com prazo — tudo o que é preciso para usar a plataforma sem treinamento presencial.'),
      '<a class="btn pri" href="#/suporte">'+esc(T('Abrir chamado'))+'</a>','helpdesk')+
    '<div class="card pad"><h3>'+esc(T('Como podemos ajudar?'))+'</h3>'+
      '<div class="hd-in"><input id="hdQ" placeholder="'+esc(T('Ex.: como troco a foto do meu perfil?'))+'"><button class="btn pri" id="hdGo">'+esc(T('Perguntar'))+'</button></div><div id="hdR"></div></div>'+
    '<div class="grid g3" style="margin:16px 0">'+
      '<a class="hd-at" href="#/suporte"><b>'+esc(T('Chamados'))+'</b><span>'+esc(T('Abra e acompanhe: responsável, prazo e histórico. N1 atende, N2 assume o que é complexo.'))+'</span></a>'+
      (zap?'<a class="hd-at" id="hdZap" href="'+zapUrl+'" target="_blank" rel="noopener"><b>WhatsApp do suporte</b><span>'+esc(zap)+' · '+esc(T('a conversa vira chamado'))+'</span></a>'
          :'<div class="hd-at"><b>WhatsApp do suporte</b><span>'+esc(T('O número oficial é definido na implantação. A mensagem vira chamado, com SLA.'))+'</span></div>')+
      '<div class="hd-at"><b>'+esc(T('Prazos de resposta'))+'</b><span>'+esc(T('Marca fora do padrão 2h · fachada e prazos 4h · erro 8h · dúvida 24h · arte fora do padrão 3 dias úteis'))+'</span></div>'+
    '</div>'+
    '<div class="card"><div class="ch"><h3>'+esc(T('Tutoriais em vídeo'))+'</h3><div class="r"><span class="mini">'+esc(T('tela e voz, por módulo'))+'</span></div></div><div class="cb"><div class="tvgrid" id="hdTut"></div></div></div>'+
    '<div class="grid g2" style="margin-top:16px">'+
      '<div class="card plano"><span class="tag ok">'+esc(T('Incluído'))+'</span><h3 style="margin-top:10px">'+esc(T('Suporte padrão'))+'</h3><ul>'+
        ['Assistente da marca a qualquer hora','Chamados N1 e N2 com SLA por tipo','Horário comercial, em português','Acompanhamento de 3 meses na implantação de cada unidade','Tutoriais em vídeo de todos os módulos'].map(x=>'<li>'+esc(T(x))+'</li>').join('')+'</ul></div>'+
      '<div class="card plano"><span class="tag" style="background:var(--azul);color:#fff">Prime</span><h3 style="margin-top:10px">'+esc(T('Licença corporativa Prime'))+'</h3><ul>'+
        ['Para a Matriz e a diretoria','Atendimento estendido, inclusive fusos horários diferentes','Telefone direto com a equipe BMAG','Gerente de conta e prioridade no N3','Relatório mensal de uso e de SLA'].map(x=>'<li>'+esc(T(x))+'</li>').join('')+'</ul></div>'+
    '</div>'+
    '<div class="card" style="margin-top:16px"><div class="ch"><h3>'+esc(T('Dúvidas frequentes'))+'</h3></div><div class="cb">'+
      FAQ.map(f=>'<details style="border-bottom:1px solid var(--line);padding:10px 0"><summary style="cursor:pointer;font-size:13.6px;font-weight:600">'+esc(f.q)+'</summary>'+
        '<div style="font-size:13.2px;color:var(--ink-2);margin-top:7px;line-height:1.6">'+esc(f.a)+'<div class="mini" style="margin-top:5px">'+esc(f.fonte)+'</div></div></details>').join('')+'</div></div>';
  const pinta=()=>{
    $('#hdTut').innerHTML=TUTORIAIS.map(t=>{ const link=(S.tutoriais||{})[t.id], yt=ytId(link||''), ig=yt?'':igCodigo(link||'');
      return '<div class="tvcard"'+(yt||ig?' data-tut="'+t.id+'"':'')+'>'+(yt||ig?capaHTML({yt,ig}):'<span class="capa"></span>')+
      '<div class="tx"><b>'+esc(T(t.tit))+'</b><span>'+esc(T(t.mod))+' · '+esc(t.dur)+'</span><div class="acoes">'+
      (yt||ig?'<span class="tag ok">'+esc(T('Disponível'))+'</span>':'<span class="tag warn">'+esc(T('Em gravação'))+'</span>')+
      (souMatriz()?'<button class="btn sm" data-vinc="'+t.id+'">'+esc(T(yt||ig?'Trocar vídeo':'Vincular vídeo'))+'</button>':'')+'</div></div></div>'; }).join('');
    $$('[data-tut]',v).forEach(c=>c.addEventListener('click',e=>{ if(e.target.closest('[data-vinc]')) return;
      const t=TUTORIAIS.find(x=>x.id===c.dataset.tut), link=S.tutoriais[t.id]; abrirVideo({yt:ytId(link), ig:ytId(link)?'':igCodigo(link), tit:t.tit}); }));
    $$('[data-vinc]',v).forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation();
      const t=TUTORIAIS.find(x=>x.id===b.dataset.vinc);
      const ov=modal(T('Vincular vídeo')+' · '+esc(T(t.tit)),'<div class="field"><label>'+esc(T('Link do YouTube ou do Instagram'))+'</label><input id="vkU" value="'+esc(S.tutoriais[t.id]||'')+'"></div>',
        '<button class="btn" onclick="fechaModal()">'+esc(T('Cancelar'))+'</button><button class="btn pri" id="vkOk">'+esc(T('Salvar'))+'</button>');
      $('#vkOk',ov).addEventListener('click',()=>{ const u=$('#vkU',ov).value.trim(); if(u && !ytId(u) && !igCodigo(u)) return toast(T('Cole um link do YouTube ou do Instagram.'));
        commit('Vinculou vídeo de tutorial', t.tit, s=>{ s.tutoriais[t.id]=u; }); fechaModal(); pinta(); });
    }));
  };
  pinta();
  const pergunta=()=>{ const q=$('#hdQ').value.trim(); if(!q) return; const r=respostaIA(q);
    $('#hdR').innerHTML='<div class="hd-resp">'+esc(r.tx)+(r.fonte?'<div class="mini" style="margin-top:6px">'+esc(T('Fonte'))+': '+esc(r.fonte)+'</div>':
      '<div style="margin-top:10px"><a class="btn sm pri" href="#/suporte">'+esc(T('Abrir chamado com uma pessoa'))+'</a></div>')+'</div>'; };
  $('#hdGo').addEventListener('click',pergunta);
  $('#hdQ').addEventListener('keydown',e=>{ if(e.key==='Enter') pergunta(); });
};

/* ---------- Pessoas da rede (consulta, sem bate-papo) ---------- */
let PS={q:'', loja:'todas'};
VIEWS.pessoas=function(v){
  v.innerHTML=
    ph('Pessoas da rede', T('Encontre associados e gestores: foto, unidade, CRECI e Instagram. O contato segue pelos canais oficiais — a plataforma não tem bate-papo entre associados.'),'','pessoas')+
    '<div class="filtros"><div class="f" style="flex:2"><label>'+esc(T('Buscar'))+'</label><input id="psQ" value="'+esc(PS.q)+'" placeholder="'+esc(T('Nome, CRECI ou bairro'))+'"></div>'+
    '<div class="f"><label>'+esc(T('Unidade'))+'</label><select id="psL"><option value="todas">'+esc(T('Todas as unidades'))+'</option>'+
      BASE.lojas.map(l=>'<option value="'+l.id+'"'+(PS.loja===l.id?' selected':'')+'>'+esc(l.nome)+'</option>').join('')+'</select></div></div>'+
    '<div class="mini" id="psN" style="margin:0 0 12px"></div><div class="pgrid" id="psG"></div>';
  const pinta=()=>{
    const q=PS.q.toLowerCase();
    const arr=Object.values(S.usuarios).filter(u=>u.nivel==='associado' && (PS.loja==='todas'||u.loja===PS.loja) &&
      (!q || (u.nome+' '+u.creci+' '+((lojaDe(u.loja)||{}).bairro||'')).toLowerCase().includes(q)));
    $('#psN').textContent=arr.length+' '+T('pessoas');
    $('#psG').innerHTML=arr.slice(0,60).map(u=>'<div class="pcard" data-p="'+u.id+'">'+avatar(u,64)+'<b>'+esc(u.nome)+'</b>'+
      '<span>'+esc((lojaDe(u.loja)||{}).nome||'')+(u.creci?' · CRECI '+esc(u.creci):'')+'</span>'+
      (u.insta?'<span style="color:var(--azul)">@'+esc(u.insta)+'</span>':'')+'</div>').join('')||'<div class="empty">'+esc(T('Ninguém encontrado.'))+'</div>';
    $$('#psG .pcard').forEach(c=>c.addEventListener('click',()=>location.hash='#/perfil/'+c.dataset.p));
  };
  pinta();
  $('#psQ').addEventListener('input',e=>{ PS.q=e.target.value; pinta(); });
  $('#psL').addEventListener('change',e=>{ PS.loja=e.target.value; pinta(); });
};

/* ---------- perfil: o próprio (editável) ou o de outra pessoa (consulta) ---------- */
VIEWS.perfil=function(v,arg){
  if(arg && arg!==euId() && S.usuarios[arg]) return perfilDe(v, S.usuarios[arg]);
  const conta=CONTAS.find(c=>c.papel===ROLE)||{};
  const r = souCorretor()? Object.assign({}, S.usuarios[euId()]) : Object.assign({nome:eu().nome, email:conta.email}, S.perfis[ROLE]||{});
  let foto=r.foto||eu().foto||'';
  const temCreci = ROLE==='corretor'||ROLE==='franquia';
  v.innerHTML=
    ph(T('Meu perfil'), T('Seus dados aparecem nas peças do Estúdio, no diretório da rede e nos relatórios. Mantenha foto, CRECI e Instagram em dia.'),'','perfil')+
    '<div class="grid g23"><div class="card pad">'+
      '<div class="perfil-top"><span id="pfAv">'+avatar({nome:r.nome, foto},88)+'</span><div><button class="btn" id="pfFoto">'+esc(T(foto?'Trocar foto':'Enviar foto'))+'</button>'+
        '<div class="mini" style="margin-top:6px">'+esc(eu().papel)+(r.ultimo?' · '+esc(T('último acesso'))+' '+quando(r.ultimo):'')+'</div></div></div>'+
      '<div class="divider"></div>'+
      '<div class="grid g2" style="gap:12px"><div class="field"><label>'+esc(T('Nome completo'))+'</label><input id="pfN" value="'+esc(r.nome||'')+'"></div>'+
      '<div class="field"><label>'+esc(T('E-mail de acesso'))+'</label><input id="pfE" type="email" value="'+esc(r.email||'')+'"></div></div>'+
      '<div class="grid g2" style="gap:12px"><div class="field"><label>'+esc(T('Celular (WhatsApp)'))+'</label><input id="pfT" value="'+esc(r.tel||'')+'" placeholder="(11) 99999-0000"></div>'+
      '<div class="field"><label>Instagram</label><input id="pfI" value="'+esc(r.insta||'')+'" placeholder="@seuperfil"></div></div>'+
      (temCreci?'<div class="field"><label>CRECI</label><input id="pfC" value="'+esc(r.creci||'')+'"></div>':'')+
      '<div class="field"><label>'+esc(T('Sobre você'))+'</label><textarea id="pfB" rows="2" placeholder="'+esc(T('Especialidade, região de atuação…'))+'">'+esc(r.bio||'')+'</textarea></div>'+
      '<button class="btn pri" id="pfOk">'+esc(T('Salvar perfil'))+'</button></div>'+
    '<div class="card pad"><h3>'+esc(T('Senha'))+'</h3><div class="mini" style="margin:6px 0 12px">'+esc(T('Mínimo de 8 caracteres, com letras e números.'))+(r.senhaEm?' '+esc(T('Última troca'))+': '+quando(r.senhaEm):'')+'</div>'+
      '<div class="field"><label>'+esc(T('Nova senha'))+'</label><input id="pfS1" type="password" autocomplete="new-password"></div>'+
      '<div class="field"><label>'+esc(T('Repita a nova senha'))+'</label><input id="pfS2" type="password" autocomplete="new-password"></div>'+
      '<button class="btn" id="pfSOk">'+esc(T('Trocar senha'))+'</button></div></div>';
  $('#pfFoto').addEventListener('click',()=>escolherImagem(420,.8,url=>{ foto=url; $('#pfAv').innerHTML=avatar({nome:r.nome,foto},88); toast(T('Foto pronta. Clique em Salvar perfil.'),1); }));
  $('#pfOk').addEventListener('click',()=>{
    const d={nome:$('#pfN').value.trim()||r.nome, email:$('#pfE').value.trim(), tel:$('#pfT').value.trim(), insta:$('#pfI').value.trim().replace(/^@/,''),
             bio:$('#pfB').value.trim(), foto};
    if(temCreci && $('#pfC')) d.creci=$('#pfC').value.trim();
    if(d.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)) return toast(T('E-mail inválido.'));
    commit('Atualizou o próprio perfil', d.nome, s=>{ if(souCorretor()) Object.assign(s.usuarios[euId()], d); else s.perfis[ROLE]=Object.assign(s.perfis[ROLE]||{}, d); });
    P=personas(); renderWho(); toast(T('Perfil salvo.'),1); route();
  });
  $('#pfSOk').addEventListener('click',()=>{
    const a=$('#pfS1').value, b=$('#pfS2').value;
    if(a.length<8 || !/\d/.test(a) || !/[a-z]/i.test(a)) return toast(T('A senha precisa de 8 caracteres, com letras e números.'));
    if(a!==b) return toast(T('As duas senhas não conferem.'));
    commit('Trocou a própria senha', eu().nome, s=>{ if(souCorretor()) s.usuarios[euId()].senhaEm=agora(); else s.perfis[ROLE]=Object.assign(s.perfis[ROLE]||{}, {senhaEm:agora()}); });
    $('#pfS1').value=''; $('#pfS2').value=''; toast(T('Senha trocada.'),1);
  });
};
function perfilDe(v,u){
  const l=lojaDe(u.loja)||{};
  v.innerHTML=
    '<a class="btn sm" href="#/pessoas" style="margin-bottom:14px">← '+esc(T('Pessoas da rede'))+'</a>'+
    '<div class="card pad"><div class="perfil-top">'+avatar(u,96)+'<div><h1 style="font-size:30px;letter-spacing:-.03em">'+esc(u.nome)+'</h1>'+

/* ---------- planilhas (CSV com ; , ou tabulação) ---------- */
function lerCSV(txt){
  txt=String(txt||'').replace(/^﻿/,'');
  const prim=txt.split(/\r?\n/)[0]||'', sep=[';','\t',','].sort((a,b)=>prim.split(b).length-prim.split(a).length)[0];
  const out=[]; let lin=[], cel='', aspas=false;
  for(let i=0;i<txt.length;i++){ const ch=txt[i];
    if(aspas){ if(ch==='"'){ if(txt[i+1]==='"'){ cel+='"'; i++; } else aspas=false; } else cel+=ch; }
    else if(ch==='"') aspas=true;
    else if(ch===sep){ lin.push(cel); cel=''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&txt[i+1]==='\n') i++; lin.push(cel); cel=''; if(lin.some(x=>x.trim())) out.push(lin); lin=[]; }
    else cel+=ch; }
  lin.push(cel); if(lin.some(x=>x.trim())) out.push(lin);
  return out;
}
const normCab = h => String(h||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();

/* ---------- nomenclatura por cliente (definida pelo Construtor, sem mexer no código) ---------- */
function termosAtivos(){
  const pr=(S&&S.param)||{}, t=pr.termos||{}, pares=[];
  Object.keys(t).forEach(de=>{ const para=t[de]; if(para && para!==de){ pares.push([de,para]); pares.push([de.toLowerCase(), para.toLowerCase()]); } });
  if(pr.plataforma && pr.plataforma!=='Prontos em Rede') pares.push(['Prontos em Rede', pr.plataforma]);
  if(GENERICA) pares.push(['Matriz RE/MAX Brasil','Matriz'],['RE/MAX Brasil','Matriz'],['RE/MAX TV','TV da Rede'],['Master São Paulo','Regional Sul'],
                          ['RE/MAX','Rede Exemplo'],['REMAX','Rede Exemplo'],['Remax','Rede Exemplo'],['#RemaxBrasil','#RedeExemplo']);
  return pares.sort((a,b)=>b[0].length-a[0].length);
}
function trocaTermos(txt, pares){ let v=txt; pares.forEach(p=>{ if(v.indexOf(p[0])>=0) v=v.split(p[0]).join(p[1]); }); return v; }
function aplicarTermos(root){
  const pares=termosAtivos(); if(!pares.length || !root) return;
  const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode(n){ const p=n.parentNode;
    return p && !/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.nodeName) && n.nodeValue.trim()? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; }});
  const alvos=[]; let n; while((n=w.nextNode())) alvos.push(n);
  alvos.forEach(t=>{ const nv=trocaTermos(t.nodeValue,pares); if(nv!==t.nodeValue) t.nodeValue=nv; });
  $$('[placeholder]',root).forEach(el=>{ const nv=trocaTermos(el.getAttribute('placeholder'),pares); if(nv!==el.getAttribute('placeholder')) el.setAttribute('placeholder',nv); });
}

function T(s){ if(LANG==='pt'||!s) return s; const d=DIC[LANG]; return (d && d[s]) || s; }
function aplicarIdioma(root){
  const d=DIC[LANG];
  ['placeholder','title','aria-label'].forEach(at=>{
    $$('['+at+']',root||document).forEach(el=>{
      const chave='pt'+at.replace('-','');
      if(!el.dataset[chave]) el.dataset[chave]=el.getAttribute(at)||'';
      const orig=el.dataset[chave];
      el.setAttribute(at, (d&&d[orig])||orig);
    });
  });
  if(LANG==='pt'||!d) return;
  const w=document.createTreeWalker(root||document.body, NodeFilter.SHOW_TEXT, {
    acceptNode(n){ const p=n.parentNode; if(!p) return NodeFilter.FILTER_REJECT;
      const tag=p.nodeName; if(tag==='SCRIPT'||tag==='STYLE'||tag==='CANVAS') return NodeFilter.FILTER_REJECT;
      return n.nodeValue && n.nodeValue.trim().length>1 ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; }
  });
  const alvos=[]; let n; while((n=w.nextNode())) alvos.push(n);
  alvos.forEach(t=>{ const v=t.nodeValue.trim(); if(d[v]) t.nodeValue=t.nodeValue.replace(v,d[v]); });
}
function trocaIdioma(l){

function animaNumeros(root){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  $$('.kpi .v, .hero .st .v', root||document).forEach(el=>{
    const txt=el.textContent.trim();
    const m=txt.match(/^([0-9][0-9.,]*)(.*)$/);
    if(!m) return;
    const bruto=m[1], resto=m[2]||'';
    const dec=(bruto.indexOf(',')>=0);
    const alvo=parseFloat(bruto.replace(/\./g,'').replace(',','.'));
    if(!isFinite(alvo)||alvo<=0||alvo>1e9) return;
    const fmt=v=> dec? v.toFixed(1).replace('.',',') : Math.round(v).toLocaleString('pt-BR');
    const dur=760; let t0=null;
    const passo=ts=>{ if(!t0)t0=ts; const p=Math.min((ts-t0)/dur,1);
      el.textContent=fmt(alvo*(1-Math.pow(1-p,3)))+resto;
      if(p<1) requestAnimationFrame(passo); };
    el.textContent=fmt(0)+resto;
    requestAnimationFrame(passo);
  });
}

/* =======================================================================
   ABERTURA EM VÍDEO — a vinheta "Prontos em Rede" (splash.mp4, ao lado do index.html).
   Sem o arquivo (artefato, HTML solto) ou com o vídeo bloqueado, entra a abertura animada abaixo.
   ======================================================================= */
function aberturaVideo(depois, forcar){
  // demonstração genérica: a vinheta tem a marca RE/MAX, então entra só a abertura animada (com o logo neutro)
  if(GENERICA){ if(forcar || !LS.get('pr_abertura_anim')){ LS.set('pr_abertura_anim','1'); abertura(depois); } else depois(); return; }
  // toca mesmo com "reduzir movimento" ligado no aparelho: é a vinheta da marca, pedida em toda visita (tem Pular)
  if(document.getElementById('splash')) return;
  const el=document.createElement('div'); el.id='splash';
  el.innerHTML='<video muted playsinline preload="auto" poster="'+SPLASH_POSTER+'"><source src="splash.mp4" type="video/mp4"><source src="splash.webm" type="video/webm"></video>'+
    '<button class="pular">'+(LANG==='en'?'Skip':LANG==='es'?'Saltar':'Pular')+'</button>';
  document.body.appendChild(el);
  document.body.style.overflow='hidden';
  const v=el.querySelector('video');
  v.muted=true;                                   // o navegador só deixa tocar sozinho se estiver mudo
  let acabou=false, tocou=false, guarda=null, teto=null;
  function fim(){
    if(acabou) return; acabou=true; clearTimeout(guarda); clearTimeout(teto);
    el.classList.add('sai');
    depois();                                     // o login já nasce por baixo e as duas telas se cruzam
    setTimeout(()=>{ el.remove(); if(!document.getElementById('login')) document.body.style.overflow=''; },900);
  }
  function reserva(){                             // sem vídeo: a abertura animada, uma vez por navegador
    if(acabou || tocou) return; acabou=true; clearTimeout(guarda);
    el.remove();
    if(!forcar && LS.get('pr_abertura_anim')){ document.body.style.overflow=''; depois(); return; }
    LS.set('pr_abertura_anim','1'); abertura(depois);
  }
  function pedeToque(){                           // o aparelho bloqueou o vídeo automático (ex.: iPhone em economia de bateria)
    if(acabou || el.querySelector('.assistir')) return; clearTimeout(guarda);
    const b=document.createElement('button'); b.className='assistir';
    b.textContent='\u25B6  '+(LANG==='en'?'Watch':LANG==='es'?'Ver':'Assistir');
    b.addEventListener('click',e=>{ e.stopPropagation(); b.remove(); const p2=v.play(); if(p2 && p2.catch) p2.catch(reserva); });
    el.appendChild(b);
  }
  v.addEventListener('playing',()=>{ if(tocou) return; tocou=true; clearTimeout(guarda);
    teto=setTimeout(fim, ((isFinite(v.duration)&&v.duration)||9)*1000+2500); });
  v.addEventListener('ended',fim);
  v.addEventListener('error',reserva);
  const fontes=el.querySelectorAll('source');
  fontes[fontes.length-1].addEventListener('error',reserva);   // MP4 e WebM falharam
  function quandoVisivel(fn){                     // aba em segundo plano: o navegador pausa vídeo sem som
    clearTimeout(guarda);
    document.addEventListener('visibilitychange',function vz(){ if(!document.hidden){ document.removeEventListener('visibilitychange',vz); fn(); } });
  }
  function tocar(){
    if(acabou) return;
    guarda=setTimeout(reserva, 8000);             // não começou em 8 s: rede muito lenta
    const p=v.play();
    if(p && p.catch) p.catch(e=>{
      if(e && e.name==='AbortError' && document.hidden) quandoVisivel(tocar);
      else if(e && e.name==='NotAllowedError') pedeToque();
      else reserva();
    });
  }
  if(document.hidden) quandoVisivel(tocar); else tocar();
  el.addEventListener('click',fim);
  document.addEventListener('keydown',function k(){ document.removeEventListener('keydown',k); fim(); });
}

function abertura(depois){
  const reduz = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduz){ depois(); return; }
  const el=document.createElement('div'); el.id='abertura';
  const t1 = LANG==='en'?'Ready as a Network.':LANG==='es'?'Listos en Red.':'Prontos em Rede.';
  const t2 = LANG==='en'?'20 offices. 200 users. One network.'
           : LANG==='es'?'20 oficinas. 200 usuarios. Una sola red.'
           : '20 unidades. 200 usuários. Uma só rede.';
  el.innerHTML='<div class="ceu"></div>'+
    '<div class="palco">'+
      '<div class="lockup"><span class="bl"><span class="aura"></span><img src="'+BALAO+'" alt=""></span>'+
      '<span class="nome"><img src="'+WORD_BRANCO+'" alt="RE/MAX"></span></div>'+
      '<h1 class="t1">'+esc(t1)+'</h1>'+
      '<p class="t2">'+esc(t2)+'</p>'+
    '</div>'+
    '<button class="pular">'+(LANG==='en'?'Skip':LANG==='es'?'Saltar':'Pular')+'</button>';
  document.body.appendChild(el);
  document.body.style.overflow='hidden';
  const ets=[
    setTimeout(()=>el.classList.add('f1'),150),
    setTimeout(()=>el.classList.add('f2'),2350),
    setTimeout(()=>el.classList.add('f3'),3450),
    setTimeout(()=>el.classList.add('f4'),4150),
    setTimeout(()=>fim(),6400)
  ];
  let acabou=false;
  function fim(){
    if(acabou) return; acabou=true;
    ets.forEach(clearTimeout);
    el.classList.add('sai');
    depois();                                   // o que vem depois já nasce por baixo: a troca é um cruzamento, sem corte
    setTimeout(()=>{ el.remove(); if(!document.getElementById('login')) document.body.style.overflow=''; },900);
  }
  el.addEventListener('click',fim);
  document.addEventListener('keydown',function k(){ document.removeEventListener('keydown',k); fim(); });
}

    '<div class="kv"><span class="k">Estúdio</span><span class="v">Preencha seus dados, escolha a cor e baixe a peça em <b>PNG</b> ou <b>PDF</b> — os arquivos saem de verdade.</span></div>'+
    '<div class="kv"><span class="k">Excelência</span><span class="v">Envie a foto de uma entrega no <b>Programa de Excelência</b>: ela fica guardada e, ao ser validada, vira ponto e faixa de bonificação.</span></div>'+
    '<div class="kv"><span class="k">Menu</span><span class="v">Passe o mouse por um módulo na barra lateral para abrir as telas dele.</span></div>',
    '<button class="btn pri" onclick="fechaModal()">Começar</button>');
}
function voltaDoPortal(){
  const q=new URLSearchParams(location.search); if(!q.has('instagram')) return;
  const erro=q.get('error')||q.get('errorMessage'), uid_=q.get('u');
  history.replaceState(null,'',location.pathname+(uid_?'#/redes':(location.hash||'#/param')));
  if(erro){ setTimeout(()=>toast('<b>'+T('A conexão do Instagram não terminou.')+'</b><br>'+esc(erro)), 800); return; }
  const u=uid_ && S.usuarios[uid_];
  if(!u || !u.teamSocial){ setTimeout(()=>toast('<b>'+T('Instagram conectado.')+'</b> '+T('Em Parametrização, clique em “Testar conexão” para ver a conta.'),1), 800); return; }
  // confere no servidor qual conta ficou no espaço do associado
  setTimeout(async()=>{
    const r=await chamarApi('social.php','status&teamId='+encodeURIComponent(u.teamSocial));
    const conta=r.ok && r.contas && r.contas.find(c=>c.tipo==='INSTAGRAM');
    if(conta){ commit('Conectou conta social', u.nome+' · '+conta.nome, s=>{ s.usuarios[uid_].ig=true; s.usuarios[uid_].igConta=conta.nome; }, 'Integração de publicação');
      toast('<b>'+esc(conta.nome)+' conectado</b> para '+esc(primeiro(u.nome))+'. As publicações dele saem nessa conta.',1); route(); }
    else toast('<b>A autorização não chegou.</b> '+esc((r&&r.erro)||'Tente de novo em Redes sociais.'));
  }, 900);
}
/* o WhatsApp do suporte vem do servidor (prontos-config.php), para valer em todos os navegadores */
function puxarConfigServidor(){
  if(!/^https?:/.test(location.protocol) || EM_QUADRO || GENERICA) return;
  fetch('api/notificar.php?acao=ping',{cache:'no-store'}).then(r=>r.json()).then(j=>{
    if(j && j.whatsSuporte && S.param && S.param.whatsSuporte!==j.whatsSuporte){ S.param.whatsSuporte=j.whatsSuporte; saveState(); if(telaAtual()==='helpdesk') route(); }
  }).catch(()=>{});
}
let APP_PRONTO=false;
function sincAplicar(){ P=personas(); renderWho(); renderNav(); if(!$$('.ov').length){ route(); } toast('<b>Atualizado</b> com o que a rede fez em outro aparelho.',1); }
function iniciarApp(){
  voltaDoPortal();
  puxarConfigServidor();
  APP_PRONTO=true;
  P = personas();
  marcarAcesso();
  renderWho(); renderNav();
  if(!location.hash) location.hash='#/inicio';
  route();
  const primeiraVez=!LS.get('pr_visto_v4');
  boasVindas();
  if(!primeiraVez) popupComunicado();          // comunicado marcado como aviso aparece ao entrar
}
function entrarNaPlataforma(){
  if(LS.get('pr_sessao') && CONTAS.some(c=>c.papel===LS.get('pr_sessao'))){
    ROLE = LS.get('pr_sessao');
    iniciarApp();
  } else {
    telaLogin();
  }
}
loadState();
garantirCampos();
// estado compartilhado: puxa o do servidor antes de a tela montar; depois, confere a cada 8 s
sincPuxar(true).then(mudou=>{ if(mudou && APP_PRONTO) sincAplicar(); });
setInterval(()=>{ if(!APP_PRONTO || document.hidden) return; sincPuxar(false).then(mudou=>{ if(mudou) sincAplicar(); }); }, 8000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && APP_PRONTO) sincPuxar(false).then(mudou=>{ if(mudou) sincAplicar(); }); });
aplicarTema();
document.documentElement.lang = LANG==='pt'?'pt-BR':LANG;
aberturaVideo(entrarNaPlataforma);   // a vinheta abre o site em toda visita; a animada de reserva aparece uma vez por navegador
window.addEventListener('pageshow', e=>{ if(e.persisted) aberturaVideo(()=>{}); });   // voltou pelo botão Voltar: o navegador restaura a página sem recarregar
</script>
