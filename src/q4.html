<script>
/* =======================================================================
   OS SEIS MÓDULOS
   ======================================================================= */
const MODULOS = [
  {n:1, id:'brand',  nome:'Brand Center', ic:'◆', desc:'Identidade da RE/MAX: guia, logos, fontes, cores, templates e regras.', telas:[
    {id:'guia',        t:'Guia da marca',            ic:'◆', mvp:1},
    {id:'biblioteca',  t:'Biblioteca de materiais',  ic:'▤', mvp:1}]},
  {n:2, id:'content', nome:'Content & Social Hub', ic:'◉', desc:'Personalização de peças, calendário, Prontos em Rede, redes sociais e distribuição.', telas:[
    {id:'estudio',     t:'Estúdio de peças',         ic:'✎', mvp:1},
    {id:'prontos',     t:'Prontos em Rede',          ic:'◉', mvp:1},
    {id:'redes',       t:'Redes sociais',            ic:'⇄', mvp:1}]},
  {n:3, id:'gov',     nome:'Compliance & Governance', ic:'✓', desc:'Checklists, prazos, evidências, aprovações, adequação das lojas e regras de negócio.', telas:[
    {id:'jornada',     t:'Jornada de adequação',     ic:'✓', mvp:1},
    {id:'fachadas',    t:'Fachadas',                 ic:'⌂', mvp:1},
    {id:'aprovacoes',  t:'Aprovações',               ic:'⇧', mvp:1, papeis:['brasil','master','franquia'], badge:()=>pendentesAprov().length},
    {id:'usuarios',    t:'Usuários e permissões',    ic:'☷', mvp:1, papeis:['brasil','master','franquia']},
    {id:'registros',   t:'Registros e plataforma',   ic:'⛁', mvp:1, papeis:['brasil','master']}]},
  {n:4, id:'comm',    nome:'Communication Center', ic:'✉', desc:'Comunicados, notificações, confirmação de leitura, busca e repositório institucional.', telas:[
    {id:'comunicados', t:'Comunicados',              ic:'✉', mvp:1, badge:()=>naoLidos().length}]},
  {n:5, id:'sup',     nome:'Support & Success', ic:'☎', desc:'WhatsApp, tickets, IA, SLA, atendimento humano, onboarding e acompanhamento das unidades.', telas:[
    {id:'suporte',     t:'Central de atendimento',   ic:'☎', mvp:1, badge:()=>ROLE==='corretor'?0:S.tickets.filter(t=>!/Resolvido/.test(t.st)).length},
    {id:'implantacao', t:'Implantação e CS',         ic:'⚑', mvp:1, papeis:['brasil','master']}]},
  {n:6, id:'intel',   nome:'Intelligence & Gamification', ic:'▦', desc:'Indicadores da rede, desempenho de marketing, ranking, pontuação e Programa de Excelência.', telas:[
    {id:'painel',      t:'Painel da rede',           ic:'▦', mvp:1, papeis:['brasil','master']},
    {id:'marketing',   t:'Desempenho de marketing',  ic:'◔', mvp:1},
    {id:'excelencia',  t:'Programa de Excelência',   ic:'✦', mvp:1, badge:()=>S.excelencia.provas.filter(p=>p.st==='pendente'&&ROLE!=='corretor').length},
    {id:'ranking',     t:'Ranking e Grand Champion', ic:'★', mvp:2}]}
];
const TELAS={};
MODULOS.forEach(m=>m.telas.forEach(t=>{ TELAS[t.id]=Object.assign({mod:m},t); }));
const podeVer = t => !t || !t.papeis || t.papeis.indexOf(ROLE)>=0;
const telasDe = m => m.telas.filter(podeVer);

/* =======================================================================
   ACESSO — contas de teste, uma por nível
   ======================================================================= */
const CONTAS=[
  {papel:'brasil',   email:'brasil@prontosemrede.test',   senha:'Rede@2026', nome:'Marketing RE/MAX Brasil', desc:'Visão nacional · publica comunicados e campanhas · aprova'},
  {papel:'master',   email:'master@prontosemrede.test',   senha:'Rede@2026', nome:'Master SP Capital II',    desc:'Acompanha a regional · aprova projetos e evidências'},
  {papel:'franquia', email:'loja@prontosemrede.test',     senha:'Rede@2026', nome:'Gestor da unidade',       desc:'Executa o checklist · envia evidências · gerencia a equipe'},
  {papel:'corretor', email:'corretor@prontosemrede.test', senha:'Rede@2026', nome:'Associado',               desc:'Personaliza peças · publica · acompanha os próprios indicadores'}
];
function telaLogin(){
  document.body.style.overflow='hidden';
  const el=document.createElement('div'); el.className='login'; el.id='login';
  el.innerHTML=
    '<div class="fundo"><canvas></canvas></div>'+
    '<div class="lgtop"><button id="lgIdi">'+IDIOMAS[LANG].sig+'</button><button id="lgTema">'+(temaEfetivo()==='escuro'?'\u263e':'\u2600')+'</button></div>'+
    '<div class="box"><div class="lado">'+
      '<div class="lockup-lg"><span class="bl"><img src="'+BALAO+'" alt=""></span><img class="wm" src="'+WORD_BRANCO+'" alt="RE/MAX"></div>'+
      '<h2>Prontos<b>em Rede.</b></h2>'+
      '<p>'+esc(T('A plataforma de marca, conteúdo, governança e suporte da rede RE/MAX — em um só lugar, com o acesso de cada nível.'))+'</p>'+
      '<div class="mods">'+MODULOS.map(m=>'<span>'+esc(m.nome)+'</span>').join('')+'</div>'+
    '</div>'+
    '<div class="form"><h1>'+esc(T('Entrar na plataforma'))+'</h1>'+
      '<div class="sb">'+esc(T('Selecione um acesso de teste — cada um abre a plataforma com o seu próprio escopo de dados e permissões.'))+'</div>'+
      '<div class="contas" id="contas">'+CONTAS.map(c=>
        '<button class="conta" data-p="'+c.papel+'"><span class="av">'+iniciais(c.nome)+'</span>'+
        '<span style="min-width:0"><span class="t">'+esc(T(c.nome))+'</span><span class="s">'+esc(c.email)+' · '+esc(T(c.desc))+'</span></span></button>').join('')+'</div>'+
      '<div class="grid g2" style="gap:14px;margin-top:20px">'+
        '<div class="field" style="margin:0"><label>'+esc(T('E-mail'))+'</label><input id="lgEmail" type="email" autocomplete="username"></div>'+
        '<div class="field" style="margin:0"><label>'+esc(T('Senha'))+'</label><input id="lgSenha" type="password" autocomplete="current-password"></div>'+
      '</div>'+
      '<div id="lgErro"></div>'+
      '<button class="entrar" id="lgOk">'+esc(T('Entrar'))+'<span style="width:17px;height:17px;display:grid">'+ICO.seta+'</span></button>'+
      '<div class="rod">'+(LANG==='en'?'Password for every test account':LANG==='es'?'Contraseña de todas las cuentas de prueba':'Senha de todas as contas de teste')+': <b>'+esc(CONTAS[0].senha)+'</b><br>'+
      (LANG==='en'?'Platform developed by':LANG==='es'?'Plataforma desarrollada por':'Plataforma desenvolvida por')+' <b>BMAG SERVIÇOS DIGITAIS</b></div>'+
    '</div></div>';
  document.body.appendChild(el);
  const m={parar(){}};
  const preencher=c=>{ $('#lgEmail').value=c.email; $('#lgSenha').value=c.senha;
    $$('#contas .conta').forEach(b=>b.classList.toggle('on', b.dataset.p===c.papel)); };
  $$('#contas .conta',el).forEach(b=>b.addEventListener('click',()=>preencher(CONTAS.find(c=>c.papel===b.dataset.p))));
  const entrar=()=>{
    const e=($('#lgEmail').value||'').trim().toLowerCase(), sn=($('#lgSenha').value||'').trim();
    const c=CONTAS.find(x=>x.email===e && x.senha===sn);
    if(!c){ $('#lgErro').innerHTML='<div class="erro">'+esc(T('E-mail ou senha inválidos. Clique em um dos acessos acima para preencher.'))+'</div>'; return; }
    LS.set('pr_sessao', c.papel); LS.set('pr_role', c.papel); ROLE=c.papel;
    el.style.transition='opacity .5s var(--ease)'; el.style.opacity='0';
    setTimeout(()=>{ m.parar(); el.remove(); document.body.style.overflow=''; iniciarApp(); },480);
  };
  $('#lgOk',el).addEventListener('click',entrar);
  el.addEventListener('keydown',ev=>{ if(ev.key==='Enter') entrar(); });
  $('#lgIdi',el).addEventListener('click',()=>{ const k=Object.keys(IDIOMAS); trocaIdioma(k[(k.indexOf(LANG)+1)%k.length]); });
  $('#lgTema',el).addEventListener('click',()=>{ trocaTema(temaEfetivo()==='escuro'?'claro':'escuro'); $('#lgTema').textContent=temaEfetivo()==='escuro'?'\u263e':'\u2600'; });
  preencher(CONTAS[0]);
  if(!SEM_HOVER && window.innerWidth>920) setTimeout(()=>{ const i=$('#lgEmail'); i&&i.focus({preventScroll:true}); },140);
}
function sair(){
  LS.del('pr_sessao'); fechaModal(); esconderFly(); const pp=$('#pop'); if(pp) pp.remove();
  $('#view').innerHTML=''; telaLogin();
}

/* =======================================================================
   MENU LATERAL — submenu ao passar o mouse
   ======================================================================= */
let flyTimer=null;
const SEM_HOVER = !!(window.matchMedia && window.matchMedia('(hover: none)').matches);
let flyRow=null;
function esconderFly(){
  if(flyRow){ flyRow.classList.remove('aberto'); flyRow=null; }
  const v=$('#veu'); if(v){ v.classList.remove('on'); setTimeout(()=>{ if(v.parentNode && !v.classList.contains('on')) v.remove(); },340); }
  const f=$('#fly');
  if(f){ f.style.opacity='0'; f.style.transform=f.classList.contains('painel')?'translateX(-12px)':'translateY(-4px) scale(.98)';
    setTimeout(()=>{ if(f.parentNode) f.remove(); },200); }
}
function mostrarFly(row, m){
  const ja=$('#fly'); if(ja) ja.remove();
  if(flyRow) flyRow.classList.remove('aberto');
  const ts=telasDe(m); if(!ts.length) return;
  const atual=telaAtual();
  const painel = window.innerWidth>1000;          // no computador, o módulo abre um painel inteiro; no resto, um menu
  const f=document.createElement('div'); f.className='fly'+(painel?' painel':''); f.id='fly';
  f.innerHTML='<div class="ft">'+esc(T('Módulo'))+' '+m.n+' · '+esc(m.nome)+'</div>'+
    ts.map(t=>{ const b=t.badge?t.badge():0;
      return '<a href="#/'+t.id+'" class="'+(t.id===atual?'on':'')+'">'+esc(T(t.t))+
      (b?'<span class="pill">'+b+'</span>':(t.mvp===2?'<span class="o2">'+esc(T('2ª onda'))+'</span>':''))+'</a>'; }).join('')+
    '<div class="fd">'+esc(T(m.desc))+'</div>';
  document.body.appendChild(f);
  f.style.transition='opacity .2s var(--e2), transform .2s var(--e2)';
  flyRow=row; row.classList.add('aberto');
  if(painel){
    let v=$('#veu'); if(!v){ v=document.createElement('div'); v.id='veu'; document.body.appendChild(v); }
    requestAnimationFrame(()=>v.classList.add('on'));
  } else {
    const r=row.getBoundingClientRect();
    if(window.innerWidth<640){
      f.style.left='4vw'; f.style.width='92vw'; f.style.minWidth='0';
      f.style.top=Math.max(12, Math.min(window.innerHeight-f.offsetHeight-12, r.bottom+8))+'px';
    } else {
      f.style.left=(r.right+10)+'px';
      f.style.top=Math.max(12, Math.min(window.innerHeight-f.offsetHeight-12, r.top-8))+'px';
    }
  }
  f.addEventListener('mouseenter',()=>clearTimeout(flyTimer));
  f.addEventListener('mouseleave',()=>{ flyTimer=setTimeout(esconderFly,150); });
  $$('a',f).forEach(a=>a.addEventListener('click',()=>esconderFly()));
}
const telaAtual = ()=> (location.hash||'#/inicio').slice(2).split('/')[0];

function moveIndicador(){
  const ind=$('#indicador'), ativo=$('#nav .modrow.on'), nav=$('#nav');
  if(!ind||!nav) return;
  if(!ativo){ ind.style.opacity='0'; return; }
  const a=ativo.getBoundingClientRect(), n=nav.getBoundingClientRect();
  ind.style.opacity='1';
  ind.style.transform='translateY('+(a.top-n.top+nav.scrollTop+(a.height-22)/2)+'px)';
}
function renderNav(){
  const atual=telaAtual();
  let h='<div class="modrow '+(atual==='inicio'?'on':'')+'" data-go="inicio"><span class="num">—</span>'+
    '<span class="n">'+esc(T('Início'))+'</span><span class="rule"></span></div>'+
    '<div class="navsep"></div>';
  MODULOS.forEach(m=>{
    const ts=telasDe(m); if(!ts.length) return;
    const b=ts.reduce((a,t)=>a+(t.badge?t.badge():0),0);
    const on=ts.some(t=>t.id===atual);
    h+='<div class="modrow '+(on?'on':'')+'" data-mod="'+m.id+'"><span class="num">'+('0'+m.n)+'</span>'+
       '<span class="n">'+esc(m.nome)+'</span>'+(b?'<span class="pill">'+b+'</span>':'')+'<span class="rule"></span></div>';
  });
  h+='<div class="navsep"></div>'+
     '<div class="modrow '+(atual==='escopo'?'on':'')+'" data-go="escopo"><span class="num">—</span>'+
     '<span class="n">'+esc(T('Mapa do escopo'))+'</span><span class="rule"></span></div>';
  $('#nav').innerHTML=h;
  $$('#nav .modrow').forEach(row=>{
    const m=MODULOS.find(x=>x.id===row.dataset.mod);
    if(m){
      if(!SEM_HOVER){
        row.addEventListener('mouseenter',()=>{ clearTimeout(flyTimer); mostrarFly(row,m); });
        row.addEventListener('mouseleave',()=>{ flyTimer=setTimeout(esconderFly,150); });
      }
      row.addEventListener('click',()=>{
        const ts=telasDe(m); if(!ts.length) return;
        if(SEM_HOVER && !$('#fly')){ mostrarFly(row,m); return; }   // no toque, primeiro abre o submenu
        esconderFly(); location.hash='#/'+ts[0].id;
      });
    } else {
      row.addEventListener('mouseenter',esconderFly);
      row.addEventListener('click',()=>{ location.hash='#/'+row.dataset.go; });
    }
  });
  requestAnimationFrame(moveIndicador);
  const dot=alertas().length;
  $('#btnAlert').innerHTML=ICO.alerta+(dot?'<span class="dot"></span>':'');
  $('#btnCfg').innerHTML=ICO.config;
  $('#btnTema').innerHTML= temaEfetivo()==='escuro'? ICO.lua : ICO.tema;
  $('#btnIdioma').innerHTML=ICO.idioma;
  $('#burger').innerHTML=ICO.menu;
  $('#siBusca').innerHTML=ICO.busca;
}
window.addEventListener('scroll',esconderFly,{passive:true});
document.addEventListener('click',e=>{ if($('#fly') && !e.target.closest('#fly') && !e.target.closest('.modrow')) esconderFly(); });

/* ---------- menus flutuantes do topo ---------- */
function popMenu(botao, titulo, itens){
  const ja=$('#pop'); const mesmo = ja && ja.dataset.dono===botao.id;
  if(ja) ja.remove();
  if(mesmo) return;
  const p=document.createElement('div'); p.className='pop'; p.id='pop'; p.dataset.dono=botao.id;
  p.innerHTML='<div class="pt">'+esc(titulo)+'</div>'+itens.map(i=>
    '<button data-v="'+i.v+'" class="'+(i.on?'on':'')+'">'+(i.ic?'<span class="fl">'+i.ic+'</span>':'')+'<span>'+esc(i.n)+'</span><span class="ck">'+ICO.ok+'</span></button>').join('');
  document.body.appendChild(p);
  const r=botao.getBoundingClientRect();
  p.style.top=(r.bottom+10)+'px';
  p.style.left=Math.max(12, Math.min(window.innerWidth-p.offsetWidth-12, r.right-p.offsetWidth))+'px';
  $$('button',p).forEach(b=>b.addEventListener('click',()=>{ const v=b.dataset.v; p.remove(); itens.find(i=>i.v===v).fn(); }));
  setTimeout(()=>document.addEventListener('click',function f(e){ if(!e.target.closest('#pop')){ const q=$('#pop'); if(q) q.remove(); document.removeEventListener('click',f);} }),10);
}
$('#btnTema').addEventListener('click',()=>popMenu($('#btnTema'), T('Tema'), [
  {v:'claro', n:T('Claro'), ic:'○', on:TEMA==='claro', fn:()=>trocaTema('claro')},
  {v:'escuro', n:T('Escuro'), ic:'●', on:TEMA==='escuro', fn:()=>trocaTema('escuro')},
  {v:'auto', n:T('Automático'), ic:'◐', on:TEMA==='auto', fn:()=>trocaTema('auto')}
]));
$('#btnIdioma').addEventListener('click',()=>popMenu($('#btnIdioma'), T('Idioma'),
  Object.keys(IDIOMAS).map(k=>({v:k, n:IDIOMAS[k].nome, ic:IDIOMAS[k].sig, on:LANG===k, fn:()=>trocaIdioma(k)}))));

function renderWho(){
  const p=eu();
  $('#whoNm').textContent = p.nome.length>26? primeiro(p.nome)+' '+(p.nome.split(' ')[1]||'') : T(p.nome);
  $('#whoRl').textContent = T(p.papel);
  $('#whoAv').innerHTML = p.foto? '<img src="'+p.foto+'" alt="">' : iniciais(p.nome);
}
$('#whoBtn').addEventListener('click',()=>{
  const linhas=CONTAS.map(c=>{
    const p=P[c.papel];
    const n = c.papel==='brasil'? BASE.lojas.length+' · '+TOTAL_USUARIOS()
            : c.papel==='master'? String(BASE.lojas.filter(l=>l.master==='m2').length)
            : c.papel==='franquia'? String(corretoresDe('l18').length) : '';
    return '<div class="li" data-r="'+c.papel+'" style="display:flex;gap:13px;padding:13px 15px;border:1px solid var(--line);border-radius:13px;cursor:pointer;align-items:center;margin-bottom:9px;'+(c.papel===ROLE?'border-color:var(--brand-line);background:var(--brand-soft)':'')+'">'+
      '<span class="avph">'+iniciais(p.nome)+'</span><div><div style="font-weight:600;font-size:13.5px;font-family:var(--font-d)">'+esc(T(p.nome))+'</div>'+
      '<div class="mini">'+esc(T(p.papel))+' '+esc(n)+'</div></div>'+(c.papel===ROLE?'<span class="tag" style="margin-left:auto">'+esc(T('Ativo'))+'</span>':'')+'</div>';
  }).join('');
  const ov=modal(T('Trocar de acesso'),linhas,
    '<button class="btn" id="btSair">'+esc(T('Sair da conta'))+'</button><button class="btn pri" onclick="fechaModal()">'+esc(T('Fechar'))+'</button>');
  $$('.li',ov).forEach(el=>el.addEventListener('click',()=>{
    ROLE=el.dataset.r; LS.set('pr_role',ROLE); LS.set('pr_sessao',ROLE);
    fechaModal(); renderWho(); renderNav();
    if(!podeVer(TELAS[telaAtual()])) location.hash='#/inicio'; else route();
  }));
  $('#btSair',ov).addEventListener('click',sair);
});
$('#burger').addEventListener('click',()=>document.body.classList.toggle('menu'));
$('#btnAlert').addEventListener('click',()=>viewAlertas());
$('#btnCfg').addEventListener('click',()=>viewConfig());

/* ---------- alertas automáticos ---------- */
function alertas(){
  const out=[];
  lojasVisiveis().forEach(l=>{
    ETAPAS.forEach(e=>{
      const s=statusEtapa(l.id,e.id), d=dias(dt(e.prazo));
      if(s==='atrasada') out.push({t:'Atividade vencida', d:l.nome+' — '+e.nome, q:'há '+Math.abs(d)+' dias', c:'bad', go:'#/jornada/'+l.id});
      else if(s==='andamento' && d<=45) out.push({t:'Faltam '+d+' dias', d:l.nome+' — '+e.nome, q:dataBR(dt(e.prazo)), c:'warn', go:'#/jornada/'+l.id});
    });
  });
  pendentesAprov().forEach(a=>out.push({t:'Aguardando aprovação', d:a.item, q:quando(a.dt), c:'', go:'#/aprovacoes'}));
  if(ROLE!=='corretor') S.excelencia.provas.filter(p=>p.st==='pendente').forEach(p=>
    out.push({t:'Comprovação para validar', d:p.criterioNome+' — '+(lojaDe(p.loja)||{}).nome, q:quando(p.q), c:'', go:'#/excelencia'}));
  if(naoLidos().filter(k=>k.obr).length) out.push({t:'Leitura obrigatória pendente', d:naoLidos().filter(k=>k.obr).length+' comunicados aguardam a sua confirmação', q:'', c:'warn', go:'#/comunicados'});
  return out;
}
function viewAlertas(){
  const al=alertas();
  const ov=modal('Alertas automáticos',
    '<p class="mini" style="margin:0 0 12px">Disparo configurável por etapa: 60, 30 e 7 dias antes do prazo, no vencimento e a cada 7 dias de atraso. Os mesmos alertas saem por e-mail e WhatsApp.</p>'+
    '<div class="lst" style="border:1px solid var(--line);border-radius:12px;max-height:46vh;overflow:auto">'+
    (al.slice(0,16).map(a=>'<div class="li" data-go="'+a.go+'"><span class="ico" style="background:'+(a.c==='bad'?'var(--red-soft);color:var(--red)':a.c==='warn'?'var(--warn-soft);color:var(--warn)':'var(--brand-soft);color:var(--brand-2)')+'">●</span>'+
      '<div class="bd"><div class="t">'+esc(a.t)+'</div><div class="s">'+esc(a.d)+'</div></div><div class="rt">'+esc(a.q)+'</div></div>').join('')||'<div class="empty">Nenhum alerta em aberto no seu escopo.</div>')+'</div>',
    '<button class="btn" onclick="fechaModal()">Fechar</button>');
  $$('.li[data-go]',ov).forEach(el=>el.addEventListener('click',()=>{ fechaModal(); location.hash=el.dataset.go; }));
}
function viewConfig(){
  const tam=(JSON.stringify(S).length/1024).toFixed(0);
  const ov=modal('Dados da plataforma',
    '<div class="kv"><span class="k">Como funciona</span><span class="v">Tudo o que você faz fica gravado neste navegador. Aprovar uma evidência, agendar uma campanha, validar uma comprovação ou confirmar leitura muda os indicadores na hora.</span></div>'+
    '<div class="kv"><span class="k">Base real</span><span class="v">'+BASE.lojas.length+' unidades e '+BASE.corretores.length+' associados da capital de São Paulo, de dados públicos da RE/MAX. Com os gestores, '+TOTAL_USUARIOS()+' usuários.</span></div>'+
    '<div class="kv"><span class="k">Carga inicial</span><span class="v">Adesão, chamados, campanhas e leituras começam preenchidos para a tela não nascer vazia. A partir daí, quem move os números é você.</span></div>'+
    '<div class="kv"><span class="k">Ocupação</span><span class="v">'+tam+' KB gravados · '+S.audit.length+' registros de auditoria · '+S.excelencia.provas.length+' comprovações guardadas</span></div>',
    '<button class="btn" id="verAb">'+esc(T('Ver a abertura'))+'</button><button class="btn" id="expJ">↓ Exportar dados (JSON)</button><button class="btn red" id="rst">Recarregar demonstração</button><button class="btn pri" onclick="fechaModal()">Fechar</button>');
  $('#verAb',ov).addEventListener('click',()=>{ fechaModal(); abertura(()=>{}); });
  $('#expJ',ov).addEventListener('click',()=>{
    baixarBlob(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),'prontos-em-rede-dados.json'); toast('Arquivo exportado.',1);
  });
  $('#rst',ov).addEventListener('click',()=>{
    if(!confirm('Isto apaga tudo o que foi feito e recarrega a demonstração. Continuar?')) return;
    resetState(); fechaModal(); route(); renderNav(); toast('Demonstração recarregada.',1);
  });
}
const EM_QUADRO=(function(){ try{ return window.self!==window.top; }catch(e){ return true; } })();
function baixarBlob(blob,nome){
  if(EM_QUADRO){ toast('<b>Download bloqueado nesta visualização.</b><br>Abra o arquivo no computador para gerar ' + esc(nome) + '.'); return; }
  const a=document.createElement('a'), url=URL.createObjectURL(blob);
  a.href=url; a.download=nome; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},1200);
}

/* ---------- busca inteligente ---------- */
const qEl=$('#q'), srBox=$('#srBox');
qEl.addEventListener('input',buscar);
qEl.addEventListener('focus',()=>{ if(qEl.value.trim()) buscar(); });
document.addEventListener('click',e=>{ if(!e.target.closest('.search')) srBox.innerHTML=''; });
function respostaIA(t){
  const low=t.toLowerCase();
  const f=FAQ.find(x=> low.split(/\s+/).some(w=>w.length>3 && (x.q.toLowerCase().includes(w)||x.a.toLowerCase().includes(w))));
  if(f) return {tx:f.a, fonte:f.fonte};
  if(/cart[aã]o/.test(low)) return {tx:'O cartão de visita da nova identidade está na Biblioteca, em Papelaria. Para personalizar com o seu nome e CRECI, use o Estúdio de peças — o arquivo sai em 90×50 mm, pronto para a gráfica.', fonte:'Brand Center · Biblioteca'};
  if(/fachad/.test(low)) return {tx:'A adequação de fachada tem duas etapas: projeto aprovado até 30/01/2027 e instalação até 15/03/2027. O passo a passo, o envio do projeto e a foto final estão em Compliance · Fachadas.', fonte:'Compliance & Governance'};
  if(/logo|marca/.test(low)) return {tx:'As versões homologadas do logotipo, a área de proteção e o tamanho mínimo estão no Guia da marca. Alterar cor, proporção ou aplicar sombra é vedado.', fonte:'Brand Center · Guia da marca'};
  if(/bonific|excel|pr[êe]mio/.test(low)) return {tx:'O Programa de Excelência dá pontos por entrega comprovada. Você envia a foto da prova, a RE/MAX valida e os pontos entram na sua faixa de bonificação.', fonte:'Intelligence · Programa de Excelência'};
  return {tx:'Veja abaixo os materiais, comunicados e regras relacionados. Se nada resolver, o assistente do suporte abre um chamado com uma pessoa da operação.', fonte:null};
}
function buscar(){
  const t=qEl.value.trim(); if(t.length<2){srBox.innerHTML='';return;}
  const low=t.toLowerCase();
  const mat=TPLS().filter(x=>(x.nome+' '+x.cat+' '+x.dim).toLowerCase().includes(low)).slice(0,4);
  const com=S.comunicados.filter(x=>(x.tit+' '+x.res+' '+x.area).toLowerCase().includes(low)).slice(0,3);
  const faq=FAQ.filter(x=>(x.q+' '+x.a).toLowerCase().includes(low)).slice(0,3);
  const uni=BASE.lojas.filter(l=>(l.nome+' '+l.bairro).toLowerCase().includes(low)).slice(0,3);
  const ia=respostaIA(t);
  let h='<div class="sr"><div class="ia"><div class="lb">Resposta do assistente</div><div class="tx">'+esc(ia.tx)+(ia.fonte?' <span style="opacity:.75">— '+esc(ia.fonte)+'</span>':'')+'</div></div>';
  if(mat.length) h+='<div class="sec">Materiais</div>'+mat.map(m=>'<div class="it" data-go="estudio/'+m.id+'"><span class="tag mut">'+esc(m.cat)+'</span><div><div class="t">'+esc(m.nome)+'</div><div class="s">'+esc(m.dim)+'</div></div></div>').join('');
  if(com.length) h+='<div class="sec">Comunicados</div>'+com.map(c=>'<div class="it" data-go="comunicados/'+c.id+'"><span class="tag mut">'+esc(c.area)+'</span><div><div class="t">'+esc(c.tit)+'</div><div class="s">'+esc(c.res.slice(0,86))+'…</div></div></div>').join('');
  if(faq.length) h+='<div class="sec">Regras e dúvidas frequentes</div>'+faq.map(f=>'<div class="it" data-go="guia"><span class="tag mut">Marca</span><div><div class="t">'+esc(f.q)+'</div><div class="s">'+esc(f.fonte)+'</div></div></div>').join('');
  if(uni.length && ROLE!=='corretor') h+='<div class="sec">Unidades</div>'+uni.map(l=>'<div class="it" data-go="jornada/'+l.id+'"><span class="tag mut">'+adesao(l.id)+'%</span><div><div class="t">'+esc(l.nome)+'</div><div class="s">'+esc(l.bairro)+' · '+esc(masterDe(l.master).nome)+'</div></div></div>').join('');
  if(!mat.length&&!com.length&&!faq.length&&!uni.length) h+='<div class="empty">Nada encontrado. A busca sem resposta fica registrada e vira sugestão de conteúdo para a RE/MAX Brasil.</div>';
  srBox.innerHTML=h+'</div>';
  $$('.sr .it').forEach(el=>el.addEventListener('click',()=>{ location.hash='#/'+el.dataset.go; srBox.innerHTML=''; qEl.value=''; }));
}

/* ---------- rotas ---------- */
const VIEWS={};
function route(){
  const [id,arg]=(location.hash||'#/inicio').slice(2).split('/');
  if(TELAS[id] && !podeVer(TELAS[id])){ location.hash='#/inicio'; return; }
  esconderFly();
  const fn=VIEWS[id]||VIEWS.inicio;
  const v=$('#view'); v.innerHTML=''; v.className='content fade';
  fn(v,arg);
  renderNav();
  if(typeof aplicarIdioma==='function') aplicarIdioma(v);
  if(typeof animaNumeros==='function') animaNumeros(v);
  setTimeout(()=>{ v.classList.remove('fade'); v.classList.add('visivel'); },1500);
  document.body.classList.remove('menu');
}
window.addEventListener('hashchange',route);

/* ---------- blocos ---------- */
function ph(titulo, sub, acts, telaId){
  const t=TELAS[telaId||telaAtual()];
  const eye=t? '<div class="eyebrow-mod"><span class="m">'+esc(T('Módulo'))+' '+t.mod.n+' · '+esc(t.mod.nome)+'</span>'+
        (t.mvp===2?'<span class="tag warn">'+esc(T('2ª onda'))+'</span>':'<span class="tag ok">MVP</span>')+'</div>':'';
  return '<div class="ph"><div>'+eye+'<h1>'+titulo+'</h1>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div>'+
         (acts?'<div class="acts">'+acts+'</div>':'')+'</div>';
}
function kpi(l,v,d,cls){ return '<div class="kpi '+(cls||'')+'"><div class="l">'+l+'</div><div class="v">'+v+'</div>'+(d?'<div class="d">'+d+'</div>':'')+'</div>'; }
function barra(p,cls){ return '<div class="bar '+(cls||(p>=80?'ok':p>=50?'':'warn'))+'"><i style="width:'+Math.max(2,Math.min(100,p))+'%"></i></div>'; }
function stTag(st){
  const m={concluida:['ok','Concluída'], aprovacao:['','Em aprovação'], andamento:['','Em andamento'],
           pendente:['mut','Pendente'], atrasada:['bad','Atrasada'], aprovado:['ok','Aprovado'], reprovado:['bad','Reprovado']};
  const x=m[st]||['mut',st]; return '<span class="tag '+x[0]+'">'+x[1]+'</span>';
}
function avatar(u,tam){
  const s=tam||32;
  return u && u.foto ? '<img class="avat" src="'+u.foto+'" style="width:'+s+'px;height:'+s+'px" alt="">'
                     : '<span class="avph" style="width:'+s+'px;height:'+s+'px;font-size:'+(s/2.8)+'px">'+iniciais(u?u.nome:'?')+'</span>';
}
