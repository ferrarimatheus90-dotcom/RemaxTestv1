<script>

   e a camada de nomenclatura do Construtor
   ======================================================================= */
const NIVEIS_OPC=['Master Regional','Matriz · marketing','Matriz · coordenação','Diretoria','Jurídico'];
const ALCADAS_PADRAO={'Evidência':['Master Regional','Matriz · marketing'], 'Fachada':['Master Regional','Matriz · marketing','Diretoria'], 'Peça fora do padrão':['Matriz · marketing']};
function alcadasDe(tipo){ const a=(S.alcadas||ALCADAS_PADRAO)[tipo]||ALCADAS_PADRAO[tipo]||['Matriz · marketing']; return a.filter(Boolean); }
/* quem decide cada nível: a Master decide o que é da Master; a Matriz, o resto; o Construtor, tudo */
function podeDecidirNivel(rot){
  if(ROLE==='construtor') return true;
  if(/Master/.test(rot)) return ROLE==='master';
  return ROLE==='brasil';
}
function critLista(){ return (S && S.pexCriterios && S.pexCriterios.length)? S.pexCriterios.filter(c=>c.ativo!==false) : CRITERIOS_EXC; }

      '<button class="btn pri" id="jnPz">'+esc(T('Salvar prazos'))+'</button><span class="mini">'+esc(T('Mudar um prazo recalcula atrasos, alertas e adesão na hora, sem depender de desenvolvimento.'))+'</span></div></div>'+

      '<div class="tw"><table><thead><tr><th>'+esc(T('Tipo de item'))+'</th><th>N1</th><th>N2</th><th>N3</th></tr></thead><tbody>'+

/* ---------- Programa de Excelência · regras e pontuação ---------- */
VIEWS.pexregras=function(v){
  const pode=souMatriz(), todas=S.pexCriterios||[], ativas=todas.filter(c=>c.ativo!==false);
  const PESOS=[['etapa','Etapa concluída no prazo'],['etapaAtraso','Etapa concluída em atraso'],['evidencia','Etapa com evidência aprovada'],
    ['campanha','Participação em campanha da rede'],['leitura','Leitura obrigatória confirmada'],['peca','Peça oficial gerada no Estúdio'],['fachada','Fachada instalada e validada']];
  v.innerHTML=
    ph('Regras e pontuação', T('As regras do Programa de Excelência vêm dos manuais da RE/MAX — até 50 regras, cada uma com o seu peso. A Matriz cadastra, ajusta os pesos ou importa a planilha de regras, e o ranking recalcula na hora.'),

      kpi(T('Pontos possíveis'), nf(ativas.reduce((a,c)=>a+(+c.pts||0),0)), T('somando todas as regras'))+
      kpi(T('Faixa Ouro'), S.excelencia.faixas.find(f=>f.id==='ouro').min, T('pontos no ciclo'),'k-ok')+
      kpi(T('Comprovações validadas'), S.excelencia.provas.filter(p=>p.st==='aprovado').length, esc(S.excelencia.ciclo))+

    '<div class="card" style="margin-bottom:16px"><div class="tw"><table><thead><tr><th>#</th><th>'+esc(T('Regra'))+'</th><th>'+esc(T('Categoria'))+'</th><th>'+esc(T('Prova exigida'))+'</th><th>'+esc(T('Pontos'))+'</th><th>'+esc(T('Situação'))+'</th>'+(pode?'<th></th>':'')+'</tr></thead><tbody>'+
      todas.map((c,i)=>'<tr'+(c.ativo===false?' style="opacity:.5"':'')+'><td class="num">'+(i+1)+'</td><td style="font-weight:600">'+esc(c.nome)+'<div class="mini">'+esc(c.desc||'')+'</div></td>'+

        '<td>'+(c.ativo===false?'<span class="tag mut">'+esc(T('Inativa'))+'</span>':'<span class="tag ok">'+esc(T('Ativa'))+'</span>')+'</td>'+
        (pode?'<td style="white-space:nowrap"><button class="btn sm" data-rged="'+c.id+'">'+esc(T('Editar'))+'</button> <button class="btn sm" data-rgat="'+c.id+'">'+esc(T(c.ativo===false?'Ativar':'Desativar'))+'</button></td>':'')+'</tr>').join('')+
    '</tbody></table></div></div>'+
    '<div class="grid g2">'+
      '<div class="card"><div class="ch"><h3>'+esc(T('Pesos da régua do ranking'))+'</h3></div><div class="cb">'+

      '<div class="field"><label>'+esc(T('Categoria'))+'</label><input id="rC" value="'+esc(c?c.cat||'':'Adequação')+'"></div>'+
      '<div class="field"><label>'+esc(T('Prova exigida'))+'</label><input id="rV" value="'+esc(c?c.prova||'':'Foto')+'"></div></div>',

    $('#rOk',ov).addEventListener('click',()=>{

      if(!c && (S.pexCriterios||[]).length>=50) return toast(T('O programa comporta até 50 regras.'));

  $$('[data-rgat]',v).forEach(b=>b.addEventListener('click',()=>{ const c=S.pexCriterios.find(x=>x.id===b.dataset.rgat);

  $('#rgPesos').addEventListener('click',()=>{

    baixarBlob(new Blob(['﻿'+txt],{type:'text/csv;charset=utf-8'}),'modelo-regras-pex.csv'); toast(T('Modelo baixado.'),1);
  });
  $('#rgImp').addEventListener('click',()=>{
    const inp=$('#filePicker'); inp.value=''; inp.accept='.csv,text/csv'; inp.multiple=false;
    inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f) return; const fr=new FileReader();
      fr.onload=()=>{ const linhas=lerCSV(fr.result); const cab=(linhas.shift()||[]).map(normCab);
        const ix=k=>cab.findIndex(h=>h===k||h.indexOf(k)===0);
        const iN=ix('regra')>=0?ix('regra'):ix('nome'), iP=ix('pontos'), iV=ix('prova'), iC=ix('categoria'), iD=ix('descricao');
        if(iN<0||iP<0) return toast(T('A planilha precisa das colunas regra e pontos.'));
        const novas=linhas.filter(r=>r[iN]&&r[iN].trim()).map(r=>({id:uid('x'), ativo:true, nome:r[iN].trim(), pts:Math.max(1,parseInt(r[iP],10)||1),
          prova:iV>=0?(r[iV]||'').trim():'', cat:iC>=0?(r[iC]||'').trim():'', desc:iD>=0?(r[iD]||'').trim():''}));
        const cabe=Math.max(0,50-(S.pexCriterios||[]).length), entram=novas.slice(0,cabe);
        commit('Importou regras do PEX', entram.length+' regras', s=>{ s.pexCriterios=s.pexCriterios.concat(entram); });
        route(); toast('<b>'+entram.length+' '+T('regras importadas.')+'</b>'+(novas.length>cabe?'<br>'+(novas.length-cabe)+' '+T('ficaram de fora: o limite é 50.'):''),1); };
      fr.readAsText(f,'utf-8'); };
    inp.click();
  });
};

/* ---------- planilhas (CSV com ; , ou tabulação) ---------- */
function lerCSV(txt){
  txt=String(txt||'').replace(/^﻿/,'');
  const prim=txt.split(/\r?\n/)[0]||'', sep=[';','\t',','].sort((a,b)=>prim.split(b).length-prim.split(a).length)[0];
  const out=[]; let lin=[], cel='', aspas=false;
  for(let i=0;i<txt.length;i++){ const ch=txt[i];
    if(aspas){ if(ch==='"'){ if(txt[i+1]==='"'){ cel+='"'; i++; } else aspas=false; } else cel+=ch; }
    else if(ch==='"') aspas=true;
    else if(ch===sep){ lin.push(cel); cel=''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&txt[i+1]==='\n') i++; lin.push(cel); cel=''; if(lin.some(x=>x.trim())) out.push(lin); lin=[]; }
    else cel+=ch; }
  lin.push(cel); if(lin.some(x=>x.trim())) out.push(lin);
  return out;
}
const normCab = h => String(h||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();

/* ---------- nomenclatura por cliente (definida pelo Construtor, sem mexer no código) ---------- */
function termosAtivos(){
  const pr=(S&&S.param)||{}, t=pr.termos||{}, pares=[];
  Object.keys(t).forEach(de=>{ const para=t[de]; if(para && para!==de){ pares.push([de,para]); pares.push([de.toLowerCase(), para.toLowerCase()]); } });
  if(pr.plataforma && pr.plataforma!=='Prontos em Rede') pares.push(['Prontos em Rede', pr.plataforma]);
  if(GENERICA) pares.push(['Matriz RE/MAX Brasil','Matriz'],['RE/MAX Brasil','Matriz'],['RE/MAX TV','TV da Rede'],['Master SP Capital III','Regional Sul'],
                          ['RE/MAX','Rede Exemplo'],['REMAX','Rede Exemplo'],['Remax','Rede Exemplo'],['#RemaxBrasil','#RedeExemplo']);
  return pares.sort((a,b)=>b[0].length-a[0].length);
}
function trocaTermos(txt, pares){ let v=txt; pares.forEach(p=>{ if(v.indexOf(p[0])>=0) v=v.split(p[0]).join(p[1]); }); return v; }
function aplicarTermos(root){
  const pares=termosAtivos(); if(!pares.length || !root) return;
  const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode(n){ const p=n.parentNode;
    return p && !/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.nodeName) && n.nodeValue.trim()? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; }});
  const alvos=[]; let n; while((n=w.nextNode())) alvos.push(n);
  alvos.forEach(t=>{ const nv=trocaTermos(t.nodeValue,pares); if(nv!==t.nodeValue) t.nodeValue=nv; });
  $$('[placeholder]',root).forEach(el=>{ const nv=trocaTermos(el.getAttribute('placeholder'),pares); if(nv!==el.getAttribute('placeholder')) el.setAttribute('placeholder',nv); });
}
