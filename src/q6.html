<script>
/* =======================================================================
   INÍCIO — banner animado + indicadores
   ======================================================================= */
const mediaAdesao = ls => ls.length? Math.round(ls.reduce((a,l)=>a+adesao(l.id),0)/ls.length):0;
const nf = n => Number(n).toLocaleString('pt-BR');
const compacto = n => n>=1e6? (n/1e6).toFixed(1).replace('.',',')+' mi' : n>=1000? Math.round(n/1000)+' mil' : nf(n);

function banner(o){
  return '<div class="hero"><div class="luz"></div>'+
    '<div class="in"><div class="txt">'+marcaBrilho('hr')+
      '<span class="eb"><i></i>'+esc(o.eb)+'</span>'+
      '<h1>'+o.h1+'</h1>'+
      '<div class="rot"><ul>'+o.rot.concat([o.rot[0]]).map(r=>'<li>'+r+'</li>').join('')+'</ul></div>'+
      '<div class="acts">'+o.acts+'</div>'+
    '</div>'+
    '<div class="stats">'+o.stats.map(s=>'<div class="st"><div class="l">'+esc(s[0])+'</div><div class="v">'+s[1]+'</div><div class="d">'+esc(s[2])+'</div></div>').join('')+'</div>'+
    '</div></div>'+blocoHome();
}
function ligarHero(){ /* o banner agora é tipográfico: sem canvas */ }

/* ---------- vídeo oficial da marca (YouTube) ----------
   Mostra só a capa; o player do YouTube (modo sem cookies) carrega quando alguém clica.
   Dentro do artefato do claude.ai, que não aceita o player, o clique abre o vídeo no YouTube. */
const VIDEO_INST = {id:'oTM71smUy1g', titulo:'REMAX 2026.', canal:'REMAX Brasil'};
function videoInstitucional(){
  const vd=VIDEO_INST;
  return '<div class="card video-inst">'+
    '<div class="vi-tx"><span class="vi-eb">'+esc(T('Vídeo oficial'))+' · '+esc(vd.canal)+'</span>'+
      '<h3>'+esc(vd.titulo)+'</h3>'+
      '<p>'+esc(T('Direto do canal da REMAX Brasil. Bom para abrir reuniões, treinamentos e o onboarding das unidades.'))+'</p>'+
      '<button class="btn pri" data-yt-abrir>'+esc(T('Assistir ao vídeo'))+'</button></div>'+
    '<button class="yt" data-yt="'+vd.id+'" aria-label="'+esc(T('Assistir ao vídeo'))+' '+esc(vd.titulo)+'">'+
      '<img src="https://i.ytimg.com/vi/'+vd.id+'/maxresdefault.jpg" alt="" loading="lazy" onerror="this.parentNode.classList.add(\'sem-capa\')">'+
      '<span class="play"></span><span class="yt-alt">'+esc(T('Assistir no YouTube'))+'</span></button>'+
  '</div>';
}
document.addEventListener('click', e=>{
  const alvo=e.target.closest('.yt[data-yt], .yt[data-ig], [data-yt-abrir]'); if(!alvo) return;
  const card=alvo.closest('.video-inst'), yt=card&&card.querySelector('.yt[data-yt], .yt[data-ig]'); if(!yt) return;
  const vv={yt:yt.dataset.yt||'', ig:yt.dataset.ig||'', tit:yt.dataset.tit||VIDEO_INST.titulo};
  if(EM_QUADRO){ abrirVideo(vv); return; }
  const f=document.createElement('iframe');
  f.className='yt-frame';
  f.src=srcVideo(vv);
  f.title=vv.tit;
  f.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
  f.allowFullscreen=true; f.referrerPolicy='strict-origin-when-cross-origin';
  yt.replaceWith(f);
  const b=card.querySelector('[data-yt-abrir]'); if(b) b.remove();
});

VIEWS.inicio=function(v){
  if(ROLE==='corretor') return inicioCorretor(v);
  if(ROLE==='franquia') return inicioFranquia(v);
  const ls=lojasVisiveis();
  const usuarios=ls.reduce((a,l)=>a+corretoresDe(l.id).length,0)+ls.length;
  const ativos=ls.reduce((a,l)=>a+ativosDe(l.id),0);
  const ad=mediaAdesao(ls), faltam=dias(DEADLINE);
  const atrasadas=ls.filter(l=>ETAPAS.some(e=>statusEtapa(l.id,e.id)==='atrasada')).length;
  const leitura=Math.round(ls.reduce((a,l)=>a+leituraDe(l.id),0)/Math.max(1,ls.length));
  const abertos=S.tickets.filter(t=>!/Resolvido/.test(t.st)).length;
  const M=metricasRede(ls);

  v.innerHTML =
    banner({
      eb:'Prontos em Rede · '+(souMatriz()?'RE/MAX Brasil':masterDe(MASTER_DEMO).nome),
      h1:T('A rede inteira')+' <b>'+T('falando a mesma língua')+'</b>',
      rot:['<b>'+ls.length+'</b> '+T('unidades acompanhadas etapa a etapa, com evidência e prazo'),
           '<b>'+compacto(M.alcance)+'</b> '+T('de alcance somado no período pelas peças oficiais'),
           '<b>'+pct(ad)+'</b> '+T('de adesão média à nova identidade'),
           '<b>'+faltam+'</b> '+T('dias até o encerramento da adequação')],
      acts:'<a class="btnh pri" href="#/jornada">Ver a jornada da rede</a>'+
           '<a class="btnh" href="#/marketing">Indicadores de marketing</a>'+
           '<a class="btnh" href="#/prontos">Próxima campanha</a>',
      stats:[['Unidades', ls.length, ls.filter(l=>S.unidades[l.id].onboard==='ativa').length+' ativas'],
             ['Usuários', usuarios, ativos+' ativos em 30 dias'],
             ['Adesão média', pct(ad), 'das 7 etapas'],
             ['Alcance', compacto(M.alcance), 'no período']]
    })+
    '<div class="grid g4" style="margin-bottom:16px">'+
      kpi('Em conformidade', ls.filter(l=>adesao(l.id)>=70).length+'/'+ls.length, 'adesão igual ou acima de 70%', ls.filter(l=>adesao(l.id)>=70).length/ls.length>.5?'k-ok':'k-warn')+
      kpi('Unidades em atraso', atrasadas, 'com pelo menos uma etapa vencida', atrasadas?'k-bad':'k-ok')+
      kpi('Leitura de comunicados', pct(leitura), 'confirmação nos obrigatórios', leitura>70?'k-ok':'k-warn')+
      kpi('Chamados abertos', abertos, 'SLA médio de 1h48 na resposta', abertos>4?'k-warn':'')+
    '</div>'+
    '<div class="grid g23" style="margin-bottom:16px">'+
      '<div class="card"><div class="ch"><h3>Publicações da rede por semana</h3><div class="r"><a class="btn sm" href="#/marketing">Abrir indicadores</a></div></div>'+
        '<div class="cb"><div class="grafico"><canvas id="gHome"></canvas></div>'+legenda([{n:'Publicações',v:M.posts},{n:'Peças geradas',v:M.pecas,cor:PALETA[1]}])+'</div></div>'+
      '<div class="card"><div class="ch"><h3>Precisa de atenção</h3><div class="r"><span class="tag red">'+atrasadas+'</span></div></div><div class="lst" id="risco"></div></div>'+
    '</div>'+
    '<div class="grid g2">'+
      '<div class="card"><div class="ch"><h3>Adesão por unidade</h3><div class="r"><span class="mini">clique para abrir a jornada</span></div></div><div class="cb" id="chart"></div></div>'+
      '<div class="card"><div class="ch"><h3>Programa de Excelência</h3><div class="r"><a class="btn sm" href="#/excelencia">Abrir</a></div></div><div class="cb">'+
        (function(){
          const pend=S.excelencia.provas.filter(p=>p.st==='pendente').length, ap=S.excelencia.provas.filter(p=>p.st==='aprovado').length;
          return '<div class="grid g2" style="gap:10px">'+
            kpi('Comprovações guardadas', S.excelencia.provas.length, 'com foto, autor e data')+
            kpi('Aguardando validação', pend, pend?'precisam da sua análise':'tudo validado', pend?'k-warn':'k-ok')+
          '</div><div class="divider"></div>'+
          '<div class="mini" style="margin-bottom:10px">Ciclo '+esc(S.excelencia.ciclo)+' · encerra em '+dataLonga(dt(S.excelencia.encerra))+' · '+ap+' entregas já validadas</div>'+
          S.excelencia.faixas.map(f=>'<div style="display:flex;gap:10px;align-items:center;padding:6px 0"><span class="tag '+(f.id==='ouro'?'warn':'mut')+'">'+esc(f.nome)+'</span>'+
            '<span class="mini">a partir de '+f.min+' pontos</span></div>').join('');
        })()+
      '</div></div>'+
    '</div>';

  gLinha($('#gHome'), M.semanas, [
    {nome:'Publicações', dados:M.serie, cor:PALETA[0]},
    {nome:'Peças', dados:M.seriePecas, cor:PALETA[1]}
  ], {alt:230});

  $('#chart').innerHTML = ls.slice().sort((a,b)=>adesao(b.id)-adesao(a.id)).map(l=>{
    const a=adesao(l.id);
    return '<div style="display:grid;grid-template-columns:minmax(120px,1.1fr) 1fr 46px;gap:10px;align-items:center;padding:3px 0;cursor:pointer" data-l="'+l.id+'">'+
      '<div style="font-size:12.6px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(l.nome)+'</div>'+barra(a)+
      '<div class="mini num" style="text-align:right">'+a+'%</div></div>';
  }).join('');
  ligarHero();
  $$('#chart [data-l]').forEach(el=>el.addEventListener('click',()=>location.hash='#/jornada/'+el.dataset.l));

  const risco=ls.filter(l=>ETAPAS.some(e=>statusEtapa(l.id,e.id)==='atrasada')||adesao(l.id)<40).sort((a,b)=>adesao(a.id)-adesao(b.id)).slice(0,5);
  $('#risco').innerHTML = risco.length? risco.map(l=>{
    const e=proximaEtapa(l.id), d=dias(dt(e.prazo)), tk=ticketsDe(l.id);
    return '<div class="li" data-l="'+l.id+'"><span class="ico" style="background:var(--red-soft);color:var(--red)">!</span>'+
      '<div class="bd"><div class="t">'+esc(l.nome)+'</div><div class="s">'+esc(e.nome)+' — '+(d<0?'vencida há '+Math.abs(d)+' dias':'vence em '+d+' dias')+'</div></div>'+
      '<div class="rt"><span class="num">'+adesao(l.id)+'%</span>'+(tk?'<span class="mini">'+tk+' chamados</span>':'')+'</div></div>';
  }).join('') : '<div class="empty">Nenhuma unidade em atraso no seu escopo.</div>';
  $$('#risco .li').forEach(el=>el.addEventListener('click',()=>location.hash='#/jornada/'+el.dataset.l));
};

function relatorioModal(ls){
  const ov=modal('Gerar relatório',
    '<div class="field"><label>Recorte</label><select id="rRec"><option>Rede completa</option><option>Por Master Regional</option><option>Por unidade</option></select></div>'+
    '<div class="field"><label>Indicadores</label><div class="chips" id="rInd">'+
      ['Adesão por etapa','Leitura de comunicados','Usuários ativos','Chamados e SLA','Publicações e alcance'].map((x,i)=>'<button class="chip '+(i<3?'on':'')+'">'+x+'</button>').join('')+'</div></div>'+
    '<div class="hint">O relatório sai com o estado atual da plataforma — o mesmo dado que alimenta os painéis.</div>',
    '<button class="btn" onclick="fechaModal()">Cancelar</button><button class="btn pri" id="rGo">Baixar CSV</button>');
  $$('#rInd .chip',ov).forEach(c=>c.addEventListener('click',()=>c.classList.toggle('on')));
  $('#rGo',ov).addEventListener('click',()=>{
    const linhas=[['unidade','bairro','regional','adesao_%','etapas_concluidas','fachada','usuarios','ativos','leitura_%','chamados_abertos','publicacoes','alcance','pontos']];
    ls.forEach(l=>{ const m=metricasLoja(l.id);
      linhas.push([l.nome,l.bairro,masterDe(l.master).nome,adesao(l.id),etapasOk(l.id),S.unidades[l.id].fachada.st,
        corretoresDe(l.id).length,ativosDe(l.id),leituraDe(l.id),ticketsDe(l.id),m.posts,m.alcance,pontosU(l.id)]); });
    baixarBlob(new Blob(['﻿'+linhas.map(r=>r.join(';')).join('\n')],{type:'text/csv;charset=utf-8'}),'prontos-em-rede-relatorio.csv');
    commit('Gerou relatório','Rede'); fechaModal(); toast('Relatório gerado com os dados atuais.',1);
  });
}

function inicioFranquia(v){
  const l=minhaLoja(), cs=corretoresDe(l.id), e=proximaEtapa(l.id), d=dias(dt(e.prazo)), U=S.unidades[l.id];
  const M=metricasLoja(l.id);
  v.innerHTML =
    banner({
      eb:esc(masterDe(l.master).nome)+' · '+esc(l.bairro),
      h1:esc(l.nome),
      rot:['<b>'+etapasOk(l.id)+' de 7 etapas</b> da adequação concluídas',
           '<b>'+ativosDe(l.id)+' de '+cs.length+'</b> associados usando a plataforma',
           '<b>'+compacto(M.alcance)+'</b> de alcance das publicações da unidade',
           d<0? '<b>'+Math.abs(d)+' dias em atraso</b> na etapa '+esc(e.nome) : '<b>'+d+' dias</b> para a próxima entrega'],
      acts:'<a class="btnh pri" href="#/jornada/'+l.id+'">Minha jornada</a><a class="btnh" href="#/estudio">Criar peça</a><a class="btnh" href="#/excelencia">Programa de Excelência</a>',
      stats:[['Adesão', pct(adesao(l.id)), etapasOk(l.id)+'/7 etapas'],
             ['Associados', cs.length, ativosDe(l.id)+' ativos'],
             ['Publicações', M.posts, 'no período'],
             ['Pontos', pontosU(l.id), 'na régua da rede']]
    })+
    '<div class="grid g23">'+
      '<div class="card"><div class="ch"><h3>Checklist de adequação</h3><div class="r"><a class="btn sm" href="#/jornada/'+l.id+'">Detalhar</a></div></div><div class="cb"><div class="tl">'+
        ETAPAS.map(x=>{ const s=statusEtapa(l.id,x.id), ev=U.etapas[x.id].evid.length;
          return '<div class="it '+(s==='concluida'?'done':s==='atrasada'?'late':(s==='andamento'||s==='aprovacao')?'now':'')+'">'+
          '<div class="t">'+esc(x.nome)+'</div><div class="d">Prazo '+dataLonga(dt(x.prazo))+' · '+(ev?ev+' evidências':'sem evidência')+'</div>'+
          '<div class="r">'+stTag(s)+(s!=='concluida'&&s!=='aprovacao'?'<button class="btn sm" data-up="'+x.id+'">Enviar evidência</button>':'')+'</div></div>';
        }).join('')+'</div></div></div>'+
      '<div><div class="card" style="margin-bottom:16px"><div class="ch"><h3>Equipe da unidade</h3><div class="r"><span class="mini">'+cs.length+'</span></div></div><div class="lst">'+
        cs.slice(0,6).map(c=>'<div class="li" style="cursor:default">'+avatar(c)+
          '<div class="bd"><div class="t" style="font-size:13px">'+esc(c.nome)+'</div><div class="s">CRECI '+esc(c.creci)+'</div></div>'+
          '<div class="rt">'+(c.ig?'<span class="tag ok">Conectado</span>':'<span class="tag mut">sem conta</span>')+'</div></div>').join('')+
        '</div><div class="cb" style="border-top:1px solid var(--line)"><a class="btn sm" href="#/usuarios">Ver todos e permissões</a></div></div>'+
        '<div class="card"><div class="ch"><h3>Avisos</h3></div><div class="cb">'+
          (naoLidos().slice(0,3).map(k=>'<div style="margin-bottom:11px"><a href="#/comunicados/'+k.id+'" style="font-weight:600;font-size:13px;text-decoration:none">'+esc(k.tit)+'</a><div class="mini">'+esc(k.area)+(k.obr?' · leitura obrigatória':'')+'</div></div>').join('')||'<div class="mini">Nada pendente. Tudo lido.</div>')+
        '</div></div></div>'+
    '</div>';
  ligarHero();
  $$('[data-up]',v).forEach(b=>b.addEventListener('click',()=>enviarEvidencia(l.id,b.dataset.up)));
}

function inicioCorretor(v){
  const c=S.usuarios[euId()], l=lojaDe(c.loja), M=metricasCorretor(c.id);
  const camp=S.campanhas.find(x=>x.st==='agendada')||S.campanhas[0];
  const jaAg=camp.ag&&camp.ag[c.id];
  const minhas=S.pecas.filter(p=>p.uid===c.id);
  const pend=[];
  if(!c.ig) pend.push(['Conectar Instagram','Sem isso você não recebe as publicações automáticas da rede','#/redes',1]);
  if(!jaAg) pend.push(['Agendar a campanha de '+new Date(camp.dt).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}),'A rede publica junto — falta você entrar','#/prontos',0]);
  if(naoLidos().filter(k=>k.obr).length) pend.push(['Confirmar leitura de '+naoLidos().filter(k=>k.obr).length+' comunicados','Leitura obrigatória','#/comunicados',0]);
  pend.push(['Enviar comprovação do Programa de Excelência','Foto da entrega feita — vira ponto e bonificação','#/excelencia',0]);

  v.innerHTML =
    banner({
      eb:esc(l.nome)+' · CRECI '+esc(c.creci),
      h1:T('Olá,')+' <b>'+esc(primeiro(c.nome))+'</b>',
      rot:['<b>'+pend.length+' '+(pend.length===1?'item':'itens')+'</b> para resolver esta semana',
           '<b>'+compacto(M.alcance)+'</b> de alcance nas suas publicações',
           '<b>'+M.posts+' publicações</b> no período · '+M.freq.toFixed(1).replace('.',',')+' por semana',
           '<b>'+pontosC(c.id)+' pontos</b> no ranking da unidade'],
      acts:'<a class="btnh pri" href="#/estudio">Criar minha peça</a><a class="btnh" href="#/marketing">Meus indicadores</a><a class="btnh" href="#/excelencia">Programa de Excelência</a>',
      stats:[['Minhas peças', minhas.length+(c.pecasFeitas||0), 'geradas no Estúdio'],
             ['Publicações', M.posts, M.freq.toFixed(1).replace('.',',')+' por semana'],
             ['Engajamento', M.eng.toFixed(1).replace('.',',')+'%', 'média das peças'],
             ['Meus pontos', pontosC(c.id), 'na régua da rede']]
    })+
    '<div class="grid g23">'+
      '<div class="card"><div class="ch"><h3>Social Hub · próxima publicação</h3><div class="r">'+(jaAg?'<span class="tag ok">Você já agendou</span>':'<span class="tag red">Em '+dias(new Date(camp.dt))+' dias</span>')+'</div></div>'+
      '<div class="cb" style="display:grid;grid-template-columns:170px 1fr;gap:16px;align-items:start">'+
        '<canvas class="prev" id="cvCamp"></canvas>'+
        '<div><div style="font-family:var(--font-d);font-weight:700;font-size:15.5px">'+esc(camp.tit)+'</div>'+
        '<div class="mini" style="margin:6px 0 10px">'+new Date(camp.dt).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+' · '+esc(camp.peca)+' · publicação sincronizada</div>'+
        '<div style="background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:12.8px">'+esc(camp.leg)+'</div>'+
        '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">'+
          (jaAg?'<button class="btn" id="desag">Cancelar agendamento</button>':'<button class="btn pri" id="ag">Agendar na minha conta</button>')+
          '<button class="btn" id="cp">Copiar legenda</button><a class="btn" href="#/estudio/'+(camp.tpl||'t01')+'">Personalizar</a></div>'+
        '</div></div></div>'+
      '<div class="card"><div class="ch"><h3>Minhas pendências</h3></div><div class="lst">'+
        pend.map((p,i)=>'<div class="li" data-go="'+p[2]+'"><span class="ico"'+(p[3]?' style="background:var(--red-soft);color:var(--red)"':'')+'>'+(i+1)+'</span>'+
          '<div class="bd"><div class="t">'+esc(p[0])+'</div><div class="s">'+esc(p[1])+'</div></div></div>').join('')+
      '</div></div>'+
    '</div>'+
    (minhas.length? '<div class="card" style="margin-top:16px"><div class="ch"><h3>Minhas peças</h3><div class="r"><a class="btn sm" href="#/estudio">Criar outra</a></div></div>'+
      '<div class="cb"><div class="pecas">'+minhas.slice(0,8).map(p=>'<div class="pc"><img src="'+p.thumb+'" data-lupa alt=""><div class="l"><b>'+esc(p.tplNome)+'</b>'+quando(p.criado)+'</div></div>').join('')+'</div></div></div>':'');

  ligarHero();
  montarPeca({fmt:'feed', tema:'azul', titulo:camp.tit.split('—')[0].trim(), sub:'Arte oficial da rede',
    nome:c.nome, creci:c.creci, tel:c.tel, unidade:l.nome, foto:c.foto}).then(cv=>{
      const a=$('#cvCamp'); if(!a) return; a.width=cv.width; a.height=cv.height; a.getContext('2d').drawImage(cv,0,0); });
  $$('.lst .li[data-go]',v).forEach(el=>el.addEventListener('click',()=>location.hash=el.dataset.go));
  $('#ag')&&$('#ag').addEventListener('click',()=>{
    commit('Agendou campanha', camp.tit, s=>{ const x=s.campanhas.find(y=>y.id===camp.id); x.ag=x.ag||{}; x.ag[c.id]=x.dt; });
    toast('<b>Agendado.</b> Sua conta publica junto com a rede.',1); route(); });
  $('#desag')&&$('#desag').addEventListener('click',()=>{
    commit('Cancelou agendamento', camp.tit, s=>{ delete s.campanhas.find(y=>y.id===camp.id).ag[c.id]; }); route(); toast('Agendamento cancelado.'); });
  $('#cp').addEventListener('click',()=>{ try{navigator.clipboard.writeText(camp.leg);}catch(e){} toast('Legenda copiada.',1); });
}
</script>
