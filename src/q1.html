<style>
/* =======================================================================
   MENU, ACESSO, ABERTURA E COMPONENTES DE TELA
   ======================================================================= */

/* ---------- menu lateral ---------- */
.modrow{
  position:relative;display:flex;align-items:center;gap:10px;height:34px;padding:0 10px 0 12px;margin:1px 0;border-radius:9px;
  cursor:pointer;color:var(--ink);font-size:13px;font-weight:500;letter-spacing:-.01em;transition:background .2s var(--e2)
}
.modrow .num,.modrow .rule,.modrow .seta,.modrow .bgp,.modrow .ic{display:none}
.modrow .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:transform .4s var(--e)}
.modrow:hover{background:var(--fill-2)}
.modrow:hover .n{transform:translateX(3px)}
.modrow.on{background:var(--fill);font-weight:600}
.modrow.aberto{background:var(--fill-2)}
.modrow.aberto .n{transform:translateX(3px)}
.modrow .pill{
  min-width:19px;height:19px;padding:0 6px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:600;
  display:grid;place-items:center;font-variant-numeric:tabular-nums;letter-spacing:0
}
.navsep{height:1px;background:var(--line);margin:10px 12px}
#indicador{display:none}

/* ---------- painel do módulo (como o menu do apple.com) ---------- */
.fly{
  position:fixed;z-index:120;min-width:280px;padding:8px 6px;border-radius:14px;
  background:rgba(252,252,253,.9);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);
  box-shadow:0 18px 50px rgba(0,0,0,.18), 0 0 0 .5px rgba(0,0,0,.12);animation:flyin .24s var(--e) both
}
:root[data-tema="escuro"] .fly{background:rgba(36,36,38,.9);box-shadow:0 18px 50px rgba(0,0,0,.6), 0 0 0 .5px rgba(255,255,255,.12)}
@keyframes flyin{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.fly .ft{font-size:12px;font-weight:500;color:var(--muted);padding:6px 12px 6px}
.fly a{
  display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;color:var(--ink);font-size:13.5px;font-weight:500;
  transition:background .15s var(--e2), color .15s var(--e2)
}
.fly a:hover{background:var(--fill-2)}
.fly a.on{color:var(--azul)}
.fly a .ic{display:none}
.fly a .pill{
  margin-left:auto;min-width:19px;height:19px;padding:0 6px;border-radius:10px;background:var(--red);color:#fff;
  font-family:var(--font-t);font-size:11px;font-weight:600;letter-spacing:0;display:grid;place-items:center
}
.fly a .o2{
  margin-left:auto;font-family:var(--font-t);font-size:11px;font-weight:600;letter-spacing:0;color:var(--warn);
  background:var(--warn-soft);padding:2px 8px;border-radius:99px
}
.fly .fd{font-size:12.5px;color:var(--muted);padding:12px 12px 6px;line-height:1.5;border-top:1px solid var(--line);margin-top:8px;max-width:36ch}

.fly.painel{
  left:var(--side-w);top:0;bottom:0;width:392px;border-radius:0;padding:74px 44px 40px;overflow-y:auto;
  background:rgba(251,251,253,.92);box-shadow:1px 0 0 var(--line), 40px 0 80px -40px rgba(0,0,0,.25);
  animation:painelin .42s var(--e) both
}
:root[data-tema="escuro"] .fly.painel{background:rgba(22,22,23,.92);box-shadow:1px 0 0 var(--line), 40px 0 80px -40px rgba(0,0,0,.8)}
@keyframes painelin{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.fly.painel .ft{padding:0 0 16px;font-size:12.5px}
.fly.painel a{
  padding:6px 0;border-radius:0;font-family:var(--font-d);font-size:24px;font-weight:600;letter-spacing:-.028em;line-height:1.22;
  opacity:0;transform:translateY(-6px);animation:flyitem .5s var(--e) both
}
.fly.painel a:hover{background:transparent;color:var(--link)}
.fly.painel a.on{color:var(--azul)}
.fly.painel a .pill,.fly.painel a .o2{margin-left:12px}
@keyframes flyitem{to{opacity:1;transform:none}}
.fly.painel a:nth-of-type(1){animation-delay:.04s} .fly.painel a:nth-of-type(2){animation-delay:.08s}
.fly.painel a:nth-of-type(3){animation-delay:.12s} .fly.painel a:nth-of-type(4){animation-delay:.16s}
.fly.painel a:nth-of-type(5){animation-delay:.2s}  .fly.painel a:nth-of-type(n+6){animation-delay:.24s}
.fly.painel .fd{padding:22px 0 0;margin-top:24px;font-size:14px;line-height:1.55;max-width:32ch;animation:sobe .6s var(--e) .2s both}
#veu{
  position:fixed;left:var(--side-w);top:0;right:0;bottom:0;z-index:110;pointer-events:none;opacity:0;
  background:rgba(245,245,247,.35);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:opacity .32s var(--e2)
}
#veu.on{opacity:1}
:root[data-tema="escuro"] #veu{background:rgba(0,0,0,.4)}

/* ---------- menus do topo ---------- */
.pop{
  position:fixed;z-index:130;min-width:210px;padding:6px;border-radius:12px;
  background:rgba(252,252,253,.88);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);
  box-shadow:0 12px 40px rgba(0,0,0,.18), 0 0 0 .5px rgba(0,0,0,.14);animation:flyin .22s var(--e)
}
:root[data-tema="escuro"] .pop{background:rgba(40,40,42,.88);box-shadow:0 12px 40px rgba(0,0,0,.6), 0 0 0 .5px rgba(255,255,255,.12)}
.pop .pt{font-size:12px;font-weight:600;color:var(--muted);padding:6px 10px 6px}
.pop button{
  display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border:0;border-radius:7px;background:transparent;cursor:pointer;
  font-size:13.5px;color:var(--ink);text-align:left
}
.pop button:hover{background:var(--azul);color:#fff}
.pop button .fl{font-size:11px;font-weight:600;width:22px;color:var(--muted)}
.pop button:hover .fl{color:rgba(255,255,255,.8)}
.pop button .ck{margin-left:auto;color:var(--azul);opacity:0;width:14px;height:14px}
.pop button:hover .ck{color:#fff}
.pop button.on .ck{opacity:1}

/* ---------- voltar, busca no celular, rodapé ---------- */
.voltar{display:none}
.voltar.on{display:grid}
.buscaBtn{display:none}
.side .op .dir{display:block;margin-top:8px;font-size:10.5px}
.rodape{padding:0 36px 34px;max-width:1320px;font-size:12px;color:var(--muted);line-height:1.6}
.rodape b{font-weight:600;color:var(--ink-2)}
@media(max-width:1000px){ .rodape{padding:0 18px 30px} }
@media(max-width:640px){
  .iconbtn{width:40px;height:40px}
  .buscaBtn{display:grid}
  .top .search{display:none}
  body.buscando .top .search{display:block;position:absolute;left:10px;right:10px;top:8px;max-width:none;z-index:5}
  body.buscando .top .search input{height:38px;background:var(--surface);box-shadow:0 0 0 1px var(--azul) inset, 0 6px 20px rgba(0,0,0,.12)}
  .rodape{padding:0 14px 28px}
}

/* ---------- trilha de alçadas ---------- */
.trilha{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.trilha span{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--fill-2);color:var(--muted)}
.trilha span.ok{background:var(--ok-soft);color:var(--ok)}
.trilha span.agora{background:var(--warn-soft);color:var(--warn)}
.trilha i{font-style:normal;color:var(--muted);font-size:11px}

/* ---------- comunicado: vídeo e evento ---------- */
.video-inst.k-video{display:block;grid-template-columns:1fr;border-radius:14px;margin-bottom:16px}
.k-evento{margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--surface-2);font-size:13.6px}

/* ---------- ícones ---------- */
.iconbtn svg{width:18px;height:18px}
.search .si,.search .si svg{width:15px;height:15px}
.pop button .ck svg{width:14px;height:14px}
.btn .ic,.btn .ic svg{width:15px;height:15px}
.lst .li .ico svg{width:17px;height:17px}

/* ---------- marca: o balão da RE/MAX com luz (acesso e banner) ---------- */
.marca{position:relative;width:120px;flex:none}
.marca .halo{position:absolute;inset:-30% -60% -18%;pointer-events:none;
  background:radial-gradient(closest-side, rgba(255,255,255,.55), rgba(255,255,255,.16) 52%, rgba(255,255,255,0))}
.marca .bl{position:relative;display:block;animation:sobeBalao 1.3s var(--e) both, flutua 7s ease-in-out 1.3s infinite}
.marca .bl img{display:block;width:100%;height:auto;filter:drop-shadow(0 16px 26px rgba(8,28,80,.3))}
@keyframes sobeBalao{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes flutua{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulsa{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.72;transform:scale(1.06)}}

/* ---------- abertura: o balão sobe, pousa e o nome sai de dentro dele ---------- */
#abertura{position:fixed;inset:0;z-index:400;background:#000;overflow:hidden;cursor:pointer;display:grid;place-items:center;color:#fff}
#abertura .ceu{
  position:absolute;inset:0;opacity:0;transition:opacity 1.6s var(--e2);
  background:linear-gradient(180deg,var(--hero-a) 0%,var(--hero-b) 56%,var(--hero-c) 100%)
}
#abertura .ceu::before{
  content:"";position:absolute;left:50%;top:44%;width:120vmax;height:120vmax;margin:-60vmax 0 0 -60vmax;border-radius:50%;
  background:radial-gradient(closest-side, rgba(255,255,255,.3), rgba(255,255,255,0) 60%);animation:pulsa 8s ease-in-out infinite
}
#abertura.f1 .ceu{opacity:1}
#abertura .palco{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 24px}
#abertura .lockup{--H:min(clamp(120px,21vh,186px),38vw);display:inline-flex;flex-direction:column;align-items:center}
#abertura .bl{
  position:relative;display:block;height:var(--H);flex:none;transform-origin:50% 100%;
  opacity:0;transform:translateY(62vh) scale(1.14);transition:transform 2.1s var(--e), opacity .9s var(--e2)
}
#abertura.f1 .bl{opacity:1;transform:translateY(0) scale(1.14)}
#abertura.f2 .bl{transform:none;transition:transform 1.3s var(--e)}
#abertura .bl img{display:block;height:100%;width:auto;filter:drop-shadow(0 18px 30px rgba(8,28,80,.35));animation:flutua 6s ease-in-out infinite}
#abertura .bl .aura{
  position:absolute;inset:-38% -62% -26%;z-index:-1;pointer-events:none;
  background:radial-gradient(closest-side, rgba(255,255,255,.6), rgba(255,255,255,.16) 52%, rgba(255,255,255,0))
}
#abertura .nome{display:block;flex:none;width:0;min-width:92%;margin-top:calc(var(--H)*.07)}
#abertura .nome img{
  display:block;width:100%;height:auto;
  clip-path:inset(0 0 100% 0);transform:translateY(-45%);filter:blur(10px);opacity:0;
  transition:clip-path 1.2s var(--e) .1s, transform 1.3s var(--e) .1s, filter 1s var(--e) .25s, opacity .6s var(--e2) .1s
}
#abertura.f2 .nome img{clip-path:inset(0 0 0 0);transform:none;filter:blur(0);opacity:1}
#abertura .t1{
  font-size:clamp(38px,6.4vw,78px);font-weight:600;letter-spacing:-.036em;line-height:1.02;margin-top:40px;
  opacity:0;filter:blur(14px);transform:translateY(16px) scale(.985);
  transition:opacity 1.1s var(--e), filter 1.2s var(--e), transform 1.4s var(--e)
}
#abertura.f3 .t1{opacity:1;filter:blur(0);transform:none}
#abertura .t2{
  font-size:clamp(17px,2.1vw,25px);font-weight:600;letter-spacing:-.022em;line-height:1.3;color:rgba(255,255,255,.7);margin:14px 0 0;
  opacity:0;transform:translateY(10px);transition:opacity 1s var(--e) .05s, transform 1.1s var(--e) .05s
}
#abertura.f4 .t2{opacity:1;transform:none}
#abertura .pular,#splash .pular{
  position:absolute;right:26px;bottom:24px;z-index:3;height:32px;padding:0 15px;border:0;border-radius:99px;cursor:pointer;
  background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;font-size:12.5px;font-weight:500;
  transition:background .2s var(--e2)
}
#abertura .pular:hover,#splash .pular:hover{background:rgba(255,255,255,.26)}
#abertura.sai{opacity:0;transform:scale(1.035);transition:opacity .85s var(--e2), transform 1.1s var(--e)}

/* ---------- abertura em vídeo (splash.mp4) ---------- */
#splash{
  position:fixed;inset:0;z-index:400;overflow:hidden;cursor:pointer;
  background:radial-gradient(ellipse 120% 75% at 50% 50%, #5279D6 0%, #1D3E9D 55%, #071538 100%)
}
#splash video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
@media (max-aspect-ratio:1/1){
  /* celular em pé: amplia o miolo do vídeo para o balão e o texto não serem cortados */
  #splash video{inset:auto;left:50%;top:50%;width:190vw;height:auto;max-width:none;transform:translate(-50%,-50%);object-fit:contain}
}
#splash.sai{opacity:0;transform:scale(1.02);transition:opacity .85s var(--e2), transform 1s var(--e)}
#splash .assistir{
  position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);z-index:3;height:52px;padding:0 28px;border:0;border-radius:99px;
  background:rgba(255,255,255,.92);color:#0B2253;font-size:16px;font-weight:600;cursor:pointer;
  box-shadow:0 12px 36px rgba(0,0,0,.28);transition:background .2s var(--e2), transform .2s var(--e2)
}
#splash .assistir:hover{background:#fff}

/* ---------- acesso ---------- */
.login{
  position:fixed;inset:0;z-index:300;overflow:auto;display:flex;padding:40px 28px;color:#fff;
  background:linear-gradient(180deg,var(--hero-a) 0%,var(--hero-b) 56%,var(--hero-c) 100%)
}
.login .fundo{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.login .fundo canvas{display:none}
.login .fundo::before{
  content:"";position:absolute;width:80vmax;height:80vmax;left:-22vmax;top:-38vmax;border-radius:50%;
  background:radial-gradient(closest-side, rgba(255,255,255,.3), rgba(255,255,255,0));animation:deriva 22s ease-in-out infinite alternate
}
.login .fundo::after{
  content:"";position:absolute;width:70vmax;height:70vmax;right:-26vmax;bottom:-36vmax;border-radius:50%;
  background:radial-gradient(closest-side, rgba(160,205,255,.4), rgba(160,205,255,0));animation:deriva 28s ease-in-out infinite alternate-reverse
}
@keyframes deriva{to{transform:translate(8vmax,6vmax) scale(1.12)}}
.login .box{
  position:relative;z-index:2;width:100%;min-width:0;max-width:1060px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:60px;align-items:center;
  animation:loginin .9s var(--e) both
}
@keyframes loginin{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.login .lado{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.login .lockup-lg{position:relative;display:inline-flex;flex-direction:column;align-items:center}
.login .lockup-lg::before{
  content:"";position:absolute;left:-104px;top:-80px;width:280px;height:240px;pointer-events:none;
  background:radial-gradient(closest-side, rgba(255,255,255,.42), rgba(255,255,255,0))
}
.login .lockup-lg .bl{position:relative;display:block;height:80px;animation:sobeBalao 1.3s var(--e) both, flutua 7s ease-in-out 1.3s infinite}
.login .lockup-lg .bl img{display:block;height:100%;width:auto;filter:drop-shadow(0 14px 22px rgba(8,28,80,.3))}
.login .lockup-lg .wm{position:relative;display:block;width:0;min-width:92%;height:auto;margin-top:6px}
.login .lado h2{font-size:clamp(44px,5.4vw,72px);font-weight:600;letter-spacing:-.037em;line-height:1.02;margin-top:34px}
.login .lado h2 b{display:block;font-weight:600;color:rgba(255,255,255,.62)}
.login .lado p{font-size:17px;line-height:1.5;color:rgba(255,255,255,.82);margin:20px 0 0;max-width:34ch;letter-spacing:-.016em}
.login .lado .mods{display:flex;flex-wrap:wrap;gap:8px;margin-top:30px;max-width:520px}
.login .lado .mods span{
  font-size:12px;font-weight:500;padding:6px 12px;border-radius:99px;color:#fff;
  background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)
}
.login .form{min-width:0;background:var(--surface);color:var(--ink);border-radius:28px;padding:36px 34px 28px;box-shadow:0 40px 100px -20px rgba(4,24,70,.5)}
.login .form h1{font-size:28px;font-weight:600;letter-spacing:-.03em}
.login .form .sb{font-size:14px;color:var(--muted);margin-top:8px;line-height:1.5}
.login .contas{margin-top:22px;display:flex;flex-direction:column;background:var(--surface-2);border-radius:16px;padding:4px}
.login .conta{
  position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;border-radius:12px;background:transparent;
  width:100%;text-align:left;color:var(--ink);cursor:pointer;transition:background .2s var(--e2), box-shadow .2s var(--e2)
}
.login .conta + .conta::before{content:"";position:absolute;left:58px;right:12px;top:0;height:1px;background:var(--line)}
.login .conta:hover{background:var(--fill-2)}
.login .conta.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.08), 0 4px 14px rgba(0,0,0,.05)}
.login .conta.on::before,.login .conta.on + .conta::before{opacity:0}
.login .conta.on::after{content:"\2713";margin-left:auto;padding-left:8px;color:var(--azul);font-weight:700;font-size:14px}
.login .conta .av{
  width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff;
  background:linear-gradient(180deg,#A7A7AC,#86868B);transition:background .3s var(--e2)
}
.login .conta.on .av{background:linear-gradient(180deg,#4C9AF5,var(--azul))}
.login .conta .t{display:block;font-size:14px;font-weight:600;line-height:1.3;letter-spacing:-.014em}
.login .conta .s{
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4
}
.login .form .field label{color:var(--ink-2)}
.login .entrar{
  width:100%;margin-top:18px;height:46px;border:0;border-radius:99px;cursor:pointer;background:var(--azul);color:#fff;
  font-size:15px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s var(--e2), transform .15s var(--e2)
}
.login .entrar:hover{background:var(--azul-2)}
.login .entrar:active{transform:scale(.985)}
.login .rod{margin-top:20px;font-size:12px;color:var(--muted);line-height:1.65;text-align:center}
.login .rod b{color:var(--ink-2);font-weight:600}
.login .erro{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:9px 12px;font-size:13px;margin-top:12px}
.login .lgtop{position:fixed;top:20px;right:22px;z-index:3;display:flex;gap:8px}
.login .lgtop button{
  height:32px;min-width:44px;padding:0 12px;border:0;border-radius:99px;cursor:pointer;color:#fff;font-size:12.5px;font-weight:600;
  background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:background .2s var(--e2)
}
.login .lgtop button:hover{background:rgba(255,255,255,.28)}
@media(max-width:920px){
  .login{padding:70px 16px 28px}
  .login .box{grid-template-columns:minmax(0,1fr);gap:24px;max-width:480px}
  .login .lado{align-items:center;text-align:center}
  .login .lockup-lg .bl{height:62px}
  .login .lado h2{font-size:40px;margin-top:16px}
  .login .lado p,.login .lado .mods{display:none}
  .login .form{padding:28px 20px 22px;border-radius:24px}
}

/* ---------- banner da página inicial ---------- */
.hero{
  position:relative;overflow:hidden;color:#fff;border-radius:var(--r-lg);margin-bottom:22px;padding:54px 40px 0;text-align:center;
  background:linear-gradient(180deg,var(--hero-a) 0%,var(--hero-b) 58%,var(--hero-c) 100%)
}
.hero::before{
  content:"";position:absolute;width:900px;height:900px;left:-420px;top:-560px;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side, rgba(255,255,255,.22), rgba(255,255,255,0));animation:deriva 24s ease-in-out infinite alternate
}
.hero .luz{
  position:absolute;left:50%;top:-330px;width:860px;height:860px;margin-left:-430px;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side, rgba(255,255,255,.3), rgba(255,255,255,0));animation:pulsa 9s ease-in-out infinite
}
.hero .in{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
.hero .txt{display:flex;flex-direction:column;align-items:center;max-width:none}
.hero .marca{width:74px;margin-bottom:24px}
