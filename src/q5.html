<script>
/* =======================================================================
   MOTOR DE ARTE — desenha a peça de verdade em canvas e exporta
   Com foto do imóvel: a foto vira o fundo, com véu escuro para o texto.
   Sem foto: gradiente da variação de cor e o balão da marca com luz.
   ======================================================================= */
const TEMAS = {
  azul:     {a:'#082C66', b:'#1352B8', tinta:'#FFFFFF', apoio:'rgba(255,255,255,.84)', pil:'#FFFFFF', pilTxt:'#0B3F94',
             card:'#FFFFFF', cardTxt:'#0B1E3F', cardApoio:'#5A6A80', luz:'rgba(255,255,255,.26)', logo:'branco'},
  claro:    {a:'#F6F8FB', b:'#DCE4EE', tinta:'#0B1E3F', apoio:'#45566E', pil:'#0B3F94', pilTxt:'#FFFFFF',
             card:'#0B3F94', cardTxt:'#FFFFFF', cardApoio:'rgba(255,255,255,.8)', luz:'rgba(255,255,255,.95)', logo:'cor'},
  vermelho: {a:'#8E0C18', b:'#DC1C2E', tinta:'#FFFFFF', apoio:'rgba(255,255,255,.88)', pil:'#FFFFFF', pilTxt:'#B5121F',
             card:'#FFFFFF', cardTxt:'#0B1E3F', cardApoio:'#5A6A80', luz:'rgba(255,255,255,.22)', logo:'branco'}
};
const FONTE = 'Inter, -apple-system, "Segoe UI", Arial, sans-serif';
let LOGO_NAVY=null;
function logoTintado(){
  if(LOGO_NAVY) return LOGO_NAVY;
  if(!LOGO_IMG.complete || !LOGO_IMG.naturalWidth) return null;
  const c=document.createElement('canvas'); c.width=LOGO_IMG.naturalWidth; c.height=LOGO_IMG.naturalHeight;
  const x=c.getContext('2d'); x.drawImage(LOGO_IMG,0,0);
  x.globalCompositeOperation='source-in'; x.fillStyle='#08405F'; x.fillRect(0,0,c.width,c.height);
  LOGO_NAVY=c; return c;
}
function carregaImg(src){
  return new Promise(res=>{
    if(!src) return res(null);
    const i=new Image();
    if(/^https?:/i.test(src)) i.crossOrigin='anonymous';
    i.onload=()=>res(i); i.onerror=()=>res(null); i.src=src;
  });
}
function pronta(img){
  if(!img) return Promise.resolve(null);
  if(img.complete && img.naturalWidth) return Promise.resolve(img);
  return new Promise(r=>{ img.addEventListener('load',()=>r(img),{once:true}); img.addEventListener('error',()=>r(null),{once:true}); });
}
const imgOk = i => !!(i && (i.naturalWidth||i.width));
function quebra(ctx, texto, larg){
  const ps=String(texto||'').split(/\s+/); const linhas=[]; let l='';
  ps.forEach(p=>{ const teste=l?l+' '+p:p;
    if(ctx.measureText(teste).width>larg && l){ linhas.push(l); l=p; } else l=teste; });
  if(l) linhas.push(l); return linhas;
}
function arredondado(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function corta(ctx, txt, larg){
  txt=String(txt||''); if(ctx.measureText(txt).width<=larg) return txt;
  while(txt.length>1 && ctx.measureText(txt+'…').width>larg) txt=txt.slice(0,-1);
  return txt+'…';
}
function capa(g, img, x, y, w, h){
  const iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height, s=Math.max(w/iw, h/ih);
  g.drawImage(img, x+(w-iw*s)/2, y+(h-ih*s)/2, iw*s, ih*s);
}
function espacamento(g, px){ if('letterSpacing' in g) g.letterSpacing=px+'px'; }
function avatarPeca(g, d, x, y, s, fundo, cor){
  g.save(); g.beginPath(); g.arc(x+s/2, y+s/2, s/2, 0, Math.PI*2); g.closePath(); g.clip();
  if(imgOk(d.foto)) capa(g, d.foto, x, y, s, s);
  else { g.fillStyle=fundo; g.fillRect(x,y,s,s); g.fillStyle=cor; g.textAlign='center'; g.textBaseline='middle';
    g.font='600 '+Math.round(s*0.36)+'px '+FONTE; g.fillText(iniciais(d.nome||'RE MAX'), x+s/2, y+s/2+1); g.textAlign='left'; }
  g.restore(); g.textBaseline='top';
}
function logoPeca(g, cor, x, y, larg){
  const src = cor ? (imgOk(WORD_COR_IMG)? WORD_COR_IMG : logoTintado()) : (imgOk(WORD_BRANCO_IMG)? WORD_BRANCO_IMG : LOGO_IMG);
  if(!imgOk(src)) return 0;
  const alt = larg*((src.naturalHeight||src.height)/(src.naturalWidth||src.width));
  g.drawImage(src, x, y, larg, alt); return alt;
}
function balaoPeca(g, cx, cy, alt, luz, k){
  if(luz){ const r=alt*0.95, rg=g.createRadialGradient(cx,cy,0,cx,cy,r);
    rg.addColorStop(0,luz); rg.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=rg; g.fillRect(cx-r,cy-r,r*2,r*2); }
  if(!imgOk(BALAO_IMG)) return;
  const larg=alt*BALAO_IMG.naturalWidth/BALAO_IMG.naturalHeight;
  g.save(); g.shadowColor='rgba(6,24,70,.32)'; g.shadowBlur=38*k; g.shadowOffsetY=18*k;
  g.drawImage(BALAO_IMG, cx-larg/2, cy-alt/2, larg, alt); g.restore();
}

/* marca d'água: pino da marca + nome da unidade + corretor e CRECI, em branco translúcido
   o = {pos:'centro'|'canto', op:'suave'|'media'|'forte', cy (centro vertical opcional), topo (canto em cima)} */
function marcaDagua(g, d, W, H, o){
  o=o||{};
  const alfa = o.op==='suave'? 0.36 : o.op==='forte'? 0.82 : 0.58, base=Math.min(W,H), canto=o.pos==='canto';
  const nome=String(d.unidade||'').toUpperCase();
  const linha2=[d.nome, d.creci?'CRECI '+d.creci:''].filter(Boolean).join('  ·  ').toUpperCase();
  const pinR = imgOk(BALAO_IMG)? BALAO_IMG.naturalWidth/BALAO_IMG.naturalHeight : 0;
  const medir=s=>{ const f1=Math.round(s*0.44), f2=Math.round(s*0.19);
    g.font='700 '+f1+'px '+FONTE; espacamento(g, Math.round(f1*0.04)); const w1=g.measureText(nome).width;
    g.font='500 '+f2+'px '+FONTE; espacamento(g, Math.round(f2*0.1)); const w2=g.measureText(linha2).width;
    return {s, f1, f2, pin:s*pinR, gap:s*0.24, larg:s*pinR+s*0.24+Math.max(w1,w2)}; };
  let m=medir(base*(canto?0.09:0.13));
  const maxL=W*(canto?0.6:0.86); if(m.larg>maxL) m=medir(m.s*maxL/m.larg);
  const mg=base*0.045;
  const x0 = canto? W-mg-m.larg : (W-m.larg)/2;
  const cy = canto? (o.topo? mg+m.s/2 : H-mg-m.s/2) : (o.cy!=null? o.cy : H/2);
  g.save(); g.globalAlpha=alfa; g.textBaseline='middle';
  g.shadowColor='rgba(0,0,0,.4)'; g.shadowBlur=m.s*0.14;
  if(m.pin) g.drawImage(BALAO_IMG, x0, cy-m.s/2, m.pin, m.s);
  const tx=x0+m.pin+m.gap; g.fillStyle='#FFFFFF';
  g.font='700 '+m.f1+'px '+FONTE; espacamento(g, Math.round(m.f1*0.04)); g.fillText(nome, tx, cy-(linha2? m.f2*0.72 : 0));
  if(linha2){ g.font='500 '+m.f2+'px '+FONTE; espacamento(g, Math.round(m.f2*0.1)); g.fillText(linha2, tx, cy+m.f1*0.56); }
  g.restore(); espacamento(g,0); g.textBaseline='top';
}
/* modelo "Foto com marca d'água": a própria foto, no tamanho dela, só com a marca por cima */
function desenharFoto(cv, d){
  const foto=imgOk(d.imovel)? d.imovel : null;
  let W=1600, H=1200;
  if(foto){ const iw=foto.naturalWidth||foto.width, ih=foto.naturalHeight||foto.height, s=Math.min(1,1600/Math.max(iw,ih)); W=Math.round(iw*s); H=Math.round(ih*s); }
  cv.width=W; cv.height=H;
  const g=cv.getContext('2d'); g.textBaseline='top'; espacamento(g,0);
  if(foto) g.drawImage(foto,0,0,W,H);
  else {
    const gr=g.createLinearGradient(0,0,W,H); gr.addColorStop(0,'#B9C6D6'); gr.addColorStop(1,'#6F7F95'); g.fillStyle=gr; g.fillRect(0,0,W,H);
    g.fillStyle='rgba(255,255,255,.85)'; g.font='600 '+Math.round(H*0.045)+'px '+FONTE; g.textAlign='center';
    g.fillText('Adicione a foto do imóvel', W/2, H*0.12); g.textAlign='left';
  }
  marcaDagua(g, d, W, H, {pos:d.marcaPos||'centro', op:d.marcaOp||'media'});
  return cv;
}

/* desenha a peça; d = {fmt,tema,titulo,sub,nome,creci,tel,unidade,foto(Image|null),imovel(Image|null),marca,marcaPos,marcaOp} */
function desenharPeca(cv, d){
  if(d.fmt==='foto') return desenharFoto(cv, d);
  const [W,H]=DIMS[d.fmt]||DIMS.feed;
  cv.width=W; cv.height=H;
  const g=cv.getContext('2d'), T=TEMAS[d.tema]||TEMAS.azul;
  const k=Math.min(W,H)/1080;
  g.textBaseline='top'; espacamento(g,0);
  if(d.fmt==='cartao' || d.fmt==='email') return desenharCartao(g, d, T, W, H);

  const foto = imgOk(d.imovel) ? d.imovel : null;
  const story = d.fmt==='story', deitado = W>H*1.15;
  const pad=Math.round(64*k), topo=story? Math.round(170*k) : pad;
  const chao = H-(story? Math.round(240*k) : pad);

  // fundo: a foto do imóvel ou o gradiente com o balão
  if(foto){
    capa(g, foto, 0, 0, W, H);
    let gr=g.createLinearGradient(0,0,0,H*0.4); gr.addColorStop(0,'rgba(0,0,0,.55)'); gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr; g.fillRect(0,0,W,H*0.4);
    gr=g.createLinearGradient(0,H*0.36,0,H); gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(.5,'rgba(0,0,0,.42)'); gr.addColorStop(1,'rgba(0,0,0,.82)');
    g.fillStyle=gr; g.fillRect(0,H*0.36,W,H*0.64);
  } else {
    const gr=g.createLinearGradient(0,0,W,H); gr.addColorStop(0,T.a); gr.addColorStop(1,T.b);
    g.fillStyle=gr; g.fillRect(0,0,W,H);
    const alt=Math.min(W,H)*(deitado?0.56:0.36);
    balaoPeca(g, deitado? W*0.8 : W*0.76, deitado? H*0.42 : (story? H*0.3 : H*0.29), alt, T.luz, k);
  }
  // marca d'água na foto (opcional): no centro livre da peça ou no canto de cima, longe do logotipo
  if(foto && d.marca) marcaDagua(g, d, W, H, {pos:d.marcaPos||'centro', op:d.marcaOp||'media', topo:true, cy: story? H*0.44 : deitado? H*0.36 : H*0.4});
  const tinta = foto? '#FFFFFF' : T.tinta, apoio = foto? 'rgba(255,255,255,.9)' : T.apoio;

  // logotipo
  logoPeca(g, !foto && T.logo==='cor', pad, topo, Math.round(250*k));

  // cartão do corretor
  const ch=Math.round(156*k), cw=deitado? Math.min(W-pad*2, Math.round(980*k)) : W-pad*2, cx=pad, cy=chao-ch, cr=Math.round(30*k);
  g.save(); g.shadowColor='rgba(0,0,0,.22)'; g.shadowBlur=32*k; g.shadowOffsetY=12*k;
  g.fillStyle=T.card; arredondado(g,cx,cy,cw,ch,cr); g.fill(); g.restore();
  const av=Math.round(104*k), ax=cx+Math.round(26*k), ay=cy+(ch-av)/2;
  avatarPeca(g, d, ax, ay, av, T.card==='#FFFFFF'?'#E6ECF4':'rgba(255,255,255,.18)', T.cardTxt);
  const bAlt=ch*0.64, bLarg=imgOk(BALAO_IMG)? bAlt*BALAO_IMG.naturalWidth/BALAO_IMG.naturalHeight : 0;
  const tx=ax+av+Math.round(24*k), txMax=cx+cw-tx-bLarg-Math.round(52*k);
  g.fillStyle=T.cardTxt; g.font='600 '+Math.round(36*k)+'px '+FONTE; g.fillText(corta(g,d.nome||'',txMax), tx, cy+Math.round(30*k));
  g.fillStyle=T.cardApoio; g.font='400 '+Math.round(26*k)+'px '+FONTE;
  g.fillText(corta(g,[d.creci?'CRECI '+d.creci:'', d.tel].filter(Boolean).join('  ·  '),txMax), tx, cy+Math.round(78*k));
  g.fillText(corta(g,d.unidade||'',txMax), tx, cy+Math.round(112*k));
  if(bLarg) g.drawImage(BALAO_IMG, cx+cw-bLarg-Math.round(30*k), cy+(ch-bAlt)/2, bLarg, bAlt);

  // apoio e título, de baixo para cima, acima do cartão
  const largTxt = (!foto && deitado) ? W*0.6 : W-pad*2;
  let yb = cy-Math.round(40*k);
  if(d.sub){
    const fs=Math.round(30*k); g.font='600 '+fs+'px '+FONTE;
    const px=Math.round(26*k), py=Math.round(15*k), pw=g.measureText(d.sub).width+px*2, phh=fs+py*2;
    if(pw<=largTxt){
      yb-=phh; g.fillStyle=T.pil; arredondado(g,pad,yb,pw,phh,phh/2); g.fill();
      g.fillStyle=T.pilTxt; g.textBaseline='middle'; g.fillText(d.sub, pad+px, yb+phh/2+1); g.textBaseline='top';
    } else {
      g.font='500 '+fs+'px '+FONTE; g.fillStyle=apoio;
      const ls=quebra(g,d.sub,largTxt).slice(0,2); yb-=ls.length*fs*1.3;
      ls.forEach((l,i)=>g.fillText(l,pad,yb+i*fs*1.3));
    }
    yb-=Math.round(24*k);
  }
  if(d.titulo){
    const tTam=Math.round((story?112:deitado?118:92)*k);
    g.font='700 '+tTam+'px '+FONTE; espacamento(g, Math.round(-tTam*0.025));
    const ls=quebra(g,String(d.titulo).toUpperCase(),largTxt).slice(0,3), lh=tTam*1.02;
    yb-=lh*ls.length; g.fillStyle=tinta;
    if(foto){ g.save(); g.shadowColor='rgba(0,0,0,.35)'; g.shadowBlur=24*k; }
    ls.forEach((l,i)=>g.fillText(l,pad,yb+i*lh));
    if(foto) g.restore();
    espacamento(g,0);
  }
  return cv;
}

/* cartão de visita e assinatura de e-mail: faixa horizontal, sem foto do imóvel */
function desenharCartao(g, d, T, W, H){
  const u=H/591, email=d.fmt==='email', cor=T.logo==='cor';
  const gr=g.createLinearGradient(0,0,W,H); gr.addColorStop(0,T.a); gr.addColorStop(1,T.b); g.fillStyle=gr; g.fillRect(0,0,W,H);
  const pad=Math.round((email?44:60)*u);
  balaoPeca(g, W-pad-H*(email?0.32:0.3), H*0.5, H*(email?0.62:0.64), T.luz, u);
  let x=pad, y;
  const fsN=Math.round((email?54:46)*u), fsA=Math.round((email?34:30)*u);
  if(email){
    const s=Math.round(H*0.56), ay=(H-s)/2;
    avatarPeca(g, d, pad, ay, s, cor?'#E6ECF4':'rgba(255,255,255,.2)', T.tinta);
    x=pad+s+Math.round(44*u);
    y=ay+logoPeca(g, cor, x, ay, Math.round(300*u))+Math.round(22*u);
  } else {
    logoPeca(g, cor, x, pad, Math.round(360*u));
    y=H-pad-fsA*1.35*2-fsN*1.2;
  }
  g.textBaseline='top';
  const larg=W-x-H*0.62-pad;
  g.fillStyle=T.tinta; g.font='600 '+fsN+'px '+FONTE; g.fillText(corta(g,d.nome||'',larg), x, y); y+=fsN*1.2+Math.round(6*u);
  g.fillStyle=T.apoio; g.font='400 '+fsA+'px '+FONTE;
  g.fillText(corta(g,[d.creci?'CRECI '+d.creci:'', d.tel].filter(Boolean).join('  ·  '),larg), x, y); y+=fsA*1.35;
  g.fillText(corta(g,d.unidade||'',larg), x, y);
  return g.canvas;
}

async function montarPeca(d){
  const [foto, imovel] = await Promise.all([carregaImg(d.foto), carregaImg(d.imovel)]);
  await Promise.all([pronta(BALAO_IMG), pronta(WORD_BRANCO_IMG), pronta(WORD_COR_IMG), pronta(LOGO_IMG)]);
  if(document.fonts){ try{ await Promise.all([document.fonts.load('700 40px Inter'), document.fonts.load('600 30px Inter'), document.fonts.load('400 26px Inter')]); }catch(e){} }
  const cv=document.createElement('canvas');
  desenharPeca(cv, Object.assign({},d,{foto, imovel}));
  return cv;
}
function canvasBlob(cv, tipo, q){
  return new Promise(res=>{ if(cv.toBlob) cv.toBlob(b=>res(b), tipo||'image/png', q); else res(null); });
}

/* ---------- PDF de uma página com a arte embutida (JPEG/DCTDecode) ---------- */
async function pecaPDF(cv, nome, mm){
  const dataUrl=cv.toDataURL('image/jpeg',0.92);
  const bin=atob(dataUrl.split(',')[1]);
  const jpg=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) jpg[i]=bin.charCodeAt(i);
  const larg = mm? mm[0]/25.4*72 : cv.width*72/150, alt = mm? mm[1]/25.4*72 : cv.height*72/150;
  const enc=s=>new TextEncoder().encode(s);
  const partes=[], offs=[]; let pos=0;
  const push=u=>{ partes.push(u); pos+=u.length; };
  push(enc('%PDF-1.4\n'));
  const obj=(n,corpo,stream)=>{
    offs[n]=pos;
    push(enc(n+' 0 obj\n'+corpo+'\n'));
    if(stream){ push(enc('stream\n')); push(stream); push(enc('\nendstream\n')); }
    push(enc('endobj\n'));
  };
  obj(1,'<</Type/Catalog/Pages 2 0 R>>');
  obj(2,'<</Type/Pages/Kids[3 0 R]/Count 1>>');
  obj(3,'<</Type/Page/Parent 2 0 R/MediaBox[0 0 '+larg.toFixed(2)+' '+alt.toFixed(2)+']/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>');
  obj(4,'<</Type/XObject/Subtype/Image/Width '+cv.width+'/Height '+cv.height+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+jpg.length+'>>', jpg);
  const cont=enc('q '+larg.toFixed(2)+' 0 0 '+alt.toFixed(2)+' 0 0 cm /Im0 Do Q');
  obj(5,'<</Length '+cont.length+'>>', cont);
  const xref=pos;
  let x='xref\n0 6\n0000000000 65535 f \n';
  for(let i=1;i<=5;i++) x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(enc(x+'trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n'+xref+'\n%%EOF'));
  baixarBlob(new Blob(partes,{type:'application/pdf'}), nome);
}

/* ---------- PDF em CMYK: a arte sai com quatro canais (DeviceCMYK), para gráfica ----------
   Conversão direta, sem perfil ICC: serve para a gráfica receber um arquivo já separado.
   Quando a gráfica exigir um perfil específico (Coated FOGRA, SWOP), ela reconverte a partir daqui. */
function rgbParaCmyk(px){
  const n=px.length/4, out=new Uint8Array(n*4);
  for(let i=0,o=0;i<n;i++,o+=4){
    const r=px[i*4]/255, g=px[i*4+1]/255, b=px[i*4+2]/255;
    const k=1-Math.max(r,g,b), d=1-k;
    out[o]   = d<=0? 0 : Math.round((1-r-k)/d*255);
    out[o+1] = d<=0? 0 : Math.round((1-g-k)/d*255);
    out[o+2] = d<=0? 0 : Math.round((1-b-k)/d*255);
    out[o+3] = Math.round(k*255);
  }
  return out;
}
async function comprimeZlib(u8){
  if(typeof CompressionStream!=='function') return null;          // navegador antigo: vai sem compressão
  try{
    const cs=new CompressionStream('deflate');                    // 'deflate' = zlib, que é o /FlateDecode do PDF
    const w=cs.writable.getWriter(); w.write(u8); w.close();
    return new Uint8Array(await new Response(cs.readable).arrayBuffer());
  }catch(e){ return null; }
}
async function pecaCMYK(cv, nome, mm){
  let px;
  try{ px=cv.getContext('2d').getImageData(0,0,cv.width,cv.height).data; }
  catch(e){ toast('<b>Não consegui ler a arte para converter.</b> Reenvie a foto pelo botão do Estúdio e tente de novo.'); return; }
  const cmyk=rgbParaCmyk(px);
  const z=await comprimeZlib(cmyk);
  const dados = z || cmyk, filtro = z? '/Filter/FlateDecode' : '';
  const larg = mm? mm[0]/25.4*72 : cv.width*72/150, alt = mm? mm[1]/25.4*72 : cv.height*72/150;
  const enc=s=>new TextEncoder().encode(s);
  const partes=[], offs=[]; let pos=0;
  const push=u=>{ partes.push(u); pos+=u.length; };
  push(enc('%PDF-1.4\n'));
  const obj=(n,corpo,stream)=>{
    offs[n]=pos;
    push(enc(n+' 0 obj\n'+corpo+'\n'));
    if(stream){ push(enc('stream\n')); push(stream); push(enc('\nendstream\n')); }
    push(enc('endobj\n'));
  };
  obj(1,'<</Type/Catalog/Pages 2 0 R>>');
  obj(2,'<</Type/Pages/Kids[3 0 R]/Count 1>>');
  obj(3,'<</Type/Page/Parent 2 0 R/MediaBox[0 0 '+larg.toFixed(2)+' '+alt.toFixed(2)+']/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>');
  obj(4,'<</Type/XObject/Subtype/Image/Width '+cv.width+'/Height '+cv.height+'/ColorSpace/DeviceCMYK/BitsPerComponent 8'+filtro+'/Length '+dados.length+'>>', dados);
  const cont=enc('q '+larg.toFixed(2)+' 0 0 '+alt.toFixed(2)+' 0 0 cm /Im0 Do Q');
  obj(5,'<</Length '+cont.length+'>>', cont);
  const xref=pos;
  let x='xref\n0 6\n0000000000 65535 f \n';
  for(let i=1;i<=5;i++) x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(enc(x+'trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n'+xref+'\n%%EOF'));
  const bl=new Blob(partes,{type:'application/pdf'});
  baixarBlob(bl, nome);
  return bl.size;
}

/* =======================================================================
   GRÁFICOS — canvas, sem biblioteca
   ======================================================================= */
let PALETA=['#1F6FE5','#5AA9FF','#0B3F94','#DC1C2E','#0F7B4F','#8A6100','#7B61A8','#6B7C8B'];
function cssVar(n,fb){ try{ const v=getComputedStyle(document.documentElement).getPropertyValue(n).trim(); return v||fb; }catch(e){ return fb; } }
function atualizaPaleta(){
  PALETA[0]=cssVar('--azul','#0071E3');   PALETA[1]=cssVar('--red','#DC1C2E');
  PALETA[2]=cssVar('--teal','#30B0C7');   PALETA[3]=cssVar('--muted-2','#86868B');
  PALETA[4]=cssVar('--ok-v','#34C759');   PALETA[5]=cssVar('--warn-v','#FF9500');
}
function prep(cv, alt){
  const dpr=window.devicePixelRatio||1;
  const larg=cv.clientWidth||cv.parentNode.clientWidth||600;
  cv.width=Math.round(larg*dpr); cv.height=Math.round(alt*dpr); cv.style.height=alt+'px';
  const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,larg,alt);
  return {g, w:larg, h:alt};
}
function eixoY(g,x0,y0,y1,max,w,fmt){
  g.strokeStyle=cssVar('--line','#E6ECF1'); g.lineWidth=1;
  g.fillStyle=cssVar('--muted','#8CA0B0'); g.font='11px Inter, Arial'; g.textAlign='right'; g.textBaseline='middle';
  for(let i=0;i<=4;i++){
    const v=max*i/4, y=y1-(y1-y0)*(i/4);
    g.beginPath(); g.moveTo(x0,y+.5); g.lineTo(x0+w,y+.5); g.stroke();
    g.fillText(fmt?fmt(v):Math.round(v), x0-8, y);
  }
  g.textAlign='left';
}
/* linha: labels[], series=[{nome,cor,dados[]}] */
function gLinha(cv, labels, series, opts){
  opts=opts||{}; const {g,w,h}=prep(cv, opts.alt||240);
  const pl=44, pr=12, pt=12, pb=26, x0=pl, y0=pt, y1=h-pb, ww=w-pl-pr;
  const max=Math.max(1,...series.flatMap(s=>s.dados))*1.15;
  eixoY(g,x0,y0,y1,max,ww,opts.fmt);
  const px=i=>x0+ww*(labels.length<2?0.5:i/(labels.length-1));
  const py=v=>y1-(y1-y0)*(v/max);
  g.fillStyle=cssVar('--muted','#8CA0B0'); g.font='11px Inter, Arial'; g.textAlign='center';
  labels.forEach((l,i)=>{ if(labels.length>10 && i%2) return; g.fillText(l,px(i),y1+15); });
  series.forEach((s,si)=>{
    const cor=s.cor||PALETA[si%PALETA.length];
    const grd=g.createLinearGradient(0,y0,0,y1); grd.addColorStop(0,cor+'44'); grd.addColorStop(1,cor+'05');
    g.beginPath(); s.dados.forEach((v,i)=> i?g.lineTo(px(i),py(v)):g.moveTo(px(i),py(v)));
    g.lineTo(px(s.dados.length-1),y1); g.lineTo(px(0),y1); g.closePath(); g.fillStyle=grd; g.fill();
    g.beginPath(); s.dados.forEach((v,i)=> i?g.lineTo(px(i),py(v)):g.moveTo(px(i),py(v)));
    g.strokeStyle=cor; g.lineWidth=2.4; g.lineJoin='round'; g.stroke();
    s.dados.forEach((v,i)=>{ g.beginPath(); g.arc(px(i),py(v),3.2,0,Math.PI*2); g.fillStyle=cssVar('--surface','#fff'); g.fill();
      g.strokeStyle=cor; g.lineWidth=2; g.stroke(); });
  });
}
/* barras verticais */
function gBarras(cv, labels, valores, opts){
  opts=opts||{}; const {g,w,h}=prep(cv, opts.alt||240);
  const pl=44, pr=12, pt=12, pb=44, x0=pl, y0=pt, y1=h-pb, ww=w-pl-pr;
  const max=Math.max(1,...valores)*1.15;
  eixoY(g,x0,y0,y1,max,ww,opts.fmt);
  const passo=ww/valores.length, larg=Math.min(46,passo*0.62), hits=[];
  valores.forEach((v,i)=>{
    const x=x0+passo*i+(passo-larg)/2, alt=(y1-y0)*(v/max), y=y1-alt;
    hits.push({x,y,w:larg,h:alt,t:String(labels[i]),s:(opts.fmt?opts.fmt(v):fmtPt(v))});
    const cor=opts.cores?opts.cores[i%opts.cores.length]:PALETA[0];
    const grd=g.createLinearGradient(0,y,0,y1); grd.addColorStop(0,cor); grd.addColorStop(1,cor+'AA');
    g.fillStyle=grd; arredondado(g,x,y,larg,Math.max(2,alt),6); g.fill();
    g.fillStyle=cssVar('--ink-2','#3B4C59'); g.font='600 11px Inter, Arial'; g.textAlign='center';
    g.fillText(opts.fmt?opts.fmt(v):v, x+larg/2, y-14);
    g.fillStyle=cssVar('--muted','#8CA0B0'); g.font='11px Inter, Arial';
    const lb=String(labels[i]); const cortado = lb.length>13? lb.slice(0,12)+'…':lb;
    g.save(); g.translate(x+larg/2, y1+8);
    if(valores.length>6){ g.rotate(-Math.PI/6); g.textAlign='right'; g.fillText(cortado,0,6); }
    else { g.textAlign='center'; g.fillText(cortado,0,10); }
    g.restore();
  });
  gHits(cv,hits);
}
/* rosca */
function gRosca(cv, dados, opts){
  opts=opts||{}; const {g,w,h}=prep(cv, opts.alt||220);
  const cx=w/2, cy=h/2, r=Math.min(w,h)/2-8, ri=r*0.62;
  const total=dados.reduce((a,d)=>a+d.v,0)||1;
  let ang=-Math.PI/2; const hits=[];
  dados.forEach((d,i)=>{
    const a2=ang+Math.PI*2*(d.v/total);
    g.beginPath(); g.moveTo(cx,cy); g.arc(cx,cy,r,ang,a2); g.closePath();
    g.fillStyle=d.cor||PALETA[i%PALETA.length]; g.fill();
    hits.push({cx,cy,r,ri,a1:ang,a2,t:d.n,s:fmtPt(d.v)+' · '+Math.round(d.v/total*100)+'%'});
    ang=a2;
  });
  gHits(cv,hits);
  g.globalCompositeOperation='destination-out';
  g.beginPath(); g.arc(cx,cy,ri,0,Math.PI*2); g.fill();
  g.globalCompositeOperation='source-over';
  g.fillStyle=cssVar('--ink','#152028'); g.textAlign='center'; g.textBaseline='middle';
  g.font='600 22px Inter, Arial, sans-serif'; g.fillText(opts.centro||total.toLocaleString('pt-BR'), cx, cy-4);
  g.fillStyle=cssVar('--muted','#8CA0B0'); g.font='11px Inter, Arial'; g.fillText(opts.rotulo||'', cx, cy+16);
}
/* ---------- camada de hover: cada gráfico registra as suas áreas (retângulo ou setor) ---------- */
let GTIP=null;
function mostraTip(h,x,y){
  if(!GTIP){ GTIP=document.createElement('div'); GTIP.id='gtip'; document.body.appendChild(GTIP); }
  if(!h){ GTIP.style.display='none'; return; }
  GTIP.innerHTML='<b>'+esc(h.t)+'</b>'+(h.s?'<span>'+esc(h.s)+'</span>':'');
  GTIP.style.display='block';
  GTIP.style.left=Math.max(8, Math.min(window.innerWidth-GTIP.offsetWidth-8, x+14))+'px';
  GTIP.style.top=Math.max(8, y-GTIP.offsetHeight-12)+'px';
}
function gHits(cv, hits){
  cv._hits=hits;
  if(cv._tipOn) return; cv._tipOn=true;
  const acha=(x,y)=>(cv._hits||[]).find(t=>{
    if(t.cx!=null){ const dx=x-t.cx, dy=y-t.cy, d=Math.hypot(dx,dy); if(d>t.r||d<t.ri) return false;
      let a=Math.atan2(dy,dx); if(a<t.a1) a+=Math.PI*2; return a>=t.a1 && a<=t.a2; }
    return x>=t.x-3 && x<=t.x+t.w+3 && y>=t.y-3 && y<=t.y+t.h+3; });
  const mover=e=>{ const r=cv.getBoundingClientRect(); const p=e.touches?e.touches[0]:e;
    const h=acha(p.clientX-r.left, p.clientY-r.top); cv.style.cursor=h?'pointer':''; mostraTip(h, p.clientX, p.clientY); };
  cv.addEventListener('mousemove',mover); cv.addEventListener('touchstart',mover,{passive:true});
  cv.addEventListener('mouseleave',()=>mostraTip(null)); cv.addEventListener('touchend',()=>setTimeout(()=>mostraTip(null),1500));
}
const corAlfa=(hex,a)=>{ const h=hex.replace('#',''); const n=h.length===3? h.split('').map(c=>c+c).join('') : h.slice(0,6);
  return 'rgba('+parseInt(n.slice(0,2),16)+','+parseInt(n.slice(2,4),16)+','+parseInt(n.slice(4,6),16)+','+a+')'; };
const fmtPt = v => (typeof v==='number'? v.toLocaleString('pt-BR') : v);

/* barras horizontais: labels[], valores[] — rótulo à esquerda, valor à direita, meta opcional (linha tracejada) */
function gBarrasH(cv, labels, valores, opts){
  opts=opts||{}; const lin=Math.max(1,valores.length), altL=opts.altLinha||30;
  const {g,w,h}=prep(cv, opts.alt||(lin*altL+16));
  const pl=Math.min(170, Math.max(90, Math.round(w*0.32))), pr=58, x0=pl, ww=w-pl-pr;
  const max=opts.max||Math.max(1,...valores)*1.05, cor=opts.cor||PALETA[0], hits=[];
  g.textBaseline='middle';
  valores.forEach((v,i)=>{
    const y=8+i*altL, bh=Math.min(16, altL*0.55), by=y+(altL-bh)/2, bw=Math.max(3, ww*(v/max));
    g.fillStyle=cssVar('--fill-2','#F2F2F5'); arredondado(g,x0,by,ww,bh,bh/2); g.fill();
    if(v>0){ g.fillStyle=(opts.cores?opts.cores[i%opts.cores.length]:cor); arredondado(g,x0,by,Math.max(bh,bw),bh,bh/2); g.fill(); }
    g.fillStyle=cssVar('--ink-2','#3B4C59'); g.font='500 12px Inter, Arial'; g.textAlign='right';
    g.fillText(corta(g,String(labels[i]),pl-14), x0-10, y+altL/2);
    g.fillStyle=cssVar('--ink','#152028'); g.font='600 12px Inter, Arial'; g.textAlign='left';
    g.fillText(opts.fmt?opts.fmt(v):fmtPt(v), x0+ww+10, y+altL/2);
    hits.push({x:x0,y:by,w:ww,h:bh,t:String(labels[i]),s:(opts.fmt?opts.fmt(v):fmtPt(v))+(opts.sufixo?' '+opts.sufixo:'')});
  });
  if(opts.meta!=null){ const mx=x0+ww*(opts.meta/max); g.save(); g.setLineDash([4,4]); g.strokeStyle=cssVar('--muted','#8CA0B0'); g.lineWidth=1;
    g.beginPath(); g.moveTo(mx,4); g.lineTo(mx,h-4); g.stroke(); g.restore();
    g.fillStyle=cssVar('--muted','#8CA0B0'); g.font='11px Inter, Arial'; g.textAlign='center'; g.fillText(opts.metaRotulo||'meta', mx, h-6); }
  g.textAlign='left'; g.textBaseline='alphabetic'; gHits(cv,hits);
}
/* medidor: meio-arco com o número no centro; pct 0..100, meta opcional */
function gMedidor(cv, pct, opts){
  opts=opts||{}; const {g,w,h}=prep(cv, opts.alt||150);
  const cx=w/2, r=Math.min(w/2-14, h-36), cy=h-22, esp=Math.max(10, r*0.16);
  const cor=opts.cor||PALETA[0], p=Math.max(0,Math.min(100,pct));
  const arco=(a1,a2,c,lw)=>{ g.beginPath(); g.arc(cx,cy,r,Math.PI+a1,Math.PI+a2); g.strokeStyle=c; g.lineWidth=lw; g.lineCap='round'; g.stroke(); };
  arco(0,Math.PI,cssVar('--fill-2','#F2F2F5'),esp);
  if(p>0) arco(0,Math.PI*p/100,cor,esp);
  if(opts.meta!=null){ const a=Math.PI+Math.PI*opts.meta/100; g.save(); g.strokeStyle=cssVar('--ink','#152028'); g.lineWidth=2;
    g.beginPath(); g.moveTo(cx+Math.cos(a)*(r-esp*0.9), cy+Math.sin(a)*(r-esp*0.9)); g.lineTo(cx+Math.cos(a)*(r+esp*0.9), cy+Math.sin(a)*(r+esp*0.9)); g.stroke(); g.restore(); }
  g.fillStyle=cssVar('--ink','#152028'); g.textAlign='center'; g.textBaseline='alphabetic';
  g.font='600 '+Math.round(Math.min(30, r*0.5))+'px Inter, Arial, sans-serif'; g.fillText((opts.fmt?opts.fmt(p):Math.round(p)+'%'), cx, cy-12);
  g.fillStyle=cssVar('--muted','#8CA0B0'); g.font='11.5px Inter, Arial'; g.fillText(opts.rotulo||'', cx, cy+4);
  if(opts.meta!=null){ g.font='10.5px Inter, Arial'; g.textAlign='left'; g.fillText('0', cx-r-esp/2, cy+18); g.textAlign='right'; g.fillText((opts.metaRotulo||'meta '+opts.meta+'%'), cx+r+esp/2, cy+18); }
  g.textAlign='left';
  gHits(cv,[{cx,cy,r:r+esp,ri:r-esp,a1:Math.PI,a2:Math.PI*2,t:opts.rotulo||'',s:(opts.fmt?opts.fmt(p):Math.round(p)+'%')+(opts.meta!=null?' · meta '+opts.meta+'%':'')}]);
}
/* mapa de calor: linhas[] × colunas[], matriz[i][j] = {v:0..1, rot, s:'texto do hover'} — azul claro → escuro */
function gCalor(cv, linhas, colunas, matriz, opts){
  opts=opts||{}; const altL=opts.altLinha||24, top=26;
  const {g,w,h}=prep(cv, opts.alt||(top+linhas.length*altL+6));
  const pl=Math.min(170, Math.max(90, Math.round(w*0.34))), x0=pl, ww=w-pl-6, cw=ww/colunas.length, cor=opts.cor||PALETA[0], hits=[];
  g.textBaseline='middle'; g.fillStyle=cssVar('--muted','#8CA0B0'); g.font='11px Inter, Arial'; g.textAlign='center';
  colunas.forEach((c,j)=>g.fillText(corta(g,String(c),cw-4), x0+cw*j+cw/2, 12));
  linhas.forEach((l,i)=>{
    const y=top+i*altL;
    g.fillStyle=cssVar('--ink-2','#3B4C59'); g.font='500 12px Inter, Arial'; g.textAlign='right'; g.fillText(corta(g,String(l),pl-14), x0-10, y+altL/2);
    colunas.forEach((c,j)=>{ const cel=(matriz[i]||[])[j]||{v:0}, val=Math.max(0,Math.min(1,cel.v||0));
      g.fillStyle= val<=0? cssVar('--fill-2','#F2F2F5') : corAlfa(cor, 0.16+0.84*val);
      arredondado(g, x0+cw*j+1, y+1, cw-2, altL-2, 5); g.fill();
      if(cel.rot && cw>34){ g.fillStyle= val>0.55? '#fff' : cssVar('--ink-2','#3B4C59'); g.font='600 10.5px Inter, Arial'; g.textAlign='center'; g.fillText(cel.rot, x0+cw*j+cw/2, y+altL/2); }
      hits.push({x:x0+cw*j+1,y:y+1,w:cw-2,h:altL-2,t:String(l)+' · '+String(c),s:cel.s||''}); });
  });
  g.textAlign='left'; g.textBaseline='alphabetic'; gHits(cv,hits);
}
/* barras empilhadas verticais: labels[], series=[{nome,cor,dados[]}] */
function gEmpilhado(cv, labels, series, opts){
  opts=opts||{}; const {g,w,h}=prep(cv, opts.alt||240);
  const muitos=labels.length>12, pl=40, pr=12, pt=12, pb=muitos?72:labels.length>6?48:30, x0=pl, y0=pt, y1=h-pb, ww=w-pl-pr;
  const tot=labels.map((_,i)=>series.reduce((a,s)=>a+(s.dados[i]||0),0));
  const max=opts.max||Math.max(1,...tot)*1.1;
  eixoY(g,x0,y0,y1,max,ww,opts.fmt);
  const passo=ww/labels.length, larg=Math.min(40,passo*0.6), hits=[];
  labels.forEach((lb,i)=>{
    const x=x0+passo*i+(passo-larg)/2; let base=y1;
    series.forEach((s,si)=>{ const v=s.dados[i]||0; if(!v) return; const alt=(y1-y0)*(v/max), y=base-alt;
      g.fillStyle=s.cor||PALETA[si%PALETA.length]; arredondado(g,x,y,larg,Math.max(1,alt-2),3); g.fill();
      hits.push({x,y,w:larg,h:alt,t:String(lb)+' · '+s.nome,s:(opts.fmt?opts.fmt(v):fmtPt(v))}); base=y; });
    g.fillStyle=cssVar('--muted','#8CA0B0'); g.font=(muitos?'10px':'11px')+' Inter, Arial';
    const lim=muitos?10:12, c=String(lb).length>lim? String(lb).slice(0,lim-1)+'…':String(lb);
    g.save(); g.translate(x+larg/2, y1+8);
    if(muitos){ g.rotate(-Math.PI/4); g.textAlign='right'; g.fillText(c,0,4); }
    else if(labels.length>6){ g.rotate(-Math.PI/6); g.textAlign='right'; g.fillText(c,0,6); } else { g.textAlign='center'; g.fillText(c,0,10); }
    g.restore();
  });
  gHits(cv,hits);
}
function legenda(dados){
  return '<div class="leg">'+dados.map((d,i)=>'<span><i style="background:'+(d.cor||PALETA[i%PALETA.length])+'"></i>'+esc(d.n)+
    (d.v!=null?' · <b>'+(typeof d.v==='number'?d.v.toLocaleString('pt-BR'):d.v)+'</b>':'')+'</span>').join('')+'</div>';
}
