<style>
/* Intelligence (BI) · submenu por módulo e detalhamento ao clicar (pedido do Bruno em 14/09) */
.kpi[data-drill]{cursor:pointer;transition:transform .16s var(--e), box-shadow .16s var(--e)}
.kpi[data-drill]:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.kpi[data-drill] .lupa{display:block;margin-top:9px;font-size:11.5px;font-weight:600;color:var(--link)}
.bi-nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.bi-nav a{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:99px;text-decoration:none;
  font-size:12.5px;font-weight:600;letter-spacing:-.01em;background:var(--fill-2);color:var(--ink-2);
  border:1px solid transparent;transition:background .15s var(--e)
}
.bi-nav a:hover{background:var(--fill)}
.bi-nav a.on{background:var(--ink);color:var(--surface)}
.bi-escala{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 18px;padding:10px 16px;
  border-radius:var(--r-sm);background:var(--fill-2);font-size:12.5px;color:var(--ink-2)
}
.bi-escala b{color:var(--ink)}
</style>
<script>
/* =======================================================================
   v3.10 — INTELLIGENCE (BI): UM PAINEL POR MÓDULO

   Pedido do Bruno na reunião de 14/09:
     "No Intelligence, ali do menu lateral esquerdo, tem que ter o submenu.
      E aí a gente vai ter os indicadores de arte, do Brand Center, do Social
      Hub, do Compliance, do Centro de Comunicação e do Programa de Excelência.
      Quando você clicar em cada um, ele vai trazer os indicadores do módulo."
     "Aí, tá com drill down, dá pra clicar?" — sim: todo indicador abre a lista
      que está por trás dele, com exportação para planilha.
     "Não deixa esse 20 aí, pode por 600" — estes painéis leem a rede inteira
      (ver q22.html); as listas nominais continuam nas unidades com base
      carregada, porque são elas que têm pessoas cadastradas.

   Nada aqui reescreve tela aprovada: são telas novas, penduradas no módulo 6.
   O painel de marketing digital e tradicional (#/bi) continua como estava.
   ======================================================================= */

let BIM_F = 'todas';        /* filtro de regional destes painéis (o #/bi tem o seu) */

function biLojas(){
  const ls = redeLojas();
  if(BIM_F !== 'todas'){ const f = ls.filter(l=>l.master===BIM_F); if(f.length) return f; }
  return ls;
}
function biFiltroHTML(ls){
  const carregadas = ls.filter(l=>!l.demo).length;
  const escala = '<div class="bi-escala"><span>📍</span><div style="flex:1;min-width:240px">'+
    '<b>'+nf(ls.length)+'</b> '+esc(T('unidades no recorte atual'))+' · <b>'+nf(ls.reduce((a,l)=>a+uDados(l).corretores,0))+'</b> '+esc(T('associados'))+
    '<div class="mini">'+esc(T('As listas com nome e sobrenome saem das'))+' '+carregadas+' '+esc(T('unidades com base carregada; o restante da rede entra nos totais e nos rankings.'))+'</div></div></div>';
  if(!souMatriz() && ROLE!=='master') return escala;
  const ordem = REDE.masters.slice().sort((a,b)=>
    REDE.lojas.filter(l=>l.master===b.id).length - REDE.lojas.filter(l=>l.master===a.id).length);
  return escala+'<div class="filtros"><div class="f"><label>'+esc(T('Regional'))+'</label><select id="biRegM">'+
    '<option value="todas">'+esc(T('Todas as regionais'))+' ('+nf(redeLojas().length)+')</option>'+
    ordem.map(m=>'<option value="'+m.id+'"'+(BIM_F===m.id?' selected':'')+'>'+esc(m.nome)+' ('+REDE.lojas.filter(l=>l.master===m.id).length+')</option>').join('')+
    '</select></div></div>';
}
function biLigaFiltro(v){
  const s=$('#biRegM',v); if(s) s.addEventListener('change',e=>{ BIM_F=e.target.value; route(); });
}
/* as pessoas só existem nas unidades com base carregada */
const biAssociados = ls => ls.filter(l=>!l.demo).flatMap(l=>corretoresDe(l.id));
const biNominal = ()=> T('Lista nominal das unidades com base carregada. As demais entram nos totais.');

/* ---------- submenu: os painéis do módulo, um por área ---------- */
const BI_PAINEIS = [
  {id:'bibrand',  t:'Brand Center',  ic:'🎨'},
  {id:'bisocial', t:'Social Hub',    ic:'📣'},
  {id:'bigov',    t:'Jornada',       ic:'✅'},
  {id:'bicomm',   t:'Comunicação',   ic:'📨'},
  {id:'bipex',    t:'Excelência',    ic:'🏆'},
  {id:'bi',       t:'Marketing',     ic:'📈'}
];
function biNav(atual){
  return '<div class="bi-nav">'+BI_PAINEIS.filter(p=>podeVer(TELAS[p.id])).map(p=>
    '<a href="#/'+p.id+'"'+(p.id===atual?' class="on"':'')+'><span>'+p.ic+'</span>'+esc(T(p.t))+'</a>').join('')+'</div>';
}

/* ---------- detalhamento (drill-down) ---------- */
const semTag = s => String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').trim();
function biDetalhe(titulo, sub, cols, linhas, arq){
  const mostra = linhas.slice(0, 800);
  const corpo =
    (sub? '<div class="hint" style="margin-bottom:14px">'+sub+'</div>':'')+
    '<div class="tw" style="max-height:56vh;overflow:auto"><table><thead><tr>'+
      cols.map((c,i)=>'<th'+(i?' class="num"':'')+'>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+
      (mostra.length
        ? mostra.map(r=>'<tr>'+r.map((c,i)=>'<td'+(i?' class="num"':'')+'>'+(c==null?'':c)+'</td>').join('')+'</tr>').join('')
        : '<tr><td colspan="'+cols.length+'"><div class="empty">'+esc(T('Nada para mostrar com o filtro atual.'))+'</div></td></tr>')+
    '</tbody></table></div>'+
    (linhas.length>mostra.length? '<div class="mini" style="margin-top:10px">'+esc(T('Mostrando as primeiras 800 linhas. A planilha sai completa.'))+'</div>':'');
  const ov = modal(esc(titulo)+' <span class="tag mut">'+nf(linhas.length)+'</span>', corpo,
    '<button class="btn" onclick="fechaModal()">'+esc(T('Fechar'))+'</button>'+
    (linhas.length?'<button class="btn pri" id="biCsvD">↓ '+esc(T('Exportar planilha'))+'</button>':''));
  const b=$('#biCsvD',ov);
  if(b) b.addEventListener('click',()=>{
    const lin=[cols].concat(linhas.map(r=>r.map(semTag)));
    baixarBlob(new Blob(['﻿'+lin.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\n')],{type:'text/csv;charset=utf-8'}),
      (arq||'detalhe')+'.csv');
    commit('Exportou detalhamento do BI', titulo); toast(T('Planilha exportada.'),1);
  });
  return ov;
}
function kpiD(l,v,d,cls,chave){
  return '<div class="kpi '+(cls||'')+'" data-drill="'+chave+'" role="button" tabindex="0"><div class="l">'+l+'</div><div class="v">'+v+'</div>'+
    (d?'<div class="d">'+d+'</div>':'')+'<span class="lupa">'+esc(T('ver o detalhe'))+' →</span></div>';
}
function ligaDrill(v, mapa){
  $$('[data-drill]',v).forEach(el=>{
    const ir=()=>{ const f=mapa[el.dataset.drill]; if(f) f(); };
    el.addEventListener('click',ir);
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); ir(); } });
  });
}
function biCard(tit, canvasId, extra, drill, mini){
  return '<div class="card"><div class="ch"><h3>'+esc(tit)+'</h3><div class="r">'+(mini?'<span class="mini">'+esc(mini)+'</span>':'')+
    (drill?'<button class="btn sm" data-drill="'+drill+'">'+esc(T('detalhar'))+'</button>':'')+'</div></div>'+
    '<div class="cb"><div class="grafico"><canvas id="'+canvasId+'"></canvas></div>'+(extra||'')+'</div></div>';
}
/* tabela da tela: mostra as primeiras e manda o resto para o detalhamento */
const BI_NA_TELA = 25;
function biRodape(total, drill){
  return total>BI_NA_TELA
    ? '<div class="cb" style="padding-top:0"><button class="btn" data-drill="'+drill+'" style="width:100%">'+
      esc(T('Ver todas as'))+' '+nf(total)+' '+esc(T('unidades'))+' →</button></div>' : '';
}

/* =======================================================================
   1 · BRAND CENTER — adesão à marca e uso do Estúdio de Arte
   "quem criou mais arte no Estúdio de Arte, quem criou mais e postou mais —
    não adianta criar e não postar"
   ======================================================================= */
function artesDe(uidc){
  const u=S.usuarios[uidc]||{};
  return S.pecas.filter(p=>p.uid===uidc).length + (u.pecasFeitas||0);
}
function publicadasDe(uidc){
  return S.campanhas.filter(c=>c.ag && c.ag[uidc]).length + (S.social.fila||[]).filter(p=>p.uid===uidc).length;
}
VIEWS.bibrand = function(v){
  const ls=biLojas(), us=biAssociados(ls);
  const dados = ls.map(l=>({l, d:uDados(l)}));
  const tot = uSoma(ls, ['criadas','publicadas','criadores','corretores']);
  const usoEstudio = tot.corretores? Math.round(tot.criadores/tot.corretores*100) : 0;
  const criouEPostou = tot.criadas? Math.round(tot.publicadas/tot.criadas*100) : 0;
  const porCriadas = dados.slice().sort((a,b)=>b.d.criadas-a.d.criadas);
  const porReg = REDE.masters.map((m,i)=>({n:m.nome, v:dados.filter(x=>x.l.master===m.id).reduce((a,x)=>a+x.d.criadas,0), cor:PALETA[i%PALETA.length]}))
    .filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,8);
  const modelos={};
  S.pecas.forEach(p=>{ const u=S.usuarios[p.uid]; if(u && ls.some(l=>l.id===u.loja)) modelos[p.tplNome||'Modelo']=(modelos[p.tplNome||'Modelo']||0)+1; });
  const modTop = Object.keys(modelos).map(k=>[k,modelos[k]]).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const rank = us.map(u=>({u, a:artesDe(u.id), p:publicadasDe(u.id)})).filter(x=>x.a>0).sort((a,b)=>b.a-a.a);
  const linhaUni = x => [esc(x.l.nome), esc(masterRede(x.l.master).nome), x.d.corretores, x.d.criadores, nf(x.d.criadas), nf(x.d.publicadas)];

  v.innerHTML =
    ph('Indicadores do Brand Center', T('Quem está usando o Estúdio de Arte, em que unidade e em que regional, e o que foi criado que realmente virou publicação. Criar sem postar não conta como adesão.'),
      '<a class="btn" href="#/estudio">'+esc(T('Abrir o Estúdio de Arte'))+' →</a>','bibrand')+
    biNav('bibrand')+ biFiltroHTML(ls)+
    '<div class="grid g4" style="margin-bottom:22px">'+
      kpiD(T('Artes criadas'), nf(tot.criadas), T('no Estúdio, em toda a rede visível'), '', 'criadas')+
      kpiD(T('Associados criando'), nf(tot.criadores), pct(usoEstudio)+' '+T('da base'), usoEstudio>50?'k-ok':'k-warn', 'criadores')+
      kpiD(T('Artes publicadas'), nf(tot.publicadas), T('saíram da plataforma para a rede'), '', 'publicadas')+
      kpiD(T('Criou e postou'), pct(criouEPostou), T('do que é criado, o que chega a publicar'), criouEPostou>60?'k-ok':'k-warn', 'criouepostou')+
    '</div>'+
    '<div class="grid g23" style="margin-bottom:22px">'+
      biCard(T('Criadas x publicadas por unidade'), 'bbUni', '<div id="bbUniLeg"></div>', 'porunidade', T('10 que mais criam'))+
      biCard(T('Artes por regional'), 'bbReg', '<div id="bbRegLeg"></div>', 'porregional', T('8 maiores'))+
    '</div>'+
    '<div class="grid g23" style="margin-bottom:22px">'+
      '<div class="card"><div class="ch"><h3>'+esc(T('Ranking de associados'))+'</h3><div class="r"><button class="btn sm" data-drill="rank">'+esc(T('ver todos'))+'</button></div></div>'+
        '<div class="tw"><table><thead><tr><th>'+esc(T('Associado'))+'</th><th class="num">'+esc(T('Criadas'))+'</th><th class="num">'+esc(T('Publicadas'))+'</th><th>'+esc(T('Conta'))+'</th></tr></thead><tbody>'+
        (rank.slice(0,10).map(x=>'<tr><td style="font-weight:600">'+esc(x.u.nome)+'<div class="mini">'+esc(lojaDe(x.u.loja).nome)+'</div></td>'+
          '<td class="num">'+nf(x.a)+'</td><td class="num">'+nf(x.p)+'</td>'+
          '<td>'+(x.u.ig?'<span class="tag ok">'+esc(T('conectada'))+'</span>':'<span class="tag mut">'+esc(T('sem conta'))+'</span>')+'</td></tr>').join('')
          ||'<tr><td colspan="4"><div class="empty">'+esc(T('Ninguém criou arte ainda no filtro atual.'))+'</div></td></tr>')+
        '</tbody></table><div class="mini" style="padding:10px 24px 0">'+esc(biNominal())+'</div></div></div>'+
      biCard(T('Modelos mais usados'), 'bbMod', '', 'modelos', T('8 primeiros'))+
    '</div>'+
    '<div class="card"><div class="ch"><h3>'+esc(T('Uso do Estúdio por unidade'))+'</h3><div class="r"><button class="btn sm" data-drill="criadas">'+esc(T('exportar'))+'</button></div></div>'+
      '<div class="tw"><table><thead><tr><th>'+esc(T('Unidade'))+'</th><th class="num">'+esc(T('Associados'))+'</th><th class="num">'+esc(T('Criando'))+'</th>'+
      '<th class="num">'+esc(T('Criadas'))+'</th><th class="num">'+esc(T('Publicadas'))+'</th></tr></thead><tbody>'+
      porCriadas.slice(0,BI_NA_TELA).map(x=>'<tr><td style="font-weight:600">'+esc(x.l.nome)+tagDemo(x.l)+'<div class="mini">'+esc(masterRede(x.l.master).nome)+'</div></td>'+
        '<td class="num">'+x.d.corretores+'</td><td class="num">'+x.d.criadores+'</td><td class="num">'+nf(x.d.criadas)+'</td><td class="num">'+nf(x.d.publicadas)+'</td></tr>').join('')+
      '</tbody></table></div>'+biRodape(porCriadas.length,'criadas')+'</div>';

  const top=porCriadas.slice(0,10);
  gEmpilhado($('#bbUni'), top.map(x=>NOME_UNI(x.l)),
    [{nome:T('Publicadas'), cor:PALETA[0], dados:top.map(x=>x.d.publicadas)},
     {nome:T('Criadas e não publicadas'), cor:PALETA[1], dados:top.map(x=>Math.max(0,x.d.criadas-x.d.publicadas))}], {alt:250});
  $('#bbUniLeg').innerHTML=legenda([{n:T('Publicadas'),cor:PALETA[0],v:tot.publicadas},{n:T('Criadas e não publicadas'),cor:PALETA[1],v:Math.max(0,tot.criadas-tot.publicadas)}]);
  gRosca($('#bbReg'), porReg, {alt:250, centro:compacto(tot.criadas), rotulo:T('artes criadas')});
  $('#bbRegLeg').innerHTML=legenda(porReg);
  gBarrasH($('#bbMod'), modTop.map(x=>x[0]), modTop.map(x=>x[1]), {alt:Math.max(120, modTop.length*30+16), sufixo:T('peças geradas')});

  biLigaFiltro(v);
  ligaDrill(v, {
    criadas: ()=>biDetalhe(T('Uso do Estúdio por unidade'), T('Soma das peças geradas no Estúdio pelos associados da unidade.'),
      [T('Unidade'),T('Regional'),T('Associados'),T('Criando'),T('Criadas'),T('Publicadas')],
      porCriadas.map(linhaUni),'estudio-por-unidade'),
    criadores: ()=>biDetalhe(T('Associados que ainda não criaram nenhuma arte'), biNominal()+' '+T('É aqui que está a adesão ao Estúdio de Arte.'),
      [T('Associado'),T('Unidade'),T('Regional'),T('Conta conectada')],
      us.filter(u=>artesDe(u.id)===0).map(u=>[esc(u.nome), esc(lojaDe(u.loja).nome), esc(masterRede(lojaDe(u.loja).master).nome), u.ig?T('sim'):T('não')]),'sem-criar-arte'),
    publicadas: ()=>biDetalhe(T('Publicações por unidade'), T('Campanhas agendadas e peças enviadas do Estúdio para as contas conectadas.'),
      [T('Unidade'),T('Regional'),T('Publicadas'),T('Criadas')],
      dados.slice().sort((a,b)=>b.d.publicadas-a.d.publicadas).map(x=>[esc(x.l.nome), esc(masterRede(x.l.master).nome), nf(x.d.publicadas), nf(x.d.criadas)]),'publicadas-por-unidade'),
    criouepostou: ()=>biDetalhe(T('Criou arte e não publicou'), biNominal()+' '+T('O indicador que o Bruno pediu: não adianta criar e não postar.'),
      [T('Associado'),T('Unidade'),T('Artes criadas'),T('Conta conectada')],
      us.filter(u=>artesDe(u.id)>0 && publicadasDe(u.id)===0).map(u=>[esc(u.nome), esc(lojaDe(u.loja).nome), nf(artesDe(u.id)), u.ig?T('sim'):T('não')]),'criou-e-nao-postou'),
    porunidade: ()=>biDetalhe(T('Criadas x publicadas por unidade'),'',
      [T('Unidade'),T('Criadas'),T('Publicadas'),T('Diferença')],
      porCriadas.map(x=>[esc(x.l.nome), nf(x.d.criadas), nf(x.d.publicadas), nf(x.d.criadas-x.d.publicadas)]),'criadas-x-publicadas'),
    porregional: ()=>biDetalhe(T('Artes por regional'),'',[T('Regional'),T('Unidades'),T('Artes criadas'),T('Publicadas')],
      REDE.masters.map(m=>{ const f=dados.filter(x=>x.l.master===m.id);
        return [esc(m.nome), f.length, nf(f.reduce((a,x)=>a+x.d.criadas,0)), nf(f.reduce((a,x)=>a+x.d.publicadas,0))]; })
        .filter(r=>r[1]>0).sort((a,b)=>b[1]-a[1]),'artes-por-regional'),
    modelos: ()=>biDetalhe(T('Modelos mais usados'), T('Qual peça da biblioteca a rede realmente usa.'),[T('Modelo'),T('Vezes usada')],
      Object.keys(modelos).map(k=>[esc(k), modelos[k]]).sort((a,b)=>b[1]-a[1]),'modelos-mais-usados'),
    rank: ()=>biDetalhe(T('Ranking de associados no Estúdio'), biNominal(),
      [T('Associado'),T('Unidade'),T('Regional'),T('Criadas'),T('Publicadas'),T('Conta')],
      rank.map(x=>[esc(x.u.nome), esc(lojaDe(x.u.loja).nome), esc(masterRede(lojaDe(x.u.loja).master).nome), nf(x.a), nf(x.p), x.u.ig?T('conectada'):T('sem conta')]),'ranking-estudio')
  });
};

/* =======================================================================
   2 · SOCIAL HUB — contas conectadas, publicações e frequência
   "o indicador primordial para o início do projeto é quantas contas estão
    conectadas… contas conectadas versus número de postagens… frequência"
   ======================================================================= */
VIEWS.bisocial = function(v){
  const ls=biLojas(), us=biAssociados(ls);
  const dados = ls.map(l=>({l, d:uDados(l)}));
  const tot = uSoma(ls, ['corretores','conectadas','posts','seguidores','curtidas','reels','stories','alcance']);
  const adesaoCt = tot.corretores? Math.round(tot.conectadas/tot.corretores*100) : 0;
  const freq = tot.conectadas? (tot.posts/SEMANAS/tot.conectadas) : 0;
  const ordAd = dados.slice().sort((a,b)=>b.d.adesaoContas-a.d.adesaoContas);
  const mix=[{n:'Feed',v:Math.max(0,tot.posts-tot.reels),cor:PALETA[0]},{n:'Reels',v:tot.reels,cor:PALETA[2]},{n:'Stories',v:tot.stories,cor:PALETA[6]}];
  const M=metricasRede(lojasVisiveis());     // a série por semana vem das unidades com base carregada
  const escala = tot.posts / Math.max(1, M.posts);
  const linhaUni = x => [esc(x.l.nome), esc(masterRede(x.l.master).nome), x.d.corretores, x.d.conectadas, pct(x.d.adesaoContas),
    nf(x.d.posts), x.d.conectadas? (x.d.posts/SEMANAS/x.d.conectadas).toFixed(1).replace('.',','):'0', nf(x.d.seguidores)];

  v.innerHTML =
    ph('Indicadores do Social Hub', T('Adesão das contas, volume e frequência de publicação. Conta conectada é o primeiro indicador do projeto: quem paga pela plataforma e não conectou a conta aparece aqui.'),
      '<a class="btn" href="#/redes">'+esc(T('Abrir Redes sociais'))+' →</a>','bisocial')+
    biNav('bisocial')+ biFiltroHTML(ls)+
    '<div class="grid g4" style="margin-bottom:22px">'+
      kpiD(T('Contas conectadas'), nf(tot.conectadas)+'/'+nf(tot.corretores), pct(adesaoCt)+' '+T('da rede visível'), adesaoCt>60?'k-ok':'k-warn','conectadas')+
      kpiD(T('Publicações'), nf(tot.posts), T('últimas 12 semanas'), '', 'publicacoes')+
      kpiD(T('Frequência'), freq.toFixed(1).replace('.',','), T('por conta conectada, por semana'), freq>=1?'k-ok':'k-warn','frequencia')+
      kpiD(T('Seguidores'), compacto(tot.seguidores), T('somados nas contas conectadas'), '', 'seguidores')+
    '</div>'+
    '<div class="grid g3" style="margin-bottom:22px">'+
      '<div class="card"><div class="ch"><h3>'+esc(T('Adesão das contas'))+'</h3><div class="r"><button class="btn sm" data-drill="conectadas">'+esc(T('detalhar'))+'</button></div></div>'+
        '<div class="cb"><div class="grafico"><canvas id="bsMed"></canvas></div>'+
        '<div class="hint" style="margin-top:6px">'+esc(T('Meta de adesão da primeira onda: 80% das contas conectadas.'))+'</div></div></div>'+
      biCard(T('Publicações por semana'), 'bsSerie', '', 'publicacoes')+
      biCard(T('Formatos publicados'), 'bsMix', '<div id="bsMixLeg"></div>', 'formatos')+
    '</div>'+
    '<div class="grid g23" style="margin-bottom:22px">'+
      biCard(T('Adesão por unidade'), 'bsUni', '', 'porunidade', T('12 primeiras'))+
      biCard(T('Conectadas x publicações'), 'bsCx', '<div id="bsCxLeg"></div>', 'conectadasxposts', T('10 maiores'))+
    '</div>'+

/* =======================================================================
   4 · CENTRO DE COMUNICAÇÃO — leitura dos comunicados
   "dá pra fazer BI só falando da leitura dos comunicados: leitura de
    comunicado, 60% — isso é um BI"
   ======================================================================= */
VIEWS.bicomm = function(v){
  const ls=biLojas(), us=biAssociados(ls), idsU=us.map(u=>u.id);
  const ks=S.comunicados.slice();
  const dados = ls.map(l=>({l, d:uDados(l)}));
  const totPessoas = dados.reduce((a,x)=>a+x.d.corretores,0);
  const lidosDe = k => (S.leituras[k.id]||[]).filter(id=>idsU.indexOf(id)>=0).length;
  /* nas unidades com base carregada a leitura é pessoa a pessoa; nas demais entra a taxa da unidade */
  const taxa = k => {
    if(!us.length && !dados.length) return 0;
    const carregado = us.length? lidosDe(k)/us.length : 0;
    const demo = dados.filter(x=>x.l.demo);
    const pesoDemo = demo.reduce((a,x)=>a+x.d.corretores,0), pesoCar = us.length;
    const mediaDemo = demo.length? demo.reduce((a,x)=>a+x.d.leitura/100,0)/demo.length : 0;
    const t = (carregado*pesoCar + mediaDemo*pesoDemo) / Math.max(1, pesoCar+pesoDemo);
    return Math.round((k.obr? Math.min(1,t*1.08) : t)*100);
  };
  const media = ks.length? Math.round(ks.reduce((a,k)=>a+taxa(k),0)/ks.length) : 0;
  const obr = ks.filter(k=>k.obr);
  const mediaObr = obr.length? Math.round(obr.reduce((a,k)=>a+taxa(k),0)/obr.length) : 0;
  const pendencias = obr.reduce((a,k)=>a+Math.round(totPessoas*(1-taxa(k)/100)),0);
  const porLoja = dados.slice().sort((a,b)=>b.d.leitura-a.d.leitura);
  const ordK = ks.slice().sort((a,b)=>taxa(b)-taxa(a));
  const canais={}; ks.forEach(k=>(k.canais||['plataforma']).forEach(c=>canais[c]=(canais[c]||0)+1));
  const canLabel=c=>c==='email'?'E-mail':c==='whatsapp'?'WhatsApp':c==='popup'?T('Aviso ao entrar'):T('Plataforma');
  const canData=Object.keys(canais).map((c,i)=>({n:canLabel(c), v:canais[c], cor:PALETA[i%PALETA.length]}));

  v.innerHTML =
    ph('Indicadores de Comunicação', T('Quanto da rede realmente lê o que a Matriz publica. A confirmação de leitura é registrada pessoa a pessoa, então dá para cobrar quem faltou.'),
      '<a class="btn" href="#/comunicados">'+esc(T('Abrir os comunicados'))+' →</a>','bicomm')+
    biNav('bicomm')+ biFiltroHTML(ls)+
    '<div class="grid g4" style="margin-bottom:22px">'+
      kpiD(T('Comunicados publicados'), nf(ks.length), obr.length+' '+T('obrigatórios'), '', 'lista')+
      kpiD(T('Leitura média'), pct(media), T('de todos os comunicados'), media>=70?'k-ok':'k-warn','leitura')+
      kpiD(T('Leitura dos obrigatórios'), pct(mediaObr), T('os que contam para o compliance'), mediaObr>=80?'k-ok':'k-warn','obrigatorios')+
      kpiD(T('Confirmações pendentes'), nf(pendencias), T('pessoas x comunicados obrigatórios'), pendencias?'k-warn':'k-ok','pendentes')+
    '</div>'+
    '<div class="grid g23" style="margin-bottom:22px">'+
      biCard(T('Leitura por comunicado'), 'bcCom', '', 'lista', T('10 primeiros'))+
      biCard(T('Canais usados'), 'bcCan', '<div id="bcCanLeg"></div>', 'canais')+
    '</div>'+
    '<div class="grid g23">'+
      biCard(T('Leitura por unidade'), 'bcUni', '', 'porunidade', T('12 primeiras'))+
      '<div class="card"><div class="ch"><h3>'+esc(T('Comunicados'))+'</h3><div class="r"><button class="btn sm" data-drill="lista">'+esc(T('ver todos'))+'</button></div></div>'+
      '<div class="tw" style="max-height:380px;overflow:auto"><table><thead><tr><th>'+esc(T('Comunicado'))+'</th><th class="num">'+esc(T('Taxa'))+'</th></tr></thead><tbody>'+
      ordK.map(k=>'<tr><td style="font-weight:600">'+esc(k.tit)+'<div class="mini">'+esc(k.area||'')+(k.obr?' · '+esc(T('obrigatório')):'')+'</div></td>'+
        '<td class="num">'+(taxa(k)>=70?'<span class="tag ok">':'<span class="tag warn">')+pct(taxa(k))+'</span></td></tr>').join('')+
      '</tbody></table></div></div>'+
    '</div>';

  const top=ordK.slice(0,10);
  gBarrasH($('#bcCom'), top.map(k=>k.tit), top.map(k=>taxa(k)), {fmt:v=>v+'%', max:100, alt:Math.max(140, top.length*30+16), meta:70, metaRotulo:T('meta 70%')});
  gRosca($('#bcCan'), canData, {alt:250, centro:String(ks.length), rotulo:T('comunicados')});
  $('#bcCanLeg').innerHTML=legenda(canData);
  gBarrasH($('#bcUni'), porLoja.slice(0,12).map(x=>NOME_UNI(x.l)), porLoja.slice(0,12).map(x=>x.d.leitura),
    {fmt:v=>v+'%', max:100, alt:Math.max(140, Math.min(12,porLoja.length)*30+16)});

  biLigaFiltro(v);
  ligaDrill(v, {
    lista: ()=>biDetalhe(T('Leitura por comunicado'),'',[T('Comunicado'),T('Área'),T('Obrigatório'),T('Taxa')],
      ordK.map(k=>[esc(k.tit), esc(k.area||''), k.obr?T('sim'):T('não'), pct(taxa(k))]),'leitura-por-comunicado'),
    leitura: ()=>biDetalhe(T('Leitura por unidade'),'',[T('Unidade'),T('Regional'),T('Associados'),T('Leitura dos obrigatórios')],
      porLoja.map(x=>[esc(x.l.nome), esc(masterRede(x.l.master).nome), x.d.corretores, pct(x.d.leitura)]),'leitura-por-unidade'),
    obrigatorios: ()=>biDetalhe(T('Comunicados obrigatórios'),'',[T('Comunicado'),T('Taxa')],
      obr.slice().sort((a,b)=>taxa(a)-taxa(b)).map(k=>[esc(k.tit), pct(taxa(k))]),'comunicados-obrigatorios'),
    pendentes: ()=>biDetalhe(T('Quem ainda não confirmou leitura'), biNominal()+' '+T('Só os comunicados obrigatórios. É a lista que o gestor usa para cobrar.'),
      [T('Associado'),T('Unidade'),T('Comunicado')],
      obr.flatMap(k=>us.filter(u=>(S.leituras[k.id]||[]).indexOf(u.id)<0).map(u=>[esc(u.nome), esc(lojaDe(u.loja).nome), esc(k.tit)])),'leitura-pendente'),
    canais: ()=>biDetalhe(T('Canais usados'),'',[T('Canal'),T('Comunicados')], canData.map(c=>[c.n, c.v]),'canais-de-comunicacao'),
    porunidade: ()=>biDetalhe(T('Leitura por unidade'),'',[T('Unidade'),T('Associados'),T('Leitura')],
      porLoja.map(x=>[esc(x.l.nome), x.d.corretores, pct(x.d.leitura)]),'leitura-por-unidade')
  });
};

/* =======================================================================
   5 · PROGRAMA DE EXCELÊNCIA — pontuação, comprovações e faixas
   ======================================================================= */
VIEWS.bipex = function(v){
  const ls=biLojas();
  const provas = S.excelencia.provas.filter(p=>ls.some(l=>l.id===p.loja));
  const dados = ls.map(l=>({l, d:uDados(l)})).sort((a,b)=>b.d.pontos-a.d.pontos);
  const faixaDe = p => (S.excelencia.faixas.slice().sort((a,b)=>b.min-a.min).find(f=>p>=f.min)||{nome:T('Fora de faixa'),id:'fora',premio:''});
  const total = dados.reduce((a,x)=>a+x.d.pontos,0);
  const val = provas.filter(p=>p.st==='aprovado').length, pend = provas.filter(p=>p.st==='pendente').length, rec = provas.filter(p=>p.st==='recusado').length;
  const naFaixa = dados.filter(x=>faixaDe(x.d.pontos).id!=='fora').length;
  const porFaixa = S.excelencia.faixas.map((f,i)=>({n:f.nome, v:dados.filter(x=>faixaDe(x.d.pontos).id===f.id).length, cor:PALETA[[5,7,3][i%3]]}))
    .concat([{n:T('Fora de faixa'), v:dados.length-naFaixa, cor:PALETA[7]}]).filter(x=>x.v>0);
  const crit={}; provas.forEach(p=>{ crit[p.criterioNome]=(crit[p.criterioNome]||0)+1; });
  const critTop = Object.keys(crit).map(k=>[k,crit[k]]).sort((a,b)=>b[1]-a[1]).slice(0,8);

  v.innerHTML =
    ph('Indicadores do Programa de Excelência', T('Pontuação da rede no ciclo, comprovações validadas e em que faixa de bonificação cada unidade está.'),
      '<a class="btn" href="#/excelencia">'+esc(T('Abrir o programa'))+' →</a>','bipex')+
    biNav('bipex')+ biFiltroHTML(ls)+
    '<div class="grid g4" style="margin-bottom:22px">'+
      kpiD(T('Pontos da rede'), compacto(total), S.excelencia.ciclo, '', 'ranking')+
      kpiD(T('Comprovações validadas'), nf(val), rec? rec+' '+T('recusadas'):T('nenhuma recusada'), 'k-ok','validadas')+
      kpiD(T('Esperando validação'), nf(pend), T('comprovações na fila'), pend?'k-warn':'k-ok','pendentes')+
      kpiD(T('Unidades em faixa'), nf(naFaixa)+'/'+nf(dados.length), T('já alcançaram bonificação'), naFaixa>dados.length/2?'k-ok':'k-warn','faixas')+
    '</div>'+
    '<div class="grid g23" style="margin-bottom:22px">'+
      biCard(T('Ranking de unidades'), 'bpRank', '', 'ranking', T('10 primeiras'))+
      biCard(T('Distribuição por faixa'), 'bpFaixa', '<div id="bpFaixaLeg"></div>', 'faixas')+
    '</div>'+
    '<div class="grid g23">'+
      biCard(T('Critérios mais comprovados'), 'bpCrit', '', 'criterios')+
      '<div class="card"><div class="ch"><h3>'+esc(T('Comprovações recentes'))+'</h3><div class="r"><button class="btn sm" data-drill="provas">'+esc(T('ver todas'))+'</button></div></div>'+
      '<div class="tw" style="max-height:380px;overflow:auto"><table><thead><tr><th>'+esc(T('Unidade'))+'</th><th>'+esc(T('Critério'))+'</th><th class="num">'+esc(T('Pontos'))+'</th><th>'+esc(T('Situação'))+'</th></tr></thead><tbody>'+
      (provas.slice().sort((a,b)=>a.q<b.q?1:-1).slice(0,12).map(p=>'<tr><td style="font-weight:600">'+esc(lojaRede(p.loja).nome)+'</td><td class="mini">'+esc(p.criterioNome)+'</td>'+
        '<td class="num">'+p.pts+'</td><td>'+(p.st==='aprovado'?'<span class="tag ok">'+esc(T('Validada'))+'</span>':p.st==='pendente'?'<span class="tag warn">'+esc(T('Pendente'))+'</span>':'<span class="tag bad">'+esc(T('Recusada'))+'</span>')+'</td></tr>').join('')
        ||'<tr><td colspan="4"><div class="empty">'+esc(T('Nenhuma comprovação no filtro atual.'))+'</div></td></tr>')+
      '</tbody></table></div></div>'+
    '</div>';

  const top=dados.slice(0,10);
  gBarrasH($('#bpRank'), top.map(x=>NOME_UNI(x.l)), top.map(x=>x.d.pontos), {alt:Math.max(140, top.length*30+16), sufixo:T('pontos')});
  gRosca($('#bpFaixa'), porFaixa, {alt:250, centro:nf(naFaixa), rotulo:T('em faixa')});
  $('#bpFaixaLeg').innerHTML=legenda(porFaixa);
  gBarrasH($('#bpCrit'), critTop.map(x=>x[0]), critTop.map(x=>x[1]), {alt:Math.max(120, critTop.length*30+16), sufixo:T('comprovações')});

  biLigaFiltro(v);
  ligaDrill(v, {
    ranking: ()=>biDetalhe(T('Ranking do Programa de Excelência'),'',[T('Unidade'),T('Regional'),T('Pontos'),T('Faixa')],
      dados.map(x=>[esc(x.l.nome), esc(masterRede(x.l.master).nome), nf(x.d.pontos), faixaDe(x.d.pontos).nome]),'ranking-excelencia'),
    validadas: ()=>biDetalhe(T('Comprovações validadas'),'',[T('Unidade'),T('Critério'),T('Pontos'),T('Validador')],
      provas.filter(p=>p.st==='aprovado').map(p=>[esc(lojaRede(p.loja).nome), esc(p.criterioNome), p.pts, esc(p.validador||'')]),'comprovacoes-validadas'),
    pendentes: ()=>biDetalhe(T('Comprovações esperando validação'),'',[T('Unidade'),T('Critério'),T('Pontos'),T('Enviada em')],
      provas.filter(p=>p.st==='pendente').map(p=>[esc(lojaRede(p.loja).nome), esc(p.criterioNome), p.pts, new Date(p.q).toLocaleDateString('pt-BR')]),'comprovacoes-pendentes'),
    faixas: ()=>biDetalhe(T('Unidades por faixa'),'',[T('Unidade'),T('Pontos'),T('Faixa'),T('Prêmio')],
      dados.map(x=>{ const f=faixaDe(x.d.pontos); return [esc(x.l.nome), nf(x.d.pontos), f.nome, esc(f.premio||'')]; }),'unidades-por-faixa'),
    criterios: ()=>biDetalhe(T('Critérios comprovados'),'',[T('Critério'),T('Comprovações')],
      Object.keys(crit).map(k=>[esc(k), crit[k]]).sort((a,b)=>b[1]-a[1]),'criterios-comprovados'),
    provas: ()=>biDetalhe(T('Todas as comprovações'),'',[T('Unidade'),T('Critério'),T('Pontos'),T('Situação'),T('Enviada em')],
      provas.slice().sort((a,b)=>a.q<b.q?1:-1).map(p=>[esc(lojaRede(p.loja).nome), esc(p.criterioNome), p.pts,
        p.st==='aprovado'?T('Validada'):p.st==='pendente'?T('Pendente'):T('Recusada'), new Date(p.q).toLocaleDateString('pt-BR')]),'comprovacoes')
  });
};
</script>
