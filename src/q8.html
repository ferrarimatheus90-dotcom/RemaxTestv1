<script>
/* =======================================================================
   MÓDULO 2 · ESTÚDIO DE PEÇAS  (foto do imóvel + personalização + download)
   ======================================================================= */
const ST={tpl:'t01', tema:'azul', titulo:null, sub:null, nome:null, creci:'', tel:'', unidade:'', foto:'', fotoNome:'', imovel:'', imovelNome:'', marca:false, marcaPos:'centro', marcaOp:'media'};
function usuarioAtualParaPeca(){
  if(souCorretor()) return S.usuarios[euId()];
  const lid=escopoLoja()||'l18';
  return corretoresDe(lid)[0] || Object.values(S.usuarios)[0];
}
/* a foto do imóvel entra inteira na arte: reduz para no máximo 1600 px e fica só nesta sessão */
function lerFotoImovel(arq, pronto){
  if(!arq || !/^image\//.test(arq.type||'')){ toast('Escolha uma imagem em JPG ou PNG.'); return; }
  const fr=new FileReader();
  fr.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const s=Math.min(1, 1600/Math.max(im.width, im.height));
      const c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      pronto(c.toDataURL('image/jpeg',0.86), arq.name+' · '+kb(arq.size));
    };
    im.onerror=()=>toast('Não consegui ler essa imagem.');
    im.src=fr.result;
  };
  fr.readAsDataURL(arq);
}
VIEWS.estudio=function(v,arg){
  const u=usuarioAtualParaPeca(), l=lojaDe(u.loja);
  if(arg && TPLS().some(t=>t.id===arg) && arg!==ST.tpl){ ST.tpl=arg; ST.titulo=null; ST.sub=null; }
  const t=TPLS().find(x=>x.id===ST.tpl)||TPLS()[0];
  if(ST.nome===null){ ST.nome=u.nome; ST.creci=u.creci; ST.tel=u.tel||'(11) 99999-0000'; ST.unidade=l.nome; ST.foto=u.foto||''; }
  if(ST.titulo===null) ST.titulo=t.txt||t.nome;
  if(ST.sub===null) ST.sub=t.sub||'Fale com o seu consultor RE/MAX';
  const minhas=S.pecas.filter(p=>p.uid===u.id);
  const aceitaImovel = t.fmt!=='cartao' && t.fmt!=='email';

  v.innerHTML =
    ph('Estúdio de Arte', T('Suba a foto do imóvel, escolha o modelo e baixe pronto — PNG para publicar, PDF para a gráfica. Logotipo, cores e proporções ficam travados no padrão da marca.'),
      '<a class="btn" href="#/biblioteca">Ver biblioteca</a>','estudio')+
    '<div class="studio">'+
      '<div class="card pad st-form">'+
        (aceitaImovel?
          '<div class="sec">'+esc(T('Foto do imóvel'))+'</div>'+
          '<label class="foto-im'+(ST.imovel?' tem':'')+'" id="fImZona">'+
            (ST.imovel?'<img src="'+ST.imovel+'" alt="">':'<span class="mais">+</span>')+
            '<span class="fi-tx"><b>'+esc(T(ST.imovel?'Trocar a foto':'Adicionar a foto do imóvel'))+'</b>'+
            '<span>'+esc(ST.imovel? ST.imovelNome : T('Arraste aqui ou clique para escolher. Ela entra no lugar do fundo.'))+'</span></span>'+
            '<input type="file" accept="image/*" id="fImArq" hidden>'+
          '</label>'+
          (ST.imovel?'<button class="btn sm" id="fImTirar" style="margin-top:10px">'+esc(T('Remover foto'))+'</button>':'')+
          (t.fmt==='foto'
            ? '<div class="mini" style="margin-top:12px"><b>'+esc(T("Neste modelo a marca d'água é sempre aplicada."))+'</b> '+esc(T('A foto sai no tamanho original, pronta para portais e WhatsApp.'))+'</div>'
            : '<label style="display:flex;gap:9px;align-items:center;margin-top:14px;font-size:13.6px;font-weight:500;cursor:pointer">'+
              '<input type="checkbox" id="fMarca" style="width:auto"'+(ST.marca?' checked':'')+(ST.imovel?'':' disabled')+'> '+esc(T("Aplicar marca d'água na foto"))+'</label>'+
              (ST.imovel?'':'<div class="mini" style="margin-top:4px">'+esc(T("Adicione a foto do imóvel para usar a marca d'água."))+'</div>'))+
          ((t.fmt==='foto' || (ST.marca && ST.imovel))?
            '<div class="grid g2" style="gap:10px;margin-top:10px"><div class="field" style="margin:0"><label>'+esc(T('Posição'))+'</label><div class="chips" id="fMPos">'+
              [['centro','Centro'],['canto','Canto']].map(x=>'<button class="chip '+(ST.marcaPos===x[0]?'on':'')+'" data-p="'+x[0]+'">'+esc(T(x[1]))+'</button>').join('')+'</div></div>'+
            '<div class="field" style="margin:0"><label>'+esc(T('Intensidade'))+'</label><div class="chips" id="fMOp">'+
              [['suave','Suave'],['media','Média'],['forte','Forte']].map(x=>'<button class="chip '+(ST.marcaOp===x[0]?'on':'')+'" data-o="'+x[0]+'">'+esc(T(x[1]))+'</button>').join('')+'</div></div></div>' : '')+
          '<div class="divider"></div>' : '')+
        '<div class="sec">'+esc(T('Peça'))+'</div>'+
        '<div class="field"><label>Modelo</label><select id="fTpl">'+TPLS().map(x=>'<option value="'+x.id+'"'+(x.id===t.id?' selected':'')+'>'+esc(x.nome)+' · '+esc(x.dim)+'</option>').join('')+'</select></div>'+
        '<div class="field"><label>Variação de cor</label><div class="chips" id="fTema">'+
          [['azul','Azul'],['claro','Claro'],['vermelho','Vermelho']].map(x=>'<button class="chip '+(ST.tema===x[0]?'on':'')+'" data-t="'+x[0]+'">'+x[1]+'</button>').join('')+'</div></div>'+
        '<div class="field"><label>Título</label><input id="fTit" value="'+esc(ST.titulo)+'" maxlength="42"></div>'+
        '<div class="field"><label>Linha de apoio</label><input id="fSub" value="'+esc(ST.sub)+'" maxlength="90"></div>'+
        '<div class="divider"></div>'+
        '<div class="sec">'+esc(T('Seus dados'))+'</div>'+
        '<div class="field"><label>Nome</label><input id="fNome" value="'+esc(ST.nome)+'"></div>'+
        '<div class="grid g2" style="gap:10px"><div class="field"><label>CRECI</label><input id="fCreci" value="'+esc(ST.creci)+'"></div>'+
        '<div class="field"><label>Telefone</label><input id="fTel" value="'+esc(ST.tel)+'"></div></div>'+
        '<div class="field"><label>Unidade</label><input id="fUni" value="'+esc(ST.unidade)+'"></div>'+
        '<div class="field"><label>'+esc(T('Sua foto'))+'</label><div style="display:flex;gap:8px"><button class="btn" id="fFoto" style="flex:1">'+(ST.foto?'Trocar foto':'Enviar do computador')+'</button>'+(ST.foto?'<button class="btn" id="fSemFoto">Sem foto</button>':'')+'</div>'+
          (ST.fotoNome?'<div class="mini" style="margin-top:5px">'+esc(ST.fotoNome)+'</div>':'')+'</div>'+
        '<div class="hint" style="margin-top:4px">Os dados vêm do seu cadastro e podem ser ajustados aqui. O arquivo sai no tamanho certo: '+esc(t.dim)+'.</div>'+
      '</div>'+
      '<div class="st-prev">'+
        '<div class="canvasWrap"><canvas class="prev" id="cvPeca" style="max-height:540px"></canvas></div>'+
        '<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">'+
          '<button class="btn pri" id="dPng">↓ Baixar PNG</button>'+
          '<button class="btn" id="dPdf">↓ PDF para impressão</button>'+
          '<button class="btn" id="dSave">Salvar nas minhas peças</button>'+
          (souCorretor()?'<button class="btn" id="dPub">Publicar / agendar</button>':'')+
        '</div>'+
        (minhas.length?'<div class="card" style="margin-top:16px"><div class="ch"><h3>Minhas peças</h3><div class="r"><span class="mini">'+minhas.length+' salvas</span></div></div>'+
          '<div class="cb"><div class="pecas" id="mp">'+minhas.map(p=>'<div class="pc"><img src="'+p.thumb+'" alt=""><div class="l"><b>'+esc(p.tplNome)+'</b>'+quando(p.criado)+
          '<div style="display:flex;gap:5px;margin-top:5px"><button class="btn sm" data-rep="'+p.id+'">Reabrir</button><button class="btn sm" data-del="'+p.id+'">×</button></div></div></div>').join('')+'</div></div></div>':'')+
      '</div>'+
    '</div>';

  const dados=()=>({fmt:t.fmt, tema:ST.tema, titulo:ST.titulo, sub:ST.sub, nome:ST.nome, creci:ST.creci, tel:ST.tel, unidade:ST.unidade, foto:ST.foto, imovel:aceitaImovel?ST.imovel:'', marca:t.fmt==='foto'||(!!ST.marca&&!!ST.imovel), marcaPos:ST.marcaPos, marcaOp:ST.marcaOp});
  let cvAtual=null, vez=0;
  function pinta(){
    const esta=++vez;
    montarPeca(dados()).then(cv=>{
      if(esta!==vez) return;                    // digitação rápida: só a última versão chega na tela
      cvAtual=cv; const alvo=$('#cvPeca'); if(!alvo) return;
      alvo.width=cv.width; alvo.height=cv.height; alvo.getContext('2d').drawImage(cv,0,0);
    });
  }
  pinta();
  const liga=(sel,campo)=>{ const el=$(sel); el&&el.addEventListener('input',e=>{ST[campo]=e.target.value;pinta();}); };
  liga('#fTit','titulo'); liga('#fSub','sub'); liga('#fNome','nome'); liga('#fCreci','creci'); liga('#fTel','tel'); liga('#fUni','unidade');
  $('#fTpl').addEventListener('change',e=>{ ST.titulo=null; ST.sub=null; location.hash='#/estudio/'+e.target.value; });
  $$('#fTema .chip').forEach(b=>b.addEventListener('click',()=>{ST.tema=b.dataset.t;$$('#fTema .chip').forEach(x=>x.classList.toggle('on',x===b));pinta();}));

  // foto do imóvel: clique ou arraste
  const zona=$('#fImZona');
  if(zona){
    const aplica=(url,nome)=>{ ST.imovel=url; ST.imovelNome=nome; route(); toast('<b>Foto aplicada.</b> Ela entrou no lugar do fundo da peça.',1); };
    $('#fImArq').addEventListener('change',e=>{ const f=e.target.files&&e.target.files[0]; if(f) lerFotoImovel(f,aplica); });
    zona.addEventListener('dragover',e=>{ e.preventDefault(); zona.classList.add('arrasta'); });
    zona.addEventListener('dragleave',()=>zona.classList.remove('arrasta'));
    zona.addEventListener('drop',e=>{ e.preventDefault(); zona.classList.remove('arrasta');
      const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) lerFotoImovel(f,aplica); });
  }
  $('#fImTirar')&&$('#fImTirar').addEventListener('click',()=>{ ST.imovel=''; ST.imovelNome=''; route(); });
  $('#fMarca')&&$('#fMarca').addEventListener('change',e=>{ ST.marca=e.target.checked; route(); });
  $$('#fMPos .chip').forEach(b=>b.addEventListener('click',()=>{ ST.marcaPos=b.dataset.p; $$('#fMPos .chip').forEach(x=>x.classList.toggle('on',x===b)); pinta(); }));
  $$('#fMOp .chip').forEach(b=>b.addEventListener('click',()=>{ ST.marcaOp=b.dataset.o; $$('#fMOp .chip').forEach(x=>x.classList.toggle('on',x===b)); pinta(); }));

  $('#fFoto').addEventListener('click',()=>pedirArquivos('image/*',false,as=>{
    const a=as[0]; if(!a||!a.thumb) return toast('Não consegui ler essa imagem.');
    ST.foto=a.thumb; ST.fotoNome=a.nome+' · '+kb(a.tam); route();
  }));
  $('#fSemFoto')&&$('#fSemFoto').addEventListener('click',()=>{ ST.foto=''; ST.fotoNome=''; route(); });

  $('#dPng').addEventListener('click',()=>{
    if(!cvAtual) return;
    canvasBlob(cvAtual,'image/png').then(b=>{
      baixarBlob(b, 'remax-'+t.id+'-'+(ST.nome||'peca').toLowerCase().replace(/\s+/g,'-').slice(0,24)+'.png');
      commit('Gerou peça (PNG)', t.nome+(dados().marca?" · com marca d'água":''));
      toast('<b>'+t.dim+'</b> gerado e baixado.',1);
    });
  });
  $('#dPdf').addEventListener('click',()=>{
    if(!cvAtual) return;
    const mm = t.fmt==='cartao'? [90,50] : t.fmt==='a4'? [210,297] : null;
    pecaPDF(cvAtual,'remax-'+t.id+'.pdf', mm).then(()=>{ commit('Gerou peça (PDF)', t.nome); toast('PDF gerado'+(mm?' em '+mm[0]+'×'+mm[1]+' mm':'')+'.',1); });
  });
  $('#dSave').addEventListener('click',()=>{
    if(!cvAtual) return;
    const mini=document.createElement('canvas'); mini.width=300; mini.height=Math.round(300*cvAtual.height/cvAtual.width);
    mini.getContext('2d').drawImage(cvAtual,0,0,mini.width,mini.height);
    const thumb=mini.toDataURL('image/jpeg',0.72);
    commit('Salvou peça', t.nome, s=>{ s.pecas.unshift({id:uid('p'), uid:u.id, tpl:t.id, tplNome:t.nome, thumb, criado:agora(),
      dados:{titulo:ST.titulo, sub:ST.sub, tema:ST.tema}}); });
    toast('Peça salva. Ela conta pontos para você e para a unidade.',1); route();
  });
  $('#dPub')&&$('#dPub').addEventListener('click',()=>{
    if(!cvAtual) return;
    const amanha=new Date(Date.now()+86400000), d0=amanha.toISOString().slice(0,10);
    const ov=modal('Agendar esta peça',
      '<div class="grid g2" style="gap:12px"><div class="field"><label>Data</label><input type="date" id="agD" value="'+d0+'"></div><div class="field"><label>Hora</label><input type="time" id="agH" value="10:00"></div></div>'+
      '<div class="field"><label>Formato</label><select id="agF"><option>Feed</option><option>Story</option><option>Feed + Story</option></select></div>'+
      '<div class="field"><label>Legenda</label><textarea id="agL" rows="3">'+esc((ST.titulo||'')+' — '+(ST.sub||'')+' · Fale comigo: '+(ST.tel||''))+'</textarea></div>'+
      '<div class="hint">A peça sai pela integração de publicação direto no seu Instagram, na data marcada. '+(S.usuarios[u.id]&&S.usuarios[u.id].ig?'':'<b>Sua conta ainda não está conectada</b> — conecte em Social Hub · Redes sociais.')+'</div>',
      '<button class="btn" onclick="fechaModal()">Cancelar</button><button class="btn pri" id="agOk">Agendar</button>');
    $('#agOk',ov).addEventListener('click',()=>{
      const mini=document.createElement('canvas'); mini.width=300; mini.height=Math.round(300*cvAtual.height/cvAtual.width);
      mini.getContext('2d').drawImage(cvAtual,0,0,mini.width,mini.height);
      const quandoAg=$('#agD',ov).value+'T'+$('#agH',ov).value;
      commit('Agendou peça do Estúdio', t.nome+' · '+new Date(quandoAg).toLocaleString('pt-BR'), s=>{ s.social.fila=(s.social.fila||[]).concat([{id:uid('f'), uid:u.id, tpl:t.id, tplNome:t.nome,
        thumb:mini.toDataURL('image/jpeg',0.7), leg:$('#agL',ov).value.trim(), fmt:$('#agF',ov).value, quando:quandoAg, st:'agendada'}]); }, 'Integração de publicação');
      fechaModal(); toast('<b>Agendada.</b> Aparece na fila de publicação do Social Hub.',1);
    });
  });
  $$('[data-rep]',v).forEach(b=>b.addEventListener('click',()=>{
    const p=S.pecas.find(x=>x.id===b.dataset.rep);
    ST.tema=p.dados.tema; ST.titulo=p.dados.titulo; ST.sub=p.dados.sub; location.hash='#/estudio/'+p.tpl; route();
  }));
  $$('[data-del]',v).forEach(b=>b.addEventListener('click',()=>{
    commit('Removeu peça','', s=>{ s.pecas=s.pecas.filter(x=>x.id!==b.dataset.del); }); route();
  }));
};
</script>
