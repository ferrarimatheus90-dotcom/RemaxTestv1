  $$('#cats .chip').forEach(b=>b.addEventListener('click',()=>{CAT_ATUAL=b.dataset.c;$$('#cats .chip').forEach(x=>x.classList.toggle('on',x===b));pinta();}));
  $('#novoT')&&$('#novoT').addEventListener('click',()=>{
    const ov=modal('Publicar novo modelo',
      '<div class="field"><label>Nome do modelo</label><input id="mN" placeholder="Ex.: Convite para feirão"></div>'+
      '<div class="grid g2" style="gap:12px"><div class="field"><label>Categoria</label><select id="mC">'+CATS.filter(c=>c!=='Todos').map(c=>'<option>'+c+'</option>').join('')+'</select></div>'+
      '<div class="field"><label>Formato</label><select id="mF"><option value="feed">Feed 1080×1080</option><option value="story">Story 1080×1920</option><option value="cartao">Cartão 90×50 mm</option><option value="placa">Placa 80×60 cm</option><option value="slide">16:9</option></select></div></div>'+
      '<div class="field"><label>Título da arte</label><input id="mT" placeholder="Texto grande da peça"></div>'+
      '<div class="field"><label>Linha de apoio</label><input id="mS" placeholder="Texto menor"></div>'+
      '<div class="hint">O modelo entra na biblioteca de toda a rede e já abre no Estúdio com os dados de quem for usar.</div>',
      '<button class="btn" onclick="fechaModal()">Cancelar</button><button class="btn pri" id="mOk">Publicar modelo</button>');
    $('#mOk',ov).addEventListener('click',()=>{
      const nome=$('#mN',ov).value.trim(); if(!nome) return toast('Dê um nome ao modelo.');
      const fmt=$('#mF',ov).value;
      const dims={feed:'1080 × 1080',story:'1080 × 1920',cartao:'90 × 50 mm · 300 dpi',placa:'80 × 60 cm',slide:'16:9'};
      commit('Publicou modelo na biblioteca', nome, s=>{
        s.templatesExtra=(s.templatesExtra||[]).concat([{id:uid('t'), nome, cat:$('#mC',ov).value, fmt, dim:dims[fmt],
          tag:'Novo', txt:($('#mT',ov).value.trim()||nome).toUpperCase(), sub:$('#mS',ov).value.trim()}]);
      });
      fechaModal(); route(); toast('<b>Modelo publicado.</b> Já aparece para toda a rede.',1);
    });
  });
};
</script>
<script>
/* =======================================================================
   MÓDULO 2 · ESTÚDIO DE PEÇAS  (personalização + geração + download)
   ======================================================================= */
const ST={tpl:'t01', tema:'azul', titulo:null, sub:null, nome:null, creci:'', tel:'', unidade:'', foto:'', fotoNome:''};
function usuarioAtualParaPeca(){
  if(souCorretor()) return S.usuarios[euId()];
  const lid=escopoLoja()||'l18';
  return corretoresDe(lid)[0] || Object.values(S.usuarios)[0];
}
VIEWS.estudio=function(v,arg){
  const u=usuarioAtualParaPeca(), l=lojaDe(u.loja);
  if(arg && TPLS().some(t=>t.id===arg) && arg!==ST.tpl){ ST.tpl=arg; ST.titulo=null; ST.sub=null; }
  const t=TPLS().find(x=>x.id===ST.tpl)||TPLS()[0];
  if(ST.nome===null){ ST.nome=u.nome; ST.creci=u.creci; ST.tel=u.tel||'(11) 99999-0000'; ST.unidade=l.nome; ST.foto=u.foto||''; }
  if(ST.titulo===null) ST.titulo=t.txt||t.nome;
  if(ST.sub===null) ST.sub=t.sub||'Fale com o seu consultor RE/MAX';
  const minhas=S.pecas.filter(p=>p.uid===u.id);

  v.innerHTML =
    ph('Estúdio de peças','Escolha o modelo, preencha os seus dados e baixe pronto — PNG para publicar, PDF para a gráfica. Sem Canva, sem Photoshop, e sem sair do padrão da marca: logotipo, cores e proporções são travados pelo modelo.',
      '<a class="btn" href="#/biblioteca">Ver biblioteca</a>','estudio')+
    '<div class="studio">'+
      '<div class="card pad">'+
        '<div class="field"><label>Modelo</label><select id="fTpl">'+TPLS().map(x=>'<option value="'+x.id+'"'+(x.id===t.id?' selected':'')+'>'+esc(x.nome)+' · '+esc(x.dim)+'</option>').join('')+'</select></div>'+
        '<div class="field"><label>Variação de cor</label><div class="chips" id="fTema">'+
          [['azul','Azul'],['claro','Claro'],['vermelho','Vermelho']].map(x=>'<button class="chip '+(ST.tema===x[0]?'on':'')+'" data-t="'+x[0]+'">'+x[1]+'</button>').join('')+'</div></div>'+
        '<div class="divider"></div>'+
        '<div class="field"><label>Título</label><input id="fTit" value="'+esc(ST.titulo)+'" maxlength="42"></div>'+
        '<div class="field"><label>Linha de apoio</label><input id="fSub" value="'+esc(ST.sub)+'" maxlength="90"></div>'+
        '<div class="divider"></div>'+
        '<div class="field"><label>Nome</label><input id="fNome" value="'+esc(ST.nome)+'"></div>'+
        '<div class="grid g2" style="gap:10px"><div class="field"><label>CRECI</label><input id="fCreci" value="'+esc(ST.creci)+'"></div>'+
        '<div class="field"><label>Telefone</label><input id="fTel" value="'+esc(ST.tel)+'"></div></div>'+
        '<div class="field"><label>Unidade</label><input id="fUni" value="'+esc(ST.unidade)+'"></div>'+
        '<div class="field"><label>Foto</label><div style="display:flex;gap:8px"><button class="btn" id="fFoto" style="flex:1">'+(ST.foto?'Trocar foto':'Enviar do computador')+'</button>'+(ST.foto?'<button class="btn" id="fSemFoto">Sem foto</button>':'')+'</div>'+
          (ST.fotoNome?'<div class="mini" style="margin-top:5px">'+esc(ST.fotoNome)+'</div>':'')+'</div>'+
        '<div class="hint" style="margin-top:4px">Os dados vêm do seu cadastro e podem ser ajustados aqui. O arquivo sai no tamanho certo: '+esc(t.dim)+'.</div>'+
      '</div>'+
      '<div>'+
        '<div class="canvasWrap"><canvas class="prev" id="cvPeca" style="max-height:440px;width:auto"></canvas></div>'+
        '<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">'+
          '<button class="btn pri" id="dPng">↓ Baixar PNG</button>'+
          '<button class="btn" id="dPdf">↓ PDF para impressão</button>'+
          '<button class="btn" id="dSave">Salvar nas minhas peças</button>'+
          (souCorretor()?'<button class="btn" id="dPub">Publicar / agendar</button>':'')+
        '</div>'+
        (minhas.length?'<div class="card" style="margin-top:16px"><div class="ch"><h3>Minhas peças</h3><div class="r"><span class="mini">'+minhas.length+' salvas</span></div></div>'+
          '<div class="cb"><div class="pecas" id="mp">'+minhas.map(p=>'<div class="pc"><img src="'+p.thumb+'" alt=""><div class="l"><b>'+esc(p.tplNome)+'</b>'+quando(p.criado)+
          '<div style="display:flex;gap:5px;margin-top:5px"><button class="btn sm" data-rep="'+p.id+'">Reabrir</button><button class="btn sm" data-del="'+p.id+'">×</button></div></div></div>').join('')+'</div></div></div>':'')+
      '</div>'+
    '</div>';

  const dados=()=>({fmt:t.fmt, tema:ST.tema, titulo:ST.titulo, sub:ST.sub, nome:ST.nome, creci:ST.creci, tel:ST.tel, unidade:ST.unidade, foto:ST.foto});
  let cvAtual=null;
  function pinta(){
    montarPeca(dados()).then(cv=>{
      cvAtual=cv; const alvo=$('#cvPeca'); if(!alvo) return;
      alvo.width=cv.width; alvo.height=cv.height; alvo.getContext('2d').drawImage(cv,0,0);
    });
  }
  pinta();
  const liga=(sel,campo)=>{ const el=$(sel); el&&el.addEventListener('input',e=>{ST[campo]=e.target.value;pinta();}); };
  liga('#fTit','titulo'); liga('#fSub','sub'); liga('#fNome','nome'); liga('#fCreci','creci'); liga('#fTel','tel'); liga('#fUni','unidade');
  $('#fTpl').addEventListener('change',e=>{ ST.titulo=null; ST.sub=null; location.hash='#/estudio/'+e.target.value; });
  $$('#fTema .chip').forEach(b=>b.addEventListener('click',()=>{ST.tema=b.dataset.t;$$('#fTema .chip').forEach(x=>x.classList.toggle('on',x===b));pinta();}));
  $('#fFoto').addEventListener('click',()=>pedirArquivos('image/*',false,as=>{
    const a=as[0]; if(!a||!a.thumb) return toast('Não consegui ler essa imagem.');
    ST.foto=a.thumb; ST.fotoNome=a.nome+' · '+kb(a.tam); route();
  }));
  $('#fSemFoto')&&$('#fSemFoto').addEventListener('click',()=>{ ST.foto=''; ST.fotoNome=''; route(); });

  $('#dPng').addEventListener('click',()=>{
    if(!cvAtual) return;
    canvasBlob(cvAtual,'image/png').then(b=>{
      baixarBlob(b, 'remax-'+t.id+'-'+(ST.nome||'peca').toLowerCase().replace(/\s+/g,'-').slice(0,24)+'.png');
      commit('Gerou peça (PNG)', t.nome);
      toast('<b>'+t.dim+'</b> gerado e baixado.',1);
    });
  });
  $('#dPdf').addEventListener('click',()=>{
    if(!cvAtual) return;
    const mm = t.fmt==='cartao'? [90,50] : t.fmt==='a4'? [210,297] : null;
    pecaPDF(cvAtual,'remax-'+t.id+'.pdf', mm).then(()=>{ commit('Gerou peça (PDF)', t.nome); toast('PDF gerado'+(mm?' em '+mm[0]+'×'+mm[1]+' mm':'')+'.',1); });
  });
  $('#dSave').addEventListener('click',()=>{
    if(!cvAtual) return;
    const mini=document.createElement('canvas'); mini.width=300; mini.height=Math.round(300*cvAtual.height/cvAtual.width);
    mini.getContext('2d').drawImage(cvAtual,0,0,mini.width,mini.height);
    const thumb=mini.toDataURL('image/jpeg',0.72);
    commit('Salvou peça', t.nome, s=>{ s.pecas.unshift({id:uid('p'), uid:u.id, tpl:t.id, tplNome:t.nome, thumb, criado:agora(),
      dados:{titulo:ST.titulo, sub:ST.sub, tema:ST.tema}}); });
    toast('Peça salva. Ela conta pontos para você e para a unidade.',1); route();
  });
  $('#dPub')&&$('#dPub').addEventListener('click',()=>{ location.hash='#/redes'; setTimeout(()=>toast('Peça enviada para a fila de publicação.',1),250); });
  $$('[data-rep]',v).forEach(b=>b.addEventListener('click',()=>{
    const p=S.pecas.find(x=>x.id===b.dataset.rep);
    ST.tema=p.dados.tema; ST.titulo=p.dados.titulo; ST.sub=p.dados.sub; location.hash='#/estudio/'+p.tpl; route();
  }));
  $$('[data-del]',v).forEach(b=>b.addEventListener('click',()=>{
    commit('Removeu peça','', s=>{ s.pecas=s.pecas.filter(x=>x.id!==b.dataset.del); }); route();
  }));
};
</script>
<script>
/* =======================================================================
   MÓDULO 2 · PRONTOS EM REDE (comunicação sincronizada)
   ======================================================================= */
function usuariosVisiveis(){
  const ls=lojasVisiveis();
  return Object.values(S.usuarios).filter(u=>u.nivel==='associado' && ls.some(l=>l.id===u.loja));
}
const adesaoCampanha = c => {
  const us=usuariosVisiveis(); if(!us.length) return 0;
  return Math.round(us.filter(u=>c.ag&&c.ag[u.id]).length/us.length*100);
};
VIEWS.prontos=function(v){
  const us=usuariosVisiveis(), con=us.filter(u=>u.ig).length;
  const camp=S.campanhas.find(c=>c.st==='agendada')||S.campanhas[0];
  const souBrasil=ROLE==='brasil', euAg=camp.ag&&camp.ag[euId()];
  v.innerHTML =
    ph('Prontos em Rede','O programa nacional de comunicação sincronizada: a RE/MAX Brasil publica arte e legenda, a rede inteira posta no mesmo dia e na mesma hora — em um clique, sem repassar arquivo por WhatsApp.',
      souBrasil?'<button class="btn pri" id="novaC">+ Nova campanha</button>':(souCorretor()&&!euAg?'<button class="btn pri" id="agEu">Agendar na minha conta</button>':''),'prontos')+
    '<div class="grid g4" style="margin-bottom:16px">'+
      kpi('Próxima publicação', new Date(camp.dt).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}), esc(camp.tit.split('—')[0].trim())+' · '+new Date(camp.dt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}))+
      kpi('Contas conectadas', con+'/'+us.length, pct(con/Math.max(1,us.length)*100)+' dos associados', con/Math.max(1,us.length)>.6?'k-ok':'k-warn')+
      kpi('Adesão da campanha', pct(adesaoCampanha(camp)), 'já agendaram a publicação', adesaoCampanha(camp)>60?'k-ok':'k-warn')+
      kpi('Campanhas no ano', S.campanhas.length, S.campanhas.filter(c=>c.st==='publicada').length+' publicadas')+
    '</div>'+
    '<div class="grid g23" style="margin-bottom:16px">'+
      '<div class="card"><div class="ch"><h3>Campanha em preparação</h3><div class="r">'+(euAg?'<span class="tag ok">Você já agendou</span>':'<span class="tag red">Faltam '+dias(new Date(camp.dt))+' dias</span>')+'</div></div>'+
      '<div class="cb" style="display:grid;grid-template-columns:190px 1fr;gap:18px;align-items:start">'+
        '<canvas class="prev" id="cvC"></canvas>'+
        '<div><div style="font-family:var(--font-d);font-weight:800;font-size:17px">'+esc(camp.tit)+'</div>'+
        '<div class="mini" style="margin:5px 0 12px">'+new Date(camp.dt).toLocaleString('pt-BR')+' · '+esc(camp.peca)+' · toda a rede</div>'+
        '<div style="background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:12.9px;line-height:1.55">'+esc(camp.leg)+'</div>'+
        '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">'+
          (souBrasil?'<button class="btn pri" id="disparar">Programar para '+lojasVisiveis().length+' unidades</button>':
           euAg?'<button class="btn" id="desag">Cancelar meu agendamento</button>':'<button class="btn pri" id="agEu2">Agendar na minha conta</button>')+
          '<button class="btn" id="cpLeg">Copiar legenda</button>'+
          '<a class="btn" href="#/estudio/'+(camp.tpl||'t01')+'">Personalizar</a>'+
          '<button class="btn" id="dlArte">↓ Baixar arte</button></div>'+
        '</div></div></div>'+
      '<div class="card"><div class="ch"><h3>Calendário da rede</h3><div class="r"><span class="mini">setembro/2026</span></div></div><div class="cb" id="cal"></div></div>'+
    '</div>'+
    '<div class="card"><div class="ch"><h3>Campanhas</h3><div class="r"><span class="mini">adesão medida sobre '+us.length+' associados do seu escopo</span></div></div>'+
      '<div class="tw"><table><thead><tr><th>Campanha</th><th>Data</th><th>Peça</th><th>Situação</th><th>Adesão</th><th></th></tr></thead><tbody>'+
      S.campanhas.map(c=>{ const ad=adesaoCampanha(c);
        return '<tr><td style="font-weight:600">'+esc(c.tit)+'</td><td class="num">'+new Date(c.dt).toLocaleDateString('pt-BR')+'</td><td>'+esc(c.peca)+'</td>'+
        '<td>'+(c.st==='publicada'?'<span class="tag ok">Publicada</span>':c.st==='agendada'?'<span class="tag">Agendada</span>':'<span class="tag mut">Planejada</span>')+'</td>'+
        '<td style="min-width:130px">'+barra(ad)+'<span class="mini num">'+ad+'% · '+Object.keys(c.ag||{}).length+' contas</span></td>'+
        '<td>'+(souCorretor()? (c.ag&&c.ag[euId()]?'<span class="tag ok">Agendada</span>':'<button class="btn sm" data-ag="'+c.id+'">Agendar</button>')
                            : '<button class="btn sm" data-ver="'+c.id+'">Ver adesão</button>')+'</td></tr>';
      }).join('')+'</tbody></table></div></div>';

  montarPeca({fmt:'feed', tema:'azul', titulo:camp.tit.split('—')[0].trim(), sub:camp.peca+' · publicação sincronizada',
    nome:eu().nome, creci:'', tel:'', unidade:'RE/MAX Brasil', foto:eu().foto}).then(cv=>{
      const a=$('#cvC'); if(!a) return; a.width=cv.width; a.height=cv.height; a.getContext('2d').drawImage(cv,0,0);
      $('#dlArte')&&$('#dlArte').addEventListener('click',()=>canvasBlob(cv,'image/png').then(b=>{baixarBlob(b,'campanha-'+camp.id+'.png');toast('Arte baixada.',1);})); });

  const prim=new Date(2026,8,1).getDay();
  let cal=['D','S','T','Q','Q','S','S'].map(d=>'<div class="dh">'+d+'</div>').join('');
  for(let i=0;i<prim;i++) cal+='<div class="dy off"></div>';
  for(let d=1;d<=30;d++){
    let ev='';
    S.campanhas.forEach(c=>{ const cd=new Date(c.dt); if(cd.getMonth()===8&&cd.getDate()===d)
      ev+='<div class="ev '+(c.st==='publicada'?'ok':'red')+'">'+cd.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+' · '+esc(c.tit.split('—')[0].trim().slice(0,16))+'</div>'; });
    S.comunicados.forEach(k=>{ const kd=dt(k.dt); if(kd.getMonth()===8&&kd.getDate()===d&&k.obr) ev+='<div class="ev">Comunicado</div>'; });
    cal+='<div class="dy'+(d===9?' today':'')+'"><div class="n">'+d+'</div>'+ev+'</div>';
  }
  $('#cal').innerHTML='<div class="cal">'+cal+'</div>';

  const agendar=cid=>{ commit('Agendou campanha', S.campanhas.find(c=>c.id===cid).tit, s=>{ const c=s.campanhas.find(x=>x.id===cid); c.ag=c.ag||{}; c.ag[euId()]=c.dt; });
    toast('<b>Agendado.</b> Sua conta publica junto com a rede.',1); route(); };
  $('#agEu')&&$('#agEu').addEventListener('click',()=>agendar(camp.id));
  $('#agEu2')&&$('#agEu2').addEventListener('click',()=>agendar(camp.id));
  $$('[data-ag]',v).forEach(b=>b.addEventListener('click',()=>agendar(b.dataset.ag)));
  $('#desag')&&$('#desag').addEventListener('click',()=>{ commit('Cancelou agendamento',camp.tit,s=>{delete s.campanhas.find(x=>x.id===camp.id).ag[euId()];}); route(); toast('Agendamento cancelado.'); });
  $('#cpLeg').addEventListener('click',()=>{ try{navigator.clipboard.writeText(camp.leg);}catch(e){} toast('Legenda copiada.',1); });
  $$('[data-ver]',v).forEach(b=>b.addEventListener('click',()=>{
    const c=S.campanhas.find(x=>x.id===b.dataset.ver);
    modal('Adesão · '+esc(c.tit),
      '<div class="tw" style="max-height:52vh;overflow:auto"><table><thead><tr><th>Unidade</th><th>Agendaram</th><th>Adesão</th></tr></thead><tbody>'+
      lojasVisiveis().map(l=>{ const cs=corretoresDe(l.id), n=cs.filter(u=>c.ag&&c.ag[u.id]).length;
        return '<tr><td>'+esc(l.nome)+'</td><td class="num">'+n+'/'+cs.length+'</td><td style="min-width:120px">'+barra(Math.round(n/Math.max(1,cs.length)*100))+'</td></tr>'; }).join('')+
      '</tbody></table></div>','<button class="btn pri" onclick="fechaModal()">Fechar</button>');
  }));
  $('#disparar')&&$('#disparar').addEventListener('click',()=>disparoEmMassa(camp.id));
  $('#novaC')&&$('#novaC').addEventListener('click',()=>{
    const ov=modal('Nova campanha',
      '<div class="field"><label>Título</label><input id="nT" placeholder="Ex.: Outubro — semana do imóvel pronto"></div>'+
      '<div class="grid g2" style="gap:12px"><div class="field"><label>Data</label><input type="date" id="nD" value="2026-10-06"></div>'+
      '<div class="field"><label>Hora</label><input type="time" id="nH" value="10:00"></div></div>'+
      '<div class="field"><label>Formato</label><select id="nP"><option>Feed</option><option>Feed + Story</option><option>Story</option><option>Carrossel</option></select></div>'+
      '<div class="field"><label>Legenda oficial</label><textarea id="nL" rows="3" placeholder="Texto que a rede publica…"></textarea></div>'+
      '<div class="field"><label>Modelo de arte</label><select id="nM">'+TPLS().filter(t=>t.cat==='Redes sociais').map(t=>'<option value="'+t.id+'">'+esc(t.nome)+'</option>').join('')+'</select></div>',
      '<button class="btn" onclick="fechaModal()">Cancelar</button><button class="btn pri" id="nOk">Criar campanha</button>');
    $('#nOk',ov).addEventListener('click',()=>{
      const tit=$('#nT',ov).value.trim()||'Nova campanha da rede';
      commit('Criou campanha', tit, s=>{ s.campanhas.unshift({id:uid('c'), tit, dt:$('#nD',ov).value+'T'+$('#nH',ov).value,
        st:'planejada', peca:$('#nP',ov).value, tpl:$('#nM',ov).value, leg:$('#nL',ov).value.trim()||'#RemaxBrasil #ProntosEmRede', ag:{}}); });
      fechaModal(); route(); toast('Campanha criada e visível para a rede.',1);
    });
  });
};

/* disparo em massa — usado em Prontos em Rede e em Redes sociais */
function disparoEmMassa(campId){
  const camp=S.campanhas.find(c=>c.id===campId)||S.campanhas[0];
  const prov=PROVEDORES.find(p=>p.id===S.social.provedor);
  const ov=modal('Publicação em massa',
    '<div class="field"><label>Campanha</label><select id="pC">'+S.campanhas.map(c=>'<option value="'+c.id+'"'+(c.id===camp.id?' selected':'')+'>'+esc(c.tit)+'</option>').join('')+'</select></div>'+
    '<div class="field"><label>Público</label><select id="pPub"><option value="todas">Todas as unidades ('+BASE.lojas.length+')</option>'+
      BASE.masters.map(m=>'<option value="'+m.id+'">Somente '+esc(m.nome)+'</option>').join('')+
      BASE.lojas.map(l=>'<option value="L'+l.id+'">Somente '+esc(l.nome)+'</option>').join('')+'</select></div>'+
    '<div class="grid g2" style="gap:12px"><div class="field"><label>Data</label><input type="date" id="pD" value="'+camp.dt.slice(0,10)+'"></div>'+
    '<div class="field"><label>Hora</label><input type="time" id="pH" value="'+camp.dt.slice(11,16)+'"></div></div>'+
    '<div class="field"><label>Canais</label><div class="chips" id="pCan"><button class="chip on">Instagram feed</button><button class="chip on">Story</button><button class="chip">Facebook</button></div></div>'+
    '<div class="hint">Envio pelo provedor <b>'+esc(prov?prov.nome:'não definido')+'</b>. Só entram na fila as contas conectadas; as demais recebem arte e legenda com aviso de publicação manual e vão para a esteira de ativação do CS.</div>',
    '<button class="btn" onclick="fechaModal()">Cancelar</button><button class="btn pri" id="okD">Programar publicação</button>');
  $$('#pCan .chip',ov).forEach(c=>c.addEventListener('click',()=>c.classList.toggle('on')));
  $('#okD',ov).addEventListener('click',()=>{
    const cid=$('#pC',ov).value, pub=$('#pPub',ov).value, d=$('#pD',ov).value, h=$('#pH',ov).value;
    let n=0, semConta=0;
    commit('Programou publicação em massa', S.campanhas.find(c=>c.id===cid).tit, s=>{
      const c=s.campanhas.find(x=>x.id===cid); c.dt=d+'T'+h; c.ag=c.ag||{}; if(c.st==='planejada') c.st='agendada';
      Object.values(s.usuarios).forEach(u=>{
        if(u.nivel!=='associado') return;
        if(pub!=='todas'){
          if(pub[0]==='L'){ if(u.loja!==pub.slice(1)) return; }
          else if(lojaDe(u.loja).master!==pub) return;
        }
        if(!u.ig){ semConta++; return; }
        if(!c.ag[u.id]){ c.ag[u.id]=c.dt; n++; }
      });
    }, (PROVEDORES.find(p=>p.id===S.social.provedor)||{}).nome||'provedor');
    fechaModal(); route();
    toast('<b>'+n+' contas</b> entraram na fila para '+new Date(d+'T'+h).toLocaleString('pt-BR')+(semConta?'.<br>'+semConta+' sem conta conectada receberam a arte para publicação manual.':'.'),1);
  });
}

/* =======================================================================
   MÓDULO 2 · REDES SOCIAIS
   ======================================================================= */
VIEWS.redes=function(v){
  const us=usuariosVisiveis(), con=us.filter(u=>u.ig).length;
  const prov=PROVEDORES.find(p=>p.id===S.social.provedor);
  const fila=[];
  S.campanhas.forEach(c=>Object.keys(c.ag||{}).forEach(uidc=>{
    const u=S.usuarios[uidc]; if(!u||!us.some(x=>x.id===uidc)) return;
    fila.push({q:c.dt, tit:c.tit, u, st:new Date(c.dt)<HOJE?'publicada':'fila'});
  }));
  fila.sort((a,b)=> a.q<b.q?1:-1);
  const eu_=souCorretor()?S.usuarios[euId()]:null;
  const M=metricasRede(lojasVisiveis());

  v.innerHTML =
    ph('Redes sociais','Conexão das contas dos associados, provedor de publicação e agendamento em massa. É daqui que a arte oficial sai para o perfil de cada corretor, no mesmo dia e na mesma hora.',
      (eu_&&!eu_.ig)?'<button class="btn pri" id="conectar">Conectar meu Instagram</button>':
      (ROLE!=='corretor'?'<button class="btn pri" id="massa">Publicar em massa</button><button class="btn" id="conectarTodas">Conectar pendentes</button>':''),'redes')+
    '<div class="grid g4" style="margin-bottom:16px">'+
      kpi('Contas conectadas', con+'/'+us.length, pct(con/Math.max(1,us.length)*100)+' da base visível', con/Math.max(1,us.length)>.6?'k-ok':'k-warn')+
      kpi('Publicações na fila', fila.filter(f=>f.st==='fila').length, 'agendadas e ainda não publicadas')+
      kpi('Já publicadas', fila.filter(f=>f.st==='publicada').length, 'pela plataforma')+
      kpi('Alcance no período', compacto(M.alcance), 'somado das publicações da rede','k-ok')+
    '</div>'+
    '<div class="card" style="margin-bottom:16px"><div class="ch"><h3>Provedor de publicação</h3><div class="r"><span class="mini">quem leva a peça até o perfil do associado</span></div></div>'+
      '<div class="cb"><div class="grid g2">'+
      PROVEDORES.map(p=>{
        const ativo=S.social.provedor===p.id;
        return '<div class="card pad" style="box-shadow:'+(ativo?'0 0 0 1.5px var(--azul) inset;background:var(--azul-soft)':'none;background:var(--surface-2)')+'">'+
          '<div style="display:flex;align-items:center;gap:8px"><h3 style="font-size:15.5px">'+esc(p.nome)+'</h3>'+
          (p.rec?'<span class="tag" style="background:var(--azul);color:#fff">Recomendado</span>':(p.selo?'<span class="tag mut">'+esc(p.selo)+'</span>':''))+(ativo?'<span class="tag ok" style="margin-left:auto">Conectado</span>':'')+'</div>'+
          '<div class="mini" style="margin-top:4px">'+esc(p.tipo)+'</div>'+
          '<div style="font-size:12.9px;color:var(--ink-2);margin-top:9px">'+esc(p.desc)+'</div>'+
          '<div style="margin-top:10px">'+p.pontos.map(x=>'<div style="font-size:12.5px;color:var(--ink-2);padding:3px 0 3px 16px;position:relative"><span style="position:absolute;left:0;color:var(--ok)">✓</span>'+esc(x)+'</div>').join('')+'</div>'+
          '<div class="hint warn" style="margin-top:10px;font-size:12.2px">'+esc(p.atencao)+'</div>'+
          (ROLE==='brasil'? '<button class="btn '+(ativo?'':'pri')+'" style="margin-top:12px;width:100%;justify-content:center" data-prov="'+p.id+'"'+(ativo?' disabled':'')+'>'+(ativo?'Provedor em uso':'Usar este provedor')+'</button>':'')+
        '</div>';
      }).join('')+
      '</div>'+
      '<div class="hint" style="margin-top:14px"><b>Uma camada só.</b> Toda publicação passa pela mesma camada da plataforma, então trocar de provedor não muda nenhuma tela. A troca pede nova autorização do Instagram a cada associado — por isso o app próprio da Meta segue em aprovação em paralelo.</div>'+
    '</div></div>'+
    '<div class="grid g23">'+
      '<div class="card"><div class="ch"><h3>Fila de publicação</h3><div class="r"><span class="mini">gerada pelos agendamentos reais</span></div></div>'+
      '<div class="tw" style="max-height:430px;overflow:auto"><table><thead><tr><th>Quando</th><th>Conteúdo</th><th>Conta</th><th>Situação</th></tr></thead><tbody>'+
      (fila.slice(0,40).map(f=>'<tr><td class="num">'+new Date(f.q).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+'</td>'+
        '<td>'+esc(f.tit.split('—')[0].trim())+'</td><td class="mini">'+esc(primeiro(f.u.nome))+' · '+esc(lojaDe(f.u.loja).nome)+'</td>'+
        '<td>'+(f.st==='fila'?'<span class="tag">Agendada</span>':'<span class="tag ok">Publicada</span>')+'</td></tr>').join('')
        ||'<tr><td colspan="4"><div class="empty">Nada na fila. Programe uma publicação em massa.</div></td></tr>')+
      '</tbody></table></div></div>'+
      '<div class="card"><div class="ch"><h3>Contas dos associados</h3><div class="r"><span class="mini">'+con+' de '+us.length+'</span></div></div><div class="lst" style="max-height:430px;overflow:auto">'+
        us.slice(0,40).map(u=>'<div class="li" style="cursor:default">'+avatar(u)+
          '<div class="bd"><div class="t" style="font-size:13px">'+esc(u.nome)+'</div><div class="s">'+esc(lojaDe(u.loja).nome)+'</div></div>'+
          '<div class="rt">'+(u.ig?'<span class="tag ok">Conectada</span>':
            (ROLE==='corretor'?'<span class="tag warn">Pendente</span>':'<button class="btn sm" data-con="'+u.id+'">Conectar</button>'))+'</div></div>').join('')+
      '</div></div>'+
    '</div>';

  const conecta=id=>{ commit('Conectou conta social', S.usuarios[id].nome, s=>{ s.usuarios[id].ig=true; }, (prov||{}).nome||'provedor');
    toast('<b>Conta conectada.</b> O associado entra nas publicações sincronizadas.',1); route(); };
  $$('[data-con]',v).forEach(b=>b.addEventListener('click',()=>conecta(b.dataset.con)));
  $$('[data-prov]',v).forEach(b=>b.addEventListener('click',()=>{
    commit('Trocou o provedor de publicação', PROVEDORES.find(p=>p.id===b.dataset.prov).nome, s=>{ s.social.provedor=b.dataset.prov; s.social.conectadoEm=agora(); });
    route(); toast('Provedor atualizado para <b>'+esc(PROVEDORES.find(p=>p.id===b.dataset.prov).nome)+'</b>.',1);
  }));
  $('#massa')&&$('#massa').addEventListener('click',()=>disparoEmMassa((S.campanhas.find(c=>c.st==='agendada')||S.campanhas[0]).id));
  $('#conectarTodas')&&$('#conectarTodas').addEventListener('click',()=>{
    const pend=us.filter(u=>!u.ig);
    if(!pend.length) return toast('Todas as contas do seu escopo já estão conectadas.',1);
    const ov=modal('Conectar contas pendentes',
      '<p style="margin:0 0 12px;font-size:13.4px;color:var(--ink-2)">'+pend.length+' associados ainda não conectaram o perfil. A plataforma dispara o convite de autorização por e-mail e WhatsApp; quem autorizar entra automaticamente nas próximas campanhas.</p>'+
      '<div class="lst" style="border:1px solid var(--line);border-radius:12px;max-height:38vh;overflow:auto">'+
      pend.slice(0,20).map(u=>'<div class="li" style="cursor:default">'+avatar(u,26)+'<div class="bd"><div class="t" style="font-size:12.8px">'+esc(u.nome)+'</div><div class="s">'+esc(lojaDe(u.loja).nome)+'</div></div></div>').join('')+'</div>',
      '<button class="btn" onclick="fechaModal()">Cancelar</button><button class="btn pri" id="okT">Enviar convite a '+pend.length+'</button>');
    $('#okT',ov).addEventListener('click',()=>{
      commit('Enviou convite de conexão', pend.length+' associados', s=>{ pend.forEach(u=>{ if(Math.random()<0.55) s.usuarios[u.id].ig=true; }); });
      fechaModal(); route(); toast('Convites enviados. As autorizações que voltarem já aparecem conectadas.',1);
    });
  });
  $('#conectar')&&$('#conectar').addEventListener('click',()=>{
    const ov=modal('Conectar Instagram',
      '<div class="tl" style="margin-bottom:6px">'+
      ['Converter a conta em Instagram Business ou Creator','Vincular a uma página do Facebook da unidade','Autorizar a plataforma Prontos em Rede','Escolher os horários preferidos de publicação']
        .map((p,i)=>'<div class="it '+(i===0?'now':'')+'"><div class="t">'+p+'</div></div>').join('')+'</div>'+
      '<div class="hint">Se travar em qualquer passo, mande “instagram” no WhatsApp do suporte: um analista faz junto com você.</div>',
      '<button class="btn" onclick="fechaModal()">Depois</button><button class="btn pri" id="okC">Autorizar</button>');
    $('#okC',ov).addEventListener('click',()=>{ fechaModal(); conecta(euId()); });
  });
};
</script>
<script>
/* =======================================================================
   MÓDULO 3 · COMPLIANCE & GOVERNANCE
   ======================================================================= */
function novaAprovacao(o){
  S.aprovacoes.unshift(Object.assign({id:uid('a'), dt:agora(), st:'pendente', quem:eu().nome}, o));
}
function aplicarAprovacao(a, ok, motivo){
  const u=S.unidades[a.loja];
  if(ok){
    if(a.alvo.tipo==='etapa'){ u.etapas[a.alvo.etapa].ok=true; u.etapas[a.alvo.etapa].enviado=false; u.etapas[a.alvo.etapa].em=agora(); }
    if(a.alvo.tipo==='fachada_projeto'){ u.fachada.st='producao'; u.etapas.e5.ok=true; u.etapas.e5.enviado=false; }
    if(a.alvo.tipo==='fachada_foto'){ u.fachada.st='instalada'; u.etapas.e6.ok=true; u.etapas.e6.enviado=false; }
  } else {
    if(a.alvo.tipo==='etapa') u.etapas[a.alvo.etapa].enviado=false;
    if(a.alvo.tipo==='fachada_projeto'){ u.fachada.st='nao_iniciada'; u.etapas.e5.enviado=false; }
    if(a.alvo.tipo==='fachada_foto'){ u.etapas.e6.enviado=false; }
    a.motivo=motivo||'';
  }
  a.st = ok?'aprovado':'reprovado'; a.decisor=eu().nome; a.decidido=agora();
}

function enviarEvidencia(lid, eid, contexto){
  const def=etapaDef(eid), l=lojaDe(lid);
  let anexos=[];
  const ov=modal('Enviar evidência · '+esc(def?def.nome:contexto.titulo||''),
    '<div class="mini" style="margin-bottom:12px">'+esc(l.nome)+(def?' · prazo '+dataLonga(dt(def.prazo)):'')+'</div>'+
    '<div class="drop" id="drop"><div class="ic">⇪</div><div class="t">Selecionar fotos, notas fiscais ou documentos</div>'+
    '<div class="mini">JPG, PNG ou PDF · a imagem é reduzida e anexada ao registro da etapa</div></div>'+
    '<div id="lista"></div>'+
    '<div class="field" style="margin-top:14px"><label>Observação para o aprovador</label><textarea id="obs" rows="2" placeholder="Ex.: cartões entregues pela gráfica em 05/09, nota anexa."></textarea></div>'+
    '<div class="hint">Toda evidência guarda autor, data e hora. É o que sustenta o relatório de compliance da RE/MAX Brasil.</div>',
    '<button class="btn" onclick="fechaModal()">Cancelar</button><button class="btn pri" id="okUp" disabled>Enviar para aprovação</button>');
  const pinta=()=>{ $('#lista',ov).innerHTML=anexos.map(a=>fileRow(a)).join(''); $('#okUp',ov).disabled=!anexos.length; };
  $('#drop',ov).addEventListener('click',()=>pedirArquivos('image/*,application/pdf',true,as=>{ anexos=anexos.concat(as); pinta(); }));
  $('#okUp',ov).addEventListener('click',()=>{
    const obs=$('#obs',ov).value.trim();
    commit('Enviou evidência', (def?def.nome:contexto.titulo)+' · '+l.nome, s=>{
      const alvo = contexto&&contexto.alvo ? contexto.alvo : {tipo:'etapa', etapa:eid};
      if(alvo.tipo==='etapa'){ const e=s.unidades[lid].etapas[eid]; e.evid=e.evid.concat(anexos); e.enviado=true; }
      if(alvo.tipo==='fachada_projeto') s.unidades[lid].fachada={...s.unidades[lid].fachada, st:'em_analise', projeto:anexos[0]};
      if(alvo.tipo==='fachada_foto'){ s.unidades[lid].fachada.foto=anexos[0]; s.unidades[lid].etapas.e6.enviado=true; }
      novaAprovacao({tipo: alvo.tipo==='etapa'?'Evidência':'Fachada',
        item:(contexto&&contexto.titulo? contexto.titulo : def.nome)+' — '+l.nome, loja:lid, obs:obs||'Sem observação.', alvo, anexos});
    });
    fechaModal(); route();
    toast('<b>Evidência enviada.</b><br>A etapa fica em aprovação até a Master validar.',1);
  });
}

VIEWS.jornada=function(v,arg){
  const ls=lojasVisiveis();
  const alvo = arg? lojaDe(arg) : (ls.length===1? ls[0] : null);
  if(alvo) return jornadaUnidade(v, alvo);
  const porEtapa=ETAPAS.map(e=>{
    const c=ls.filter(l=>S.unidades[l.id].etapas[e.id].ok).length;
    const a=ls.filter(l=>statusEtapa(l.id,e.id)==='atrasada').length;
    return {e,c,a,p:Math.round(c/ls.length*100)};
  });
  const emAtraso=ls.filter(l=>ETAPAS.some(e=>statusEtapa(l.id,e.id)==='atrasada')).length;
  v.innerHTML =
    ph('Jornada de adequação','Sete etapas, prazo por etapa, evidência anexada, aprovação e alerta automático. É o que transforma “todo mundo precisa se adequar” em uma linha por unidade, com data e responsável.',
      '<button class="btn" id="btnAl">🔔 Alertas</button><button class="btn pri" id="btnRel2">↓ Relatório</button>','jornada')+
    '<div class="grid g4" style="margin-bottom:16px">'+
      kpi('Adesão média', pct(mediaAdesao(ls)), ls.length+' unidades acompanhadas')+
      kpi('Etapas concluídas', porEtapa.reduce((a,x)=>a+x.c,0)+'/'+(ls.length*7), 'no conjunto da rede')+
      kpi('Unidades em atraso', emAtraso, 'com pelo menos uma etapa vencida', emAtraso?'k-bad':'k-ok')+
      kpi('Encerramento', DEADLINE.toLocaleDateString('pt-BR'), dias(DEADLINE)+' dias · prazo a confirmar com a RE/MAX','k-warn')+
    '</div>'+
    '<div class="card" style="margin-bottom:16px"><div class="ch"><h3>Progresso por etapa</h3><div class="r"><span class="mini">clique na etapa para ver quem falta</span></div></div><div class="cb">'+
      porEtapa.map(x=>'<div style="display:grid;grid-template-columns:1fr 130px 96px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer" data-e="'+x.e.id+'">'+
        '<div><div style="font-size:13.2px;font-weight:600">'+esc(x.e.nome)+'</div><div class="mini">Prazo '+dataLonga(dt(x.e.prazo))+(x.a?' · <span style="color:var(--bad)">'+x.a+' em atraso</span>':'')+'</div></div>'+
        barra(x.p)+'<div class="mini num" style="text-align:right">'+x.c+'/'+ls.length+' unidades</div></div>').join('')+
    '</div></div>'+
    '<div class="card"><div class="ch"><h3>Situação por unidade</h3><div class="r"><input id="fU" placeholder="Filtrar…" style="border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12.5px"></div></div>'+
      '<div class="tw"><table><thead><tr><th>Unidade</th><th>Regional</th>'+ETAPAS.map((e,i)=>'<th title="'+esc(e.nome)+'">E'+(i+1)+'</th>').join('')+'<th>Adesão</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div>';
  const cor={concluida:'var(--ok)',aprovacao:'var(--brand-2)',andamento:'var(--brand-3)',atrasada:'var(--red)',pendente:'var(--surface-3)'};
  const pinta=(f)=>{
    $('#tb').innerHTML=ls.filter(l=>!f||(l.nome+l.bairro).toLowerCase().includes(f.toLowerCase()))
      .sort((a,b)=>adesao(b.id)-adesao(a.id)).map(l=>
      '<tr><td style="font-weight:600">'+esc(l.nome)+'<div class="mini">'+esc(l.bairro)+'</div></td>'+
      '<td class="mini">'+esc(masterDe(l.master).nome.replace('Master ',''))+'</td>'+
      ETAPAS.map(e=>{ const s=statusEtapa(l.id,e.id);
        return '<td title="'+esc(e.nome)+' — '+s+'"><span style="display:inline-block;width:13px;height:13px;border-radius:4px;background:'+cor[s]+'"></span></td>';}).join('')+
      '<td style="min-width:110px">'+barra(adesao(l.id))+'<span class="mini num">'+adesao(l.id)+'%</span></td>'+
      '<td><a class="btn sm" href="#/jornada/'+l.id+'">Abrir</a></td></tr>').join('');
  };
  pinta();
  $('#fU').addEventListener('input',e=>pinta(e.target.value));
  $('#btnAl').addEventListener('click',viewAlertas);
  $('#btnRel2').addEventListener('click',()=>relatorioModal(ls));
  $$('[data-e]',v).forEach(el=>el.addEventListener('click',()=>{
    const e=etapaDef(el.dataset.e);
    const faltam=ls.filter(l=>!S.unidades[l.id].etapas[e.id].ok);
    modal('Quem falta · '+esc(e.nome),
      '<div class="mini" style="margin-bottom:10px">Prazo '+dataLonga(dt(e.prazo))+' · '+faltam.length+' unidades pendentes</div>'+
      '<div class="lst" style="border:1px solid var(--line);border-radius:12px;max-height:46vh;overflow:auto">'+
      (faltam.map(l=>'<div class="li" style="cursor:default"><span class="ico">'+adesao(l.id)+'</span><div class="bd"><div class="t">'+esc(l.nome)+'</div>'+
        '<div class="s">'+esc(masterDe(l.master).nome)+' · '+stTag(statusEtapa(l.id,e.id))+'</div></div></div>').join('')||'<div class="empty">Todas concluíram.</div>')+'</div>',
      '<button class="btn" onclick="fechaModal()">Fechar</button><button class="btn pri" id="cobrar">Cobrar as pendentes</button>');
    $('#cobrar').addEventListener('click',()=>{ commit('Cobrou etapa pendente', e.nome+' · '+faltam.length+' unidades'); fechaModal(); toast('Cobrança enviada por e-mail e WhatsApp a '+faltam.length+' unidades.',1); });
  }));
};

function jornadaUnidade(v,l){
  const U=S.unidades[l.id], e=proximaEtapa(l.id), d=dias(dt(e.prazo));
  const podeEnviar = ROLE==='franquia' || ROLE==='brasil' || ROLE==='master';
  v.innerHTML =
    (lojasVisiveis().length>1?'<a class="btn sm" href="#/jornada" style="margin-bottom:14px">← Todas as unidades</a>':'')+
    ph('Jornada · '+esc(l.nome), esc(l.bairro)+' · '+esc(masterDe(l.master).nome)+' · '+corretoresDe(l.id).length+' associados',
      '<a class="btn" href="#/fachadas">Fachada</a>'+(podeEnviar?'<button class="btn pri" id="up2">⇪ Enviar evidência</button>':''),'jornada')+
    '<div class="grid g4" style="margin-bottom:16px">'+
      kpi('Adesão', pct(adesao(l.id)), etapasOk(l.id)+' de 7 etapas concluídas', adesao(l.id)>=70?'k-ok':'k-warn')+
      kpi('Próxima etapa', d<0? Math.abs(d)+' <small>dias em atraso</small>' : d+' <small>dias</small>', esc(e.nome.slice(0,42)), d<0?'k-bad':d<30?'k-warn':'')+
      kpi('Evidências', ETAPAS.reduce((a,x)=>a+U.etapas[x.id].evid.length,0), 'fotos, notas e documentos anexados')+
      kpi('Pontos', pontosU(l.id), 'na régua da rede','k-ok')+
    '</div>'+
    '<div class="grid g23">'+
      '<div class="card"><div class="ch"><h3>Etapas</h3><div class="r"><span class="mini">prazos definidos pela RE/MAX Brasil</span></div></div><div class="cb"><div class="tl">'+
        ETAPAS.map(x=>{ const s=statusEtapa(l.id,x.id), dd=dias(dt(x.prazo)), ev=U.etapas[x.id].evid;
          return '<div class="it '+(s==='concluida'?'done':s==='atrasada'?'late':(s==='andamento'||s==='aprovacao')?'now':'')+'">'+
          '<div class="t">'+esc(x.nome)+'</div>'+
          '<div class="d">Prazo '+dataLonga(dt(x.prazo))+' · '+(s==='concluida'?'concluída':dd<0?'vencida há '+Math.abs(dd)+' dias':'faltam '+dd+' dias')+'</div>'+
          (ev.length?'<div style="margin-top:6px">'+ev.slice(0,2).map(a=>fileRow(a)).join('')+'</div>':'')+

}

const FACH_LABEL={nao_iniciada:'Não iniciada', em_analise:'Projeto em análise', producao:'Em produção', instalada:'Instalada'};
function fachadaCard(l){

    '<div class="grid g4" style="margin-bottom:16px">'+

    '<div class="grid g23" style="margin-bottom:16px">'+
      '<div class="card"><div class="ch"><h3>Fluxo da unidade</h3><div class="r"><span class="mini">'+esc(l0.nome)+'</span></div></div><div class="cb"><div class="tl">'+
        (function(){
          const et=['nao_iniciada','em_analise','producao','instalada'].indexOf(F.st);
          const passos=[['Baixar o projeto padrão e medir a fachada',0],['Enviar o projeto adaptado (PDF, DWG ou foto)',0],

            if(i===5 && !F.foto && podeEnviar && F.st==='producao') extra='<div class="r"><button class="btn sm" id="foto">Enviar foto final</button></div>';
            return '<div class="it '+cls+'"><div class="t">'+p[0]+'</div>'+extra+'</div>';

      '</div></div></div>'+
      '<div class="card"><div class="ch"><h3>Antes e depois</h3></div><div class="cb"><div class="grid g2" style="gap:12px">'+
        '<div><div class="fach"><div class="sky"></div><div class="bld"></div><div class="band old"><img src="'+LOGO+'" style="opacity:.75" alt=""></div><div class="door"></div><div class="grd"></div></div><div class="mini" style="margin-top:6px">Identidade anterior</div></div>'+

    const t=TEMPLATES.find(x=>x.id==='t15');
    montarPeca({fmt:'slide',tema:'claro',titulo:t.txt,sub:'Especificação de letreiro, cores e materiais · '+dataLonga(HOJE),nome:'RE/MAX Brasil',creci:'',tel:'',unidade:'Padrão nacional de fachada'})
      .then(cv=>pecaPDF(cv,'remax-projeto-padrao-fachada.pdf'));
    commit('Baixou o projeto padrão de fachada','Fachadas'); toast('Projeto padrão baixado em PDF.',1);
  });
};

VIEWS.aprovacoes=function(v){
  const meu=ROLE==='franquia';
  const lista = ROLE==='brasil'? S.aprovacoes : ROLE==='master'? S.aprovacoes.filter(a=>lojaDe(a.loja).master==='m2') : S.aprovacoes.filter(a=>a.loja===escopoLoja());
  const pend=lista.filter(a=>a.st==='pendente');

    ph('Fluxo de aprovação','Projetos de fachada, evidências de etapa e peças fora do padrão passam por aprovação. Cada decisão fica registrada com autor, data e justificativa — e o que é aprovado avança a jornada da unidade na hora.',
      '','aprovacoes')+

      kpi('Reprovados', lista.filter(a=>a.st==='reprovado').length, 'com justificativa registrada')+
    '</div>'+
    (meu?'<div class="hint" style="margin-bottom:16px">A franquia acompanha o andamento, mas quem aprova é a Master Regional ou a RE/MAX Brasil.</div>':'')+
    '<div class="card"><div class="lst" id="aps"></div></div>';
  const pinta=()=>{
    $('#aps').innerHTML = lista.map(a=>
      '<div class="li" style="cursor:default"><span class="ico" style="'+(a.tipo==='Fachada'?'background:var(--brand-soft);color:var(--brand-2)':a.tipo==='Evidência'?'background:var(--ok-soft);color:var(--ok)':'background:var(--warn-soft);color:var(--warn)')+'">'+a.tipo[0]+'</span>'+
      '<div class="bd"><div class="t">'+esc(a.item)+' <span class="tag mut">'+esc(a.tipo)+'</span></div>'+
      '<div class="s">'+esc(lojaDe(a.loja).nome)+' · '+esc(a.quem)+' · '+quando(a.dt)+' — '+esc(a.obs||'')+
        (a.motivo?' <b style="color:var(--bad)">Motivo: '+esc(a.motivo)+'</b>':'')+
        (a.decisor?' · decidido por '+esc(a.decisor):'')+'</div>'+
        ((a.anexos&&a.anexos.length)?'<div style="margin-top:6px;max-width:420px">'+a.anexos.slice(0,2).map(x=>fileRow(x)).join('')+'</div>':'')+
      '</div>'+
      '<div class="rt">'+(a.st==='pendente'
        ? (meu?'<span class="tag warn">Aguardando</span>':'<div style="display:flex;gap:6px"><button class="btn sm" data-no="'+a.id+'">Reprovar</button><button class="btn sm pri" data-ok="'+a.id+'">Aprovar</button></div>')
        : stTag(a.st))+'</div></div>').join('')||'<div class="empty">Nada para aprovar.</div>';
    $$('[data-ok]').forEach(b=>b.addEventListener('click',()=>{
      const a=S.aprovacoes.find(x=>x.id===b.dataset.ok);
      commit('Aprovou', a.item, s=>{ aplicarAprovacao(s.aprovacoes.find(x=>x.id===a.id), true); });
      route(); toast('<b>Aprovado.</b> A unidade avançou na jornada e a adesão foi recalculada.',1);
    }));
    $$('[data-no]').forEach(b=>b.addEventListener('click',()=>{
      const a=S.aprovacoes.find(x=>x.id===b.dataset.no);
      const ov=modal('Reprovar · '+esc(a.item),'<div class="field"><label>Motivo (vai para a unidade)</label><textarea id="mot" rows="3" placeholder="Ex.: proporção do logotipo alterada — refazer pelo Estúdio."></textarea></div>',
        '<button class="btn" onclick="fechaModal()">Cancelar</button><button class="btn red" id="okNo">Reprovar</button>');
      $('#okNo',ov).addEventListener('click',()=>{

        commit('Reprovou', a.item, s=>{ aplicarAprovacao(s.aprovacoes.find(x=>x.id===a.id), false, m); });
        fechaModal(); route(); toast('Reprovado — motivo enviado à unidade.');
      });
    }));
  };
  pinta();
};
</script>
<script>
/* =======================================================================
   MÓDULO 4 · COMMUNICATION CENTER
   ======================================================================= */
let AREA_ATUAL='Todas';
VIEWS.comunicados=function(v,arg){
  if(arg) return comunicadoDetalhe(v,arg);
  const ls=lojasVisiveis();
  const podePublicar = ROLE==='brasil'||ROLE==='master';
  const meus=S.comunicados.length, obr=S.comunicados.filter(k=>k.obr).length;
  const minhaLeitura=S.comunicados.length-naoLidos().length;
  const redeLeitura=Math.round(ls.reduce((a,l)=>a+leituraDe(l.id),0)/Math.max(1,ls.length));
  v.innerHTML =
    ph('Comunicados','Canal direto da RE/MAX Brasil e das Masters com franquias e associados — pesquisável, com histórico e confirmação de leitura. É o que substitui a cascata de WhatsApp.',
      podePublicar?'<button class="btn pri" id="novoC">+ Novo comunicado</button>':'','comunicados')+
    '<div class="grid g4" style="margin-bottom:16px">'+
      kpi('Publicados', meus, 'no repositório institucional')+
      kpi('Leitura obrigatória', obr, 'com confirmação exigida')+
      kpi('Sua leitura', minhaLeitura+'/'+meus, naoLidos().length? naoLidos().length+' pendentes':'em dia', naoLidos().length?'k-warn':'k-ok')+
      kpi('Leitura da rede', pct(redeLeitura), 'média das unidades do seu escopo', redeLeitura>70?'k-ok':'k-warn')+
    '</div>'+
    '<div class="chips" id="areas" style="margin-bottom:14px">'+['Todas'].concat(AREAS).map(a=>'<button class="chip '+(a===AREA_ATUAL?'on':'')+'" data-a="'+a+'">'+a+'</button>').join('')+'</div>'+
    '<div class="card"><div class="lst" id="ks"></div></div>';
  const pinta=()=>{
    const ks=S.comunicados.filter(k=>AREA_ATUAL==='Todas'||k.area===AREA_ATUAL);
    $('#ks').innerHTML=ks.map(k=>{
      const lido=(S.leituras[k.id]||[]).indexOf(euId())>=0;
      return '<div class="li '+(lido?'':'unread')+'" data-k="'+k.id+'"><span class="ico">'+esc(k.area.slice(0,2).toUpperCase())+'</span>'+
      '<div class="bd"><div class="t">'+esc(k.tit)+(k.obr?' <span class="tag red">Obrigatório</span>':'')+(lido?'':' <span class="tag">Novo</span>')+'</div>'+
      '<div class="s">'+esc(k.res)+'</div></div>'+
      '<div class="rt"><span>'+dt(k.dt).toLocaleDateString('pt-BR')+'</span><span class="mini">'+esc(k.autor||k.area)+'</span></div></div>';
    }).join('')||'<div class="empty">Nenhum comunicado nesta área.</div>';
    $$('#ks .li').forEach(el=>el.addEventListener('click',()=>location.hash='#/comunicados/'+el.dataset.k));
  };
  pinta();
  $$('#areas .chip').forEach(b=>b.addEventListener('click',()=>{AREA_ATUAL=b.dataset.a;$$('#areas .chip').forEach(x=>x.classList.toggle('on',x===b));pinta();}));
  $('#novoC')&&$('#novoC').addEventListener('click',()=>{
    const ov=modal('Novo comunicado',
      '<div class="field"><label>Título</label><input id="cT" placeholder="Ex.: Etapa de papelaria — prorrogação de prazo"></div>'+
      '<div class="grid g2" style="gap:12px"><div class="field"><label>Área</label><select id="cA">'+AREAS.map(a=>'<option>'+a+'</option>').join('')+'</select></div>'+
      '<div class="field"><label>Destinatários</label><select id="cD"><option>Toda a rede</option><option>Masters Regionais</option><option>Franquias</option><option>Associados</option></select></div></div>'+
      '<div class="field"><label>Resumo</label><input id="cR" placeholder="Uma linha que aparece na lista"></div>'+
      '<div class="field"><label>Texto</label><textarea id="cC" rows="4" placeholder="Conteúdo do comunicado…"></textarea></div>'+
      '<label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" id="cO" checked style="width:auto"> Exigir confirmação de leitura</label>',
      '<button class="btn" onclick="fechaModal()">Cancelar</button><button class="btn pri" id="cOk">Publicar</button>');
    $('#cOk',ov).addEventListener('click',()=>{
      const tit=$('#cT',ov).value.trim(); if(!tit) return toast('Dê um título ao comunicado.');
      const id=uid('k');
      commit('Publicou comunicado', tit, s=>{
        s.comunicados.unshift({id, area:$('#cA',ov).value, tit, dt:new Date().toISOString().slice(0,10),
          obr:$('#cO',ov).checked, res:$('#cR',ov).value.trim()||tit, corpo:esc($('#cC',ov).value.trim()).replace(/\n/g,'<br>'),
          autor:eu().nome, dest:$('#cD',ov).value});
        s.leituras[id]=[];
      });
      fechaModal(); route(); toast('<b>Comunicado publicado.</b> A rede recebe agora e a leitura passa a ser medida.',1);
    });
  });
};

function comunicadoDetalhe(v,id){
  const k=S.comunicados.find(x=>x.id===id); if(!k){location.hash='#/comunicados';return;}
  const lido=(S.leituras[k.id]||[]).indexOf(euId())>=0;
  const ls=lojasVisiveis(), verLeitura=ROLE!=='corretor';
  v.innerHTML =
    '<a class="btn sm" href="#/comunicados" style="margin-bottom:14px">← Comunicados</a>'+
    ph(esc(k.tit),'<span class="tag mut">'+esc(k.area)+'</span> &nbsp; publicado em '+dt(k.dt).toLocaleDateString('pt-BR')+' por '+esc(k.autor||'RE/MAX Brasil')+
      (k.obr?' &nbsp; <span class="tag red">Leitura obrigatória</span>':''),'','comunicados')+
    '<div class="grid '+(verLeitura?'g23':'')+'">'+
      '<div class="card pad"><div style="font-size:14.2px;line-height:1.7;color:var(--ink-2)">'+k.corpo+'</div><div class="divider"></div>'+
        '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+
        (lido?'<span class="tag ok">✓ Leitura confirmada</span>':'<button class="btn pri" id="okLer">Confirmar leitura</button>')+
        '<button class="btn" id="dlK">↓ Baixar</button><a class="btn" href="#/jornada">Ir para a jornada</a></div></div>'+
      (verLeitura?'<div class="card"><div class="ch"><h3>Quem leu</h3><div class="r"><span class="mini">'+(S.leituras[k.id]||[]).length+' confirmações</span></div></div><div class="cb">'+
        ls.slice(0,8).map(l=>{
          const cs=corretoresDe(l.id), n=cs.filter(u=>(S.leituras[k.id]||[]).indexOf(u.id)>=0).length;
          const p=Math.round(n/Math.max(1,cs.length)*100);
          return '<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:12.7px"><span style="font-weight:600">'+esc(l.nome)+'</span><span class="mini num">'+n+'/'+cs.length+'</span></div>'+barra(p)+'</div>';
        }).join('')+
        '<div class="divider"></div><button class="btn sm" id="cobrar">Cobrar quem não leu</button></div></div>':'')+
    '</div>';
  $('#okLer')&&$('#okLer').addEventListener('click',()=>{
    commit('Confirmou leitura', k.tit, s=>{ s.leituras[k.id]=(s.leituras[k.id]||[]).concat([euId()]); });
    route(); renderNav(); toast('Leitura confirmada, com data e hora.',1);
  });
  $('#cobrar')&&$('#cobrar').addEventListener('click',()=>{
    const falta=ls.reduce((a,l)=>a+corretoresDe(l.id).filter(u=>(S.leituras[k.id]||[]).indexOf(u.id)<0).length,0);
    commit('Cobrou leitura', k.tit+' · '+falta+' pessoas'); toast('Lembrete enviado a '+falta+' pessoas por e-mail e WhatsApp.',1);
  });
  $('#dlK').addEventListener('click',()=>{
    const txt=k.tit+'\n'+dt(k.dt).toLocaleDateString('pt-BR')+' · '+k.area+' · '+(k.autor||'RE/MAX Brasil')+'\n\n'+k.corpo.replace(/<br\s*\/?>/g,'\n').replace(/<[^>]+>/g,'');
    baixarBlob(new Blob([txt],{type:'text/plain;charset=utf-8'}), 'comunicado-'+k.id+'.txt'); toast('Comunicado baixado.',1);
  });
}

/* =======================================================================
   MÓDULO 3 · USUÁRIOS E PERMISSÕES
   ======================================================================= */

  ['Publicar comunicado nacional',1,0,0,0],['Criar campanha Prontos em Rede',1,0,0,0],
  ['Definir prazos da jornada',1,0,0,0],['Aprovar projeto e evidência',1,1,0,0],
  ['Ver painel da rede',1,1,0,0],['Ver painel da unidade',1,1,1,0],
  ['Enviar evidência da unidade',1,1,1,0],['Gerenciar usuários da unidade',1,1,1,0],
  ['Personalizar e baixar peças',1,1,1,1],['Publicar nas próprias redes',1,1,1,1],
  ['Abrir chamado no suporte',1,1,1,1]
];

    podeAgir? '<button class="btn" id="esc">Escalar N2</button><button class="btn" id="respBtn">Responder</button><button class="btn pri" id="res">Resolver</button>'

  if(!podeAgir) return;
  $('#respBtn',ov).addEventListener('click',()=>{

    commit('Respondeu chamado', t.id, s=>{ const x=s.tickets.find(y=>y.id===id); x.msgs=(x.msgs||[]).concat([{quem:eu().nome,txt,q:agora()}]); x.st='Em atendimento'; x.resp=eu().nome; });

  });

    commit('Escalou chamado', t.id, s=>{ const x=s.tickets.find(y=>y.id===id); x.st='Escalado · N2'; x.resp='Coordenação · N2'; });
    fechaModal(); apos&&apos(); renderNav(); toast('Chamado escalado para o N2.');
  });
  $('#res',ov).addEventListener('click',()=>{
    commit('Resolveu chamado', t.id, s=>{ const x=s.tickets.find(y=>y.id===id); x.st='Resolvido'; });
    fechaModal(); apos&&apos(); renderNav(); toast('Chamado resolvido.',1);
  });
}

      '<div class="grid g4" style="gap:12px">'+

       ['Onda 2','novas Masters','planejada',''],['Rede','~600 unidades','projetada','mut']].map(o=>

      '<div class="tag '+(o[3]||'mut')+'">'+o[2]+'</div><div style="font-family:var(--font-d);font-weight:800;font-size:16px;margin-top:8px">'+o[0]+'</div>'+

      '<div class="hint" style="margin-top:16px">Cada onda repete o mesmo kit de onboarding. Sem kit templatizado, subir 20 unidades consome semanas que a operação não tem.</div>'+
    '</div></div>'+
    '<div class="grid g23">'+
      '<div class="card"><div class="ch"><h3>Carteira de unidades</h3><div class="r"><span class="mini">avance o onboarding pelo botão</span></div></div>'+
      '<div class="tw"><table><thead><tr><th>Unidade</th><th>Onboarding</th><th>Ativos</th><th>Adesão</th><th>Risco</th><th></th></tr></thead><tbody id="tbo"></tbody></table></div></div>'+
      '<div class="card"><div class="ch"><h3>Kit de onboarding</h3></div><div class="cb"><div class="tl">'+
        [['Reunião de abertura com o gestor','done'],['Importação da base e criação dos acessos','done'],
         ['Treinamento de 40 minutos com a equipe','now'],['Primeira peça publicada por cada associado','pendente'],
         ['Checklist da jornada iniciado','pendente'],['Revisão de 30 dias com o CS','pendente']]
        .map(p=>'<div class="it '+(p[1]==='done'?'done':p[1]==='now'?'now':'')+'"><div class="t" style="font-size:12.9px">'+p[0]+'</div></div>').join('')+
      '</div><div class="hint">Meta de ativação: 80% dos associados com pelo menos uma peça gerada em 15 dias.</div></div></div>'+
    '</div>';
  const pinta=()=>{
    $('#tbo').innerHTML=ls.map(l=>{
      const U=S.unidades[l.id], risco=(ativosDe(l.id)/Math.max(1,corretoresDe(l.id).length)<.5)||U.ultima>6;

      '<td>'+(U.onboard==='ativa'?'<span class="tag ok">Ativa</span>':U.onboard==='em ativação'?'<span class="tag">Em ativação</span>':'<span class="tag mut">Agendada</span>')+'</td>'+
      '<td class="num">'+ativosDe(l.id)+'/'+corretoresDe(l.id).length+'</td>'+
      '<td style="min-width:100px">'+barra(adesao(l.id))+'</td>'+
      '<td>'+(risco?'<span class="tag bad">Atenção do CS</span>':'<span class="tag ok">Saudável</span>')+'</td>'+
      '<td>'+(U.onboard!=='ativa'?'<button class="btn sm" data-ob="'+l.id+'">Avançar</button>':'<button class="btn sm" data-ob="'+l.id+'">Reabrir</button>')+'</td></tr>';
    }).join('');
    $$('[data-ob]').forEach(b=>b.addEventListener('click',()=>{
      const l=lojaDe(b.dataset.ob), U=S.unidades[l.id];

<script>
/* =======================================================================
   MÓDULO 6 · INTELLIGENCE & GAMIFICATION
   ======================================================================= */

/* ---------- indicadores de marketing (os da apresentação, agora dentro da plataforma) ---------- */
const SEMANAS=12;
function metricasCorretor(id){
  const u=S.usuarios[id]||{}, r=seed('mk:'+id);
  const base = u.ativo? rint(r,4,20) : rint(r,0,3);
  const reais = S.campanhas.filter(c=>c.ag&&c.ag[id]).length + S.pecas.filter(p=>p.uid===id).length;
  const posts = base+reais;
  const seguidores = u.ig? rint(r,320,4200) : rint(r,0,180);
  const alcance = Math.round(posts*(180+r()*520) + seguidores*0.7);
  const eng = 1.2 + r()*4.4;
  const reels = Math.round(posts*(0.12+r()*0.28));
  const stories = Math.round(posts*(0.5+r()*1.3));
  const imoveis = rint(r,0,16);
  const dist = Array.from({length:SEMANAS},(_,i)=> Math.max(0, Math.round(posts/SEMANAS*(0.4+r()*1.6))));
  return {posts, alcance, eng, reels, stories, imoveis, seguidores, freq:posts/SEMANAS, dist};
}
function metricasLoja(lid){
  const cs=corretoresDe(lid);
  const acc={posts:0,alcance:0,reels:0,stories:0,imoveis:0,seguidores:0,eng:0,pecas:0,dist:Array(SEMANAS).fill(0)};
  cs.forEach(c=>{ const m=metricasCorretor(c.id);
    acc.posts+=m.posts; acc.alcance+=m.alcance; acc.reels+=m.reels; acc.stories+=m.stories;
    acc.imoveis+=m.imoveis; acc.seguidores+=m.seguidores; acc.eng+=m.eng;
    m.dist.forEach((d,i)=>acc.dist[i]+=d); });
  acc.eng = cs.length? acc.eng/cs.length : 0;
  acc.freq = cs.length? acc.posts/SEMANAS/cs.length : 0;
  acc.pecas = S.pecas.filter(p=>{const u=S.usuarios[p.uid]; return u&&u.loja===lid;}).length;
  acc.corretores = cs.length; acc.ativos = ativosDe(lid);
  return acc;
}
function metricasRede(ls){
  const acc={posts:0,alcance:0,reels:0,stories:0,imoveis:0,seguidores:0,eng:0,pecas:0,corretores:0,ativos:0,dist:Array(SEMANAS).fill(0)};
  ls.forEach(l=>{ const m=metricasLoja(l.id);
    ['posts','alcance','reels','stories','imoveis','seguidores','pecas','corretores','ativos'].forEach(k=>acc[k]+=m[k]);
    acc.eng+=m.eng; m.dist.forEach((d,i)=>acc.dist[i]+=d); });
  acc.eng = ls.length? acc.eng/ls.length : 0;
  acc.freq = acc.corretores? acc.posts/SEMANAS/acc.corretores : 0;
  acc.serie = acc.dist;
  acc.seriePecas = acc.dist.map((d,i)=> Math.round(d*(0.35+((i%4)*0.06))) + (i===SEMANAS-1? S.pecas.length:0));
  const hoje=new Date(HOJE);
  acc.semanas = Array.from({length:SEMANAS},(_,i)=>{ const d=new Date(hoje); d.setDate(d.getDate()-(SEMANAS-1-i)*7); return dataBR(d); });
  return acc;
}

let MKT={regional:'todas', unidade:'todas', periodo:12};
VIEWS.marketing=function(v){
  if(souCorretor()) return marketingCorretor(v);
  let ls=lojasVisiveis();
  if(MKT.regional!=='todas') ls=ls.filter(l=>l.master===MKT.regional);
  if(MKT.unidade!=='todas') ls=ls.filter(l=>l.id===MKT.unidade);
  if(!ls.length) ls=lojasVisiveis();
  const M=metricasRede(ls);
  const corte=SEMANAS-MKT.periodo;
  const serie=M.serie.slice(corte), semanas=M.semanas.slice(corte);
  const postsPeriodo=serie.reduce((a,b)=>a+b,0);
  const top=ls.map(l=>({l, m:metricasLoja(l.id)})).sort((a,b)=>b.m.alcance-a.m.alcance).slice(0,8);
  const mix=[{n:'Feed',v:Math.max(0,M.posts-M.reels)},{n:'Reels',v:M.reels},{n:'Stories',v:M.stories}];

  v.innerHTML =
    ph('Desempenho de marketing','Os indicadores que antes viviam em uma apresentação à parte, agora dentro da plataforma e ligados ao dado real: frequência de publicação, alcance, engajamento, formatos e imóveis divulgados — por rede, regional, unidade e associado.',
      '<button class="btn" id="expM">↓ Exportar CSV</button>','marketing')+
    '<div class="filtros">'+
      '<div class="f"><label>Regional</label><select id="fReg"><option value="todas">Todas as regionais</option>'+
        BASE.masters.map(m=>'<option value="'+m.id+'"'+(MKT.regional===m.id?' selected':'')+'>'+esc(m.nome)+'</option>').join('')+'</select></div>'+
      '<div class="f"><label>Unidade</label><select id="fUni"><option value="todas">Todas as unidades</option>'+
        lojasVisiveis().filter(l=>MKT.regional==='todas'||l.master===MKT.regional).map(l=>'<option value="'+l.id+'"'+(MKT.unidade===l.id?' selected':'')+'>'+esc(l.nome)+'</option>').join('')+'</select></div>'+
      '<div class="f"><label>Período</label><select id="fPer">'+[[4,'Últimas 4 semanas'],[8,'Últimas 8 semanas'],[12,'Últimas 12 semanas']]
        .map(p=>'<option value="'+p[0]+'"'+(MKT.periodo===p[0]?' selected':'')+'>'+p[1]+'</option>').join('')+'</select></div>'+
      '<div class="f"><label>&nbsp;</label><button class="btn" id="limpar">Limpar filtros</button></div>'+
    '</div>'+
    '<div class="grid g4" style="margin-bottom:16px">'+
      kpi('Publicações', nf(postsPeriodo), 'no período · '+ls.length+' unidade'+(ls.length>1?'s':''))+
      kpi('Alcance', compacto(M.alcance), 'somado das contas conectadas','k-ok')+
      kpi('Engajamento médio', M.eng.toFixed(1).replace('.',',')+'%', 'sobre o alcance das peças')+
      kpi('Frequência', M.freq.toFixed(1).replace('.',',')+' <small>/semana</small>', 'por associado', M.freq>=1.5?'k-ok':'k-warn')+
    '</div>'+
    '<div class="grid g23" style="margin-bottom:16px">'+
      '<div class="card"><div class="ch"><h3>Publicações por semana</h3><div class="r"><span class="mini">'+semanas[0]+' a '+semanas[semanas.length-1]+'</span></div></div>'+
        '<div class="cb"><div class="grafico"><canvas id="gSerie"></canvas></div></div></div>'+
      '<div class="card"><div class="ch"><h3>Formatos publicados</h3></div><div class="cb"><div class="grafico"><canvas id="gMix"></canvas></div>'+legenda(mix.map((m,i)=>({n:m.n,v:m.v,cor:PALETA[i]})))+'</div></div>'+
    '</div>'+
    '<div class="card" style="margin-bottom:16px"><div class="ch"><h3>Alcance por unidade</h3><div class="r"><span class="mini">8 maiores do recorte</span></div></div>'+
      '<div class="cb"><div class="grafico"><canvas id="gTop"></canvas></div></div></div>'+
    '<div class="card"><div class="ch"><h3>Detalhe por '+(MKT.unidade==='todas'?'unidade':'associado')+'</h3>'+
      '<div class="r"><span class="mini">clique para abrir o recorte</span></div></div>'+
      '<div class="tw"><table><thead><tr>'+
      (MKT.unidade==='todas'
        ? '<th>Unidade</th><th>Regional</th><th>Associados</th><th>Publicações</th><th>Frequência</th><th>Alcance</th><th>Engajamento</th><th>Imóveis</th>'
        : '<th>Associado</th><th>Conta</th><th>Publicações</th><th>Frequência</th><th>Alcance</th><th>Engajamento</th><th>Imóveis</th>')+
      '</tr></thead><tbody id="tbM"></tbody></table></div></div>';

  gLinha($('#gSerie'), semanas, [{nome:'Publicações', dados:serie, cor:PALETA[0]}], {alt:250});
  gRosca($('#gMix'), mix, {alt:250, centro:compacto(mix.reduce((a,b)=>a+b.v,0)), rotulo:'peças publicadas'});
  gBarras($('#gTop'), top.map(t=>t.l.nome.replace('RE/MAX ','')), top.map(t=>t.m.alcance), {alt:270, fmt:compacto, cores:[PALETA[0],PALETA[1]]});

  const pintaTab=()=>{
    if(MKT.unidade==='todas'){
      $('#tbM').innerHTML=ls.map(l=>{ const m=metricasLoja(l.id);
        return '<tr style="cursor:pointer" data-l="'+l.id+'"><td style="font-weight:600">'+esc(l.nome)+'<div class="mini">'+esc(l.bairro)+'</div></td>'+
        '<td class="mini">'+esc(masterDe(l.master).nome.replace('Master SP ',''))+'</td>'+
        '<td class="num">'+m.ativos+'/'+m.corretores+'</td><td class="num">'+nf(m.posts)+'</td>'+
        '<td class="num">'+m.freq.toFixed(1).replace('.',',')+'</td><td class="num">'+compacto(m.alcance)+'</td>'+
        '<td class="num">'+m.eng.toFixed(1).replace('.',',')+'%</td><td class="num">'+m.imoveis+'</td></tr>'; }).join('');
      $$('#tbM [data-l]').forEach(tr=>tr.addEventListener('click',()=>{ MKT.unidade=tr.dataset.l; route(); }));
    } else {
      const cs=corretoresDe(MKT.unidade).map(c=>({c,m:metricasCorretor(c.id)})).sort((a,b)=>b.m.alcance-a.m.alcance);
      $('#tbM').innerHTML=cs.map(x=>'<tr><td><div class="stack">'+avatar(x.c,26)+'<div><div style="font-weight:600">'+esc(x.c.nome)+'</div><div class="mini">CRECI '+esc(x.c.creci)+'</div></div></div></td>'+
        '<td>'+(x.c.ig?'<span class="tag ok">Conectada</span>':'<span class="tag warn">Sem conta</span>')+'</td>'+
        '<td class="num">'+x.m.posts+'</td><td class="num">'+x.m.freq.toFixed(1).replace('.',',')+'</td>'+
        '<td class="num">'+compacto(x.m.alcance)+'</td><td class="num">'+x.m.eng.toFixed(1).replace('.',',')+'%</td>'+
        '<td class="num">'+x.m.imoveis+'</td></tr>').join('');
    }
  };
  pintaTab();
  $('#fReg').addEventListener('change',e=>{ MKT.regional=e.target.value; MKT.unidade='todas'; route(); });
  $('#fUni').addEventListener('change',e=>{ MKT.unidade=e.target.value; route(); });
  $('#fPer').addEventListener('change',e=>{ MKT.periodo=parseInt(e.target.value,10); route(); });
  $('#limpar').addEventListener('click',()=>{ MKT={regional:'todas',unidade:'todas',periodo:12}; route(); });
  $('#expM').addEventListener('click',()=>{
    const linhas=[['unidade','regional','associados','ativos','publicacoes','frequencia_semana','alcance','engajamento_%','reels','stories','imoveis']];
    ls.forEach(l=>{ const m=metricasLoja(l.id);
      linhas.push([l.nome,masterDe(l.master).nome,m.corretores,m.ativos,m.posts,m.freq.toFixed(2),m.alcance,m.eng.toFixed(1),m.reels,m.stories,m.imoveis]); });
    baixarBlob(new Blob(['﻿'+linhas.map(r=>r.join(';')).join('\n')],{type:'text/csv;charset=utf-8'}),'prontos-em-rede-marketing.csv');
    commit('Exportou indicadores de marketing', ls.length+' unidades'); toast('Indicadores exportados.',1);
  });
};

function marketingCorretor(v){
  const c=S.usuarios[euId()], l=lojaDe(c.loja), m=metricasCorretor(c.id), ml=metricasLoja(l.id);
  const mediaUnidade = {posts: ml.corretores? ml.posts/ml.corretores:0, alcance: ml.corretores? ml.alcance/ml.corretores:0, eng: ml.eng};
  const semanas=metricasRede([l]).semanas;
  const mix=[{n:'Feed',v:Math.max(0,m.posts-m.reels)},{n:'Reels',v:m.reels},{n:'Stories',v:m.stories}];
  v.innerHTML =
    ph('Meus indicadores','Como está o seu marketing: quanto você publica, quanto alcança e como isso se compara com a média da sua unidade.','','marketing')+
    '<div class="grid g4" style="margin-bottom:16px">'+
      kpi('Publicações', m.posts, 'nas últimas 12 semanas')+
      kpi('Frequência', m.freq.toFixed(1).replace('.',',')+' <small>/semana</small>', mediaUnidade.posts? 'média da unidade: '+(mediaUnidade.posts/SEMANAS).toFixed(1).replace('.',','):'', m.freq>=(mediaUnidade.posts/SEMANAS)?'k-ok':'k-warn')+
      kpi('Alcance', compacto(m.alcance), 'média da unidade: '+compacto(Math.round(mediaUnidade.alcance)), m.alcance>=mediaUnidade.alcance?'k-ok':'k-warn')+
      kpi('Engajamento', m.eng.toFixed(1).replace('.',',')+'%', 'média da unidade: '+ml.eng.toFixed(1).replace('.',',')+'%', m.eng>=ml.eng?'k-ok':'k-warn')+
    '</div>'+
    '<div class="grid g23">'+
      '<div class="card"><div class="ch"><h3>Minhas publicações por semana</h3></div><div class="cb"><div class="grafico"><canvas id="gEu"></canvas></div></div></div>'+
      '<div class="card"><div class="ch"><h3>Meus formatos</h3></div><div class="cb"><div class="grafico"><canvas id="gMixEu"></canvas></div>'+legenda(mix.map((x,i)=>({n:x.n,v:x.v,cor:PALETA[i]})))+'</div></div>'+
    '</div>'+
    '<div class="card" style="margin-top:16px"><div class="ch"><h3>Como melhorar</h3></div><div class="cb">'+
      [!c.ig?['Conecte seu Instagram','Sem a conta conectada você fica fora das campanhas sincronizadas e o alcance não é medido.','#/redes']:null,
       m.freq<1.5?['Publique ao menos 2 vezes por semana','A frequência é o indicador que mais move alcance na rede.','#/estudio']:null,
       m.reels<3?['Use mais Reels','Formatos em vídeo puxam o engajamento para cima.','#/biblioteca']:null,
       ['Participe da próxima campanha da rede','Publicação sincronizada rende alcance e pontos no Programa de Excelência.','#/prontos']
      ].filter(Boolean).map(x=>'<div class="li" data-go="'+x[2]+'" style="display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer">'+
        '<span class="ico" style="width:30px;height:30px;border-radius:8px;background:var(--brand-soft);color:var(--brand-2);display:grid;place-items:center">→</span>'+
        '<div><div style="font-weight:600;font-size:13.3px">'+esc(x[0])+'</div><div class="mini">'+esc(x[1])+'</div></div></div>').join('')+
    '</div></div>';
  gLinha($('#gEu'), semanas, [{nome:'Publicações', dados:m.dist, cor:PALETA[0]}], {alt:250});
  gRosca($('#gMixEu'), mix, {alt:250, centro:String(mix.reduce((a,b)=>a+b.v,0)), rotulo:'peças'});
  $$('[data-go]',v).forEach(el=>el.addEventListener('click',()=>location.hash=el.dataset.go));
}

/* ---------- painel da rede ---------- */
VIEWS.painel=function(v){
  const ls=lojasVisiveis();
  const porMaster=BASE.masters.filter(m=>ROLE==='brasil'||m.id==='m2').map(m=>{
    const sub=BASE.lojas.filter(l=>l.master===m.id);
    return {m, n:sub.length, ad:mediaAdesao(sub), us:sub.reduce((a,l)=>a+corretoresDe(l.id).length,0), at:sub.reduce((a,l)=>a+ativosDe(l.id),0)};
  });
  const conformes=ls.filter(l=>adesao(l.id)>=70).length;
  const M=metricasRede(ls);
  v.innerHTML =

      porMaster.map(x=>'<div style="display:grid;grid-template-columns:1.2fr 1fr 150px 60px;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)">'+
        '<div><div style="font-weight:600;font-size:13.3px">'+esc(x.m.nome)+'</div><div class="mini">'+esc(x.m.area)+'</div></div>'+

      '<div class="tw"><table><thead><tr><th>Unidade</th><th>Adesão</th><th>Fachada</th><th>Digital</th><th>Impressos</th><th>Ativos</th><th>Leitura</th><th>Chamados</th></tr></thead><tbody>'+
      ls.slice().sort((a,b)=>adesao(b.id)-adesao(a.id)).map(l=>{ const U=S.unidades[l.id];
        return '<tr><td style="font-weight:600">'+esc(l.nome)+'<div class="mini">'+esc(masterDe(l.master).nome.replace('Master ',''))+'</div></td>'+
        '<td style="min-width:110px">'+barra(adesao(l.id))+'<span class="mini num">'+adesao(l.id)+'%</span></td>'+
        '<td>'+(U.fachada.st==='instalada'?'<span class="tag ok">OK</span>':'<span class="tag warn">'+FACH_LABEL[U.fachada.st]+'</span>')+'</td>'+
        '<td>'+(U.etapas.e2.ok?'<span class="tag ok">OK</span>':'<span class="tag mut">pendente</span>')+'</td>'+
        '<td>'+(U.etapas.e3.ok?'<span class="tag ok">OK</span>':'<span class="tag mut">pendente</span>')+'</td>'+

      '<div class="card"><div class="ch"><h3>Situação das unidades</h3></div><div class="cb"><div class="grafico"><canvas id="gSit"></canvas></div>'+
        legenda([{n:'Em conformidade',v:conformes,cor:cssVar('--ok','#1F6B45')},{n:'Em andamento',v:ls.filter(l=>adesao(l.id)<70&&adesao(l.id)>=40).length,cor:PALETA[1]},{n:'Em risco',v:ls.filter(l=>adesao(l.id)<40).length,cor:cssVar('--red','#D4222F')}])+
      '</div></div>'+
    '</div>';
  const base=mediaAdesao(ls);
  gLinha($('#gEvo'), ['abr','mai','jun','jul','ago','set'],
    [{nome:'Adesão média', dados:[0,1,2,3,4,5].map(i=> i===5? base : Math.max(3,Math.round(base*(0.25+i*0.15)))), cor:PALETA[0]}],
    {alt:230, fmt:v=>Math.round(v)+'%'});
  gRosca($('#gSit'), [{n:'Em conformidade',v:conformes,cor:cssVar('--ok','#1F6B45')},
                      {n:'Em andamento',v:ls.filter(l=>adesao(l.id)<70&&adesao(l.id)>=40).length,cor:PALETA[1]},
                      {n:'Em risco',v:ls.filter(l=>adesao(l.id)<40).length,cor:cssVar('--red','#D4222F')}],

  $('#rel3').addEventListener('click',()=>relatorioModal(ls));
};

    '</div>'+

    '</div>'+
    '<div class="grid g23">'+

        '<td style="font-family:var(--font-d);font-weight:800" class="num">'+pontosU(l.id)+'</td></tr>').join('')+

        '<div class="rt"><b class="num">'+x.p+'</b></div></div>').join('')+

  $('#regras').addEventListener('click',()=>modal('Como a pontuação funciona',

     ['Etapa com evidência aprovada','+'+PONTOS.evidencia],['Participação em campanha sincronizada','+'+PONTOS.campanha+' por campanha'],
     ['Confirmação de leitura obrigatória','+'+PONTOS.leitura],['Peça oficial gerada pelo Estúdio','+'+PONTOS.peca],
     ['Fachada instalada e validada','+'+PONTOS.fachada],['Entrega validada no Programa de Excelência','conforme o critério']]
    .map(r=>'<tr><td>'+r[0]+'</td><td style="font-family:var(--font-d);font-weight:700;color:var(--ok)">'+r[1]+'</td></tr>').join('')+
    '</tbody></table></div>'+
    '<div class="hint" style="margin-top:14px">Pesos configuráveis pela RE/MAX Brasil. Aprove uma evidência em Compliance ou valide uma comprovação no Programa de Excelência e volte aqui: o ranking muda.</div>',
